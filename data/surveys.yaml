    研究路线矩阵:
    - 路线: 统一多模态CAD基准与生成
      解决的问题: 提供跨文本、图像、草图、点云和网格输入的CAD程序生成评测面，测试单一模型处理多任务的能力。
      尚未覆盖: 模型排名随指标变化；模态转换和几何复杂度仍导致退化；工件与独立复现证据不足。
