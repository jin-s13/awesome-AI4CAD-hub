    of older CAD dataset families into unified multimodal benchmarks and engineering
    design-intent evaluation.'
  - 'Open questions: Proxy metrics'' alignment with real design decisions, VLM-judge
    reliability, ranking stability across metrics and modalities, robustness under
    geometric complexity and modality shift, and reproducibility gaps from absent
    code/dataset/limitation details.'
  related_work_outline_zh:
  - 主流方向：当前证据集中在从文本、图像、网格、点云生成或逆向重建参数化CAD程序，2026年以CADBench、UniCAD、MUSE为代表的多模态基准与模型系统处于前沿。
  - 研究共性：方法将CAD输出分解为可执行程序、拓扑或参数推理，围绕几何保真度、可执行性、程序紧凑性等指标，并在DeepCAD、Fusion 360、ABC、MCB、Objaverse等数据集上比较。
  - 关键差异：输入与目标不同，包括文本到CAD、网格/点云到CAD重建和多模态多任务；部分工作关注工程设计意图、可制造性与可装配性，另一部分侧重几何保真度与无效比率。
  - 趋势演进：可见年份横跨2005至2026，但高排名证据集中在2026年，当前演进主要体现在将既有CAD数据集聚合成统一多模态基准，并引入工程设计意图评估。
  - 开放问题：代理指标与真实设计决策的对齐、VLM评判可靠性、不同指标与模态下排名稳定性、几何复杂度和模态转换鲁棒性，以及缺失代码/数据集/限制说明造成的可复现性缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Establishes shared multimodal CAD evaluation tasks and dataset
        aggregations so text-to-CAD, mesh/point-to-CAD reconstruction, and CAD question
        answering can be compared under one suite.
      what_remains_open: Whether task distributions and dataset sampling cover real
        engineering workflows, design intent, assemblies, and the settings where CAD
        generation claims are expected to transfer.
    - line: Metric and stress-test design
      what_it_solves: Adds multi-stage checks for code executability, geometric validity
        and fidelity, program compactness, and design-intent alignment, plus modality-shift,
        geometric-complexity, and ranking stress tests.
      what_remains_open: Alignment between proxy metrics such as IoU, Chamfer distance,
        invalid ratio, or VLM-judge rubrics and the downstream manufacturability and
        functionality decisions users care about.
    - line: Comparable baselines and reporting
      what_it_solves: Supplies common baselines, benchmark suites, and reporting conventions
        so state-of-the-art claims can be audited across CAD-specific and multimodal
        or language-model methods.
      what_remains_open: Stability of conclusions across implementations, compute
        budgets, artifact availability, and missing limitation reports; several top
        papers have no visible limitations and mixed reproducibility signals.
    consensus:
    - Parametric CAD generation and reverse engineering are treated as a shared benchmark
      problem centered on recovering editable programs or construction sequences from
      one or more input modalities.
    - Recent benchmarks combine datasets with protocols and baselines, using staged
      evaluation from executable code through valid geometry to design-intent alignment
      rather than a single aggregate score.
    - Geometric fidelity, executability, compactness, invalid ratio, and engineering
      criteria are recurring evaluation dimensions; evidence shows model rankings
      and failure patterns vary with metric, modality, and geometric complexity.
    - Unified multimodal evaluation is becoming common, with benchmarks covering multiple
      CAD tasks under a single suite instead of task-specific leaderboards.
    disagreements:
    - 'Input and supervision setting: text-prompted generation, mesh or point-cloud
      reverse engineering, image-based reconstruction, and multi-task multimodal instruction
      test different model capabilities.'
    - 'Evaluation target: some benchmarks emphasize geometric reconstruction quality,
      while others prioritize design-intent alignment, manufacturability, functionality,
      and assemblability of B-Rep assemblies.'
    - 'Metric and judging approach: some rely on IoU, Chamfer distance, executability,
      and invalid ratio; others introduce rubric-based VLM judges for engineering
      design criteria.'
    - 'Model and interaction paradigm: approaches differ between direct LLM code generation,
      stepwise feature construction, hybrid optimization, and proactive clarification
      before synthesis.'
    - 'Reporting and reproducibility posture: artifact visibility and limitation disclosure
      vary, making direct comparability of state-of-the-art claims uneven.'
    open_questions:
    - Does current CAD benchmark coverage adequately represent the downstream engineering
      settings and design-intent complexity where CAD generation claims are expected
      to be useful?
    - Are VLM-based rubric judges sufficiently reliable and human-aligned for manufacturability,
      functionality, and assemblability evaluation?
    - How stable are model rankings across different geometric metrics, input modalities,
      benchmark versions, and implementation budgets?
    - What evaluation protocols can systematically expose brittleness under modality
      shift and increasing geometric complexity?
    - To what extent do missing code, dataset, baseline, and limitation details account
      for observed performance differences and state-of-the-art claims?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 建立共享的多模态CAD评测任务与数据集聚合，使文本到CAD、网格/点云到CAD重建、CAD问答等任务可以在同一套件下比较。
      尚未覆盖: 任务分布与数据集采样是否覆盖真实工程设计流程、设计意图、装配体以及生成模型预期迁移的场景，仍缺乏足够证据。
    - 路线: 指标与压力测试设计
      解决的问题: 增加代码可执行性、几何有效性与保真度、程序紧凑性、设计意图对齐等多阶段检查，并施加模态转换、几何复杂度和排名稳定性等压力测试。
      尚未覆盖: IoU、Chamfer距离、无效比率或VLM评判分数等代理指标与用户真正关心的可制造性、功能性决策之间是否对齐，尚未解决。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、基准套件和报告方式，使CAD专用方法与通用多模态或语言模型方法的最新性能声明具有可审计性。
      尚未覆盖: 结论在不同实现、算力预算、工件可得性以及缺失限制说明下是否稳定；部分高排名论文未给出局限说明，复现信号不一。
    共识:
    - 参数化CAD生成与逆向工程被视作同一类基准问题，核心是给定一种或多种输入，恢复可编辑的程序或构建序列。
    - 越来越多的基准将数据集、评测协议和基线打包，采用从可执行代码、有效几何到设计意图对齐的分阶段评估，而非单一总分。
    - 几何保真度、可执行性、程序紧凑性、无效比率和工程评判标准是反复出现的评测维度；证据显示模型排名与失败模式随指标、模态和几何复杂度变化。
    - 统一多模态评测正在成为趋势，单个套件覆盖多种CAD任务，替代分散的任务特定排行榜。
    分歧:
    - 监督信号与输入设置不同：文本提示生成、网格或点云逆向工程、图像重建和多任务多模态指令分别测试不同模型能力。
    - 评测目标不同：部分工作侧重几何重建质量，另一些强调设计意图对齐、可制造性、功能性和可装配性。
    - 指标与评判方式不同：一些基准使用IoU、Chamfer距离、可执行性和无效比率，另一些引入基于评分标准的VLM评判器评估工程设计标准。
    - 模型与交互范式不同：直接LLM代码生成、逐步特征构建、混合优化和生成前主动澄清并存。
