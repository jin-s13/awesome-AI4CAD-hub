  related_work_outline:
  - 'Mainstream direction: The current frontier focuses on benchmarking multimodal
    CAD generation: text, image, mesh, and point cloud inputs to parametric CAD programs,
    evaluated for executability, geometric fidelity, and increasingly engineering
    readiness. Representative examples include CADBench, MUSE, and UniCAD.'
  - 'Shared research pattern: Works aggregate datasets and build evaluation suites
    that stress-test generation models across metrics, modalities, and geometric complexity;
    benchmarks are also paired with new methods to demonstrate state-of-the-art performance
    or failure modes.'
  - 'Key differences: Evaluation targets range from geometric reconstruction validity
    to manufacturability, functionality, and assemblability. Generation modes include
    end-to-end, optimization-based, hierarchical, and proactive clarification. Supervision
    and judging differ across geometric metrics, VLM judges, and human-validated rubrics.'
  - 'Trend evolution: The available top-paper evidence is concentrated in 2026, so
    the trend is within the current frontier: moving from geometric and executability
    metrics toward multimodal, engineering-intent, and failure-cascade evaluation.'
  - 'Open questions: Whether benchmark distributions reflect real engineering constraints;
    whether VLM judges align with human engineers; whether rankings are stable across
    metrics, modalities, implementations, and compute budgets; how much clarification
    interaction is needed.'
  related_work_outline_zh:
  - 主流方向：当前前沿集中于多模态CAD生成基准，覆盖文本、图像、网格、点云到参数化CAD程序，评估可执行性、几何保真度，并逐步加入工程就绪度。代表性工作如CADBench、MUSE、UniCAD。
  - 研究共性：研究聚合数据集并构建评测套件，在多指标、多模态和几何复杂度上对生成模型做压力测试；基准常与新方法配套，以展示最先进性能或失败模式。
  - 关键差异：评测目标从几何重建有效性延伸到可制造性、功能性与可装配性；生成方式包括端到端、优化驱动、层次化和主动澄清；监督与评判在几何指标、VLM评判器和人工验证量表之间存在差异。
  - 趋势演进：已有顶部证据集中在2026年，趋势属于当前前沿：从几何与可执行性指标转向多模态、工程意图和失败级联评估。
  - 开放问题：基准分布是否反映真实工程约束；VLM评判器是否与工程师判断一致；排名在指标、模态、实现和算力预算下是否稳定；需要多少澄清交互开销。
  literature_review:
    line_of_work_matrix:
    - line: Multimodal benchmark and dataset aggregation
      what_it_solves: Creates shared evaluation tasks for comparing CAD generation
        across text, image, mesh, point cloud, and multiple dataset families.
      what_remains_open: Whether aggregate suites preserve comparable conclusions
        across heterogeneous data formats, modality shifts, and geometric complexity
        strata.
    - line: Engineering-intent and design-rule evaluation
      what_it_solves: 'Assesses beyond geometry: manufacturability, functionality,
        assemblability, and failure cascades from code to valid geometry to engineering-ready
        design.'
      what_remains_open: Validity and calibration of rubric-based VLM judges and coverage
        of real assembly and tolerance constraints.
    - line: Structured parametric CAD generation and reconstruction baselines
      what_it_solves: Provides methods that output executable CAD programs or construction
        sequences, enabling measurable validity and reconstruction quality.
      what_remains_open: Generalization from idealized inputs to complex, noisy, or
        shifted modalities, and stable ranking across metrics.
    - line: Interactive clarification and agentic text-to-CAD evaluation
      what_it_solves: Reduces ambiguity and invalid outputs by clarifying prompts
        before program synthesis, with low interaction overhead.
      what_remains_open: Whether clarification protocols reflect real user workflows
        and scale beyond evaluated prompts.
    consensus:
    - CAD generation should be evaluated as executable structured programs rather
      than only as final meshes.
    - Aggregate metrics such as validity, geometric fidelity, compactness, and invalid
      ratio appear across studies but are not sufficient alone.
    - Recent evidence converges on multimodal evaluation and on separating idealized
      geometry from engineering-ready design intent.
    - Model rankings are sensitive to metric and modality choices, supporting multi-metric
      stress-test evaluations.
    disagreements:
    - 'Evaluation target differs: some work evaluates geometric reconstruction quality,
      while others evaluate manufacturability, functionality, and assemblability.'
    - 'Interaction mode differs: end-to-end generation without clarification versus
      proactive clarification before code synthesis.'
    - 'Representation and optimization differ: construction-tree or CadQuery generation
      with supervised or reinforcement signals versus optimization-driven parametric
      reconstruction using geometric feedback.'
    - 'Judging mechanism differs: geometric metrics compared against VLM rubric judges,
      with limited evidence on reliability and human alignment.'
    open_questions:
    - Do benchmark task distributions cover real CAD settings that include tolerance,
      assembly context, and manufacturing constraints?
    - Do rubric-based VLM judges align with practicing engineers and remain consistent
      across design specifications?
    - Are benchmark conclusions stable across implementations, compute budgets, and
      dataset sampling?
    - What interaction budget and clarification protocol best improves text-to-CAD
      robustness without burdening users?
    - Which missing artifacts and limitation details in the evidence packet create
      verification gaps for reproducibility and auditability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态基准与数据集聚合
      解决的问题: 创建共享评测任务，在文本、图像、网格、点云和多个数据集家族间比较CAD生成能力。
      尚未覆盖: 在异构数据格式、模态转换和几何复杂度分层下，聚合套件能否保持可比结论。
    - 路线: 工程意图与设计规则评估
      解决的问题: 在几何之外评估可制造性、功能性、可装配性，以及从代码到有效几何再到工程就绪设计的失败级联。
      尚未覆盖: 基于量表的VLM评判器的有效性和校准，以及对真实装配与公差约束的覆盖。
    - 路线: 结构化参数化CAD生成与重建基线
      解决的问题: 提供输出可执行CAD程序或构建序列的方法，使有效性和重建质量可量化。
      尚未覆盖: 从理想输入推广到复杂、噪声或模态偏移设置的边界，以及跨指标排名稳定性。
    - 路线: 交互式澄清与智能体式文本到CAD评估
      解决的问题: 在程序合成前澄清模糊提示，以低交互开销降低无效输出。
      尚未覆盖: 澄清协议是否反映真实用户工作流，并能在评估提示之外扩展。
    共识:
    - CAD生成应作为可执行结构化程序评估，而不能只看最终网格。
    - 有效性、几何保真度、紧凑性和无效比率等聚合指标被广泛使用，但单独使用并不充分。
    - 近期证据汇聚于多模态评估，并区分理想化几何与工程就绪设计意图。
    - 模型排名对指标和模态选择敏感，支持多指标压力测试。
    分歧:
    - 评测目标不同：有些工作评估几何重建质量，有些则评估可制造性、功能性和可装配性。
    - 交互模式不同：无澄清的端到端生成与在代码合成前主动澄清。
    - 表示与优化不同：基于构建树或CadQuery的监督/强化生成，与利用几何反馈的优化驱动参数化重建。
    - 评判机制不同：几何指标与VLM量表评判器并用，但其可靠性和人类一致性证据有限。
    开放问题:
    - 基准任务分布是否覆盖包含公差、装配上下文和制造约束的真实CAD设置？
    - 基于量表的VLM评判器是否与实践工程师一致，并在不同设计规范下保持稳定？
    - 基准结论在不同实现、算力预算和数据集采样下是否稳定？
    - 何种交互预算和澄清协议能在不增加用户负担的情况下提升文本到CAD鲁棒性？
    - 证据包中缺失的工件和局限性细节在多大程度上构成可复现性与可审计性的验证缺口？
