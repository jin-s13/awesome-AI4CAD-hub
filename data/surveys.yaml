  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于多模态数据的参数化CAD逆向重建
      解决的问题: 从网格、正交视图或点云中恢复可编辑的、基于历史的CAD构建序列，将不可编辑的几何体转化为可重用的参数化程序。
      尚未覆盖: 对真实传感器噪声和工业级复杂拓扑的鲁棒性，以及重建序列是否体现原始设计意图而非仅几何拟合；评估仍严重依赖纯几何指标。
    - 路线: 统一多任务与VLM驱动的CAD代码生成
      解决的问题: 利用微调的视觉语言模型或多模态大模型，从图像、文本或草图直接生成可编辑CAD代码（如CadQuery Python），并将异构任务整合到单一框架中。
      尚未覆盖: 对真实世界照片和未见操作的跨分布泛化仅为部分成功；代码生成与专业设计工作流的集成及制造可行性检查尚未涉及；语法正确性与功能设计合理性之间存在评估缺口。
    - 路线: CAD序列的生成建模与意图条件补全
      解决的问题: 通过状态空间模型或自回归LLM对长参数化CAD序列进行建模，并诊断模型在补全时是否真正利用设计意图头，而非利用指标伪影。
      尚未覆盖: 长序列的物理有效性与拓扑一致性；设计意图条件控制在不同模型规模和CAD领域间的可迁移性；头提取与一致性指标之间的根本循环性仍未解决。
    共识:
    - 参数化CAD程序（尤其是CadQuery）正成为通用表示，以实现可编辑性和下游重用。
    - 从多模态输入（网格、图像、点云）到构建序列的端到端重建是核心问题形式。
    - 评估重心正从纯几何相似性转向可编辑性、有效比率和可执行几何断言。
    - 现有基准（DeepCAD、Fusion360、MCB）作为标准化比较平台，但其局限性日益被指出。
    分歧:
    - 生成模式：逐步、逐特征的重建并配合中间几何检查，与一次性生成完整序列，导致不同的误差累积和修正能力。
    - 监督信号：使用几何对齐奖励的强化学习，与直接IoU驱动优化，以及与VLM引导的程序演化，各自对什么是好程序持有不同假设。
    - 设计意图建模：通过因果错乱控制显式诊断意图头，与隐式依赖VLM世界知识，在如何可靠注入和评估设计意图上缺乏共识。
    开放问题:
    - 如何定义和评估CAD程序中的“设计意图”，而不依赖与条件相同的令牌提取器，从而避免指标循环？
    - 为何对随意拍摄的照片或训练中未见CAD操作的泛化仍仅限于零星迹象，一个鲁棒的真实世界基准应如何构建？
    - 何种评估协议能捕捉生成的CAD模型是否真正可制造，而不仅仅是几何相似？
