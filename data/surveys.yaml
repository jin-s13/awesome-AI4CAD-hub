  related_work_outline:
  - 'Mainstream direction: constructing unified multimodal benchmarks that evaluate
    CAD program generation from images, point clouds, and text, with an expanding
    focus on engineering constraints beyond geometric fidelity.'
  - 'Shared research pattern: all benchmarks define input modalities, output formats
    (executable CAD scripts), and evaluation metrics; they stress the gap between
    geometry-level metrics and real-world design requirements.'
  - 'Key differences: benchmarks diverge in whether they assess only geometric validity
    or also manufacturability, functionality, and assemblability; some introduce interactive
    clarification, while others rely on one-shot generation.'
  - 'Trend evolution: within the 2026 frontier, benchmarks are shifting from single-task
    geometric reconstruction to multi-task, multi-modal suites, and from rule-based
    metrics to VLM-based evaluators for design intent.'
  - 'Open questions: alignment between proxy metrics and downstream engineering decisions
    remains unverified; robustness of VLM judges and benchmark stability across implementations
    are still open.'
  related_work_outline_zh:
  - 主流方向：构建统一多模态基准，评估从图像、点云和文本生成CAD程序，并越来越关注几何保真度之外的工程约束。
  - 研究共性：所有基准都定义输入模态、输出格式（可执行CAD脚本）和评估指标，并强调几何层面指标与真实设计需求之间的差距。
  - 关键差异：基准在评估维度上存在分歧，有的仅评估几何有效性，有的则评估可制造性、功能性和可装配性；部分工作引入主动澄清交互，其他则依赖单次生成。
  - 趋势演进：在2026年前沿中，基准正在从单任务几何重建向多任务、多模态套件转变，并从基于规则的指标转向基于VLM的设计意图评估器。
  - 开放问题：代理指标与下游工程决策之间的一致性尚未验证；VLM评判器的鲁棒性以及基准在不同实现间结论的稳定性仍是开放问题。
  literature_review:
    line_of_work_matrix:
    - line: Multimodal CAD benchmark and dataset design
      what_it_solves: provides unified evaluation suites across diverse input modalities
        (mesh, image, point cloud, text) and CAD tasks, enabling fair model comparison.
      what_remains_open: whether the task distributions cover real-world design workflows,
        including iterative refinement, under-specified requirements, and manufacturing
        constraints beyond geometric checks.
    - line: Metric and stress-test design for downstream engineering constraints
      what_it_solves: extends evaluation beyond geometric similarity to assess manufacturability,
        functionality, assemblability, and robustness to ambiguous prompts, often
        via VLM judges or interactive clarification.
      what_remains_open: alignment between these proxy metrics (e.g., VLM rubric scores,
        Chamfer distance) and the actual downstream decisions that engineers make;
        the reliability of VLM judges across diverse designs.
    - line: Standardized baselines and reproducible benchmarking
      what_it_solves: creates common evaluation protocols with fixed baselines, datasets,
        and reporting formats to make results auditable and comparable.
      what_remains_open: whether benchmark conclusions remain stable across different
        implementations, compute budgets, and when code/datasets are not fully open;
        sensitivity to the choice of CAD backends (e.g., CadQuery, OpenSCAD).
    consensus:
    - All benchmarks adopt executable CAD program generation as the output format
      and emphasize the importance of geometric validity.
    - There is a shared recognition that purely geometric metrics are insufficient
      and must be complemented by assessments of design intent, usability, or engineering
      feasibility.
    - Multimodal inputs (text, images, point clouds, meshes) are considered essential
      for realistic CAD generation evaluation.
    disagreements:
    - 'Evaluation scope: some benchmarks focus on geometric reconstruction accuracy
      (e.g., CADBench, CADENA-Bench), while others incorporate engineering constraints
      like manufacturability and assemblability (e.g., MUSE).'
    - 'Interaction mode: a few works introduce proactive clarification to handle ambiguous
      prompts (e.g., ProCAD), whereas most benchmarks assume a single-shot generation
      setting without user interaction.'
    - 'Evaluation methodology: disagreement between using rule-based geometric metrics
      (IoU, Chamfer distance) and using VLM judges with design-specific rubrics to
      assess design-intent alignment.'
    - 'Coverage of CAD operations: some benchmarks restrict to extrusion and revolution,
      while others include fillets, chamfers, and more complex feature sets, affecting
      the representativeness of the benchmark.'
    open_questions:
    - How can benchmarks be designed to capture the iterative, under-specified nature
      of real CAD design tasks, rather than only well-defined reconstruction problems?
    - What is the evidence that VLM-based evaluators are reliable and unbiased across
      diverse mechanical designs and manufacturing processes?
    - To what extent do current benchmark rankings generalize to alternative CAD scripting
      languages or different computational budgets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态CAD基准与数据集设计
      解决的问题: 提供跨不同输入模态（网格、图像、点云、文本）和CAD任务的统一评估套件，实现公平的模型比较。
      尚未覆盖: 任务分布是否覆盖真实设计工作流，包括迭代细化、需求不明确的情况以及超越几何检查的制造约束。
    - 路线: 面向下游工程约束的指标与压力测试设计
      解决的问题: 将评估从几何相似性扩展到可制造性、功能性、可装配性以及对模糊提示的鲁棒性，通常通过VLM评判器或主动澄清实现。
      尚未覆盖: 这些代理指标（如VLM评分标准分数、Chamfer距离）与工程师实际做出的下游决策之间的一致性；VLM评判器在不同设计上的可靠性。
    - 路线: 标准化基线与可复现的基准测试
      解决的问题: 创建具有固定基线、数据集和报告格式的通用评估协议，使结果可审计、可比较。
      尚未覆盖: 基准结论在不同实现、算力预算以及代码/数据集未完全开放时是否稳定；对CAD后端（如CadQuery、OpenSCAD）选择的敏感性。
    共识:
    - 所有基准都采用可执行CAD程序生成作为输出格式，并强调几何有效性的重要性。
    - 普遍认识到仅靠几何指标不足，必须辅以设计意图、可用性或工程可行性的评估。
    - 多模态输入（文本、图像、点云、网格）被认为对真实的CAD生成评估至关重要。
    分歧:
    - 评估范围：部分基准侧重几何重建精度（如CADBench、CADENA-Bench），而另一些纳入可制造性和可装配性等工程约束（如MUSE）。
    - 交互模式：少数工作引入主动澄清以处理模糊提示（如ProCAD），而大多数基准假设单次生成设置，无用户交互。
    - 评估方法论：基于规则的几何指标（IoU、Chamfer距离）与使用带有设计特定评分标准的VLM评判器评估设计意图对齐之间存在分歧。
