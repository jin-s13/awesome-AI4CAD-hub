  related_work_outline:
  - 'Mainstream direction: AI-driven generation and reconstruction of editable parametric
    CAD programs from 3D meshes, 2D images, or point clouds, increasingly using large
    (vision-)language models.'
  - 'Shared research pattern: Representing CAD as a sequence of parametric operations
    (sketch, extrude, fillet, etc.) and training a model to predict such sequences,
    with geometric fidelity as the primary quality metric.'
  - 'Key differences: Methods differ in architecture (optimization, autoregressive,
    SSM, RL, VLM/LLM), supervision signal (geometric comparison, visual projections,
    image-to-code), and how they handle design intent (explicit header conditioning,
    program evolution, or no intent).'
  - 'Trend evolution: From 2025 to 2026 the field moved from task-specific mesh-to-CAD
    networks toward general-purpose VLM-based code generation and unified multi-modal
    benchmarks, with a growing emphasis on industrial-scale complexity and editability.'
  - 'Open questions: Generalization to real-world, noisy sensor inputs; robust handling
    of long, complex CAD sequences; reliable evaluation of design-intent alignment
    beyond surface metrics; and safe integration of LLM-generated CAD into downstream
    engineering workflows.'
  related_work_outline_zh:
  - 主流方向：使用AI（尤其是大型视觉语言模型）从3D网格、2D图像或点云生成和重建可编辑的参数化CAD程序。
  - 研究共性：将CAD建模表示为一组参数化操作序列（草图、拉伸、圆角等），训练模型预测该序列，并以几何保真度作为核心质量指标。
  - 关键差异：模型架构（优化、自回归、状态空间模型、强化学习、VLM/LLM）、监督信号（几何对比、视觉投影、图像到代码）以及设计意图的处理方式（显式头部条件化、程序演化或不含意图）不同。
  - 趋势演进：2025–2026年间，领域从特定任务的网格到CAD网络转向通用的VLM代码生成和统一多模态基准，工业级复杂度和可编辑性受到更多关注。
  - 开放问题：对真实世界噪声传感器输入的泛化能力；鲁棒地处理长而复杂的CAD序列；超越表面指标可靠评估设计意图一致性；以及LLM生成的CAD安全集成到下游工程流程中。
  literature_review:
    line_of_work_matrix:
    - line: Parametric CAD reconstruction from 3D geometry
      what_it_solves: Recovering the editable construction sequence (extrusions, fillets,
        etc.) from a polygon mesh or point cloud, enabling downstream editing and
        reuse of legacy or scanned parts.
      what_remains_open: Generalization to complex, multi-feature mechanical parts;
        handling of noise and incomplete scans; and validation that the reconstructed
        program actually reflects the original design intent, not just a geometrically
        similar solid.
    - line: End-to-end CAD code generation from images or text using VLMs/LLMs
      what_it_solves: Translating a single image, a sketch, or a textual description
        directly into executable CAD scripting code (e.g., CadQuery Python), drastically
        lowering the barrier for non-expert CAD creation.
      what_remains_open: Robustness on real-world photographs and unseen CAD operations;
        control over the generated part's structural logic and internal constraints;
        and alignment between the generated solid and the user's higher-level design
        intent.
    - line: LLM-based CAD program completion and intent conditioning
      what_it_solves: Conditioning a language model on a compact design-intent header
        (part type, dimensions) to autocomplete the rest of the CAD program, enabling
        intent-driven, few-shot CAD authoring.
      what_remains_open: Disentangling the effect of learned header-to-program mapping
        from simple distributional cues; developing evaluation metrics that are not
        circular with the header extraction process; and generalizing beyond the few
        intent classes tested.
    - line: Unified multi-modal CAD benchmarks
      what_it_solves: Providing a single evaluation suite for heterogeneous CAD tasks
        (reconstruction, generation, QA) across multiple input modalities, enabling
        fair comparison of multi-task models.
      what_remains_open: Coverage of the full diversity of real CAD workflows (assemblies,
        constraints, manufacturing features); alignment of benchmark metrics with
        engineering usability; and the benchmark's own sensitivity to data contamination
        from training sets.
    consensus:
    - Parametric CAD programs, expressed as sequences of sketches and features, are
      the preferred representation because they guarantee editability and compatibility
      with professional CAD tools.
    - Geometric accuracy (e.g., IoU, Chamfer distance, solid similarity) is the primary
      evaluation axis, but the community increasingly recognizes that geometric metrics
      alone can mask failures in design-intent adherence.
    - Current models struggle with long, complex CAD sequences and often rely on synthetic
      datasets derived from limited collections like DeepCAD or Fusion 360, raising
      concerns about real-world transfer.
    - Large vision-language models pretrained on code are emerging as a viable backbone
      for CAD generation, but they still require fine-tuning on domain-specific CAD
      data to achieve industrial-grade validity.
    disagreements:
    - 'Supervision paradigm: some methods employ dense geometric feedback (comparison
      of intermediate solids), while others only use the final image or program as
      a weak supervision signal, creating a trade-off between training simplicity
      and reconstruction fidelity.'
    - 'Architecture choice: approaches span from guided optimization (no learning)
      and autoregressive/SSM sequence models to RL-based decision transformers and
      VLM fine-tuning, with no clear winner on the efficiency–accuracy–generalization
      spectrum.'
    - 'Evaluation scope: some works benchmark on synthetic multi-view images or renderings,
      while others test on real-world photographs, revealing a divide between laboratory
      benchmarks and the demands of practical CAD reverse engineering.'
    - 'Role of design intent: one line of work treats the CAD header as a strong conditioning
      signal, while another shows that incorrect headers can degrade performance,
      and a third omits explicit intent altogether, leaving the community split on
      whether and how to encode intent.'
    open_questions:
    - Can models trained purely on synthetic CAD data generalize to noisy, real-world
      sensor inputs (e.g., smartphone photos of physical parts) without catastrophic
      drops in reconstruction quality?
    - How should we design an evaluation metric that disentangles geometric accuracy
      from design-intent adherence, avoiding the circularity discovered in header-conditioned
      evaluation?
    - What is the minimal set of CAD operations and structural constraints a model
      must master to be useful in professional mechanical design, and how can we scale
      training data to cover that set?
    - Under what conditions can a VLM-generated CAD program be safely passed to downstream
      CAE/CAM pipelines without human review, and what verification gaps would block
      such automated deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 从3D几何重建参数化CAD
      解决的问题: 从多边形网格或点云恢复可编辑的构造序列（拉伸、圆角等），使遗留或扫描零件能够被下游编辑和重用。
      尚未覆盖: 对复杂多特征机械零件的泛化；处理噪声和不完整扫描；验证重建程序是否真正反映了原始设计意图，而不仅仅是几何相似实体。
    - 路线: 使用VLM/LLM从图像或文本端到端生成CAD代码
      解决的问题: 将单张图像、草图或文本描述直接转换为可执行的CAD脚本代码（如 CadQuery Python），大幅降低非专业用户的CAD创建门槛。
      尚未覆盖: 在真实世界照片和未见过的CAD操作上的鲁棒性；对生成零件结构逻辑和内部约束的控制；以及生成实体与用户高阶设计意图之间的一致性。
    - 路线: 基于LLM的CAD程序补全与意图条件化
      解决的问题: 用紧凑的设计意图头（零件类型、尺寸）条件化语言模型，使其自动补全其余CAD程序，实现意图驱动的少样本CAD编写。
      尚未覆盖: 剥离所学到的头到程序映射与简单分布线索的混淆效应；开发不与头提取过程循环的评估指标；以及泛化到已测试的少数意图类别之外。
    - 路线: 统一多模态CAD基准
      解决的问题: 为异构CAD任务（重建、生成、问答）提供跨多种输入模态的单一评估套件，实现多任务模型的公平比较。
      尚未覆盖: 覆盖真实CAD工作流的全部多样性（装配、约束、制造特征）；基准指标与工程可用性的对齐；以及基准本身对训练集数据污染的敏感性。
    共识:
    - 参数化CAD程序（表示为草图和特征序列）是首选的表示形式，因为它能保证可编辑性并与专业CAD工具兼容。
    - 几何精度（如IoU、倒角距离、实体相似度）是主要的评估轴，但社区越来越认识到仅凭几何指标可能掩盖设计意图遵循方面的失败。
    - 当前模型难以处理长而复杂的CAD序列，并且通常依赖于从DeepCAD或Fusion 360等有限集合衍生的合成数据集，引发了对真实世界迁移的担忧。
    - 在代码上预训练的大型视觉语言模型正成为CAD生成的可行骨干，但仍需在领域特定CAD数据上进行微调，才能达到工业级有效性。
    分歧:
