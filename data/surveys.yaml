    研究路线矩阵:
    - 路线: 面向CAD成功标准的评测驱动形式化
      解决的问题: 为程序可执行性、几何有效性和工程意图如可制造性、功能性与可装配性定义可度量检查。
      尚未覆盖: 指标变化和基于评分标准的VLM判断能否在未见零件族和复杂设计规范上捕获工程就绪度仍未证明。
