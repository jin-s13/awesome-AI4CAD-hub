  - 'Shared research pattern: Methods ground modality inputs to structured CAD representations
    or reasoning trajectories and then generate or evaluate editable programs, rather
    than only predicting meshes.'
  - 'Key differences: Representation choice, supervision signal, interaction mode,
    training mechanism, and evaluation target differ across the evidence.'
  - 'Trend evolution: Available top-paper evidence is concentrated in 2026; the frontier
    is shifting toward agentic clarification, hierarchical reasoning, and manufacturability-aware
    benchmarking.'
