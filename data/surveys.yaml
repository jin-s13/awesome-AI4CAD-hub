  related_work_outline_zh:
  - 主流方向：证据集中在参数化CAD程序与B-Rep生成，从文本、图像和3D输入生成可编辑模型，评测从几何扩展到可执行性与工程意图。
  - 研究共性：方法将多模态输入接地到结构化CAD表示或推理轨迹，生成或评估可编辑程序，而非仅预测网格。
  - 关键差异：表示方式、监督信号、交互方式、训练机制和评测目标各有不同。
  - 趋势演进：顶级论文证据集中在2026年，当前前沿转向主动澄清、层次推理与可制造性感知的评测基准。
  - 开放问题：对未见零件族的泛化、模态转换鲁棒性、可扩展的工程意图评测，以及再现性验证缺口仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven multimodal CAD program evaluation (e.g., CADBench, MUSE,
        BenchCAD)
      what_it_solves: Systematic comparison of programmatic CAD generation across
        input modalities, metrics, and design criteria beyond geometric similarity.
      what_remains_open: Whether benchmark gains transfer to unseen part families
        and align with formal design reasoning remains unclear.
    - line: LLM-driven text-to-CAD program synthesis with grounding
      what_it_solves: Generating executable parametric CAD scripts from language and
        connecting references to B-rep primitives or parameters.
      what_remains_open: Ambiguity handling, fine-grained parameter accuracy, and
        generalization beyond curated distributions remain partially open.
    - line: Self-supervised and sequence-based parametric CAD generative models
      what_it_solves: Learning long parametric CAD sequences or editable B-rep surfaces
        from point-level or reconstruction supervision.
      what_remains_open: Real-world boundary-representation complexity and cross-domain
        transfer beyond ABC/Objaverse-style data need more evidence.
    - line: Engineering-intent evaluation and agentic clarification
      what_it_solves: Assessing manufacturability, functionality, and assemblability
        while reducing prompt ambiguity before CAD code synthesis.
      what_remains_open: Scalable reliable judges and low-overhead clarification across
        broader design tasks are not yet established.
    consensus:
    - Parametric CAD generation is converging on executable program or B-rep representations
      to preserve editability and manufacturability.
    - Multiple papers agree geometric fidelity alone is insufficient; executability,
      design intent, manufacturability, and assemblability must also be evaluated.
    - Strong current models still fail on fine-grained structure, complex geometry,
      or unseen part families despite high benchmark-oriented performance.
    - Grounding language or visual inputs to geometric primitives, structure trajectories,
      or parameters is treated as a key mechanism for consistency and accuracy.
    disagreements:
    - 'Representation choice: CadQuery script generation, latent state-space sequences,
      and differentiable Bezier/B-rep patches lead to different editability and supervision
      trade-offs.'
    - 'Supervision signal: point-level self-supervision on unannotated 3D data differs
      from curated text or specification supervision with or without reinforcement
      learning.'
    - 'Evaluation target: one line emphasizes geometric fidelity and user preference,
      another emphasizes manufacturability and assemblability, and another emphasizes
      robustness to ambiguous prompts.'
    - 'Interaction mode: some systems insert a proactive clarification agent before
      synthesis; others generate directly from a single prompt.'
    - 'Training mechanism: GAN-based latent generation, supervised fine-tuning plus
      reinforcement learning, and ranking-based structure or parameter grounding reflect
      different assumptions about learning CAD structure.'
    open_questions:
    - How well do current empirical CAD generation results generalize to unseen industrial
      part families and to shifts across clean meshes, noisy meshes, single-view,
      photorealistic, and multi-view inputs?
    - Does the formal geometric modeling theory implied by the topic align with observed
      failure cascades from executable code to valid geometry to engineering-ready
      design?
    - Can proactive clarification, hierarchical reasoning, or parameter grounding
      scale while keeping interaction overhead low and avoiding shortcut learning?
    - What evidence is missing because several top-paper analyses omit limitation
      details or reproducible code and dataset access despite methodology and reproducibility
      scores?
    - Can benchmark ranking instability across metrics be resolved into a stable definition
      of CAD generation quality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准驱动的多模态CAD程序评测（如 CADBench、MUSE、BenchCAD）
      解决的问题: 在输入模态、指标和设计标准上系统比较程序化CAD生成，超越几何相似度。
      尚未覆盖: 这些基准的进展是否能迁移到未见零件族并与形式化设计推理对齐仍不清楚。
    - 路线: LLM驱动的文本到CAD程序合成与接地
      解决的问题: 从自然语言生成可执行参数化CAD脚本，并将指称连接到B-Rep基元或参数。
      尚未覆盖: 歧义处理、细粒度参数准确性以及超出精选分布的泛化仍部分未解决。
    - 路线: 自监督与序列式参数化CAD生成模型
      解决的问题: 通过点级或重建监督学习长参数化CAD序列或可编辑B-Rep曲面。
      尚未覆盖: 真实B-Rep复杂度以及ABC/Objaverse风格数据之外的跨域迁移仍需更多证据。
    - 路线: 工程意图评测与主动澄清
      解决的问题: 评估可制造性、功能性和可装配性，并在CAD代码合成前减少提示歧义。
      尚未覆盖: 可扩展且可靠的评判器，以及更广泛设计任务中的低开销澄清尚未建立。
    共识:
    - 参数化CAD生成正趋向于可执行程序或B-Rep表示，以保留可编辑性与可制造性。
    - 多项论文一致认为仅看几何保真度不够；还必须评测可执行性、设计意图、可制造性和可装配性。
    - 即使性能较强，现有模型在细粒度结构、复杂几何或未见零件族上仍会失败。
    - 将语言或视觉输入接地到几何基元、结构轨迹或参数，被普遍视为提升一致性和准确性的关键机制。
    分歧:
    - 表示选择：CadQuery脚本生成、潜在状态空间序列和可微Bezier/B-Rep面片带来不同的可编辑性与监督权衡。
    - 监督信号：未标注3D数据上的点级自监督，不同于带监督微调和强化学习的文本或规格监督。
    - 评测目标：一条路线强调几何保真度和用户偏好，另一条强调可制造性和可装配性，第三条强调对模糊提示的鲁棒性。
    - 交互模式：部分系统在合成前加入主动澄清智能体，其他系统从单次提示直接生成。
