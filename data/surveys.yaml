  - 'Mainstream direction: The dominant route is reconstructing or generating editable
    parametric CAD programs from visual or geometric inputs such as meshes, images,
    point clouds, and sketches, evaluated on datasets or benchmarks such as DeepCAD,
    Fusion360, and MCB.'
  - 'Shared research pattern: Most work represents CAD as structured parametric operations
    or code; methods optimize for executable syntax, geometric similarity including
    IoU or Chamfer distance, validity ratio, or downstream editability.'
  - 'Key differences: Input modality and task differ, including mesh-to-CAD reconstruction,
    image-to-CAD code generation, unified multimodal multi-task CAD, long-sequence
    generative modeling, and design-intent conditioning diagnosis; architectures range
    from hybrid optimization and multimodal LLMs to reinforcement learning, state-space
    models, and evolutionary data generation.'
  - 'Trend evolution: Available top evidence is concentrated at the 2025-2026 frontier.
    It shifts from task-specific reconstruction toward unified multimodal models,
    evolution-synthesized datasets, and causal evaluation of design-intent conditioning;
    older years in the span provide only sparse foundation signals.'
  - 'Open questions: Cross-domain generalization to real industrial CAD, non-circular
    evaluation metrics, long complex sequence validity, and reproducibility remain
    open; several top papers lack explicit limitation details or public artifact evidence.'
  related_work_outline_zh:
  - 主流方向：主导路线是从网格、图像、点云或草图重建或生成可编辑参数化CAD程序，并以DeepCAD、Fusion360、MCB或新基准进行评测。
  - 研究共性：多数工作将CAD表示为结构化参数化操作或代码；优化目标包括语法可执行、体积IoU/Chamfer几何相似度、有效比例或可编辑性。
  - 关键差异：输入模态和任务不同，包括网格到CAD重建、图像到CAD代码生成、统一多模态任务、长序列生成和设计意图条件化诊断；架构有混合优化、多模态大模型、强化学习、状态空间和演化生成等。
  - 趋势演进：可用高排名证据集中在2025–2026前沿，从单任务重建向统一多模态模型、演化合成数据集和设计意图因果评测演进；更早年份基础信号较稀疏。
  - 开放问题：真实工业CAD泛化、非循环评测、长复杂序列有效性和可复现性仍开放；部分论文缺少显式局限性或工件证据。
  literature_review:
    line_of_work_matrix:
    - line: Parametric reverse engineering from mesh or image geometry
      what_it_solves: Recovers editable parametric CAD construction sequences from
        boundary meshes or visual views, improving volumetric IoU, Chamfer distance,
        and invalid-ratio.
      what_remains_open: Generalization beyond benchmark categories, multimodal end-to-end
        image-to-CAD reliability, and limited explicit limitation or artifact evidence.
    - line: Unified multimodal CAD generation and question answering
      what_it_solves: Handles heterogeneous inputs and tasks such as text, image,
        sketch, and point cloud to CAD generation, reconstruction, and CAD question
        answering within one model or benchmark.
      what_remains_open: Robustness outside training distributions, especially real-world
        images and unseen CAD operations; reproducibility signals vary and some limitations
        are only partial.
    - line: Long-sequence parametric CAD generative modeling
      what_it_solves: Models long parametric CAD sequences via state-space or evolution-generated
        script-geometry datasets, targeting complex executable CAD parts.
      what_remains_open: Validation of long-sequence validity, realism under industrial
        complexity, and sensitivity to dataset post-processing or augmentation remain
        unclear.
    - line: Design-intent conditioning and evaluation validity
      what_it_solves: Diagnoses whether CAD program completion actually uses design-intent
        header information and whether evaluation metrics are circular.
      what_remains_open: Evidence is limited to a single model/checkpoint, specific
        prefix/regime and certain geometric intents, so findings may not generalize
        to full generation.
    consensus:
    - CAD is represented as structured parametric operations or code rather than raw
      shape only; editability and geometric validity are common goals.
    - Evaluation relies on reconstruction similarity metrics such as volumetric IoU,
      Chamfer distance, syntax validity, and invalid ratio; DeepCAD, Fusion360, and
      MCB are recurring benchmarks.
    - Top-ranked evidence treats visual or geometric input to editable CAD output
      as the central applied CAD problem and is concentrated in the 2025-2026 frontier.
    disagreements:
    - 'Supervision and input signals differ: mesh geometry, stepwise orthographic
      images, point clouds, text/image/sketch, or design-intent headers.'
    - 'Training paradigms differ: hybrid optimization, multimodal LLM fine-tuning,
      offline reinforcement learning with Decision Transformer, state-space generative
      modeling, and VLM-guided program evolution.'
    - 'Evaluation targets differ: some optimize geometric similarity and program validity,
      while others diagnose design-intent adherence using independent geometric assertions.'
    - 'Deployment and reproducibility stances differ: open-source image-to-code models
      are contrasted with artifact-light benchmark or method reports; some works expose
      partial generalization, others leave limitations empty.'
    open_questions:
    - Will mesh-to-CAD and image-to-CAD models transfer to real-world industrial parts
      and unseen CAD operations beyond curated benchmarks?
    - How can evaluation avoid circular metrics where header extraction or code similarity
      inflates apparent design-intent adherence?
    - Can long-parameter CAD sequence generators maintain validity and exact editability
      as design complexity grows?
    - What explains inconsistent generalization evidence across multimodal CAD systems,
      and what missing limitations or artifacts hide boundary conditions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 从网格或图像几何进行参数化逆向工程
      解决的问题: 从边界网格或视觉视图恢复可编辑的参数化CAD构建序列，改善体积IoU、Chamfer距离和无效比例。
      尚未覆盖: 基准类别之外的泛化、多模态端到端图像到CAD的可靠性，以及显式局限性或工件证据有限。
    - 路线: 统一多模态CAD生成与问答
      解决的问题: 在单一模型或基准中处理文本、图像、草图、点云到CAD生成、重建和CAD问答等异构任务。
      尚未覆盖: 训练分布外的鲁棒性，尤其真实图像和未见CAD操作；可复现信号不一，部分局限仅被部分披露。
    - 路线: 长序列参数化CAD生成建模
      解决的问题: 通过状态空间或演化生成的脚本-几何数据建模长参数化CAD序列，面向复杂可执行CAD零件。
      尚未覆盖: 长序列有效性、工业级复杂度下的真实性，以及对数据集后处理或增强的敏感性仍不明确。
    - 路线: 设计意图条件化与评测有效性
      解决的问题: 诊断CAD程序补全是否真正使用设计意图头信息，以及评测指标是否循环。
      尚未覆盖: 证据限于单模型/检查点、特定前缀/条件和部分几何意图，结论不一定覆盖完整生成。
    共识:
    - CAD被表示为结构化参数化操作或代码，而不仅是原始几何；可编辑性与几何有效性是共同目标。
    - 评测依赖体积IoU、Chamfer距离、语法有效率和无效比例等重建相似性指标；DeepCAD、Fusion360、MCB是常见基准。
    - 高排名证据将视觉或几何输入到可编辑CAD输出视为核心应用，并集中在2025–2026前沿。
    分歧:
    - 监督与输入信号不同：网格几何、逐步正交图像、点云、文本/图像/草图或设计意图头。
    - 训练范式不同：混合优化、多模态大模型微调、带Decision Transformer的离线强化学习、状态空间生成建模和VLM引导程序演化。
    - 评测目标不同：有的优化几何相似和程序有效性，有的用独立几何断言诊断设计意图遵循程度。
    - 部署与可复现立场不同：开源图像到代码模型与工件较少的基准/方法报告形成对比；有的暴露部分泛化，有的缺失局限性。
    开放问题:
    - 网格到CAD和图像到CAD模型能否迁移到真实工业零件和未见CAD操作，而不仅限于基准分布？
    - 如何避免因头提取或代码相似性造成循环评测，从而夸大设计意图遵循？
    - 长参数化CAD序列生成器能否在设计复杂度提高时保持有效性和精确可编辑性？
    - 多模态CAD系统泛化证据不一致，缺失的局限性和工件是否掩盖了边界条件？
