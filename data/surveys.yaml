    with geometric consistency and syntactic validity as primary objectives.'
  - 'Key differences: Choice of output representation (command sequences, CadQuery
    code, STEP files, B-rep with pointers) and supervisory signal (images, meshes,
    point clouds, orthographic views, language), along with whether stepwise editing
    or interactive feedback is supported.'
  - 'Trend evolution: Moving from single-modality reconstruction to multimodal unified
    frameworks, with architectures expanding from Transformers to Mamba and VLMs,
    and incorporating retrieval-augmented generation and evolutionary strategies for
