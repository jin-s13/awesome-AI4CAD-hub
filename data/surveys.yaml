  related_work_outline:
  - 'Mainstream direction: recovering editable parametric CAD programs from non-CAD
    inputs such as meshes, images, sketches, and point clouds.'
  - 'Shared research pattern: treating CAD as structured programs or construction
    sequences, with geometric fidelity and program validity as central evaluation
    concerns.'
  - 'Key differences: input modality, optimization or supervision strategy, program
