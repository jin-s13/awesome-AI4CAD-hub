  literature_review:
    line_of_work_matrix:
    - line: Formal representation and constraint analysis
      what_it_solves: Clarifies what executable, manufacturable, functional, and assemblable
        CAD representations must satisfy by operationalizing staged code, geometry,
        and design-intent checks.
      what_remains_open: Formal theory linking assumptions to CAD validity is sparse;
        the evidence mainly offers empirical rubrics rather than proofs of constraint
        satisfaction.
    - line: Executable parametric CAD program generation
      what_it_solves: Translates text, image, or point inputs into CadQuery scripts
        or parametric CAD sequences that can be executed and edited.
      what_remains_open: Models often recover coarse outer geometry but miss fine
        3D structure and substitute complex sweep or loft operations with simpler
        sketch-and-extrude patterns.
    - line: B-Rep and parametric surface grounding
      what_it_solves: Enables editable B-Rep generation from weak point-level supervision
        or natural-language primitive grounding without dense CAD annotations.
      what_remains_open: Brittleness under modality shift and geometric complexity,
        plus limited evidence that grounded primitives enforce manufacturability constraints.
    - line: Benchmarking and staged design-intent evaluation
      what_it_solves: Measures code validity, geometry fidelity, and engineering attributes
        such as manufacturability, functionality, and assemblability across many samples
        and tasks.
      what_remains_open: Metric rankings can change across evaluation criteria; benchmarks
        only partially connect generated geometry to formal design constraints or
        real fabrication readiness.
    - line: Proactive specification clarification
      what_it_solves: Reduces ambiguous text-to-CAD failures by auditing prompts and
        asking targeted clarification questions before program synthesis.
      what_remains_open: Scaling to low-interaction real-world workflows and proving
        specification completeness remain open.
    - line: State-space and differentiable generative CAD modeling
      what_it_solves: Models longer parametric CAD sequences with state-space architectures
        or uses differentiable parametric surfaces for mesh generation from weak supervision.
      what_remains_open: Validation emphasizes sequence validity and fidelity; generalization
        beyond the presented datasets and artifact access are under-evidenced.
    consensus:
    - The field is converging on executable parametric CAD programs or editable B-Reps
      as a shared intermediate representation for generation.
    - 'Multi-stage evaluation from code validity to geometry to design intent reveals
      a failure cascade: many outputs are syntactically valid but not engineering-ready.'
    - Frontier LLMs and VLMs capture coarse geometry but struggle with fine parametric
      detail, while specialized models excel under idealized inputs but degrade under
      modality shift.
    - Benchmarks increasingly include industrial-scale, execution-verified samples
      and multimodal inputs.
    disagreements:
    - 'Representation: CadQuery or parametric sequence scripts versus B-Rep parametric
      surfaces or patches.'
    - 'Supervision: paired text-to-CAD or image-to-CAD data versus point-level weak
      supervision versus clarification trajectories.'
    - 'Evaluation target: geometric fidelity and executability versus manufacturability,
      functionality, and assemblability.'
    - 'Interaction mode: one-shot generation versus proactive clarification before
      synthesis.'
    - 'Architecture: LLM-or-VLM code generators versus state-space or GAN latent generators
      versus differentiable parametric surface generators.'
    open_questions:
    - Can models generalize to unseen industrial part families after fine-tuning or
      reinforcement learning?
    - What formal constraints or design rules would guarantee manufacturable and assemblable
      B-Rep outputs rather than only empirical rubrics?
    - How should evaluation metrics be weighted when model rankings change across
      geometry, compactness, and engineering-readiness criteria?
    - Does proactive clarification remain low-overhead and complete for complex real-world
      CAD specifications?
    - Are the reproducibility signals sufficient to validate robustness claims, given
      missing limitation statements and varied artifact availability in the packet?
