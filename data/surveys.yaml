      program compactness, and in newer work manufacturability and functionality.'
    - Specialized reconstruction models can outperform general multimodal LLMs under
      clean idealized inputs, while benchmarks reveal failures under modality shift
      and complex geometry.
    - LLM- and agent-based methods are moving from direct code synthesis toward grounding,
      hierarchical alignment, or clarification to improve structural and parameter
