  related_work_outline_zh:
  - 主流方向：构建AI驱动的CAD生成系统，从文本、图像或3D数据生成可编辑的B-rep或参数化程序，并高度依赖基准评估。
  - 研究共性：使用大语言模型、可微分表示或混合优化将用户需求转化为可执行CAD脚本，并通过几何、拓扑和工程指标进行验证。
  - 关键差异：生成范式（LLM代码合成 vs. 轨迹推理 vs. 曲面优化）、监督模态（点云、网格、草图、文本）和评估目标（几何保真度 vs. 可制造性与可装配性）。
  - 趋势演进：从传统CAD工具包转向多模态生成式智能体与统一基准，所有顶级论文均出现在2026年，表明AI原生CAD系统正处于前沿突破期。
  - 开放问题：如何保证超出几何有效性的工程就绪性，弥合合成基准与真实CAD工作流之间的差距，以及在模糊输入和硬件约束下维持鲁棒性。
  literature_review:
    line_of_work_matrix:
    - line: CAD generation and evaluation benchmarks
      what_it_solves: Provides standardized protocols and datasets to measure geometric
        fidelity, executability, and engineering properties (manufacturability, functionality,
        assemblability) of AI-generated CAD programs.
      what_remains_open: Coverage of complex assemblies, real-world interactive workflows,
        and cross-modal generalization remains limited; metric alignment with downstream
        engineering tasks is still unverified.
    - line: Parametric CAD program synthesis from language
      what_it_solves: Translates natural language descriptions into executable parametric
        CAD scripts (e.g., CadQuery, construction trees) with improved structural
        consistency and parameter accuracy.
      what_remains_open: Handling ambiguous or underspecified requirements, avoiding
        brittle failure under modality shifts, and embedding engineering constraints
        directly into the generation process are unresolved.
    - line: 3D-to-CAD reconstruction via optimization
      what_it_solves: Recovers editable parametric CAD sequences from meshes or point
        clouds using geometric feedback and IoU-driven optimization, supporting rich
        feature operations.
      what_remains_open: Scalability to complex topology and freeform surfaces, trade-offs
        between reconstruction speed and precision, and robustness to noisy or partial
        inputs are not fully addressed.
    - line: Interactive and multi-modal CAD agents
      what_it_solves: Enables proactive clarification of ambiguous prompts, unified
        handling of text, image, sketch, and point cloud inputs, and end-to-end task
        execution in a single framework.
      what_remains_open: Interaction latency, integration depth with professional
        CAD tools, and the cost of maintaining state across multi-turn design sessions
        remain open.
    consensus:
    - All works treat editable output (B-rep or parametric histories) as essential
      for downstream engineering use.
    - Executability and validity of generated CAD programs are considered mandatory,
      not optional, for system-level evaluation.
    - A failure cascade exists from syntactically correct code to geometrically valid
      models to engineering-ready designs; closing this gap is a shared challenge.
    - Large language models and differentiable representations are the dominant computation
      backbones, displacing earlier heuristic-based CAD automation.
    disagreements:
    - 'Evaluation scope: some works focus narrowly on geometric accuracy (Chamfer
      distance, IoU), while others introduce engineering-specific rubrics for manufacturability,
      functionality, and assemblability.'
    - 'Generation strategy: direct LLM code synthesis versus structured trajectory-based
      reasoning versus optimization-based surface fitting, each with distinct fidelity–speed–robustness
      trade-offs.'
    - 'Interaction model: one-shot generation from a single prompt versus proactive
      multi-turn clarification, reflecting different assumptions about user expertise
      and design ambiguity.'
    - 'Representation choice: explicit CadQuery scripts versus hierarchical construction
      trees versus parametric Bézier patches, leading to divergent capabilities in
      editability and topology support.'
    open_questions:
    - Can current benchmarks capture the constraints of professional CAD workflows,
      such as version control, tolerance stack-up, and design-for-manufacturing rules?
    - How can generation systems be hardened against ambiguous inputs without making
      the interaction cost prohibitive for real users?
    - What is the minimal set of cross-modal evaluation protocols needed to ensure
      that a model trained on clean data generalizes to noisy, real-world sensor inputs?
    - Where should the boundary be drawn between learned generation and symbolic constraint
      solving in systems that must produce engineering-grade CAD models?
  literature_review_zh:
    研究路线矩阵:
    - 路线: CAD生成与评估基准
      解决的问题: 提供标准化协议和数据集，衡量AI生成CAD程序的几何保真度、可执行性以及工程属性（可制造性、功能性、可装配性）。
      尚未覆盖: 对复杂装配体、真实交互工作流的覆盖有限，跨模态泛化性未充分验证，度量指标与下游工程任务的对齐仍有疑问。
    - 路线: 基于语言的参数化CAD程序合成
      解决的问题: 将自然语言描述转化为可执行的参数化CAD脚本（如CadQuery、构建树），提升结构一致性和参数准确度。
      尚未覆盖: 处理模糊或欠规范需求，避免模态转换下的脆弱失败，以及将工程约束直接嵌入生成过程仍待解决。
    - 路线: 基于优化的3D到CAD重建
      解决的问题: 利用几何反馈和IoU驱动优化，从网格或点云中恢复可编辑的参数化CAD序列，支持丰富的特征操作。
      尚未覆盖: 对复杂拓扑和自由曲面的可扩展性、重建速度与精度的权衡、对噪声或部分输入的鲁棒性未完全解决。
    - 路线: 交互式与多模态CAD智能体
      解决的问题: 实现主动澄清模糊提示、统一处理文本、图像、草图、点云等输入，并在单一框架内端到端执行多种CAD任务。
      尚未覆盖: 交互延迟、与专业CAD工具的深度集成、多轮设计会话中的状态维护成本等问题仍为开放挑战。
    共识:
    - 所有工作都将可编辑输出（B-rep或参数化历史）视为下游工程应用的必要条件。
    - 生成CAD程序的可执行性和有效性被视为系统级评估的强制性要求，而非可选。
    - 从语法正确的代码到几何有效的模型再到工程就绪的设计，存在一条失败级联，弥合这一差距是共同挑战。
    - 大语言模型和可微分表示已成为主流计算主干，取代了早期基于启发式的CAD自动化方法。
    分歧:
    - 评估范围：部分工作聚焦于几何精度（Chamfer距离、IoU），另一些则引入工程专用评分标准，考量可制造性、功能性和可装配性。
    - 生成策略：直接LLM代码合成、结构化轨迹推理、基于优化的曲面拟合，各自在保真度、速度、鲁棒性上存在不同权衡。
    - 交互模式：单次提示生成 vs. 主动多轮澄清，反映了对用户专业程度和设计模糊性的不同假设。
    - 表示选择：显式CadQuery脚本、层次化构建树、参数化贝塞尔曲面，导致在可编辑性和拓扑支持能力上的差异。
    开放问题:
    - 当前基准能否覆盖专业CAD工作流中的约束，如版本控制、公差累积和面向制造的设计规则？
    - 如何增强生成系统对模糊输入的鲁棒性，同时避免交互成本过高导致用户无法承受？
    - 需要什么样的最小跨模态评测协议，才能确保在干净数据上训练的模型能泛化到噪声、真实传感器输入？
    - 在必须生成工程级CAD模型的系统中，学习式生成与符号约束求解的边界应如何划定？
