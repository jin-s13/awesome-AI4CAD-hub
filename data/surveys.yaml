    geometric feedback.'
  - 'Trend evolution: Across the available years the topic moves from specialized
    single-task reconstruction toward unified multimodal multi-task CAD benchmarks
    and universal models, adding engineering-oriented assembly criteria and agentic
    clarification at the current frontier.'
  - 'Open questions: Can universal models close the specialized-to-general gap under
    modality shift? How should metrics balance validity, fidelity, compactness, and
