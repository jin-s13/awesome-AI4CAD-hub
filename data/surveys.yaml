  related_work_outline:
  - 'Mainstream direction: recovering editable parametric CAD programs from visual
    or geometric inputs, increasingly through multimodal or code-generating models
    rather than fixed sequence decoders.'
  - 'Shared research pattern: learn from paired CAD geometry, code, or program data;
    evaluate validity and geometric similarity; target parametric operations such
    as extrusions, revolutions, fillets, and chamfers.'
  - 'Key differences: input modality and representation; stepwise reconstruction versus
    end-to-end generation; optimization, reinforcement learning, evolution, or VLM
    supervision; evaluation ranges from syntax validity to executable geometric assertions.'
  - 'Trend evolution: top evidence clusters in 2025-2026 around CadQuery-style code,
    VLM/SSM/RL methods, synthesized training data, and unified benchmarks; earlier
    years in the span do not appear in top-ranked evidence, so this is a current-frontier
    trend.'
  - 'Open questions: generalization beyond synthetic benchmarks, metric circularity,
    real manufacturing/CAE/CAM utility, and robustness to unseen operations and design
    intents.'
  related_work_outline_zh:
  - 主流方向：从视觉或几何输入恢复可编辑参数化CAD程序，越来越多采用多模态或代码生成模型，而非固定序列解码器。
  - 研究共性：基于配对CAD几何、代码或程序数据学习，评估有效性与几何相似性，目标覆盖拉伸、旋转、倒圆角、倒角等参数化操作。
  - 关键差异：输入模态与表示；逐步重建与端到端生成；优化、强化学习、演化或VLM监督；评测从语法有效性到可执行几何断言不等。
  - 趋势演进：高排名证据集中在2025-2026年，围绕CadQuery风格代码、VLM/SSM/RL方法、合成训练数据和统一基准；跨度内早期年份未出现在高排名证据中，趋势属当前前沿。
  - 开放问题：对合成基准之外的泛化、指标循环性、真实制造/CAE/CAM价值，以及对未见操作和设计意图的鲁棒性。
  literature_review:
    line_of_work_matrix:
    - line: Parametric mesh/image-to-CAD reverse engineering
      what_it_solves: Recovers editable parametric CAD construction sequences from
        meshes, images, or orthographic views by optimizing operations against geometric
        feedback or by stepwise decision-making.
      what_remains_open: Generalization to real-world scans, sketches, and complex
        topologies; whether high geometric accuracy also preserves downstream editability
        and valid solid semantics.
    - line: Multimodal and code-generating CAD models
      what_it_solves: Maps text, image, sketch, or point cloud inputs to editable
        CAD code or unified multi-task CAD outputs in a single model.
      what_remains_open: Real-world robustness beyond synthetic image-code pairs,
        unseen operations, and domain constraints such as manufacturing tolerances
        or CAE/CAM requirements.
    - line: Long-sequence generative CAD program modeling
      what_it_solves: Models parametric CAD sequences with latent or state-space generative
        architectures to produce longer valid command sequences.
      what_remains_open: Whether longer sequence generation corresponds to meaningful
        design complexity, parametric validity, and downstream task utility; dataset
        coverage and operation semantics remain lightly verified.
    - line: Evolutionary and synthetic CAD data generation
      what_it_solves: Creates complex CadQuery programs through VLM-guided iterative
        edits and validation, then uses augmented script-geometry pairs to train downstream
        image-to-CAD models.
      what_remains_open: Generated data may overfit to programmatic realism; reproducibility,
        diversity, and industrial-grade constraint coverage are not yet established.
    - line: Design-intent and evaluation diagnostics for CAD program completion
      what_it_solves: Tests whether models condition on explicit design-intent headers,
        using causal controls and executable geometric assertions to avoid circular
        metrics.
      what_remains_open: Findings are limited to one model, domain, checkpoint, and
        specific intents; no evidence yet connects header adherence to final CAD quality
        or real task outcomes.
    consensus:
    - Parametric CAD should be represented as editable programs or code, not only
      as meshes or solids, to preserve design intent.
    - Geometric feedback, whether through IoU, Chamfer distance, or executable assertions,
      is central for training and evaluation.
    - Recent methods focus on CadQuery or similar code-style outputs and aim to improve
      validity and geometric similarity over task-specific baselines.
    - Current evidence relies heavily on synthetic benchmark datasets such as DeepCAD,
      Fusion 360, MCB, or newly created CAD program datasets.
    - There is a shift toward multimodal and unified models that handle several CAD
      tasks in a single framework.
    disagreements:
    - 'Representation differs: some generate structured CAD construction sequences,
      others generate Python-style CAD code, and others use latent sequence models.'
    - 'Supervision differs: hybrid optimization uses geometric objectives, stepwise
      methods use intermediate geometry comparison or RL rewards, and others use VLM-guided
      edits or program evolution.'
    - 'Evaluation target differs: syntax validity, 3D solid similarity, invalid ratio,
      benchmark-specific SOTA, or design-intent adherence via geometric assertions.'
    - 'Interaction mode differs: some methods reconstruct from static mesh/image input,
      while others target conditional program completion with explicit design headers.'
    - 'Deployment assumptions differ: universal end-to-end models assume task unification
      benefits, whereas stepwise or hybrid approaches assume interpretable intermediate
      geometry improves reconstruction.'
    open_questions:
    - Do gains on synthetic CAD reconstruction benchmarks translate to improved mechanical
      design, manufacturing, CAE/CAM, or 3D printing workflows?
    - Can current mesh/image-to-CAD methods handle noisy real-world scans, hand sketches,
      unseen operation sequences, and partially specified designs?
    - How can evaluation avoid circularity when design-intent header extraction and
      metric scoring are based on the same generated code or geometry?
    - Which representation, code-based or parametric sequence-based, better preserves
      editability, parametric constraints, and downstream interoperability?
    - Does longer or more complex program generation reflect meaningful design complexity,
      or does it exploit dataset-specific sequence patterns?
    - What verification evidence is missing for reproducibility, given that code,
      datasets, baselines, and limitation reports are not consistently available in
      the packet?
