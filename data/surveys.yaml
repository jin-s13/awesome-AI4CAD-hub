    synthesis problem; train on large-scale datasets of CAD models paired with natural
    language descriptions; evaluate using geometric fidelity, executability, and increasingly
    design-intent metrics.'
  - 'Key differences: Representations range from discrete parametric command sequences
    (CadQuery) to continuous differentiable parametric surfaces (Bézier patches);
    interaction modes split into non-interactive one-shot generation versus proactive
    clarification; evaluation targets differ between pure geometric similarity and
    downstream manufacturability/functionality constraints.'
  - 'Trend evolution: Within the 2026 frontier, the field is moving from single-modality
    mesh-to-CAD benchmarks toward unified multimodal benchmarks, from idealized inputs
    to real-world industrial part families, and from static generation to interactive,
    specification-resolving agents. The evidence spans a narrow year range, so the
    trend describes the current frontier rather than a long-term evolution.'
  - 'Open questions: Generalization to unseen part families and complex operations
    (sweeps, lofts) remains poor; reconciliation of geometric similarity metrics with
    engineering design intent is unresolved; the trade-off between model flexibility
    and output validity under ambiguous specifications needs further study.'
