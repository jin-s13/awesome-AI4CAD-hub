      and program compactness signals to capture more than visual similarity.
    - LLM or agentic components are increasingly used to translate language or visual
      inputs into CAD operations or grounding decisions.
    - Current evaluation reveals a performance gap between producing executable code
      and producing engineering-ready manufacturable assemblies.
    - Reproducibility and validity are treated as first-class concerns through code,
      datasets, metrics, and failure analysis, though missing artifacts remain verification
      gaps.
    disagreements:
