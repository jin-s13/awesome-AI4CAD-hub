  related_work_outline:
  - 'Mainstream direction: Constructing rigorous benchmarks and generative models
    for text-to-CAD / programmatic CAD, shifting from coarse geometry to fine-grained
    parametric design and engineering constraints.'
  - 'Shared research pattern: Benchmarking exposes failure modes (invalid geometry,
    missing complex operations, brittle generalization), while new generative architectures
    and interaction strategies aim to address those gaps.'
  - 'Key differences: Evaluation targets diverge—geometric fidelity vs. manufacturability/assemblability
    vs. industrial part-family coverage; generation architectures range from LLM-based
    code synthesis to state-space models and differentiable parametric surfaces; interaction
    mode varies from fully automated to proactive clarification.'
  - 'Trend evolution: From small-scale, single-modality generation to comprehensive,
    multi-modal, and interaction-aware benchmarks; early focus on geometric reconstruction
    now complemented by design-intent, manufacturability, and real-world industrial
    complexity.'
  - 'Open questions: How to achieve reliable generalization to unseen part families;
    how to integrate engineering constraints (sweeps, lofts, tolerances) into generation;
    how to validate that evaluation metrics align with professional engineering satisfaction.'
  related_work_outline_zh:
  - 主流方向：构建严谨的文本到CAD/程序化CAD基准与生成模型，从粗粒度几何转向细粒度参数化设计与工程约束。
  - 研究共性：基准测试揭示失败模式（无效几何、缺失复杂操作、泛化脆弱），而新的生成架构与交互策略尝试填补这些缺口。
  - 关键差异：评测目标分歧——几何保真度 vs. 可制造性/可装配性 vs. 工业零件族覆盖；生成架构从基于LLM的代码合成到状态空间模型与可微分参数曲面；交互模式从全自动到主动澄清。
  - 趋势演进：从小规模、单模态生成发展到全面、多模态且考虑交互的基准；早期关注几何重建，现在则补充了设计意图、可制造性和真实工业复杂性。
  - 开放问题：如何实现对未见零件族的可靠泛化；如何将工程约束（扫掠、放样、公差）融入生成；如何验证评测指标与专业工程师的满意度一致。
  literature_review:
    line_of_work_matrix:
    - line: Benchmarking and task definition for programmatic CAD generation
      what_it_solves: Establishes standardized evaluation protocols, multi-modal datasets,
        and metrics to expose model failures in geometric fidelity, executability,
        and engineering intent, as seen in CADBench, MUSE, and BenchCAD.
      what_remains_open: Unified evaluation across generalization to unseen part families
        and alignment of synthetic metrics with professional engineering practice;
        current benchmarks mainly probe in-distribution or specific industrial families.
    - line: Generative model architectures and representations
      what_it_solves: Develops models that produce editable CAD programs from text,
        images, or point clouds using LLM-based code synthesis, state-space models,
        or differentiable parametric surfaces, improving geometric accuracy and sequence
        length.
      what_remains_open: Faithful generation of complex operations (sweeps, lofts,
        fillets) and long-range parametric dependencies; most models still simplify
        operations to sketch-and-extrude and struggle with industrial detail.
    - line: Interaction and robustness in CAD generation
      what_it_solves: Introduces proactive clarification, multi-stage design-intent
        checks, and reinforcement learning to reduce invalid output and improve satisfaction
        with manufacturability and functional requirements.
      what_remains_open: Closed-loop user studies to validate that interaction and
        rubric-based evaluation reflect real engineering workflows; scalability of
        the VLM-judge and clarification dialogues to diverse design domains.
    consensus:
    - Current text-to-CAD models recover coarse outer shapes but fail on fine-grained
      parametric details, complex operations, and industrial constraints.
    - Comprehensive benchmarks are essential to reveal failure cascades from executable
      code to valid geometry to engineering-ready design.
    - Multi-modal inputs (text, image, point cloud) and editable B-Rep outputs are
      critical for practical CAD generation.
    - There is a gap between model performance on idealized benchmarks and real-world
      engineering requirements, motivating more realistic evaluation protocols.
    disagreements:
    - 'Evaluation focus: some benchmarks prioritize geometric fidelity (e.g., Chamfer
      distance), while others target manufacturability, functionality, and assemblability
      via rubric-based VLM judges.'
    - 'Representation choice: parametric patches (Bézier surfaces) vs. imperative
      code scripts (CadQuery) vs. construction tree sequences—each with trade-offs
      in editability and training supervision.'
    - 'Interaction mode: fully automated generation vs. proactive clarification agents
      that interact with the user before synthesis, leading to different robustness-communication
      trade-offs.'
    - 'Training data: synthetic CAD datasets vs. re-annotated real-world industrial
      parts; the latter promises better generalization but remains limited in diversity
      and scale.'
    open_questions:
    - How can models generalize to unseen part families, especially those requiring
      complex operations like sweeps and lofts?
    - What combination of evaluation metrics and human-in-the-loop feedback best predicts
      engineer satisfaction in practice?
    - Can differentiable parametric surfaces be scaled to large industrial assemblies
      while maintaining editability and topological consistency?
    - To what extent does proactive clarification reduce error without burdening the
      user, and how should it be adapted for different design expertise levels?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 程序化CAD生成的基准测试与任务定义
      解决的问题: 建立标准化评估协议、多模态数据集与指标，揭示模型在几何保真度、可执行性和工程意图上的失败，典型如CADBench、MUSE、BenchCAD。
      尚未覆盖: 未见零件族的泛化统一评估，以及合成指标与专业工程实践的一致性；当前基准多探测分布内性能或特定工业族。
    - 路线: 生成模型架构与表示
      解决的问题: 开发从文本、图像或点云生成可编辑CAD程序的模型，采用基于LLM的代码合成、状态空间模型或可微分参数曲面，提升几何精度与序列长度。
      尚未覆盖: 复杂操作（扫掠、放样、圆角）和长程参数依赖的忠实生成；多数模型仍将操作简化为草图-拉伸，无法处理工业细节。
    - 路线: CAD生成中的交互与鲁棒性
      解决的问题: 引入主动澄清、多阶段设计意图检查与强化学习，减少无效输出，提高可制造性和功能需求满足度。
      尚未覆盖: 闭环用户研究以验证交互和基于评分标准的评估反映真实工程流程；VLM评判器和澄清对话对多样化设计领域的可扩展性。
    共识:
    - 当前文本到CAD模型能恢复粗略外形，但在细粒度参数化细节、复杂操作和工业约束上失败。
    - 全面的基准测试对揭示从可执行代码到有效几何再到工程就绪设计的失败级联至关重要。
    - 多模态输入（文本、图像、点云）与可编辑B-Rep输出是实用CAD生成的关键。
    - 模型在理想化基准上的表现与真实工程需求之间存在差距，推动更现实的评估协议。
    分歧:
    - 评估焦点：有的基准侧重几何保真度（如Chamfer距离），有的则通过基于评分标准的VLM评判器关注可制造性、功能性和可装配性。
    - 表示选择：参数化面片（贝塞尔曲面）vs. 命令式代码脚本（CadQuery）vs. 构建树序列，各自在可编辑性和训练监督上有不同权衡。
    - 交互模式：全自动生成 vs. 主动澄清智能体在合成前与用户交互，导致不同的鲁棒性与通信开销权衡。
    - 训练数据：合成CAD数据集 vs. 重新标注的真实工业零件；后者有望带来更好的泛化，但在多样性和规模上仍受限。
    开放问题:
    - 模型如何泛化到未见零件族，尤其是需要扫掠和放样等复杂操作的零件？
