  related_work_outline_zh:
  - 主流方向：以可编辑B-Rep/参数化CAD为目标的统一基准与LLM程序生成，评测逐渐纳入可制造性与设计意图。
  - 研究共性：构建或采用CAD数据集，生成可执行参数脚本，并用代码有效性、几何指标和设计准则联合评测；常用监督微调、强化学习或智能体循环提升对齐。
  - 关键差异：监督信号、表示方式、交互模式与评测目标不同，如点云对文本-CAD对、参数曲面对程序序列、直接生成对主动澄清、几何保真对工程就绪。
  - 趋势演进：现有强证据集中在2026年前沿，向多模态输入、长序列、工业零件族和可制造性约束推进；早期年份缺乏详细顶层证据。
