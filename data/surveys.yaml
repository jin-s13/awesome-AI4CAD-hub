  literature_review:
    line_of_work_matrix:
    - line: Multimodal CAD generation benchmarks
      what_it_solves: Provides standardized evaluation across diverse input modalities
        (image, mesh, point cloud) and metrics (geometric fidelity, executability,
        compactness) to compare models on CAD program synthesis.
      what_remains_open: Generalization to unseen industrial part families and complex
        operations (sweeps, lofts) remains poor; metrics do not fully capture design
        intent or manufacturability beyond executable geometry.
    - line: LLM-based text-to-CAD program synthesis
      what_it_solves: Generates executable CAD scripts (e.g., CadQuery) from natural
        language prompts, bridging textual descriptions and parametric modeling via
        fine-tuning or reinforcement learning.
      what_remains_open: Models often misinterpret design parameters, substitute complex
        operations with simpler sketch-and-extrude patterns, and lack robustness to
        ambiguous prompts without interactive clarification.
    - line: Hierarchical structural reasoning for CAD generation
      what_it_solves: Decomposes CAD construction trees into object-level and part-level
        reasoning trajectories, aligning topology reasoning with parametric spans
        to improve structural consistency and parameter accuracy.
      what_remains_open: Whether this hierarchical decomposition generalizes to assemblies
        with inter-part constraints and whether the trajectory alignment method scales
        to larger, diverse CAD datasets.
    - line: Proactive clarification for ambiguous specifications
      what_it_solves: Reduces invalid outputs and improves robustness by having an
        agent ask targeted clarification questions before code generation, turning
        ambiguous prompts into self-consistent specifications.
      what_remains_open: The interaction overhead and the agent's ability to handle
        highly complex or domain-specific design requirements without human intervention
        remain unvalidated.
    - line: Differentiable parametric surfaces for CAD generation
      what_it_solves: Enables training CAD generators on unannotated 3D data by representing
        B-Reps as differentiable Bézier patches and using point-level supervision,
        producing editable models from multiple modalities.
      what_remains_open: The approach's scalability to very large assemblies and its
        fidelity in preserving sharp features and high-curvature regions are not yet
        demonstrated.
    - line: Sequence modeling architectures for long parametric CAD sequences
      what_it_solves: Handles long CAD command sequences with state space models (Mamba)
        and self-supervised pretraining to generate valid, complex parametric models
        beyond the limited context windows of previous methods.
      what_remains_open: Validation is limited to specific evaluation metrics; the
        model's ability to capture design semantics and adapt to different CAD scripting
        languages is not shown.
    consensus:
    - All approaches treat CAD generation as producing either parametric command sequences
      or B-Rep surfaces, with a shared goal of editable, executable output.
    - Geometric fidelity (e.g., Chamfer distance) and executability are the primary
      metrics, but all papers acknowledge that these fail to capture higher-level
      design intent.
    - 'Models exhibit a failure cascade: from executable code to valid geometry to
      engineering-ready design, with performance degrading sharply on complex or unseen
      part families.'
    - Large language models and transformers are the dominant backbone, either used
      directly for code generation or adapted for CAD-specific tokenization and attention.
    disagreements:
    - 'Representation: some works use discrete program tokens (CadQuery scripts),
      while others use continuous parametric surface patches (Bézier), leading to
      different training supervisions (text vs. point clouds).'
    - 'Evaluation: benchmarks like CADBench and MUSE differ in whether they prioritize
      geometric similarity, compactness, or engineering criteria (manufacturability,
      assemblability), creating contradictory model rankings.'
    - 'Interaction: ProCAD introduces proactive clarification as a pre-generation
      step, whereas other methods assume a single-shot generation from a complete
      prompt.'
    - 'Specialization: Some works advocate fine-tuned CAD-specific models (e.g., mesh-to-CAD)
      over general-purpose VLMs, claiming better idealized performance, while others
      use LLMs with RL to improve code generation.'
    open_questions:
    - How can models generalize to unseen part families and complex operations like
      sweeps and lofts when current fine-tuning only improves in-distribution performance?
    - What combination of geometric and design-intent metrics can reliably predict
      real-world CAD engineer acceptance?
    - To what extent does proactive clarification scale to real-world design workflows
      with multiple stakeholders and evolving specifications?
    - Can differentiable parametric representations maintain strict engineering constraints
      (e.g., waterproofness, tolerance) during optimization?
