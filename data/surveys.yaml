    研究路线矩阵:
    - 路线: 形式化问题定义与表示
      解决的问题: 将CAD生成定义为从文本、图像或3D数据到可执行参数化程序或边界表示（B-Rep）的映射，建立关于几何组合、可编辑性以及层次结构和参数接地作用的基础假设。
      尚未覆盖: 这些形式化定义是否涵盖所有工业设计约束，以及如何验证所定义的表示与下游制造要求（如功能性和可装配性）一致。
    - 路线: 基准测试与评估分类法
      解决的问题: 将评估组织为层次化阶段（代码正确性、几何保真度、设计意图对齐），并引入可制造性、功能性和可装配性等指标，揭示失败级联以及模型在模态转换和几何复杂度下的脆弱性。
      尚未覆盖: 对未见零件族的泛化有限；缺乏统一衡量几何精度、参数简洁性和工程可行性的共识指标；评估仍依赖代理评判而非真实制造验证。
    - 路线: 生成模型设计与缩放
      解决的问题: 开发架构（LLM、状态空间模型、可微分参数曲面）和训练策略（监督微调、基于执行反馈的强化学习、自监督预训练），以改进序列生成、多模态条件生成和可编辑性。
      尚未覆盖: 缩放规律缺乏实证映射；模型在模态转换和几何复杂度下表现脆弱；生成目标中尚未集成显式制造约束；对新颖工业零件族的泛化能力仍然较差。
    共识:
    - 程序化CAD生成，尤其是通过B-Rep或脚本，是实现可编辑和精确模型的主导范式。
    - 多模态条件（文本、图像、点云）对实用CAD工具至关重要，但从这些模态到参数化CAD的映射容易出错，经常丢失精细几何细节。
    - 当前模型经常无法保留设计意图，并在超越几何相似性的工程标准上表现不佳，表现出从可执行代码到有效几何再到工程就绪设计的级联失败。
    - 揭示失败模式（可执行性、几何保真度、设计对齐）的全面基准测试对推动进展至关重要，它们揭示了系统性的弱点并指导模型改进。
    分歧:
    - 输出表示：一些工作针对CadQuery脚本，另一些针对B-Rep基元，还有的采用参数化贝塞尔曲面，导致在可编辑性、精度和可训练性上有不同权衡。
    - 评估重点：基准测试在优先考虑几何保真度、紧凑性、可执行性还是下游可制造性和设计意图上存在差异，导致模型排名随指标变化。
    - 训练范式：方法分为在精选数据集上的监督微调、基于执行反馈的强化学习以及在大规模未标注3D数据上的自监督预训练，对哪种方式能带来最佳泛化尚无共识。
    - 交互模式：一类工作假设输入明确且仅需生成，另一类则提倡在生成前通过主动澄清解决规格模糊性，以延迟换取鲁棒性。
    开放问题:
    - 如何将制造约束直接嵌入CAD生成中，以确保输出不仅几何有效，而且功能可装配？
    - 什么样的缩放规律支配着模型规模、数据多样性与对未见零件族或工业领域的泛化能力之间的关系？
    - 能否设计一个统一评估框架，联合评估参数精度、几何保真度和工程可行性，而不依赖脆弱的代理指标？
    - 如何将设计意图的形式化表示操作化，使得即使输入模糊，生成的模型也能与用户规格保持一致？
