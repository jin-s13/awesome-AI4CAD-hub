  related_work_outline:
  - 'Mainstream direction: Multi-modal, multi-task unification driven by large language
    models (LLMs) and vision-language models (VLMs) for CAD generation, with a strong
    emphasis on executable parametric programs (e.g., CadQuery) and structured benchmarks.'
  - 'Shared research pattern: Framing CAD generation as sequence-to-sequence or program
    synthesis, training on large-scale real-world/curated datasets, and evaluating
    via geometric fidelity (Chamfer distance, IoU), executability, and invalid ratio.'
  - 'Key differences: Methods diverge in whether they adopt a single unified model
    vs. separate agentic workflows (e.g., clarification agent), in the target representation
    (B-Rep grounding vs. parametric operation sequences), and in evaluation targets—geometric
    accuracy alone vs. functional engineering criteria (manufacturability, assemblability).'
  - 'Trend evolution: The field is moving from isolated task-specific models to comprehensive
    benchmarks and multi-task models, from idealized inputs to handling prompt ambiguity,
    and from pure geometric metrics to design-intent alignment and engineering validation.'
  - 'Open questions: How well do these methods generalize beyond the curated benchmark
    distributions to real-world engineering workflows, and whether the gains from
    LLM-based approaches are due to the model architecture or the scale of training
    data and post-hoc optimization.'
  related_work_outline_zh:
  - 主流方向：以大型语言模型和视觉语言模型驱动的多模态多任务统一框架，强调可执行参数化程序（如CadQuery）和结构化基准测试。
  - 研究共性：将CAD生成建模为序列到序列或程序合成，在大规模真实/精心策划的数据集上训练，通过几何保真度（Chamfer距离、IoU）、可执行性和无效比率进行评估。
  - 关键差异：在是否采用单一统一模型 vs. 分离的智能体工作流（如澄清智能体）、目标表示（B-Rep接地 vs. 参数化操作序列）以及评估目标（仅几何精度 vs.
    功能性工程标准如可制造性、可装配性）上存在分歧。
  - 趋势演进：从孤立的任务特定模型到综合基准和多任务模型，从理想化输入到处理提示模糊性，从纯几何指标到设计意图对齐和工程验证。
  - 开放问题：这些方法在多大程度上能从精心策划的基准分布推广到真实工程设计工作流，以及基于LLM的方法的收益是源于模型架构还是训练数据规模和事后优化。
  literature_review:
    line_of_work_matrix:
    - line: Unified multi-modal and multi-task CAD frameworks
      what_it_solves: Enables a single model to handle point-to-CAD, text/image-to-CAD,
        and CAD question answering across diverse input modalities, reducing the need
        for task-specific architectures.
      what_remains_open: Whether the unified model sacrifices per-task optimality
        compared to specialized models, and how its performance scales with the complexity
        of individual tasks and the diversity of input modalities.
    - line: LLM-driven parametric program generation with structural or interactive
        alignment
      what_it_solves: Generates executable CAD scripts from natural language using
        LLMs, with structural alignment (hierarchical decomposition) or interactive
        clarification to improve robustness and parameter accuracy.
      what_remains_open: The extent to which LLM fine-tuning alone can capture fine-grained
        geometric constraints and engineering design intent without explicit geometric
        reasoning modules or user-in-the-loop corrections.
    - line: Optimization-based mesh-to-CAD reconstruction
      what_it_solves: Recovers editable parametric CAD sequences from meshes through
        iterative fitting and geometric validation, ensuring high fidelity and low
        invalid ratios for complex shapes.
      what_remains_open: The computational cost of iterative optimization and its
        sensitivity to mesh quality, noise, and modality shifts, as well as generalization
        to extremely complex or multi-part assemblies.
    - line: Benchmark-driven evaluation for CAD generation
      what_it_solves: Provides standardized, multi-modal, and design-intent-oriented
        evaluation protocols that expose failure modes, model ranking inconsistencies,
        and the gap between geometric accuracy and engineering readiness.
      what_remains_open: How well benchmark metrics (e.g., VLM judges) correlate with
        human expert assessments in real manufacturing contexts, and whether benchmarks
        can drive algorithmic improvements beyond overfitting to specific metrics.
    consensus:
    - Executable parametric CAD programs are a preferred output representation, as
      they enable editability and integration with engineering workflows.
    - Geometric fidelity metrics (Chamfer distance, IoU) and program validity are
      universally adopted, but they are insufficient alone to guarantee functional
      design quality.
    - LLM-based and specialized neural models both outperform naive code-generation
      VLMs on idealized inputs, but their performance degrades under geometric complexity
      or modality shift.
    disagreements:
    - 'Whether multi-modal unification or task-specific specialization yields better
      overall performance: unified models claim state-of-the-art across tasks, while
      specialized pipelines (e.g., with optimization or clarification) show stronger
      robustness on specific sub-problems.'
    - 'What constitutes a valid evaluation: geometric-only benchmarks (CADBench) vs.
      engineering-intent rubrics (MUSE) lead to different model rankings, creating
      tension between pure geometric accuracy and functional manufacturability.'
    - 'The role of autonomous agents vs. end-to-end models: one approach introduces
      proactive clarification agents to resolve ambiguity before generation, while
      others rely on single-pass generation from clarified prompts, raising questions
      about interactivity overhead and simplicity.'
    open_questions:
    - Can the observed failure modes (e.g., brittleness under modality shift, performance
      drop with increased B-Rep face count) be mitigated by scaling data and model
      size, or do they require fundamentally new architectural priors?
    - How do the design decisions in CAD-specific LLM fine-tuning (e.g., supervised
      vs. reinforcement learning) affect the trade-off between program executability
      and geometric novelty/diversity?
    - To what extent do the reported gains stem from the proposed method vs. the training
      data quantity/quality, especially when new datasets are introduced alongside
      novel models?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态多任务CAD框架
      解决的问题: 使单一模型能够处理点云到CAD、文本/图像到CAD和CAD问答等多种任务和输入模态，减少对任务特定架构的需求。
      尚未覆盖: 统一模型是否在每个子任务上牺牲了专用模型的最优性，以及其性能如何随单个任务复杂度和输入模态多样性的增加而变化。
    - 路线: 基于LLM的带结构或交互对齐的参数化程序生成
      解决的问题: 利用LLM从自然语言生成可执行CAD脚本，通过结构对齐（层次分解）或交互澄清提高鲁棒性和参数准确性。
      尚未覆盖: 仅靠LLM微调能否在缺乏显式几何推理模块或用户交互纠正的情况下，捕捉细粒度几何约束和工程设计意图。
    - 路线: 基于优化的网格到CAD重建
      解决的问题: 通过迭代拟合和几何验证从网格恢复可编辑的参数化CAD序列，确保复杂形状的高保真度和低无效比率。
      尚未覆盖: 迭代优化的计算成本及其对网格质量、噪声和模态转换的敏感性，以及向极复杂或多部件装配体的泛化。
    - 路线: 面向CAD生成的基准驱动评估
      解决的问题: 提供标准化、多模态和面向设计意图的评估协议，揭示失败模式、模型排名不一致以及几何精度与工程就绪之间的差距。
      尚未覆盖: 基准指标（如VLM评判器）与真实制造场景中人类专家评估的相关性，以及基准是否能推动算法改进而不只是过度拟合特定指标。
    共识:
    - 可执行参数化CAD程序是首选输出表示，因为它支持可编辑性和与工程工作流的集成。
    - 几何保真度指标（Chamfer距离、IoU）和程序有效性被普遍采用，但仅凭它们不足以保证功能设计质量。
    - 基于LLM和专用神经模型在理想化输入上均优于简单的代码生成VLM，但在几何复杂或模态转换下性能下降。
    分歧:
    - 多模态统一还是任务特定专业化能带来更优的整体性能：统一模型声称跨任务最优，而专用流水线（如含优化或澄清）在特定子问题上表现出更强的鲁棒性。
    - 什么是有效的评估：仅几何基准（如CADBench）与工程意图评分标准（如MUSE）导致不同的模型排名，在纯几何精度和功能可制造性之间产生张力。
    - 自主智能体与端到端模型的角色：一种方法在生成前引入主动澄清智能体以解决歧义，而其他方法依赖单次生成，引发关于交互开销和简洁性的问题。
    开放问题:
    - 观察到的失败模式（如模态转换下的脆弱性、B-Rep面数增加时性能下降）能否通过扩展数据和模型规模来缓解，还是需要全新的架构先验？
    - CAD专用LLM微调中的设计决策（如监督微调与强化学习）如何影响程序可执行性与几何新颖性/多样性之间的权衡？
    - 报告的收益在多大程度上源于所提出的方法本身，而非训练数据的数量/质量，特别是在引入新数据集的同时提出新模型的情况下？
