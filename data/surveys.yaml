  related_work_outline_zh:
  - 主流方向：端到端可运行CAD生成系统与评测平台，将文本、图像、草图、点云或网格输入转换为可执行参数化CAD程序；代表工作如CADBench、FutureCAD、UniCAD和CADFit。
