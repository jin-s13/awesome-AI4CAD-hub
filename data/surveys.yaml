  literature_review:
    line_of_work_matrix:
    - line: Multimodal and industrial CAD program generation benchmarks
      what_it_solves: Defines controlled evaluation protocols across image, text,
        mesh, and 3D inputs for executable CAD programs; stratifies geometric complexity
        and adds engineering-oriented checks.
      what_remains_open: Metric agreement across geometry, executability, and engineering
        intent; automated judge reliability; generalization to unseen part families
        and complex operations.
    - line: Hierarchical and grounded text-to-CAD program generation
      what_it_solves: Decomposes construction trees into topology and parameter reasoning,
        with explicit structure alignment, parameter grounding, or clarification to
        improve program validity and fidelity.
      what_remains_open: Handling ambiguous prompts without excessive interaction;
        transferring grounding beyond seen template or part-family distributions;
        preserving complex operations like sweep and loft.
    - line: Differentiable parametric B-Rep and sequence generative models
      what_it_solves: Generates editable B-Reps or long parametric CAD sequences from
        weak point-level or latent supervision, reducing dependence on CAD-specific
        annotations.
      what_remains_open: Exact constraint preservation, modality shift robustness,
        and whether point-level supervision transfers to engineering assemblies.
    - line: LLM-driven executable CAD code generation and editing
      what_it_solves: Maps natural language and images to executable CadQuery scripts;
        supports code QA, editing, and program synthesis verifiable by execution.
      what_remains_open: Coarse outer geometry is often recovered but fine 3D structure
        and design parameters are missed; distribution shift remains after fine-tuning
        and reinforcement learning.
    consensus:
    - The field treats production of executable parametric CAD programs or editable
      B-Reps as the central capability to verify geometric validity beyond static
      mesh prediction.
    - 'There is shared emphasis on explicit grounding: natural language or images
      are aligned to topology, primitive, or parameter structure before program decoding.'
    - Evaluation is moving beyond single-value reconstruction error toward stratified,
      multi-metric protocols covering executability, compactness, and design intent.
    - Several studies identify a common failure cascade from executable code, to valid
      geometry, to engineering-ready design.
    disagreements:
    - Representation choice varies from CadQuery scripts, construction trees, and
      Bézier/B-Rep patches to latent state-space sequences.
    - Supervision ranges from point-level or unannotated 3D data to curated text-CAD
      pairs with interactive clarification trajectories.
    - Evaluation target differs between idealized geometric fidelity and industry-oriented
      manufacturability, functionality, and assemblability rubrics.
    - Some methods use direct generation while others insert proactive clarification,
      changing the interaction and error-correction boundary.
    - Automated geometric metrics and VLM-based design-intent judges are not yet shown
      to agree across all tasks.
    open_questions:
    - How can current text-to-CAD and image-to-CAD methods generalize to unseen industrial
      part families and complex operations such as sweeps and lofts?
    - Do automated metrics and VLM judges align with expert engineering evaluation
      across manufacturability, functionality, and assemblability?
    - Which representation and supervision combination best balances geometric fidelity,
      editability, and robustness under modality shift?
    - What formal or structural alignment conditions are sufficient for engineering-ready
      CAD rather than merely executable code or valid geometry?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态与工业CAD程序生成基准
      解决的问题: 为可执行CAD程序生成定义受控评估协议，覆盖图像、文本、网格和三维输入，并按几何复杂度分层，加入工程导向检查。
      尚未覆盖: 几何、可执行性与工程意图指标间的一致性；自动化评判可靠性；对未见零件族和复杂操作的泛化。
    - 路线: 层次化并接地的文本到CAD程序生成
      解决的问题: 将构建树分解为拓扑和参数推理，通过显式结构对齐、参数接地或主动澄清提高程序有效性和保真度。
      尚未覆盖: 在少量交互下处理模糊提示；将接地能力迁移到未见模板或零件族；保留扫掠和放样等复杂操作。
    - 路线: 可微分参数化B-Rep与序列生成模型
      解决的问题: 从点级或潜在弱监督生成可编辑B-Rep或长参数化CAD序列，减少对CAD特定标注的依赖。
      尚未覆盖: 精确约束保持、模态转换鲁棒性，以及点级监督能否迁移到工程装配体。
    - 路线: LLM驱动的可执行CAD代码生成与编辑
      解决的问题: 将自然语言和图像映射到可执行的CadQuery脚本；支持代码问答、编辑和可由执行验证的程序合成。
      尚未覆盖: 通常能恢复粗略外形，但遗漏细部三维结构和设计参数；微调与强化学习后的分布外泛化仍有限。
    共识:
    - 研究普遍把可执行参数化CAD程序或可编辑B-Rep视为验证几何有效性的核心能力。
    - 多篇证据强调显式接地：将自然语言或图像对齐到拓扑、基元或参数结构后再解码。
    - 评估正从单一重建误差转向分层、多指标协议，覆盖可执行性、紧凑性与设计意图。
    - 多个方法识别出从可执行代码、有效几何到工程就绪设计的共同失败级联。
    分歧:
    - 表示选择不同：CadQuery脚本、构建树、Bézier/B-Rep面片或潜在状态空间序列。
    - 监督信号不同：点级或无标注三维数据，对比精选文本-CAD配对和交互澄清轨迹。
    - 评测目标不同：理想化几何保真对比面向制造、功能和装配的工程评分标准。
    - 交互方式不同：直接生成对比先主动澄清再合成。
    - 自动几何指标与基于VLM的设计意图评判尚未在全部任务上证明一致。
    开放问题:
    - 当前文本到CAD和图像到CAD方法如何泛化到未见工业零件族及扫掠、放样等复杂操作？
    - 自动指标和VLM评判是否能在可制造性、功能性、可装配性上与专家工程评估一致？
    - 哪种表示和监督组合能在几何保真、可编辑性和模态转换鲁棒性之间取得最佳平衡？
    - 哪些形式或结构对齐条件足以从可执行代码推进到工程就绪CAD？
