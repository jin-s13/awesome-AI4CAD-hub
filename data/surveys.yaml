  related_work_outline:
  - 'Mainstream direction: Recent work centers on generating or reconstructing editable
    parametric CAD programs rather than raw geometry, especially text-to-CAD via LLMs
    and mesh/point/image-to-CAD reverse engineering, with new multimodal benchmarks.'
  - 'Shared research pattern: Papers couple structured CAD representations with grounding,
    alignment, or geometric optimization feedback, then evaluate validity, geometric
    fidelity, and increasingly engineering intent across multiple datasets and metrics.'
  - 'Key differences: Generation mechanisms split among LLM code generation, unified
    multimodal models, stepwise reverse engineering, and hybrid optimization; evaluation
    targets range from geometric/executability metrics to manufacturability/assemblability;
    interaction ranges from one-shot to proactive clarification.'
  - 'Trend evolution: The available top-paper evidence is all 2026, so the trend is
    within the current frontier: a shift toward unified multimodal/multi-task evaluation,
    LLM-driven program synthesis, and agentic or optimization-based correction for
    CAD validity.'
  - 'Open questions: Remaining gaps include engineering-grade alignment, robustness
    under ambiguous prompts and modality shift, attribution of gains to model versus
    planner/optimizer, and inconsistent reporting of limitations or artifacts.'
  related_work_outline_zh:
  - 主流方向：近期工作集中在生成或重建可编辑参数化CAD程序，而非原始几何；尤其是基于LLM的文本到CAD，以及网格/点云/图像到CAD逆向工程，并辅以新的多模态基准。
  - 研究共性：论文通常将结构化CAD表示与某种接地、对齐或优化反馈结合，并在多个数据集和指标上评估有效性、几何保真度，逐渐加入工程意图。
  - 关键差异：生成机制在LLM代码生成、统一多模态模型、逐步逆向工程和混合优化之间分化；评估目标从几何/可执行性指标到可制造性/可装配性；交互从一次性生成到主动澄清。
  - 趋势演进：可见的顶尖论文均为2026年，趋势处于当前前沿：向统一多模态/多任务评估、LLM驱动的程序合成，以及用于CAD有效性的智能体或优化校正演进。
  - 开放问题：工程级对齐、模糊提示与模态转移下的鲁棒性、模型与规划器/优化器的贡献归因，以及局限性/工件报告不一致等证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal benchmarks and evaluation protocols for CAD program
        generation
      what_it_solves: Standardized comparison across text, image, sketch, mesh, point
        cloud inputs and across geometric, executability, and engineering metrics.
      what_remains_open: Whether benchmark rankings transfer to engineering-grade
        manufacturability, assemblability, retrieval, editing, and reasoning tasks.
    - line: LLM-driven text-to-CAD program synthesis with structure and parameter
        grounding
      what_it_solves: Converting text design intent into executable parametric scripts
        while grounding B-Rep primitives or parameters.
      what_remains_open: Robustness to ambiguous prompts and geometric complexity,
        and whether gains come from supervision, reinforcement, grounding, or data.
    - line: Mesh, image, and point-to-CAD reverse engineering by stepwise or optimization-based
        reconstruction
      what_it_solves: Recovering editable parametric operations from geometry while
        improving validity and geometric fidelity.
      what_remains_open: Scalability to complex topology, behavior under modality
        shift, and separation of optimization/search from learned priors.
    - line: Agentic clarification and specification resolution for text-to-CAD
      what_it_solves: Reducing invalid or under-specified CAD programs by asking targeted
        questions before code synthesis.
      what_remains_open: Interaction overhead, generalization beyond curated CadQuery
        data, and compatibility with non-agentic pipelines.
    - line: Unified multimodal multi-task CAD models
      what_it_solves: Handling reconstruction, generation, and question answering
        across several input modalities in a single framework.
      what_remains_open: Whether one model preserves specialized geometric fidelity
        and covers retrieval, editing, and reasoning tasks.
    - line: Method evidence and ablation protocol for CAD generation and reconstruction
      what_it_solves: Separating method contribution from dataset, baseline, metric,
        and implementation effects through benchmark stratification and evaluation
        suites.
      what_remains_open: Limitation statements and artifact availability are inconsistent,
        so isolation of method effects is only partially supported.
    consensus:
    - CAD is represented as editable parametric programs or construction sequences,
      making validity, compactness, and geometric fidelity measurable.
    - Evaluation is trending multimodal and multi-metric, with repeated evidence that
      model rankings and failure modes change across inputs, geometry complexity,
      and metrics.
    - Grounding and alignment mechanisms are needed to connect natural language or
      visual inputs to executable CAD structure and parameters.
    - 'Validity is a first-class concern: executable code can still fail to yield
      valid geometry or engineering-ready design.'
    - Benchmarks and models increasingly evaluate engineering intent beyond geometric
      similarity, including functionality, manufacturability, and assemblability.
    disagreements:
    - 'Generation mechanism: LLM code synthesis, specialized sequence models, and
      optimization or stepwise reconstruction differ.'
    - 'Supervision signal: supervised fine-tuning plus reinforcement learning, structure
      alignment with parameter ranking, and geometric IoU optimization differ.'
    - 'Evaluation target: geometric/executability/compactness metrics versus engineering-grade
      manufacturability, functionality, and assemblability have different priorities.'
    - 'Interaction mode: single-step text-to-CAD versus proactive clarification agents;
      single-modal versus multimodal inputs.'
    - 'Model scope: unified multi-task multimodal models versus task-specific mesh-to-CAD
      or text-to-CAD systems.'
    open_questions:
    - How well do current benchmark metrics predict engineering readiness, given the
      observed failure cascade from executable code to valid geometry to design-intent
      alignment?
    - What is the isolated contribution of learned priors versus optimization or search
      procedures in mesh, point, and image-to-CAD reconstruction?
    - Can proactive clarification reduce ambiguity without excessive interaction overhead
      and transfer beyond curated text-to-CadQuery settings?
    - What evidence gaps remain because limitations, code, datasets, and baseline
      details are not consistently reported?
    - How should unified multimodal CAD models be evaluated on retrieval, editing,
      and reasoning tasks that current evidence does not cover?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向CAD程序生成的统一多模态基准与评估协议
      解决的问题: 在文本、图像、草图、网格、点云输入以及几何/可执行性/工程指标上实现标准化比较。
      尚未覆盖: 基准排名能否迁移到工程级可制造性、可装配性、检索、编辑和推理任务仍待验证。
    - 路线: 基于LLM的文本到CAD程序合成与结构/参数接地
      解决的问题: 将文本设计意图转化为可执行参数化脚本，并接地到B-Rep基元或参数。
      尚未覆盖: 对模糊提示和几何复杂性的鲁棒性，以及监督、强化、接地和数据各自贡献仍不清楚。
    - 路线: 网格、图像和点云到CAD的逐步或优化式逆向工程
      解决的问题: 从几何恢复可编辑参数化操作，同时提高有效性和几何保真度。
      尚未覆盖: 复杂拓扑和模态转移下的可扩展性，以及优化/搜索与学习先验的贡献分离。
    - 路线: 面向文本到CAD的主动澄清与规格解析
      解决的问题: 在代码合成前通过有针对性的提问减少无效或规格不足的CAD程序。
      尚未覆盖: 交互开销、超出精选CadQuery数据的泛化，以及与一次性流程的兼容性。
    - 路线: 统一多模态多任务CAD模型
      解决的问题: 在单一模型中处理多个输入模态下的重建、生成和问答。
      尚未覆盖: 是否在保留专用几何保真度的同时覆盖检索、编辑和推理任务。
    - 路线: CAD生成与重建的方法证据与消融协议
      解决的问题: 通过基准分层和评估套件分离方法与数据集、基线、指标和实现因素。
      尚未覆盖: 局限性声明和工件可用性不一致，方法贡献隔离只得到部分支持。
    共识:
    - CAD被表示为可编辑参数化程序或构建序列，使有效性、紧凑性和几何保真度可测量。
    - 评估趋向多模态和多指标，证据反复显示模型排名和失败模式随输入、几何复杂度和指标变化。
    - 需要接地和对齐机制来连接自然语言或视觉输入与可执行CAD结构和参数。
    - 有效性是首要关注：代码可执行仍可能无法产生有效几何或工程就绪设计。
    - 基准和模型越来越多地评估几何相似性之外的工程意图，包括功能性、可制造性和可装配性。
    分歧:
    - 生成机制：LLM代码合成、专用序列模型、优化或逐步重建之间存在差异。
    - 监督信号：监督微调加强化学习、结构对齐加参数排序、几何IoU优化之间不同。
    - 评估目标：几何/可执行性/紧凑性与工程级可制造性/功能性/可装配性各有侧重。
    - 交互模式：单次文本到CAD与主动澄清智能体不同；单模态与多模态输入不同。
    - 模型范围：统一多任务多模态模型与任务特定的网格到CAD或文本到CAD系统之间存在分化。
    开放问题:
    - 当前基准指标能在多大程度上预测工程就绪度，尤其在从可执行代码到有效几何再到设计意图对齐的失败级联下？
    - 学习先验与优化/搜索程序在网格、点云和图像到CAD重建中的各自贡献是什么？
    - 主动澄清能否在不过度增加交互开销的情况下减少歧义，并迁移到精选文本到CadQuery设定之外？
    - 由于局限性、代码、数据集和基线细节报告不一致，存在哪些证据缺口？
    - 统一多模态CAD模型如何评估检索、编辑和推理任务，而当前证据尚未覆盖？
