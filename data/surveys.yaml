  related_work_outline:
  - 'Mainstream direction: Recent CAD benchmark work is consolidating around unified
    multimodal and multi-task evaluation for CAD program generation and reconstruction,
    with representative examples such as CADBench and UniCAD covering text, images,
    point clouds, and meshes.'
  - 'Shared research pattern: Papers combine shared datasets or task suites with layered
    metrics for geometric fidelity, executability/validity, and increasingly engineering
    design intent instead of relying on a single aggregate score.'
  - 'Key differences: Work differs in evaluation target, from idealized geometry similarity
    and program validity to manufacturability/functionality/assemblability, and in
    supervision, from deterministic geometry/code checks to VLM judges and proactive
    clarification.'
  - 'Trend evolution: Within the current frontier, the trend moves from single-task
    geometry benchmarks toward multi-modal, assembly-aware, and agentic or clarification-based
    evaluation; older years are present in the topic but not evidenced in the top-paper
    packet.'
  - 'Open questions: How well proxy metrics align with downstream manufacturing decisions,
    whether model rankings remain stable across metrics and modalities, and how reliably
    automated judges evaluate design intent remain unresolved.'
  related_work_outline_zh:
  - 主流方向：近期CAD基准工作正围绕统一多模态、多任务评估体系展开，覆盖文本、图像、点云、网格到CAD程序的生成与重构，例如CADBench和UniCAD。
  - 研究共性：论文通常把共享数据集或任务套件与分层指标结合，不只看几何相似度，还评估可执行性/有效性以及越来越受关注的工程设计意图。
  - 关键差异：评估目标、监督信号和交互方式不同：从理想化几何相似度、程序有效性到可制造性/功能性/可装配性，从确定性检查到VLM评判和主动澄清。
  - 趋势演进：在当前前沿内，趋势从单任务几何基准转向多模态、装配感知和基于澄清或智能体的评估；较早年份在证据包中未充分体现。
  - 开放问题：代理指标与下游制造决策是否一致、模型排名在不同指标和模态下是否稳定、自动评判器对设计意图评估的可靠性如何，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make CAD generation
        and reconstruction claims comparable across multimodal inputs.
      what_remains_open: Whether the task distribution covers real design workflows,
        assembly constraints, and manufacturing settings beyond aggregated existing
        datasets.
    - line: Metric and stress-test design
      what_it_solves: Probing geometric fidelity, program executability/validity,
        robustness to complexity and modality shift, and higher-level design intent.
      what_remains_open: Alignment between proxy metrics and downstream engineering
        decisions, plus the reliability of automated VLM judges and human agreement.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable by comparing specialized CAD models
        and general vision-language or LLM agents under shared evaluation protocols.
      what_remains_open: Whether benchmark conclusions remain stable across implementations,
        compute budgets, and unverified code/dataset/artifact availability.
    consensus:
    - Recent work converges on evaluating CAD generation with more than aggregate
      geometry scores, adding executability, validity, and engineering design criteria.
    - There is a shared focus on multimodal CAD program generation or reconstruction
      from text, images, sketches, point clouds, and meshes.
    - 'Staged evaluation is common: first code validity, then geometric validity,
      then design-intent alignment with structured specifications.'
    - Benchmarks increasingly report failure cascades and sensitivity of model rankings
      rather than treating a single metric as sufficient.
    - Specialized CAD models may outperform general vision-language or LLM systems
      under idealized conditions, but robustness remains an open concern.
    disagreements:
    - 'Evaluation target differs: idealized geometric similarity, parametric program
      validity, or manufacturability/functionality/assemblability.'
    - 'Supervision and validation differ: deterministic geometry/code checks, VLM
      judges with design-specific rubrics, human annotation, and ranking-based parameter
      grounding.'
    - 'Interaction mode differs: single-shot multimodal generation versus proactive
      clarification before CAD code synthesis.'
    - 'Dataset construction differs: aggregating existing mesh/CAD families versus
      curating real-world datasets or structured assembly-level design specifications.'
    open_questions:
    - How well do current geometric and validity metrics align with actual manufacturability
      and downstream engineering decision quality?
    - Why do model rankings change across metrics and modalities, and which evaluation
      settings should be trusted?
    - How reliable are VLM judges for design-intent evaluation, and how much human
      verification is needed across different design domains?
    - Do current benchmarks cover realistic assembly, tolerance, and manufacturing
      process constraints?
    - What reproducibility gaps exist in code, data, and artifact availability, and
      would conclusions persist under different implementations and compute budgets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 建立共享任务和数据集，使多模态输入下的CAD生成与重构主张具备可比性。
      尚未覆盖: 任务分布是否覆盖真实设计工作流、装配约束和制造环境，而不仅是聚合已有数据集。
    - 路线: 指标与压力测试设计
      解决的问题: 检验几何保真度、程序可执行性/有效性、对复杂度和模态转换的鲁棒性，以及更高层次的工程设计意图。
      尚未覆盖: 代理指标与下游工程决策之间的一致性，以及VLM自动评判器可靠性和人工一致性验证。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共享评估协议，比较专用CAD模型与通用视觉语言或LLM智能体，使结果更具可审计性。
      尚未覆盖: 结论在不同实现、算力预算以及未经核验的代码/数据集/工件下是否稳定。
    共识:
    - 近期工作已形成共识：CAD生成评估不应只依赖聚合几何分数，还要纳入可执行性、有效性和工程设计标准。
    - 共同的关注点是多模态CAD程序生成或重建，输入覆盖文本、图像、草图、点云和网格。
    - 分阶段评估很常见：先检查代码有效性，再检查几何有效性，最后与结构化设计规范进行设计意图对齐。
    - 基准开始报告失败级联和模型排名敏感性，而不是把单一指标视为充分。
    - 专用CAD模型在理想化条件下可能优于通用视觉语言或LLM系统，但鲁棒性仍是开放问题。
    分歧:
    - 评估目标不同：理想化几何相似度、参数化程序有效性，或可制造性/功能性/可装配性。
    - 监督与验证不同：确定性几何/代码检查、带设计特定评分标准的VLM评判器、人工标注和基于排名的参数接地。
    - 交互方式不同：单次多模态生成，或在CAD代码合成前进行主动澄清。
    - 数据集构建不同：聚合既有网格/CAD数据集家族，或策划真实世界数据集与结构化装配级设计规范。
    开放问题:
    - 当前几何与有效性指标在多大程度上与实际可制造性和下游工程决策质量一致？
    - 模型排名为何在不同指标和模态下变化，哪些评估设置更可信？
    - VLM评判器在设计意图评估中是否足够可靠，跨领域需要多少人工验证？
    - 现有基准是否覆盖真实装配、公差和制造工艺约束？
    - 代码、数据和工件可得性存在哪些未验证缺口，结论在不同实现和算力预算下是否持续成立？
