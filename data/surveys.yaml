  related_work_outline_zh:
  - 主流方向：AI驱动的CAD模型生成、重建与理解，重点关注面向结构化表示的几何深度学习。
  - 研究共性：多数工作采用深度神经网络从几何数据（B-rep、网格、点云）中学习，并严重依赖合成数据进行训练，目标是自动化或辅助CAD工作流。
  - 关键差异：在几何表示（B-rep vs 网格 vs 点云）、生成范式（自回归、强化学习、图神经网络）和任务设定（生成、重建、对齐、交互）上存在分歧。
  - 趋势演进：领域正从传统几何处理转向基于学习的方法，近期更关注复杂拓扑生成、可控性及多模态交互；证据时间跨度为2016–2026年，表明该方向处于当前深度学习前沿的持续演进中。
  - 开放问题：如何跨不同CAD格式泛化，如何一致地评估拓扑有效性，以及如何减少对合成数据的依赖等问题尚未解决。
  literature_review:
    line_of_work_matrix:
    - line: B-rep generation and geometric modeling
      what_it_solves: Generating topologically valid and geometrically complex boundary
        representation models, which are the standard in industrial CAD.
      what_remains_open: Generalization to other CAD formats and verification on large-scale
        industrial datasets; the provided evidence does not discuss limitations or
        failure modes.
    - line: 3D reconstruction from point clouds
      what_it_solves: Reconstructing structured 3D building models from unstructured
        point clouds, potentially using polyhedron-based graph neural networks.
      what_remains_open: No methodology or results are available in the evidence packet,
        so the specific capabilities and limitations cannot be assessed.
    - line: Controllable CAD model generation
      what_it_solves: Enabling user control over the generation process through hierarchical
        neural coding, which could support design exploration.
      what_remains_open: The evidence lacks details on the control mechanisms, evaluation
        metrics, and any constraints on the types of controllable edits.
    - line: Dataset creation for manufacturing processes
      what_it_solves: Providing a multimodal dataset (Slice-100K) for extrusion-based
        3D printing, which can facilitate learning-based slicing and toolpath planning.
      what_remains_open: The downstream model performance and the dataset's coverage
        of manufacturing variability are not discussed in the evidence.
    - line: Structured deformable mesh generation
      what_it_solves: Generating deformable meshes with structural part information,
        which is useful for animation and shape editing.
      what_remains_open: No analysis is provided, so the extent of structure preservation
        and the ability to handle diverse topologies are unknown.
    - line: Unsupervised part decomposition
      what_it_solves: Decomposing 3D objects into hierarchical parts from a single
        RGB image without part-level supervision, reducing annotation cost.
      what_remains_open: The evidence contains no implementation details or results,
        making it impossible to evaluate the decomposition quality or scalability.
    - line: CAD interaction learning from video
      what_it_solves: Learning long-horizon CAD UI interactions from video demonstrations,
        with the aim of automating complex design sequences.
      what_remains_open: Only a high-level description is present; the action space,
        success rate, and generalization to unseen CAD tools are not evidenced.
    - line: Scene alignment and recomposition
      what_it_solves: Aligning CAD models to 3D scans using deep reinforcement learning
        (Learning-based ICP), which handles clutter and viewpoint variations.
      what_remains_open: The method is trained only on synthetic data; its performance
        on real-world scans with high diversity and noise is not fully validated in
        the evidence.
    consensus:
    - Deep learning is the primary tool for processing CAD-related geometric data.
    - Synthetic data plays a crucial role in training because obtaining annotated
      real CAD or scan data is expensive.
    - Geometric representation choice (B-rep, mesh, point cloud) is a central design
      decision that influences model capabilities.
    disagreements:
    - 'Representation type: some works operate on B-rep structures, while others use
      meshes or point clouds, leading to different strengths in topological vs. geometric
      fidelity.'
    - 'Task granularity: the papers target different stages of the CAD pipeline—generation
      from scratch, reconstruction from sensors, alignment with scenes, or interaction
      with CAD UIs—which makes direct comparison difficult.'
    - 'Evaluation setting: some rely on purely synthetic benchmarks, whereas others
      incorporate real scanned data; the lack of a common evaluation protocol limits
      comparability.'
    open_questions:
    - Can a unified representation support both generative and discriminative tasks
      across the CAD pipeline?
    - What are the minimal annotation requirements to adapt synthetic-trained models
      to real manufacturing or design scenarios?
    - How should topological validity be measured and enforced in a learning-based
      generation system?
  literature_review_zh:
    研究路线矩阵:
    - 路线: B-rep生成与几何建模
      解决的问题: 生成具有拓扑有效性和几何复杂度的边界表示模型，这是工业CAD的标准格式。
      尚未覆盖: 对其他CAD格式的泛化及在大规模工业数据集上的验证；证据包中未讨论局限性或失败模式。
    - 路线: 基于点云的三维重建
      解决的问题: 从非结构化点云重建结构化三维建筑模型，可能使用多面体图神经网络。
      尚未覆盖: 证据包中没有方法或结果，无法评估具体能力和局限性。
    - 路线: 可控CAD模型生成
      解决的问题: 通过层次神经编码实现对生成过程的用户控制，可能支持设计探索。
      尚未覆盖: 证据缺少控制机制、评价指标以及可控编辑类型的限制等细节。
    - 路线: 面向制造过程的数据集构建
      解决的问题: 提供面向挤出式3D打印的多模态数据集（Slice-100K），可促进基于学习的切片和路径规划。
      尚未覆盖: 证据未讨论下游模型性能及数据集对制造变异性的覆盖。
    - 路线: 结构化可变形网格生成
      解决的问题: 生成带有结构部件信息的可变形网格，适用于动画和形状编辑。
      尚未覆盖: 未提供分析，结构保持程度和处理多样化拓扑的能力未知。
    - 路线: 无监督部件分解
      解决的问题: 从单张RGB图像无监督地分解出3D物体的层次化部件，减少标注成本。
      尚未覆盖: 证据不含实现细节或结果，无法评估分解质量或可扩展性。
    - 路线: 从视频学习CAD交互
      解决的问题: 从视频演示中学习长时程CAD UI交互，旨在自动化复杂设计序列。
      尚未覆盖: 仅有高层次描述；动作空间、成功率及对未知CAD工具的泛化能力未提供证据。
    - 路线: 场景对齐与重组
      解决的问题: 使用深度强化学习（Learning-based ICP）将CAD模型与3D扫描对齐，处理杂波和视角变化。
      尚未覆盖: 方法仅用合成数据训练；在高度多样化和噪声的真实扫描上的性能未在证据中充分验证。
    共识:
    - 深度学习是处理CAD相关几何数据的主要工具。
    - 合成数据在训练中扮演关键角色，因为获取标注的真实CAD或扫描数据代价高昂。
    - 几何表示（B-rep、网格、点云）的选择是影响模型能力的核心设计决策。
    分歧:
    - 表示类型：有的工作操作B-rep结构，有的使用网格或点云，导致在拓扑保真度与几何保真度上各有侧重。
    - 任务粒度：论文覆盖CAD管线的不同阶段——从零生成、传感器重建、场景对齐到CAD UI交互——使得直接比较困难。
    - 评测设置：有的依赖纯合成基准，有的纳入真实扫描数据；缺乏统一的评测协议限制了可比性。
    开放问题:
    - 能否用统一的表示同时支持CAD管线中的生成和判别任务？
    - 将合成数据训练的模型适配到真实制造或设计场景所需的最小标注是什么？
    - 在基于学习的生成系统中，应如何衡量和强制拓扑有效性？
