  related_work_outline:
  - 'Mainstream direction: Current work concentrates on unified multimodal and multi-task
    CAD benchmarks that pair mesh, point-cloud, text, image, or assembly inputs with
    CAD program generation, reconstruction, or question answering and report multiple
    geometric, validity, and design-intent metrics.'
  - 'Shared research pattern: Papers combine curated datasets or benchmark suites
    with staged evaluation, checking executable code or geometry, measuring fidelity
    and invalid-program rates, and stress-testing specialized and general-purpose
    models across complexity and modality conditions.'
  - 'Key differences: Some evaluations target single-turn generative reconstruction
    or program generation, while others target editable B-Rep assemblies and engineering
    constraints; some introduce proactive clarification, and metric choices span deterministic
    geometric checks and VLM-judge rubrics.'
  - 'Trend evolution: The available top-paper evidence is concentrated in 2026, so
    a long-term trend cannot be inferred; within the current frontier, evaluation
    is moving from isolated geometry tasks toward multi-modal, multi-task suites with
    complexity stratification and design-intent checks.'
  - 'Open questions: Whether proxy geometric or program-level metrics align with downstream
    manufacturing, functionality, and assemblability decisions; whether rankings remain
    stable across metric, modality, and implementation differences; and how to cover
    ambiguous interactive specifications remain unresolved.'
  related_work_outline_zh:
  - 主流方向：当前工作集中于统一多模态、多任务CAD基准，将网格、点云、文本、图像或装配输入与CAD程序生成、重建或问答配对，并报告几何、有效性与设计意图等多类指标。
  - 研究共性：论文通常将精选数据集或基准套件与分阶段评估结合，先检查可执行代码或几何，再衡量保真度和无效程序率，并在复杂度和模态条件下对专用与通用模型进行压力测试。
  - 关键差异：一些评测面向单轮生成式重建或程序生成，另一些面向可编辑B-Rep装配体和工程约束；部分工作引入主动澄清，指标选择既有确定性几何检查，也有VLM评判器规则。
  - 趋势演进：可用证据集中在2026年，无法推断长期趋势；在当前前沿内部，评测正从孤立几何任务走向多模态多任务套件，并加入复杂度分层和设计意图检查。
  - 开放问题：代理几何或程序级指标是否与下游可制造性、功能性和可装配性决策一致；排名在指标、模态和实现差异下是否稳定；以及如何覆盖模糊交互式规格，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Multimodal CAD benchmark construction
      what_it_solves: Provides shared tasks and datasets for comparing CAD program
        generation, mesh/point-cloud reconstruction, text/image-to-CAD generation,
        and CAD question answering across multiple input modalities.
      what_remains_open: Whether stratified samples and task distributions cover realistic
        engineering constraints, interactive specification ambiguity, and manufacturing
        or assembly settings rather than mostly static or idealized inputs.
    - line: Geometric and design-intent metric design
      what_it_solves: Probes CAD outputs beyond aggregate scores by combining executability
        or validity, geometric fidelity, program compactness, topology or parameter
        grounding, and manufacturability, functionality, or assemblability rubrics.
      what_remains_open: Alignment between proxy metrics such as IoU, Chamfer distance,
        invalid ratio, and VLM-judge rubrics and the downstream engineering decisions
        users care about; model rankings can change by metric.
    - line: Unified baselines and reporting conventions
      what_it_solves: Makes CAD results auditable by evaluating specialized and general
        models on common suites and reporting protocol stages such as code check,
        geometry check, and design-intent alignment.
      what_remains_open: Whether benchmark conclusions remain stable across implementations
        and compute budgets; several code, dataset, and limitation details remain
        verification gaps in the bounded packet.
    consensus:
    - Shared tasks increasingly combine multiple input modalities and multiple CAD
      task types rather than isolating a single reconstruction or generation setting.
    - Evaluation is moving beyond aggregate geometric accuracy to include executable
      code validity, invalid-program rates, topological or parameter consistency,
      and design-intent or engineering criteria.
    - Stratified sampling or staged protocols are used to expose failure modes across
      geometric complexity and model classes, especially specialized versus general-purpose
      models.
    disagreements:
    - 'Evaluation target: some studies target single CAD programs or reconstruction
      sequences, while others target editable B-Rep assemblies with manufacturability,
      functionality, and assemblability criteria.'
    - 'Metric choices: deterministic geometric or validity metrics and learned VLM-judge
      rubrics are used differently, and reported evidence shows model rankings shift
      across metrics.'
    - 'Interaction model: most benchmarks assume direct single-turn input-output evaluation,
      while at least one line treats ambiguity as requiring proactive clarification
      before CAD generation.'
    - 'Input realism: studies differ between idealized clean or rendered inputs and
      noisy or multimodal stress tests, with specialized models showing brittleness
      under modality shift.'
    open_questions:
    - How can benchmark metrics be calibrated so rankings predict downstream manufacturability,
      functionality, and assemblability rather than only geometric or program-level
      proxies?
    - What evaluation protocols are needed to capture ambiguous user specifications
      and iterative clarification while keeping comparison overhead low?
    - Are current stratified CAD benchmark conclusions stable across implementations,
      compute budgets, and modality or geometric complexity shifts?
    - How should evaluation combine deterministic geometric checks with learned judges
      without hiding judge reliability or metric conflict?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态CAD基准构建
      解决的问题: 提供共享任务与数据集，在多模态输入下比较CAD程序生成、网格或点云重建、文本或图像到CAD生成以及CAD问答。
      尚未覆盖: 分层采样和任务分布是否覆盖真实工程约束、交互式规格模糊以及制造或装配设置，而不只是静态或理想化输入。
    - 路线: 几何与设计意图指标设计
      解决的问题: 通过可执行性或有效性、几何保真度、程序紧凑性、拓扑或参数接地，以及可制造性、功能性、可装配性评分，检验CAD输出而不仅看总分。
      尚未覆盖: IoU、Chamfer距离、无效率和VLM评判器等代理指标与用户关心的下游工程决策之间是否一致；模型排名可能随指标变化。
    - 路线: 统一基线与报告规范
      解决的问题: 通过在共同套件上评估专用和通用模型，并报告代码检查、几何检查、设计意图对齐等协议阶段，使CAD结果可审计。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定；在限定证据包中，若干代码、数据集和限制细节仍是验证缺口。
    共识:
    - 共享任务越来越多地同时覆盖多种输入模态和多种CAD任务类型，而非只评测单一重建或生成设置。
    - 评测正从总体几何精度扩展到可执行代码有效性、无效程序率、拓扑或参数一致性以及设计意图或工程标准。
    - 通过分层采样或分阶段协议揭示几何复杂度和模型类别上的失败模式，尤其是专用模型与通用模型的差异。
    分歧:
    - 评测对象：有的针对单个CAD程序或重建序列，有的面向可编辑B-Rep装配体及其可制造性、功能性和可装配性标准。
    - 指标选择：确定性几何或有效性指标与学习的VLM评判器规则使用方式不同，且有证据显示模型排名会随指标变化。
    - 交互模式：多数基准假设直接单轮输入输出评测，而至少一条路线要求在生成前主动澄清模糊需求。
    - 输入真实性：研究在理想化干净或渲染输入与噪声或多模态压力测试之间存在差异，专用模型在模态迁移下更脆弱。
    开放问题:
    - 如何校准基准指标，使排名能预测下游可制造性、功能性和可装配性，而不只反映几何或程序层代理指标？
    - 需要哪些评测协议来捕捉模糊用户规格和迭代澄清，同时保持比较开销较低？
    - 当前分层CAD基准结论在不同实现、算力预算和模态或几何复杂度迁移下是否稳定？
    - 如何结合确定性几何检查和学到的评判器，而不掩盖评判器可靠性或指标冲突？
