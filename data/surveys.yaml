  related_work_outline:
  - 'Mainstream direction: Large-scale 2026 CAD benchmarks focus on multimodal text-to-CAD
    and mesh-to-CAD generation, executable parametric CAD, and engineering readiness
    rather than geometry alone.'
  - 'Shared research pattern: Papers combine curated datasets, standardized protocols,
    multiple metrics, and baseline comparisons to expose validity failures and ranking
    instability.'
  - 'Key differences: Evaluation targets split among reconstruction, synthesis, multi-task
    CAD, and design intent; methods include geometric optimization, fine-tuned LLMs,
    and proactive clarification agents.'
  - 'Trend evolution: Evidence is concentrated in the current frontier; benchmark
    design is moving from geometric similarity toward manufacturability, assemblability,
    modality shift, and agentic prompt clarification.'
  - 'Open questions: Metric stability, VLM-judge reliability, coverage of engineering
    constraints, and reproducibility remain unresolved.'
  related_work_outline_zh:
  - 主流方向：2026年CAD基准聚焦于多模态文本到CAD和网格到CAD生成、可执行参数化CAD，以及超越几何本身的工程就绪度。
  - 研究共性：工作普遍组合数据集、标准化协议、多指标和基线对比，以揭示有效性失败和排名不稳定。
  - 关键差异：评测目标分为重建、合成、多任务CAD和设计意图；方法包括几何优化、微调大模型与主动澄清智能体。
  - 趋势演进：证据集中在当前前沿；基准设计正从几何相似性扩展至可制造性、可装配性、模态迁移和智能体式提示澄清。
  - 开放问题：指标稳定性、VLM评判可靠性、工程约束覆盖和可复现性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal CAD benchmark suites
      what_it_solves: Make heterogeneous CAD tasks comparable across input modalities,
        metrics, and model families.
      what_remains_open: Model rankings change across metrics, robustness under modality
        shift is limited, and coverage of real engineering constraints is not yet
        demonstrated.
    - line: Engineering- and design-intent evaluation protocols
      what_it_solves: Extend scoring beyond geometric similarity to manufacturability,
        functionality, and assemblability.
      what_remains_open: VLM judge reliability and human alignment are only partially
        verified; fine-grained engineering criteria still show a failure cascade.
    - line: Parametric CAD reverse engineering and stepwise reconstruction evaluation
      what_it_solves: Recover editable construction sequences from meshes with intermediate
        geometry checks.
      what_remains_open: Complex operation coverage and cross-benchmark consistency
        remain unclear.
    - line: LLM- and agent-based text-to-CAD generation with executable validation
      what_it_solves: Generate valid parametric programs and handle ambiguous prompts
        through proactive clarification.
      what_remains_open: Reported improvements are tied to curated prompts and datasets;
        interaction overhead and reproducibility need more evidence.
    consensus:
    - Executable validity is treated as a necessary evaluation stage before geometric
      or design-intent scoring.
    - Aggregate geometric metrics alone are recognized as insufficient for ranking
      CAD generation systems.
    - Rich input modality coverage and standardized baselines are used to test generalization
      and expose brittleness.
    - Recent work converges on parametric CAD programs as the target representation
      rather than only mesh outputs.
    disagreements:
    - Some evaluations prioritize reconstruction fidelity from meshes or point clouds,
      while others prioritize language-driven synthesis or CAD question answering.
    - Evaluation criteria differ between geometric fidelity and program compactness
      and manufacturability, functionality, and assemblability.
    - Interaction modes differ between passive benchmarking and agentic clarification
      before code generation.
    - Optimization and supervision choices differ, including ranking-aware fine-tuning,
      hybrid geometric optimization, and VLM-judge scoring.
    open_questions:
    - How should CAD benchmark leaderboards handle ranking instability across metrics
      and modality shifts?
    - Can VLM-based judges align with human engineering judgment for fine-grained
      design intent beyond aggregate validation?
    - Do current benchmark task distributions cover the complex, editable B-Rep assemblies
      and failure modes observed in real CAD workflows?
    - Are reported improvements robust when code, dataset splits, and limitation details
      are released, or are implementations and prompt curation driving the gains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD基准套件
      解决的问题: 使异构CAD任务在输入模态、指标和模型家族之间可比。
      尚未覆盖: 模型排名随指标变化，模态迁移下鲁棒性有限，真实工程约束覆盖尚未充分证明。
    - 路线: 工程与设计意图评估协议
      解决的问题: 将评分从几何相似性扩展至可制造性、功能性和可装配性。
      尚未覆盖: VLM评判器与人工判断对精细设计意图的一致性仅部分验证，仍存在失败级联。
    - 路线: 参数化CAD逆向工程与逐步重建评估
      解决的问题: 从网格恢复可编辑构建序列并进行中间几何校验。
      尚未覆盖: 复杂操作覆盖不足，跨基准一致性尚未明确。
    - 路线: 基于LLM或智能体的文本到CAD生成与可执行性验证
      解决的问题: 生成可执行参数化程序，并通过主动澄清处理模糊提示。
      尚未覆盖: 改进依赖精选提示和数据，交互开销与可复现性仍需更多证据。
    共识:
    - 可执行有效性被普遍作为先于几何或设计意图评分的必要评估阶段。
    - 单一聚合几何指标被认为不足以对CAD生成系统进行排序。
    - 覆盖丰富输入模态并使用标准化基线，用于检验泛化能力并暴露脆弱性。
    - 近期工作趋向于把参数化CAD程序作为目标表示，而非仅输出网格。
    分歧:
    - 一些评测侧重网格或点云重建保真度，另一些侧重语言驱动合成或CAD问答。
    - 评估标准不同，包括几何保真度与程序紧凑性，以及可制造性、功能性和可装配性。
    - 交互模式不同，包括被动基准测试和代码生成前的主动澄清智能体。
    - 优化与监督选择不同，包括排序感知微调、混合几何优化和VLM评判打分。
    开放问题:
    - 当指标和模态变化导致排名不稳定时，CAD基准排行榜应如何处理？
    - VLM评判器能否在细粒度设计意图上与人类工程判断保持一致，而不仅是聚合验证？
    - 当前基准任务分布是否覆盖真实CAD工作流中的复杂可编辑B-Rep装配体和失败模式？
    - 在公开代码、数据集划分和局限性细节后，报告的性能提升是否稳健，还是实现和提示筛选驱动了提升？
