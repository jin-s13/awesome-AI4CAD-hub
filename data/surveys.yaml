  related_work_outline:
  - 'Mainstream direction: LLM-driven parametric CAD program generation from multimodal
    inputs is the dominant approach, with growing emphasis on benchmarks that evaluate
    not only geometric fidelity but also manufacturability and design intent.'
  - 'Shared research pattern: Most methods decompose CAD generation into a sequence
    prediction or optimization problem over parametric operations (e.g., extrusions,
    sketches), and validate outputs through program executability and volumetric similarity
    metrics.'
  - 'Key differences: Works split between text-to-CAD generation, mesh-to-CAD reconstruction,
    unified multi-task frameworks, and interactive clarification agents; they differ
    in representation (CadQuery scripts vs. construction trees), supervision (SFT,
    RL, hybrid optimization), and evaluation targets (geometric accuracy vs. engineering
    constraints).'
  - 'Trend evolution: The topic is at the current frontier (2026 papers), with a rapid
    shift from single-modality, metric-focused generation toward multi-modal, interaction-aware,
    and engineering-validated CAD systems.'
  - 'Open questions: How to reliably align generated geometry with high-level design
    intent, ensure manufacturability and assemblability without human intervention,
    and adapt models to ambiguous or underspecified user inputs.'
  related_work_outline_zh:
  - 主流方向：以LLM为驱动的多模态输入参数化CAD程序生成是主导方法，基准测试正从几何保真度扩展到可制造性和设计意图评估。
  - 研究共性：大多数方法将CAD生成分解为参数化操作（如拉伸、草图）上的序列预测或优化问题，并通过程序可执行性和体积相似度指标进行验证。
  - 关键差异：工作分为文本到CAD生成、网格到CAD重建、统一多任务框架和交互式澄清智能体；它们在表示方式（CadQuery脚本 vs 构建树）、监督信号（SFT、RL、混合优化）和评测目标（几何精度
    vs 工程约束）上存在分歧。
  - 趋势演进：该主题处于当前前沿（2026年论文），趋势是从单一模态、指标导向的生成迅速转向多模态、交互感知和工程验证的CAD系统。
  - 开放问题：如何可靠地将生成几何与高层设计意图对齐，如何在没有人工干预下确保可制造性和可装配性，以及如何使模型适应模糊或不完整的用户输入。
  literature_review:
    line_of_work_matrix:
    - line: LLM-driven parametric CAD generation from text or multimodal inputs
      what_it_solves: Translates natural language or multimodal prompts into executable
        parametric CAD programs (e.g., CadQuery scripts, construction trees) to automate
        design synthesis.
      what_remains_open: Generated programs often fail to satisfy engineering constraints
        like manufacturability or assemblability, and robustness to ambiguous prompts
        remains limited.
    - line: Optimization-based mesh-to-CAD reconstruction
      what_it_solves: Recovers editable parametric CAD sequences from discrete 3D
        data (meshes, point clouds) by incrementally fitting operations and validating
        via geometric feedback.
      what_remains_open: Scalability to complex topologies and the balance between
        reconstruction accuracy and program validity are unresolved; generalization
        across object categories is underexplored.
    - line: Unified multi-modal multi-task benchmarks and evaluation protocols
      what_it_solves: Provides standardized evaluation across datasets, modalities,
        and tasks to surface failure modes and compare model capabilities beyond geometric
        similarity.
      what_remains_open: Current metrics insufficiently capture engineering readiness
        (e.g., functional play, assemblability); automated judges only partially align
        with human expert evaluation.
    - line: Interactive and proactive clarification agents for CAD
      what_it_solves: Improves robustness by allowing models to query users for specification
        clarification before generating CAD programs, reducing ambiguity-driven errors.
      what_remains_open: The trade-off between interaction cost and generation quality,
        and the generalization of clarification strategies to diverse design contexts,
        are not well understood.
    consensus:
    - Parametric CAD representations (B-Rep or construction sequences) are essential
      for editability and downstream engineering use.
    - Program executability and volumetric similarity (e.g., IoU, Chamfer distance)
      serve as primary evaluation metrics, though they are recognized as insufficient
      for practical design.
    - Pure end-to-end generation struggles with complex geometries and engineering
      constraints; hybrid approaches (optimization + learning, or agentic workflows)
      are seen as promising.
    - Multi-modal inputs (text, images, mesh, point clouds) are increasingly supported,
      reflecting real-world design workflows.
    disagreements:
    - 'Representation: Some methods use CadQuery or domain-specific scripting languages,
      while others adopt hierarchical construction trees or unstructured text-based
      CAD primitives.'
    - 'Supervision: Training strategies differ—supervised fine-tuning on curated datasets,
      reinforcement learning for geometric alignment, and hybrid optimization with
      geometric feedback.'
    - 'Evaluation target: Some benchmarks emphasize geometric fidelity and program
      validity, while others target engineering-grade criteria like manufacturability,
      functionality, and assemblability.'
    - 'Interaction mode: Most systems generate in one pass, but ProCAD introduces
      a proactive clarification loop, shifting the assumption from fully specified
      to underspecified inputs.'
    open_questions:
    - Can generated CAD models be automatically validated against engineering constraints
      (e.g., stress, manufacturing cost) without expert human review?
    - How can models generalize from limited parametric CAD data to novel object categories
      or highly complex assemblies?
    - What is the optimal balance between automated generation and human-in-the-loop
      clarification for design tasks?
    - To what extent do current metrics predict real-world usability and downstream
      task success (e.g., simulation, fabrication)?
  literature_review_zh:
    研究路线矩阵:
    - 路线: LLM驱动的多模态参数化CAD生成
      解决的问题: 将自然语言或多模态提示转化为可执行的参数化CAD程序（如CadQuery脚本、构建树），实现设计自动化。
      尚未覆盖: 生成程序常无法满足可制造性或可装配性等工程约束，对模糊提示的鲁棒性有限。
    - 路线: 基于优化的网格到CAD重建
      解决的问题: 通过增量拟合参数化操作和几何反馈验证，从离散3D数据（网格、点云）中恢复可编辑的CAD序列。
      尚未覆盖: 复杂拓扑的可扩展性、重建精度与程序有效性的平衡尚未解决；跨类别泛化研究不足。
    - 路线: 统一多模态多任务基准与评估协议
      解决的问题: 提供跨数据集、模态和任务的标准化评估，揭示失败模式，超越几何相似度比较模型能力。
      尚未覆盖: 现有指标难以捕捉工程就绪度（如功能间隙、可装配性）；自动评判器与人类专家评估仅部分一致。
    - 路线: 交互式与主动澄清CAD智能体
      解决的问题: 通过允许模型在生成前向用户澄清规格，提升对模糊输入的鲁棒性，减少错误。
      尚未覆盖: 交互成本与生成质量之间的权衡，以及澄清策略在不同设计场景下的泛化性尚不明确。
    共识:
    - 参数化CAD表示（B-Rep或构建序列）对于可编辑性和下游工程使用至关重要。
    - 程序可执行性和体积相似度（如IoU、Chamfer距离）是主要评估指标，但被公认不足以反映实际设计质量。
    - 纯端到端生成难以处理复杂几何和工程约束；混合方法（优化+学习或智能体工作流）被视为有前景的方向。
    - 多模态输入（文本、图像、网格、点云）逐渐被支持，以契合真实设计工作流。
    分歧:
    - 表示方式：一些方法使用CadQuery或领域特定脚本语言，另一些采用层次化构建树或非结构化文本基元表示。
    - 监督信号：训练策略不同——在精选数据集上监督微调、用于几何对齐的强化学习，以及结合几何反馈的混合优化。
    - 评测目标：部分基准强调几何保真度和程序有效性，其他则目标可制造性、功能性和可装配性等工程级标准。
    - 交互模式：多数系统一次生成，而ProCAD引入主动澄清循环，将假设从完全指定输入转为欠指定输入。
    开放问题:
    - 生成CAD模型能否自动验证工程约束（如应力、制造成本）而无需专家审查？
    - 模型如何从有限的参数化CAD数据泛化到新物体类别或高度复杂的装配体？
    - 设计任务中自动化生成与人在回路澄清之间的最佳平衡是什么？
    - 当前指标在多大程度上预测真实世界可用性和下游任务（如仿真、制造）的成功？
