  related_work_outline:
  - 'Mainstream direction: The field is converging on using large language models
    and vision-language models to generate parametric CAD programs (mainly B-Rep and
    construction sequences) from text, images, meshes, and point clouds, with a parallel
    push toward unified benchmarks that assess geometric fidelity, executability,
    and engineering properties.'
  - 'Shared research pattern: Most works adopt a pipeline that encodes an input (text,
    2D, or 3D) into a latent representation, then decodes a structured CAD program
    or construction sequence; evaluation is dominated by geometric metrics (IoU, Chamfer)
    and validity ratios, with a growing use of LLM-based or rubric-based judges for
    design intent.'
  - 'Key differences: Systems differ in the input modality they support (text-only
    vs. image vs. mesh vs. multi-modal), the generation strategy (one-shot vs. stepwise
    optimization vs. hybrid fitting), the targeted CAD representation (CadQuery scripts,
    generic construction trees, feature-based operations), and the depth of downstream
    engineering evaluation (purely geometric vs. manufacturability and assemblability).'
  - 'Trend evolution: The evidence packet is concentrated in 2026, indicating a current
    frontier shift from single-task, idealized-input CAD generation toward multi-modal,
    multi-task systems, interactive clarifying agents, and benchmarks that explicitly
    measure manufacturability and functional intent beyond geometric accuracy.'
  - 'Open questions: How to close the gap between geometry-valid outputs and engineering-ready
    designs; how to scale interactive clarification without excessive user burden;
    whether current benchmarks capture the diversity of real-world CAD workflows;
    and how to robustly handle complex, multi-part assemblies with physical constraints.'
