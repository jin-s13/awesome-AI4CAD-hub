  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven evaluation of programmatic CAD generation (CADBench,
        MUSE, BenchCAD)
      what_it_solves: Provides stratified multimodal samples and staged metrics to
        compare generators on geometry, executability, code QA/editing, and engineering
        intent.
      what_remains_open: Unseen part family generalization is limited; metric rankings
        shift; VLM-judged design intent has limited human or physical validation;
        several artifacts are not clearly reproducible.
    - line: Text-to-CAD program synthesis with grounding and alignment (FutureCAD,
        HierCAD, ProCAD)
      what_it_solves: Converts natural language specifications into executable CadQuery
        or parametric construction trees, using primitive grounding, structure alignment,
        or clarification to reduce invalid outputs and ambiguous specification errors.
      what_remains_open: Fine-grained parameters and complex operations are still
        misinferred or simplified; clarification interaction overhead and broader
        coverage of design specifications are not fully evidenced.
    - line: Geometry-native generative representations for CAD (DreamCAD, Mamba-CAD)
      what_it_solves: Learns latent or parametric surface representations, enabling
        generation from point-level or self-supervised signals and longer CAD sequences
        without dense CAD-specific paired annotations.
      what_remains_open: Brittleness under modality shift and geometric complexity
        is observed; engineering constraints and real-world editability remain mostly
        unevaluated; code or dataset availability is limited.
    - line: Formal design constraints and evaluation rubrics for CAD generation
      what_it_solves: Defines code check, geometric check, and design-intent rubrics
        for manufacturability, functionality, and assemblability, making engineering-oriented
        requirements measurable beyond geometric similarity.
      what_remains_open: Whether rubrics correspond to formal engineering validity
        or manufacturing outcomes is not established; benchmark coverage and judge
        reliability need further validation across unseen industrial diversity.
    consensus:
    - Executable CAD programs or editable B-Reps are preferred targets over raw meshes
      because they support downstream engineering manipulation and constraint checking.
    - Staged evaluation is necessary because models often produce executable code
      but fail valid geometry or design intent, a recurring failure cascade.
    - Specialized geometric grounding, hierarchical decomposition, or clarification
      improves robustness over direct end-to-end generation in the reported evidence.
    - No single metric or dataset family is sufficient; rankings are sensitive to
      modality, part complexity, and evaluation rubric.
    disagreements:
    - 'Representation choices differ: script-based CadQuery, hierarchical construction
      trees, parametric Bézier surfaces, and state-space latent sequences trade editability,
      training signal, and sequence capacity differently.'
    - 'Supervision strategies differ: curated text-to-CAD pairs, point-level unannotated
      3D data, self-supervised reconstruction, and reinforcement learning are used,
      implying different assumptions about available annotations.'
    - 'Interaction mode differs: some systems generate directly, some ground structure
      and parameters internally, and some ask clarification questions before generation.'
    - 'Evaluation targets differ: geometric fidelity and executability are measured
      in some benchmarks, while others emphasize code QA, code editing, manufacturability,
      functionality, or assemblability.'
    - 'Deployment settings differ: idealized mesh or image inputs versus industrial
      part families and complex assemblies, which changes generalization expectations.'
    open_questions:
    - How reliably do VLM-judged engineering rubrics predict real manufacturability,
      functionality, and assemblability?
    - Under what input shifts and unseen part families can specialized CAD generators
      maintain their advantage over general LLMs?
    - Which representation and supervision combination best balances editability,
      geometric fidelity, and training from unannotated or weakly supervised data?
    - Can parameter grounding and proactive clarification reduce fine-grained parameter
      substitution errors beyond the evaluated datasets?
    - 'What is missing from the current evidence base: several top papers do not surface
      code, dataset, baseline, metrics, or limitations, so reproducibility and failure
      boundaries remain verification gaps.'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向程序化CAD生成的基准评测（CADBench、MUSE、BenchCAD）
      解决的问题: 通过分层多模态样本和分阶段指标，比较生成器在几何、可执行性、代码问答/编辑与工程意图上的表现。
      尚未覆盖: 对未见零件族的泛化有限；模型排名随指标变化；VLM设计意图判断缺乏充分人工或物理验证；部分工件复现性不明确。
    - 路线: 带有接地与对齐的文本到CAD程序合成（FutureCAD、HierCAD、ProCAD）
      解决的问题: 将自然语言规范转换为可执行的CadQuery或参数化构建树，通过基元接地、结构对齐或主动澄清减少无效输出和模糊规格错误。
      尚未覆盖: 细粒度参数和复杂操作仍被误推或简化；澄清交互开销和更广设计规范覆盖缺少充分证据。
    - 路线: 面向CAD的几何原生生成表示（DreamCAD、Mamba-CAD）
      解决的问题: 学习潜在或参数曲面表示，从点级或自监督信号生成长序列CAD，减少对大量CAD特定配对标注的依赖。
      尚未覆盖: 观察到模态偏移与几何复杂度下的脆弱性；工程约束和真实可编辑性大多未评估；代码或数据集可得性有限。
    - 路线: 用于CAD生成的形式化设计约束与评分标准
      解决的问题: 定义代码检查、几何检查和设计意图评分标准，评估可制造性、功能性与可装配性，使工程导向要求可度量。
      尚未覆盖: 评分标准是否对应正式工程有效性或制造结果尚不明确；跨工业多样性的覆盖和评判器可靠性需要验证。
    共识:
    - 可执行CAD程序或可编辑B-Rep被视为优于原始网格的目标，因为它们支持下游工程操作与约束检查。
    - 需要分阶段评估，因为模型常能生成可执行代码，却在有效几何或设计意图上失败，这是反复出现的失败级联。
    - 与直接端到端生成相比，专门的几何接地、层次分解或主动澄清能提升报告的鲁棒性。
    - 单一指标或数据族不够；排名对模态、零件复杂度和评分标准敏感。
    分歧:
    - 表示选择不同：基于脚本的CadQuery、层次构建树、参数化Bézier曲面和状态空间潜在序列在可编辑性、训练信号和序列容量上各有取舍。
    - 监督策略不同：精选文本-CAD配对、点级未标注3D数据、自监督重建和强化学习被使用，说明对标注资源的假设不同。
    - 交互模式不同：部分系统直接生成，部分在内部对结构和参数接地，部分在生成前主动澄清。
    - 评测目标不同：有的强调几何保真与可执行性，有的强调代码问答、代码编辑、可制造性、功能性或可装配性。
    - 部署场景不同：理想化网格或图像输入与工业零件族和复杂装配体并存，改变泛化预期。
    开放问题:
    - VLM判断的工程评分标准在多大程度上能预测真实可制造性、功能性与可装配性？
    - 在何种输入偏移和未见零件族下，专用CAD生成器能保持对通用LLM的优势？
    - 哪种表示与监督组合能在可编辑性、几何保真和利用未标注或弱监督数据间取得最佳平衡？
    - 参数接地和主动澄清能否在现有评测数据集之外减少细粒度参数替换错误？
