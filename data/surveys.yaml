  related_work_outline:
  - 'Mainstream direction: Current evidence centers on unified CAD benchmarks and
    generation models that evaluate CAD program generation or reconstruction from
    multiple modalities—meshes, images, text, sketches, and point clouds—and increasingly
    assess downstream design properties such as manufacturability, functionality,
    and assemblability.'
  - 'Shared research pattern: Work converges on structured outputs: generate executable
    or editable parametric CAD programs, then check code validity, geometric similarity,
    and design-intent or engineering criteria. Benchmark building reuses dataset families
    such as DeepCAD, Fusion 360, ABC, MCB, and Objaverse with Chamfer, IoU, and validity-style
    metrics.'
  - 'Key differences: Targets differ among mesh-to-CAD geometric recovery, text-to-CAD
    engineering specifications, unified multi-task CAD, and proactive text clarification.
    Methods differ across hybrid optimization, LLM grounding, supervised fine-tuning
    plus RL, structure alignment and ranking, and agentic interaction. Metrics also
    range from geometric fidelity/validity to executability/compactness and rubric-based
    VLM judgment.'
  - 'Trend evolution: Available top evidence is concentrated in 2026, so long-term
    change cannot be inferred. Within this frontier, the direction moves from single-task/single-modal
    CAD evaluation toward unified multimodal benchmarks and engineering-level evaluation;
    rankings are explicitly reported to change across metrics.'
  - 'Open questions: Metric stability, real-world task coverage, VLM-judge alignment
    with engineering decisions, robustness to modality shift and geometric complexity,
    and auditability remain unresolved. Several top papers lack limitation details
    or full artifact signals, creating verification gaps for reproducibility.'
  related_work_outline_zh:
  - 主流方向：当前证据集中在统一的CAD基准与生成模型，评估从网格、图像、文本、草图、点云到CAD程序生成或重建，并越来越多地加入可制造性、功能性和可装配性等下游设计属性。
  - 研究共性：工作汇聚到结构化输出：先生成可执行或可编辑的参数化CAD程序，再检查代码有效性、几何相似度以及设计意图或工程标准。基准构建复用DeepCAD、Fusion
    360、ABC、MCB、Objaverse等数据集族，并采用Chamfer、IoU和有效性类指标。
  - 关键差异：目标不同，包括网格到CAD几何恢复、文本到CAD工程规格、统一多任务CAD和主动文本澄清。方法不同，包括混合优化、LLM接地、监督微调加强化学习、结构对齐与排序、智能体交互。指标也从几何保真/有效性延伸到可执行性/紧凑性和基于评分标准的VLM判断。
  - 趋势演进：顶级证据集中在2026年，难以推断长期变化。在当前前沿内，方向从单任务/单模态CAD评估转向统一多模态基准和工程级评估；证据显示模型排名会随指标变化。
  - 开放问题：指标稳定性、真实任务覆盖、VLM判断与工程决策的一致性、对模态偏移和几何复杂度的鲁棒性以及可审计性仍未解决。若干顶级论文缺少局限性说明或完整工件信号，构成可复现性验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal CAD benchmark construction
      what_it_solves: Creates shared evaluation suites spanning meshes, images, text,
        sketches, and point clouds for CAD program generation, reconstruction, and
        question answering.
      what_remains_open: Coverage of real-world design and engineering conditions
        beyond current samples, and limits of stratification or diversity sampling,
        remain unclear.
    - line: Engineering and design-intent metric design
      what_it_solves: Moves evaluation beyond geometric similarity and code validity
        to functionality, manufacturability, and assemblability through staged code,
        geometry, and design-intent checks.
      what_remains_open: Whether rubric-based VLM-judge scores align with expert engineering
        decisions and remain stable across design instances is not fully established.
    - line: Parametric CAD generation and reverse engineering methods
      what_it_solves: Produces editable or executable CAD programs from text, mesh,
        image, or multimodal inputs, using stepwise construction, hybrid optimization,
        or LLM-based grounding.
      what_remains_open: Robustness under geometric complexity, modality shift, and
        invalid program reduction is reported but not fully bounded; limitation evidence
        is largely absent.
    - line: Interactive specification clarification for text-to-CAD
      what_it_solves: Reduces ambiguous-prompt errors by proactively asking targeted
        clarification questions before CAD code synthesis.
      what_remains_open: Interaction overhead and generalization beyond a curated
        text-to-CadQuery setting lack sufficient evidence.
    - line: Comparable baselines and auditability
      what_it_solves: Supports cross-model comparison through shared datasets, benchmark
        protocols, and repeated metrics such as Chamfer, IoU, executability, and invalid
        ratio.
      what_remains_open: Artifact and code availability, implementation stability,
        and compute-budget sensitivity are insufficiently documented across several
        top papers.
    consensus:
    - CAD generation evaluation is shifting from isolated tasks or datasets toward
      unified multimodal and multi-task benchmarks covering program generation, reconstruction,
      and question answering.
    - Common basic evaluation concerns include executable output, geometric similarity,
      and invalid program reduction, with Chamfer, IoU, and validity metrics appearing
      repeatedly.
    - Evaluation protocols increasingly use staged checks from code validity, to geometry,
      to design intent or engineering criteria rather than a single aggregate score.
    - Shared dataset families such as DeepCAD, Fusion 360, ABC, MCB, and Objaverse
      are reused as benchmark components.
    disagreements:
    - 'Evaluation targets differ: some emphasize mesh-to-CAD geometric fidelity, while
      others emphasize text-to-CAD manufacturability and assemblability or multi-task
      generality.'
    - 'Method optimization differs: hybrid geometric optimization, supervised fine-tuning
      plus reinforcement learning, structured alignment with ranking supervision,
      and agentic clarification coexist.'
    - 'Interaction mode differs: several systems generate end-to-end without clarification,
      while one line proactively asks questions before synthesis.'
    - 'Metric choices differ: volumetric IoU, Chamfer distance, and validity ratios
      are not directly comparable to program executability/compactness or rubric-based
      VLM judgments.'
    open_questions:
    - Are model rankings stable across geometric fidelity, executability, compactness,
      and engineering-design criteria within unified benchmarks?
    - Do proxy metrics such as Chamfer, IoU, and VLM-judge rubrics align with downstream
      manufacturability and functionality decisions that users care about?
    - How robust are CAD-specialized and multimodal models to rendering noise, modality
      shift, and increasing geometric complexity?
    - Can benchmark conclusions be audited when several top papers lack limitation
      details and full artifact signals?
    - Can proactive clarification scale to more CAD environments without adding excessive
      interaction overhead?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD基准构建
      解决的问题: 创建覆盖网格、图像、文本、草图、点云的共享评估套件，用于比较CAD程序生成、重建和问答。
      尚未覆盖: 当前样本是否覆盖真实设计和工程条件，以及分层或多样性采样边界仍不明确。
    - 路线: 工程与设计意图指标设计
      解决的问题: 在几何相似度和代码有效性之外，通过分阶段的代码、几何和设计意图检查评估功能性、可制造性和可装配性。
      尚未覆盖: 基于评分标准的VLM判断是否与专家工程决策一致，以及跨设计实例的稳定性尚未完全建立。
    - 路线: 参数化CAD生成与逆向工程方法
      解决的问题: 从文本、网格、图像或多模态输入生成可编辑或可执行CAD程序，使用逐步构建、混合优化或LLM接地。
      尚未覆盖: 在几何复杂度和模态偏移下的鲁棒性虽有报告但边界不清；局限性证据大多缺失。
    - 路线: 文本到CAD的交互式规格澄清
      解决的问题: 在CAD代码合成前通过主动、有针对性的澄清问题减少模糊提示错误。
      尚未覆盖: 交互开销以及向精选文本到CadQuery设置之外的泛化性缺乏充分证据。
    - 路线: 可比基线与可审计性
      解决的问题: 通过共享数据集、基准协议以及Chamfer、IoU、可执行性和无效比例等重复指标支持跨模型比较。
