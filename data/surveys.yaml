  literature_review:
    line_of_work_matrix:
    - line: Multimodal procedural CAD generation
      what_it_solves: Generates editable B-Rep models from text, image, or point cloud
        inputs by emitting executable CAD programs, enabling direct editing and high
        geometric fidelity without CAD-specific annotations.
      what_remains_open: Models often fail on complex features like sweeps and lofts,
        exhibit brittleness under modality shift, and show limited generalization
        to distribution-shifted part families.
    - line: Manufacturability-aware CAD benchmarks
      what_it_solves: Provides standardized evaluation protocols that go beyond geometric
        similarity to assess executability, functionality, manufacturability, and
        assemblability, revealing failure cascades and ranking shifts across metrics.
      what_remains_open: Automated VLM-based judges need further validation against
        human expert assessments; benchmarks currently focus on single parts, leaving
        multi-part assembly evaluation unaddressed.
    - line: Interactive clarification and design intent alignment
      what_it_solves: Improves robustness to ambiguous prompts by proactively asking
        clarification questions or aligning hierarchical structure, reducing invalidity
        rates and parameter errors.
      what_remains_open: The impact of interaction overhead on user efficiency and
        the scalability to multi-turn, multi-component designs remain unexplored.
    consensus:
    - B-Rep is the preferred editable representation for CAD generation.
    - Program synthesis (CadQuery scripts or parametric sequences) enables precise
      and editable model creation.
    - Multimodal input (text, image, point cloud) is essential for flexible CAD authoring.
    - 'Evaluation must include multiple dimensions: geometric fidelity, executability,
      and engineering constraints such as manufacturability.'
    disagreements:
    - 'Program representation differs: some use CadQuery scripts, others use custom
      parametric sequences (e.g., DeepCAD-style).'
    - 'Training strategies vary: supervised fine-tuning is common, but reinforcement
      learning is used in some cases to improve generalization.'
    - 'Approaches to complex geometry differ: some methods handle only sketch-and-extrude,
      while others attempt sweeps and lofts with mixed success.'
    - Evaluation frameworks choose between design-specific rubrics with VLM judges
      and broader metrics, introducing variation in what constitutes a good model.
    open_questions:
    - How can generative models reliably produce high-level operations like sweeps
      and lofts while maintaining executability?
    - What methods can guarantee that generated models meet real-world manufacturing
      constraints (e.g., tolerances, material properties)?
    - How can we align automated evaluation metrics with expert engineering judgment,
      especially for design intent?
    - Can the clarifying or alignment strategies scale to multi-part assemblies and
      interactive design workflows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态程序化CAD生成
      解决的问题: 从文本、图像或点云输入生成可编辑的B-Rep模型，通过输出可执行CAD程序实现直接编辑和高几何保真度，无需CAD特有标注。
      尚未覆盖: 模型在处理扫掠、放样等复杂特征时常常失败，在模态切换下表现脆弱，且对分布外零件族的泛化能力有限。
    - 路线: 面向可制造性的CAD基准
      解决的问题: 提供超越几何相似度的标准化评估协议，评估可执行性、功能性、可制造性和可装配性，揭示失败级联和指标间排名变化。
      尚未覆盖: 基于VLM的自动评判器需要进一步与人类专家评估对齐；当前基准主要关注单个零件，多零件装配体评估尚未涉及。
    - 路线: 交互式澄清与设计意图对齐
      解决的问题: 通过主动提出澄清问题或对齐层次结构，提高对模糊提示的鲁棒性，降低无效率和参数错误。
      尚未覆盖: 交互开销对用户效率的影响，以及向多轮、多组件设计扩展的可行性尚未探索。
    共识:
    - B-Rep是CAD生成中首选的、可编辑的几何表示形式。
    - 程序合成（CadQuery脚本或参数化序列）能够实现精确且可编辑的模型创建。
    - 多模态输入（文本、图像、点云）对于灵活的CAD创作至关重要。
    - 评估必须包含多个维度：几何保真度、可执行性以及如可制造性等工程约束。
    分歧:
    - 程序表示不同：部分工作使用CadQuery脚本，另一些使用定制参数化序列（如DeepCAD风格）。
    - 训练策略存在差异：监督微调广泛使用，但部分方法采用强化学习以提升泛化性。
    - 处理复杂几何的能力不同：一些方法仅处理草图-拉伸，而另一些尝试扫掠和放样但成功率参差不齐。
    - 评估框架选择设计特定评分标准配合VLM评委，或采用更宽泛的指标，导致对“好模型”的定义存在差异。
    开放问题:
