  related_work_outline:
  - 'Mainstream direction: unified multi-modal CAD benchmarks and task suites for
    text/image/point/mesh-to-CAD generation or reverse engineering, with multi-metric
    evaluation spanning geometric fidelity, executable program validity, compactness,
    and engineering design intent.'
  - 'Shared research pattern: modeling CAD outputs as parametric programs or construction
    sequences, stratifying evaluation by geometric complexity and object diversity,
    and combining code, geometry, and design-intent checks rather than relying on
    a single aggregate score.'
  - 'Key differences: coverage varies from broad multi-task/multi-modal benchmarks
    to focused mesh-to-CAD or text-to-CAD settings; evaluation emphasizes either reconstruction
    quality or manufacturability/functionality/assemblability; methods range from
    end-to-end generation to stepwise optimization and proactive clarification.'
  - 'Trend evolution: the available frontier largely clusters around 2026, shifting
    toward unified evaluation suites, multi-stage design checks, VLM judges, and ambiguity
    stress tests; earlier-year evidence in this packet is sparse, so longer-term trend
    claims remain a verification gap.'
  - 'Open questions: whether proxy metrics and rubric judges align with real downstream
    design/manufacturing decisions, whether model rankings remain stable across metrics
    and modalities, and how well current stratification covers realistic engineering
    CAD complexity.'
  related_work_outline_zh:
  - 主流方向：构建统一多模态CAD基准，覆盖文本、图像、点云、网格到参数化CAD程序生成或逆向重建，并以几何保真度、可执行性、程序紧凑性和工程意图等多维指标评估。
  - 研究共性：将CAD输出表示为参数化程序或构建序列，按几何复杂度和多样性分层评估，并联合代码、几何和设计意图检查，而非依赖单一总分。
  - 关键差异：覆盖范围从广泛多任务/多模态基准到聚焦网格到CAD或文本到CAD的设置；评估目标从重建精度到可制造性、功能性和可装配性；方法包括端到端生成、逐步优化和主动澄清。
  - 趋势演进：可用前沿主要集中于2026年，走向统一评估套件、多阶段设计检查、VLM评判器和模糊提示压力测试；本证据包中较早年份证据稀缺，长期趋势仍需验证。
  - 开放问题：代理指标和评判器是否与真实下游设计与制造决策对齐；模型排名在指标和模态间是否稳定；当前分层是否覆盖真实工程CAD复杂性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared CAD evaluation tasks across image, point cloud,
        mesh, and text inputs for program generation and reverse engineering, with
        stratified samples and unified task suites.
      what_remains_open: Whether the task distributions and stratified sampling cover
        real engineering workflows, assembly complexity, and deployment modes beyond
        the included benchmark families.
    - line: Metric and stress-test design
      what_it_solves: Probes geometric fidelity, executable program validity, compactness,
        and design-intent criteria such as manufacturability, functionality, and assemblability;
        tests robustness under modality shifts and ambiguous prompts.
      what_remains_open: Alignment between proxy metrics or VLM-judged rubrics and
        downstream design decisions, plus stability of model rankings across metrics
        and difficulty strata.
    - line: Comparable baselines and reporting
      what_it_solves: Enables model comparison through shared evaluation suites, common
        program validity ratios, and large-scale generation protocols.
      what_remains_open: Whether conclusions remain stable across implementations
        and compute budgets; several papers have missing code, dataset, artifact,
        or limitation details, so reproducibility is a verification gap.
    consensus:
    - CAD generation and reconstruction are evaluated as executable parametric programs
      or construction sequences, not only as mesh or point surfaces.
    - A single geometric score is insufficient; evaluation should combine code validity,
      geometry quality, program compactness, and engineering design intent.
    - Specialized and general multimodal models exhibit complementary failure modes,
      especially under clean versus shifted input modalities.
    - Stratification by geometric complexity and diversity sampling is valuable for
      exposing performance degradation.
    disagreements:
    - 'Evaluation target differs: some work emphasizes reverse-engineering reconstruction
      accuracy, while others evaluate text-to-CAD design intent, manufacturability,
      functionality, and assemblability.'
    - 'Input and task coverage differ: unified multi-task/multi-modal suites contrast
      with task-specific reverse-engineering benchmarks or text-to-CAD engineering
      suites.'
    - 'Methodology differs: direct end-to-end multimodal generation, stepwise feature-by-feature
      construction, hybrid optimization with geometric feedback, and proactive clarification
      agents impose different supervision and interaction assumptions.'
    - 'Metric emphasis differs: volumetric intersection-over-union and Chamfer distance
      remain prominent in reconstruction work, while validity ratios and rubric-based
      judges are prominent in engineering-oriented evaluation.'
    open_questions:
    - Which evaluation targets and thresholds best predict whether a generated CAD
      model is usable in real manufacturing and assembly settings?
    - How stable are model rankings when metrics, input modalities, geometric complexity,
      and prompting ambiguity change?
    - How can benchmark sampling and stratification move beyond idealized CAD dataset
      families to cover real engineering complexity and failure modes?
    - Are VLM-based rubric judges calibrated and auditable enough to replace or scale
      human evaluation of design intent?
    - Which missing artifacts and unreported limitations, including code, datasets,
      and metric details, are needed to verify the observed benchmark conclusions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建覆盖图像、点云、网格和文本输入的共享CAD评估任务，用于程序生成和逆向重建，并通过分层采样统一任务套件。
      尚未覆盖: 任务分布和分层采样是否覆盖真实工程工作流、装配复杂性和部署模式，仍有待验证。
    - 路线: 指标与压力测试设计
      解决的问题: 检验几何保真度、程序可执行有效性、紧凑性，以及可制造性、功能性和可装配性等设计意图；测试模态变化和模糊提示下的鲁棒性。
      尚未覆盖: 代理指标或VLM评判与下游设计决策之间是否一致，以及模型排名在不同指标和难度层之间是否稳定。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共享评估套件、统一程序有效性比率和大规模生成协议，使模型结果可比较和可审计。
      尚未覆盖: 结论在不同实现和算力预算下是否稳定；部分论文缺少代码、数据集、工件或局限性细节，可复现性仍是验证缺口。
    共识:
    - CAD生成和重建被评估为可执行参数化程序或构建序列，而不仅是网格或点云表面。
    - 单一几何分数不足，应联合代码有效性、几何质量、程序紧凑性和工程设计意图进行评估。
    - 专用模型与通用多模态模型在干净输入和模态转移下呈现互补的失败模式。
    - 按几何复杂度和多样性采样分层，有助于暴露性能下降。
    分歧:
    - 评估目标不同：有些侧重逆向重建精度，有些评估文本到CAD的设计意图、可制造性、功能性和可装配性。
    - 输入和任务覆盖不同：统一多任务/多模态套件与任务特定的逆向工程基准或工程导向的文本到CAD套件存在差异。
    - 方法不同：端到端多模态生成、逐步逐特征构建、采用几何反馈的混合优化，以及主动澄清智能体，在监督信号和交互假设上不同。
    - 指标侧重不同：重建工作常用体积交并比和倒角距离，而工程导向评估更强调有效性比率和基于评分标准的评判器。
    开放问题:
