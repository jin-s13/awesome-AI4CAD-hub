  - 'Mainstream direction: The evidence is dominated by empirical CAD program and
    B-Rep generation with multimodal text/image/point-conditioned synthesis evaluated
    on unified benchmarks, while formal theory is largely absent from the top papers.'
  - 'Shared research pattern: Most work decomposes CAD as executable scripts or parametric/B-Rep
    structures and evaluates a code-to-geometry-to-design cascade, revealing failures
    in geometric fidelity and engineering intent.'
  - 'Key differences: Work differs in representation, supervision, interaction, and
    evaluation target; clean-mesh reconstruction, text-to-program grounding, point-level
    B-Rep learning, design-intent rubrics, and proactive clarification form distinct
    sub-directions.'
  - 'Trend evolution: The available years are sparse before 2026, so the observable
    trend is within the current frontier: from narrow sequence generation toward industrial-scale,
    multimodal, LLM-driven program synthesis and engineering-oriented evaluation.'
  - 'Open questions: Generalization beyond seen part families, reliability of design-intent
    judges, robustness under modality shift, and whether formal modeling assumptions
    can predict empirical CAD failures remain open.'
  related_work_outline_zh:
  - 主流方向：证据以经验性CAD程序和B-Rep生成为主，聚焦文本/图像/点云条件生成与统一基准评测；形式化理论在主要论文中基本缺失。
  - 研究共性：多数工作将CAD建模为可执行脚本或参数化/B-Rep结构，并沿“代码—几何—设计意图”逐级评测，暴露几何保真度和工程可用性不足。
  - 关键差异：表示、监督、交互和评测目标均不同，形成干净网格重建、文本到程序接地、点级B-Rep学习、设计意图评分和主动澄清等子方向。
  - 趋势演进：2026年之前证据稀疏，可观察趋势集中在当前前沿：从窄领域序列生成走向工业级、多模态、LLM驱动的程序合成和工程化评测。
  - 开放问题：未见零件族泛化、设计意图自动评判可靠性、模态切换鲁棒性，以及形式化建模假设能否预测经验性CAD失败，仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven evaluation of multimodal and programmatic CAD generation
      what_it_solves: Standardizes comparison across input modalities, output metrics,
        and geometric complexity for AI-assisted CAD program generation.
      what_remains_open: Metric alignment with engineering usability, generalization
        to unseen part families, and robustness under input distribution shift are
        not yet resolved.
    - line: LLM-based executable CAD program synthesis with grounding or clarification
      what_it_solves: Converts natural language or visual input into executable CadQuery-style
        programs and resolves ambiguous specifications before synthesis.
      what_remains_open: Faithfulness of fine-grained parametric operations and whether
        reinforcement learning transfers outside curated or fine-tuned distributions
        remain unclear.
    - line: Representation-centric generative modeling for parametric and B-Rep CAD
      what_it_solves: Produces editable CAD models from text, images, or point-level
        supervision via parametric sequences, state-space models, or differentiable
        Bézier patches.
      what_remains_open: Scaling to complex assemblies, long sequences, and multimodal
        transfer without CAD-specific annotations is still unproven.
    - line: Engineering-oriented design-intent evaluation
      what_it_solves: Moves evaluation beyond geometric fidelity to manufacturability,
        functionality, and assemblability using structured specifications and judge
        rubrics.
      what_remains_open: Reliability of VLM judges and the persistent failure cascade
        from executable code to valid geometry to engineering-ready designs remain
        unaddressed.
    - line: Industrial-scale programmatic CAD benchmark construction
      what_it_solves: Supplies execution-verified CadQuery programs and multi-task
        evaluations across industrial part families.
      what_remains_open: Fine-tuning improves in-distribution results, but generalization
        beyond seen part families remains limited.
    consensus:
    - CAD generation is treated as program synthesis plus geometry realization, so
      evaluation should check code executability, geometric validity, and design intent.
    - Specialized generation models or fine-tuned agents outperform general-purpose
      vision-language models on in-distribution CAD tasks, especially under clean
      inputs.
    - Benchmark stratification by complexity, modality, and part family is necessary
      to expose failures that aggregate metrics hide.
    disagreements:
    - 'Representation choices differ: executable scripts, parametric sequences, latent
      encodings, and differentiable B-Rep patches trade off editability, fidelity,
      and supervision needs.'
    - 'Supervision signals differ: some rely on point-level or reconstruction losses,
      while others use curated text-to-CAD pairs or execution-verified programs.'
    - 'Evaluation scope differs: one line targets multimodal reconstruction quality,
      while another targets engineering requirements such as manufacturability and
      assemblability.'
    - 'Interaction mode differs: most systems generate in one pass, while clarification-based
      agents add an interactive specification stage before code synthesis.'
    - 'Deployment assumptions differ: idealized mesh-to-CAD settings differ from industrial
      part families and assembly-level design data.'
    open_questions:
    - How well do current CAD generation systems transfer to unseen part families
      and real industrial design tasks outside curated benchmarks?
    - Under what conditions do VLM-based design-intent rubrics provide reliable evidence
      for manufacturability and assemblability?
    - What explains ranking changes across geometric and programmatic metrics, and
      which metric should govern model selection?
    - Can formal geometric modeling constraints or representation assumptions predict
      the code-to-geometry-to-design failure cascade reported in benchmark studies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态与程序化CAD生成的基准化评测
      解决的问题: 跨输入模态、输出指标和几何复杂度对AI辅助CAD程序生成进行标准化比较。
      尚未覆盖: 指标与工程可用性的对齐、未见零件族的泛化，以及输入分布偏移下的鲁棒性仍缺少验证。
    - 路线: 基于LLM的可执行CAD程序合成，并结合接地或澄清
      解决的问题: 将自然语言或视觉输入转换为可执行的CadQuery类程序，并在合成前消解模糊规格。
      尚未覆盖: 细粒度参数化操作的忠实度，以及强化学习能否迁移到策展或微调分布之外仍不明。
    - 路线: 面向参数化与B-Rep CAD的表示中心生成建模
      解决的问题: 通过参数序列、状态空间模型或可微分Bézier面片，从文本、图像或点级监督生成可编辑CAD模型。
      尚未覆盖: 在无CAD特定标注下扩展到复杂装配体、长序列和多模态迁移仍待验证。
    - 路线: 面向工程化设计意图的评测
      解决的问题: 将评价从几何保真度扩展到可制造性、功能性和可装配性，使用结构化规范与评分标准。
      尚未覆盖: VLM评判器的可靠性，以及从可执行代码到有效几何再到工程就绪设计的失败级联尚未被解决。
    - 路线: 工业级程序化CAD基准构建
      解决的问题: 提供执行验证的CadQuery程序和多任务评测，覆盖工业零件族。
      尚未覆盖: 微调提升分布内表现，但对未见零件族的泛化仍然有限。
    共识:
    - CAD生成被视为程序合成与几何实现的组合，因此评测需要同时检查代码可执行性、几何有效性和设计意图。
    - 专用生成模型或微调智能体在分布内CAD任务上优于通用视觉语言模型，尤其在干净输入条件下更明显。
    - 按复杂度、模态和零件族分层构建基准，有助于暴露聚合指标掩盖的失败模式。
    分歧:
    - 表示选择不同：可执行脚本、参数序列、潜在编码与可微分B-Rep面片在可编辑性、保真度和监督需求之间各有取舍。
    - 监督信号不同：有的依赖点级或重建损失，有的依赖策展文本到CAD对，或执行验证的程序。
    - 评测范围不同：一类关注多模态重建质量，另一类关注可制造性、可装配性等工程设计需求。
    - 交互模式不同：多数系统一次性生成，而基于澄清的智能体在合成前增加交互式规格消解。
    - 部署假设不同：从理想化网格到CAD，到工业零件族和装配级设计数据之间存在明显差异。
    开放问题:
    - 当前CAD生成系统在策展基准之外的未见零件族和真实工业设计任务上迁移能力如何？
    - 在什么条件下，基于VLM的设计意图评分标准能为可制造性和可装配性提供可靠证据？
    - 几何指标与程序化指标之间的排名变化由什么引起，模型选择应以哪个指标为准？
    - 形式化几何建模约束或表示假设能否预测基准研究中报告的代码—几何—设计失败级联？
