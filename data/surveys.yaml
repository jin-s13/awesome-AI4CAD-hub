  related_work_outline:
  - 'Mainstream direction: End-to-end generation of editable parametric CAD models
    (construction sequences, code) from images, meshes, or point clouds via large
    multimodal models and optimization.'
  - 'Shared research pattern: Converting non-structured geometric inputs or natural
    language into structured, editable CAD programs that preserve design intent and
    support downstream modification.'
  - 'Key differences: Representation (CAD construction sequences vs. scripting languages
    like CadQuery), supervision (stepwise geometric feedback vs. end-to-end), architecture
    (Mamba, RL, VLM), and evaluation (geometric similarity vs. executable adherence).'
  - 'Trend evolution: Movement from traditional shape reconstruction toward multi-modal,
    unified frameworks (2025–2026) that leverage VLMs and program evolution to generate
    complex, industrial-grade CAD models from limited inputs.'
  - 'Open questions: Generalization across part categories and unseen operations,
    reliability of evaluation metrics (circularity between header extraction and adherence),
    and alignment of generated CAD with manufacturing constraints.'
  related_work_outline_zh:
  - 主流方向：通过大型多模态模型与优化方法，从图像、网格或点云端到端生成可编辑的参数化CAD模型（构建序列、代码）。
  - 研究共性：将非结构化几何输入或自然语言转换为保留设计意图、支持后续修改的结构化可编辑CAD程序。
  - 关键差异：表示形式（CAD构建序列 vs. 如CadQuery的脚本语言）、监督信号（逐步几何反馈 vs. 端到端）、架构（Mamba、RL、VLM）以及评估方式（几何相似度
    vs. 可执行一致性）。
  - 趋势演进：从传统形状重建向多模态统一框架（2025–2026）演进，利用VLM和程序演化从有限输入生成复杂工业级CAD模型。
  - 开放问题：跨零件类别和未见操作的泛化能力、评估指标的可靠性（头提取与一致性间的循环性），以及生成CAD与制造约束的契合度。
  literature_review:
    line_of_work_matrix:
    - line: Parametric CAD reverse engineering
      what_it_solves: Recovering editable CAD construction sequences or programs from
        meshes, point clouds, or images, enabling redesign and manufacturing reuse.
      what_remains_open: Scalability to complex industrial parts, handling of unseen
        operations and noisy real-world scans, and validation that the reconstructed
        program reflects true design intent rather than merely approximating geometry.
    - line: End-to-end multimodal CAD generation
      what_it_solves: Generating CAD code or construction sequences directly from
        text, images, or sketches using large vision-language models, unifying diverse
        CAD tasks in a single framework.
      what_remains_open: Robustness to out-of-distribution inputs, syntax correctness
        and semantic validity of generated code beyond training categories, and the
        ability to guarantee manufacturability and adherence to implicit design rules.
    - line: Controllable generation and design intent
      what_it_solves: Diagnosing how conditioning signals like design-intent headers
        influence CAD program generation, and developing methods to ensure faithful
        adherence to specified constraints.
      what_remains_open: Causal identification of true header effects versus distributional
        artifacts, generalization across different base models and CAD domains, and
        the design of evaluation metrics that are independent of the conditioning
        mechanism.
    consensus:
    - Editable parametric CAD is the target representation, not static meshes or point
      clouds, because it supports downstream engineering modifications.
    - Multi-modal inputs (images, meshes, point clouds, text) are increasingly used
      to drive CAD generation, moving beyond single-modality reconstruction.
    - Evaluation must go beyond geometric similarity (IoU, Chamfer distance) and include
      executable validity, syntax correctness, and design-intent adherence to be meaningful
      for real workflows.
    disagreements:
    - 'Representation choices diverge: some works reconstruct CAD construction sequences
      as step-by-step operations, while others generate executable scripts in a general-purpose
      CAD language (CadQuery).'
    - 'Supervision strategies differ: stepwise geometric feedback at each construction
      step versus end-to-end training from image–code pairs without intermediate supervision.'
    - 'Architectural preferences vary: hybrid optimization, decision transformers
      with offline RL, state-space models (Mamba), and fine-tuned vision-language
      models all compete, with no clear winner for long-sequence or complex designs.'
    - 'Evaluation scope differs: some emphasize geometric accuracy on standard benchmarks,
      while others highlight syntax validity, dataset creation, or causal analysis
      of conditioning signals, making cross-comparison difficult.'
    open_questions:
    - How well do current methods generalize to real-world photographs, hand sketches,
      or incomplete scans, given experiments on curated datasets?
    - Can the evaluation metrics be made independent of the header or condition extraction
      process to avoid circularity, as suggested by the derangement-control study?
    - What is the minimal set of design constraints (dimensions, tolerances, material)
      that must be satisfied for generated CAD to be considered manufacturing-ready,
      and how should they be verified?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 参数化CAD逆向工程
      解决的问题: 从网格、点云或图像恢复可编辑的CAD构建序列或程序，支持再设计与制造复用。
      尚未覆盖: 复杂工业零件的可扩展性、未见操作与真实噪声扫描的泛化，以及重建程序是否反映真实设计意图而非仅逼近几何。
    - 路线: 端到端多模态CAD生成
      解决的问题: 利用大型视觉语言模型直接从文本、图像或草图生成CAD代码或构建序列，在单一框架中统一多种CAD任务。
      尚未覆盖: 对分布外输入的鲁棒性、生成代码在训练类别外的语法正确性与语义有效性，以及保证可制造性和遵循隐式设计规则的能力。
    - 路线: 可控生成与设计意图
      解决的问题: 诊断如设计意图头等条件信号如何影响CAD程序生成，并开发确保忠实遵循指定约束的方法。
      尚未覆盖: 真实头效应与分布伪影的因果识别、跨不同基座模型与CAD领域的泛化，以及独立于条件机制的评估指标设计。
    共识:
    - 可编辑的参数化CAD是目标表示，而非静态网格或点云，因为它支持下游工程修改。
    - 多模态输入（图像、网格、点云、文本）正越来越多地用于驱动CAD生成，超越了单一模态重建。
    - 评估必须超越几何相似度（IoU、倒角距离），纳入可执行有效性、语法正确性和设计意图一致性，才能对真实工作流有意义。
    分歧:
    - 表示形式选择不同：部分工作重建逐步操作构建序列，另一些生成通用CAD语言（如CadQuery）的可执行脚本。
    - 监督策略不同：有的利用每一步的逐步几何反馈，有的从图像-代码对进行端到端训练，无中间监督。
    - 架构偏好多样：混合优化、离线RL的决策Transformer、状态空间模型（Mamba）和微调视觉语言模型并存，尚无长序列或复杂设计上的明显胜者。
    - 评估范围不同：部分强调在标准基准上的几何精度，另一些则突出语法有效性、数据集创建或条件信号的因果分析，导致难以交叉比较。
    开放问题:
    - 当前方法在真实照片、手绘草图或不完整扫描上的泛化能力如何，因为实验多在精选数据集上进行？
    - 评估指标是否能独立于头或条件提取过程以避免循环性，正如错乱控制研究所提示的？
    - 生成CAD要被视为制造就绪，需满足的最小设计约束集（尺寸、公差、材料）是什么，又应如何验证？
  synthesis_status: llm
