  related_work_outline:
  - 'Mainstream direction: LLM/VLM and agentic systems are becoming the main route
    for generating editable parametric CAD programs, with unified benchmarks covering
    multimodal inputs and geometric/executability metrics.'
  - 'Shared research pattern: representing CAD as executable construction sequences
    or structured programs, grounding text/image/mesh/point inputs to operations and
    parameters, and scoring geometric fidelity and validity.'
  - 'Key differences: some work reconstructs from mesh or point clouds via optimization,
    while other work generates from text or images via LLMs; settings differ by single
    part versus B-Rep assemblies, static generation versus interactive clarification,
    and CAD-specialized versus general models.'
  - 'Trend evolution: the provided top evidence is concentrated in 2026, so the visible
    trend is within the current frontier moving toward LLM/VLM, agentic clarification,
    unified multitask models, and benchmarks for engineering intent; older-year evidence
    is not represented here.'
  - 'Open questions: robustness under modality shift and geometric complexity, alignment
    of metrics with manufacturability and assemblability, isolating model gains from
    agent or optimization choices, and evidence gaps for CAD editing/retrieval and
    reproducibility.'
  related_work_outline_zh:
  - 主流方向：LLM/VLM和智能体系统成为生成可编辑参数化CAD程序的主路线，并配有多模态输入与几何/可执行性统一基准。
  - 研究共性：将CAD表示为可执行构建序列或结构化程序，把文本/图像/网格/点云输入接地到操作和参数，同时评估几何保真度与有效性。
  - 关键差异：从网格或点云重建与从文本/图像生成并存；包括端到端学习与优化、单零件与B-Rep装配体、静态生成与交互澄清、专用与通用模型等设置差异。
  - 趋势演进：现有高证据集中在2026年，可见趋势在当前前沿内，从单一任务模型转向LLM/VLM、智能体澄清、统一多任务模型和面向工程意图的基准；更早年份证据在此未覆盖。
  - 开放问题：模态转换与几何复杂度下的鲁棒性，指标与可制造性/可装配性的一致性，模型收益与智能体或优化选择的隔离，以及CAD编辑/检索与可复现性的证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: LLM-driven parametric program generation and grounding
      what_it_solves: Generating editable CAD scripts or construction sequences from
        text/image inputs by grounding semantics to B-Rep primitives, parameters,
        and hierarchical topology.
      what_remains_open: Robustness to ambiguous natural-language prompts, modality
        shift, and transfer to complex assemblies beyond curated single-part datasets.
    - line: Reverse engineering and geometry-to-CAD reconstruction
      what_it_solves: Recovering editable parametric CAD operations from meshes, point
        clouds, or images through iterative fitting or optimization with geometric
        feedback.
      what_remains_open: Operation coverage and complexity scaling, plus whether geometric
        metrics capture engineering validity and design intent.
    - line: Unified multimodal and multitask CAD modeling
      what_it_solves: Handling heterogeneous CAD tasks such as reconstruction, generation,
        and question answering within one model and benchmark.
      what_remains_open: Whether unification preserves task-specific robustness and
        how benchmark coverage affects model ranking.
    - line: Proactive and interactive CAD specification
      what_it_solves: Resolving underspecified prompts through agentic clarification
        before program synthesis, reducing invalid outputs and geometric error.
      what_remains_open: Interaction overhead and generalization beyond the trained
        text-to-CadQuery trajectory setting; separating clarifier benefit from coder
        ability.
    - line: CAD evaluation and benchmark protocols
      what_it_solves: Providing controlled comparability across input modalities,
        geometric fidelity, executability, program compactness, and design-intent
        stages.
      what_remains_open: Metric rank instability and alignment among geometric similarity,
        manufacturability, functionality, and assemblability remain unresolved.
    consensus:
    - CAD is usually represented as executable programs or construction sequences
      rather than raw meshes or B-Rep-only outputs.
    - Geometric fidelity alone is insufficient; validity, executability, and design-intent
      alignment are increasingly included.
    - LLMs/VLMs and hybrid optimization have become central for CAD generation and
      reconstruction in the current frontier.
    - Benchmarks highlight a cascade from executable code to valid geometry to engineering-ready
      design.
    - Method gains are often reported with state-of-the-art claims, but evidence of
      limitations and reproducibility remains uneven.
    disagreements:
    - 'Generation source differs: text/image-to-CAD versus mesh/point/image-to-CAD
      reconstruction.'
    - 'Representation and optimization differ: learned end-to-end script generation,
      hierarchical structure supervision, reinforcement fine-tuning, and IoU-driven
      iterative fitting.'
    - 'Interaction mode differs: static one-shot generation versus proactive clarification
      with user/agent dialogue.'
    - 'Evaluation target differs: single-part geometry versus B-Rep assemblies requiring
      functionality, manufacturability, and assemblability.'
    - 'Model scope differs: task-specific CAD models versus general multimodal LLMs,
      with specialized models stronger under ideal inputs but brittle across modality
      shifts.'
    open_questions:
    - How can text-to-CAD models remain reliable when prompts are ambiguous, noisy,
      or under-specified without excessive clarification overhead?
    - How should evaluation metrics weight geometric similarity, executability, program
      compactness, and engineering design intent when rankings change across them?
    - What operation and supervision choices are needed to scale reconstruction/generation
      to complex mechanical assemblies and manufactured parts?
    - How much of the reported improvement comes from the proposed representation
      or model versus the surrounding agent, optimization loop, dataset, or benchmark
      protocol?
    - Which verification gaps in code, datasets, and limitation reporting limit reproducibility
      across the current CAD methods?
  literature_review_zh:
    研究路线矩阵:
    - 路线: LLM驱动的参数化程序生成与接地
      解决的问题: 从文本/图像输入生成可编辑CAD脚本或构建序列，将语义接地到B-Rep基元、参数和层次拓扑。
      尚未覆盖: 对模糊自然语言提示、模态转换和超出精选单零件数据集的复杂装配体的鲁棒性。
    - 路线: 逆向工程与几何到CAD重建
      解决的问题: 通过迭代拟合或带几何反馈的优化，从网格、点云或图像恢复可编辑参数化CAD操作。
      尚未覆盖: 操作覆盖与复杂度扩展，以及几何指标能否捕捉工程有效性和设计意图。
    - 路线: 统一多模态与多任务CAD建模
      解决的问题: 在一个模型和基准中处理重建、生成和CAD问答等异构任务。
      尚未覆盖: 统一化是否保留任务特定鲁棒性，以及基准覆盖如何影响模型排名。
    - 路线: 主动式与交互式CAD规格澄清
      解决的问题: 在程序合成前通过智能体澄清解决欠指定提示，降低无效输出和几何误差。
      尚未覆盖: 交互开销及在受训文本到CadQuery轨迹设置之外的泛化；澄清器与编码器贡献难以分离。
    - 路线: CAD评估与基准协议
      解决的问题: 在输入模态、几何保真度、可执行性、程序紧凑性和设计意图阶段提供受控可比性。
      尚未覆盖: 不同指标下排名不稳定，几何相似度与可制造性、功能性、可装配性的对齐仍待解决。
    共识:
    - CAD通常表示为可执行程序或构建序列，而不是仅原始网格或B-Rep输出。
    - 仅几何保真度不够；有效性、可执行性和设计意图对齐越来越多被纳入。
    - 当前前沿中，LLM/VLM与混合优化已成为CAD生成和重建的核心方法。
    - 基准揭示从可执行代码到有效几何再到工程就绪设计的失败级联。
    - 多数方法报告最先进结果，但局限性与可复现性证据仍不均衡。
    分歧:
    - 生成来源不同：文本/图像到CAD与网格/点云/图像到CAD重建并存。
    - 表示与优化不同：端到端脚本生成、层次结构监督、强化微调和IoU驱动的迭代拟合各有采用。
    - 交互模式不同：一次性生成与先主动澄清再生成。
    - 评测目标不同：单零件几何与需要功能性、可制造性、可装配性的B-Rep装配体。
    - 模型范围不同：任务特定CAD模型与通用多模态LLM；理想输入下专用模型更强，但模态转换下更脆弱。
    开放问题:
    - 在提示模糊、噪声或欠指定时，文本到CAD模型如何保持可靠且避免过多澄清开销？
    - 当几何相似度、可执行性、程序紧凑性和工程意图排序矛盾时，评测指标应如何加权？
    - 需要哪些操作和监督选择才能将重建/生成扩展到复杂机械装配体和可制造零件？
    - 报告中的改进有多少来自表示或模型本身，而不是周围智能体、优化循环、数据集或基准协议？
    - 哪些代码、数据集和局限性验证缺口限制了当前CAD方法的可复现性？
