  literature_review:
    line_of_work_matrix:
    - line: Unified multi-modal CAD benchmarking and generation
      what_it_solves: Providing common evaluation surfaces across text, image, sketch,
        point cloud, and mesh inputs to CAD program generation, and testing whether
        one model can handle multiple CAD tasks.
      what_remains_open: Model rankings shift across metrics; modality shift and geometric
        complexity still degrade reconstruction; artifacts and independent reproduction
        are not established.
    - line: LLM-driven and agentic text-to-CAD pipelines
      what_it_solves: Converting natural-language design intents into executable parametric
        CAD scripts, with structure grounding, parameter grounding, hierarchical reasoning,
        or proactive clarification.
      what_remains_open: Fine-grained engineering success remains limited; ambiguity
        handling adds interaction overhead; real-world deployment robustness beyond
        reported datasets is unclear.
    - line: Mesh-to-CAD reverse engineering via stepwise and optimization-based reconstruction
      what_it_solves: Recovering editable parametric CAD construction sequences from
        meshes by incremental operation fitting and validation.
      what_remains_open: Evidence is mostly on part-level reconstruction; assembly-level,
        deployment, and independent cross-benchmark reproduction remain open.
    - line: Engineering-readiness evaluation frameworks
      what_it_solves: 'Evaluating generated CAD beyond geometry: executability, manufacturability,
        functionality, and assemblability through staged code, geometry, and design-intent
        checks.'
      what_remains_open: VLM judge reliability and human alignment need more validation;
        the failure cascade from code to engineering-ready design remains unresolved.
    consensus:
    - Work in this packet converges on parametric CAD program generation or reconstruction
      as the central system output, rather than producing only meshes or images.
    - 'There is shared recognition that generation quality must be decomposed into
      multiple checks: syntactic executability, geometric validity, and design-intent
      or engineering fitness.'
    - Recent systems increasingly combine large language or vision-language models
      with CAD-specific structure, parameter grounding, or optimization to improve
      semantic control.
    - 'Across benchmarks and methods, authors report a common failure cascade: executable
      code often does not produce valid geometry, and valid geometry often does not
      satisfy engineering-ready criteria.'
    disagreements:
    - 'Systems differ in supervision and representation: some use training-time structure/parameter
      alignment or reinforcement, while others use inference-time hybrid optimization
      or stepwise geometric comparison.'
    - 'Task coverage differs: some systems emphasize unified multimodal multi-task
      generation, while others focus on a narrower input-to-CAD conversion or interactive
      text-to-CAD clarification.'
    - 'Evaluation goals differ: one group prioritizes geometric fidelity, executability,
      and program compactness across input modalities; another prioritizes manufacturability,
      functionality, and assemblability through design-intent rubrics.'
    - 'Interaction mode differs: some systems operate as one-shot generators, while
      others introduce a proactive clarification agent that asks targeted questions
      before code synthesis.'
    - 'Deployment assumptions differ: some assume idealized input geometry or curated
      datasets, while others target real-world ambiguous prompts and practical design
      instances.'
    open_questions:
    - What independent reproduction evidence would show that reported gains hold across
      datasets, hardware, and evaluation implementations?
    - How can systems overcome the failure cascade from executable code to valid geometry
      to engineering-ready design without overfitting to a single benchmark metric?
    - What is the right balance between proactive clarification overhead and robustness
      for real-world design workflows?
    - How do unified multi-task models compare with specialized reconstruction pipelines
      under noisy, multi-view, or geometrically complex inputs?
    - How reliable are VLM-based judges for manufacturability, functionality, and
      assemblability when compared with human engineering review?
