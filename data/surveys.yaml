  related_work_outline:
  - 'Mainstream direction: AI-driven parametric CAD program generation from multimodal
    inputs (text, images, meshes, point clouds) using LLMs, state-space models, or
    hybrid optimization, with a focus on executable code and editable B-Rep sequences.'
  - 'Shared research pattern: Formulating CAD generation as sequence-to-sequence or
    program synthesis, training with supervised fine-tuning, self-supervised reconstruction,
    or RL, and evaluating geometric fidelity, executability, and increasingly manufacturability.'
  - 'Key differences: The output representation varies between full Python scripts
    (CadQuery), operation sequences, or direct B-Rep grounding; architectures range
    from task-specific Mamba/Transformer to generalist VLMs; interaction spans one-shot
    generation to proactive clarification agents.'
  - 'Trend evolution: Recent 2026 work shifts from pure geometry reconstruction to
    text/multimodal generation, adds engineering-aware benchmarks, and introduces
    agentic clarification and hybrid optimization, moving beyond idealized inputs
    toward real-world constraints.'
  - 'Open questions: How to maintain high fidelity on complex, long-sequence CAD models;
    whether current benchmarks capture true manufacturing constraints; how models
    generalize under modality shift and noise; and the trade-off between geometric
    accuracy, executability, and design intent alignment.'
  related_work_outline_zh:
  - 主流方向：基于LLM、状态空间模型或混合优化的AI驱动参数化CAD程序生成，从文本、图像、网格等多模态输入产生可执行代码和可编辑的B-Rep序列。
  - 研究共性：将CAD生成形式化为序列到序列或程序合成，使用监督微调、自监督重建或强化学习训练，评估几何保真度、可执行性，并日益关注可制造性。
  - 关键差异：输出表示在完整Python脚本、操作序列或直接B-Rep接地之间不同；模型架构从专用Mamba/Transformer到通用视觉语言模型；交互方式从一次性生成到主动澄清。
  - 趋势演进：2026年工作从纯几何重建转向文本/多模态生成，引入工程意识基准，并加入主动澄清和混合优化，正在从理想化输入走向真实约束。
  - 开放问题：如何在复杂长序列CAD模型上保持高保真度；现有基准是否捕获真实制造约束；模型在模态变化和噪声下如何泛化；几何精度、可执行性与设计意图对齐之间的权衡。
  literature_review:
    line_of_work_matrix:
    - line: Parametric representation and sequence generation for CAD
      what_it_solves: Transforms CAD design into a learnable sequence of parametric
        operations or executable scripts, enabling end-to-end generation from visual
        or textual input. It bridges the gap between raw geometry and editable CAD
        constructs.
      what_remains_open: Long-sequence consistency for complex models, cross-modal
        robustness (e.g., from clean mesh to noisy scan), and the ability to capture
        fine-grained engineering constraints such as tolerance and manufacturability
        remain unresolved.
    - line: Agentic interaction and human-in-the-loop design
      what_it_solves: Addresses ambiguity in user prompts by introducing proactive
        clarification, dialogue, or iterative refinement before code synthesis, thereby
        reducing specification errors and invalid outputs.
      what_remains_open: The contribution of the interaction strategy versus the underlying
        CAD model is unclear; overhead of multi-turn clarification and scalability
        to diverse design tasks are not yet quantified.
    - line: Benchmarking and multi-dimensional evaluation
      what_it_solves: Provides standardized datasets and metrics that go beyond geometric
        similarity to assess executability, manufacturability, and design intent alignment,
        enabling fair comparison across disparate methods.
      what_remains_open: Current benchmarks may not fully represent real-world CAD
        workflows; the correlation between benchmark metrics and downstream engineering
        usefulness is still an open question, and the reliability of VLM-based evaluators
        needs further validation.
    consensus:
    - Parametric CAD program generation is the dominant paradigm, producing editable,
      history-based representations rather than static meshes.
    - Multimodal input (text, images, point clouds, meshes) is increasingly supported,
      aiming to lower the barrier for non-expert users.
    - Hybrid approaches that combine neural generation with optimization-based fitting
      or geometric verification outperform purely generative methods on geometric
      fidelity and validity.
    - Evaluation is expanding from geometric metrics (IoU, Chamfer) to include executability,
      manufacturability, and functional correctness, reflecting a shift toward engineering-ready
      outputs.
    - Large language models and vision-language models show promise for CAD tasks,
      but specialized CAD models still dominate under clean, idealized inputs.
    disagreements:
    - 'Output abstraction: Some methods generate finished Python scripts (e.g., CadQuery),
      while others produce sequences of primitive operations that require further
      interpretation.'
    - 'Model paradigm: Task-specific architectures (e.g., Mamba-based state-space
      models, dedicated mesh-to-CAD transformers) contrast with fine-tuned generalist
      LLMs/VLMs used in a unified manner.'
    - 'Interaction mode: One-shot generation assumes a complete and unambiguous prompt,
      whereas agentic frameworks invest in a clarification phase to resolve ambiguity
      before generation.'
    - 'Training signal: Self-supervised reconstruction pretraining, supervised fine-tuning
      on curated datasets, and RL-based optimization represent different optimization
      philosophies with different scalability and data requirements.'
    - 'Evaluation emphasis: Some benchmarks prioritize geometric accuracy and executability,
      while others introduce design-intent rubrics and manufacturability criteria,
      leading to different model rankings.'
    open_questions:
    - How can models maintain geometric fidelity and validity on CAD sequences with
      high face count and complex topology, without prohibitively long inference times?
    - To what extent do current evaluation benchmarks reflect the true constraints
      of mechanical design and manufacturing, and how can we close the gap?
    - What is the most effective way to handle distribution shift—from synthetic or
      idealized inputs to real-world captures with noise, occlusions, or incomplete
      data?
    - Can agentic clarification strategies be made efficient enough for interactive
      use, and how do we measure the trade-off between clarification cost and output
      quality?
    - Is there a unified metric that captures both geometric similarity and engineering
      intent, avoiding the problem of inconsistent model rankings across different
      evaluation dimensions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 参数化表示与序列生成
      解决的问题: 将CAD设计转化为可学习的参数化操作序列或可执行脚本，实现从视觉或文本输入端到端生成，连接原始几何与可编辑CAD结构。
      尚未覆盖: 长序列复杂模型的一致性、跨模态鲁棒性（如从理想网格到噪声扫描），以及捕获细粒度工程约束（如公差、可制造性）的能力仍未解决。
    - 路线: 智能体交互与人机协同设计
      解决的问题: 通过主动澄清、对话或迭代优化来应对用户提示中的模糊性，减少规格错误并降低无效输出。
      尚未覆盖: 交互策略相对于底层CAD模型的贡献尚不明确；多轮澄清的开销以及对多样化设计任务的可扩展性缺乏量化。
    - 路线: 基准测试与多维度评估
      解决的问题: 提供超越几何相似度的标准化数据集和指标，评估可执行性、可制造性和设计意图对齐，实现在不同方法间的公平比较。
      尚未覆盖: 现有基准能否充分代表真实CAD工作流存疑；基准指标与下游工程实用性的相关性仍是开放问题，基于VLM的评估器可靠性需进一步验证。
    共识:
    - 参数化CAD程序生成是主流范式，产生可编辑的、基于历史的表示，而非静态网格。
    - 多模态输入（文本、图像、点云、网格）越来越被支持，以降低非专业用户的使用门槛。
    - 将神经生成与基于优化的拟合或几何验证相结合的混合方法，在几何保真度和有效性上优于纯生成方法。
    - 评估从几何指标（IoU、Chamfer）扩展到可执行性、可制造性和功能正确性，反映出向工程就绪输出的转变。
    - 大语言模型和视觉语言模型在CAD任务中展现潜力，但在干净、理想化的输入下，专用CAD模型仍然占优。
    分歧:
    - 输出抽象层次：有的方法生成完整的Python脚本，有的则生成需要进一步解释的基元操作序列。
    - 模型范式：专用架构（如基于Mamba的状态空间模型、专用网格到CAD变换器）与以统一方式微调的通用LLM/VLM形成对比。
    - 交互模式：一次性生成假设完整且无歧义的提示，而智能体框架在生成前投入澄清阶段以消除模糊。
    - 训练信号：自监督重建预训练、在精心策划数据集上的监督微调、以及基于强化学习的优化代表了不同的优化哲学，在可扩展性和数据需求上各异。
    - 评估侧重点：一些基准优先考虑几何精度和可执行性，另一些则引入设计意图评分标准和可制造性准则，导致模型排名不一致。
    开放问题:
    - 模型如何在面数多、拓扑复杂的CAD序列上保持几何保真度和有效性，同时避免过长的推理时间？
    - 现有评估基准在多大程度上反映了机械设计和制造的真实约束，如何缩小差距？
    - 如何最有效地处理从合成或理想化输入到带有噪声、遮挡或不完整数据的真实捕获的分布偏移？
    - 主动澄清策略能否高效到足以用于交互式场景，如何权衡澄清成本与输出质量？
    - 是否存在一个统一指标，能够同时捕获几何相似性和工程意图，避免不同评估维度下模型排名不一致的问题？
