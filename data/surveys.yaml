  related_work_outline:
  - 'Mainstream direction: The current frontier builds multimodal CAD program-generation
    benchmarks and text/mesh-to-CAD evaluation around executable parametric programs,
    pairing geometric metrics with validity and engineering-intent checks.'
  - 'Shared research pattern: Papers treat CAD as structured, editable construction
    sequences and evaluate both generation quality and program executability; recent
    work adds multi-metric stress tests to expose robustness gaps.'
  - 'Key differences: Input modalities range from text and images to meshes and point
    clouds; optimization spans LLM fine-tuning/RL, hybrid geometric optimization,
    stepwise reconstruction, and agent-based clarification; evaluation targets differ
    from geometric fidelity to manufacturability/assemblability.'
  - 'Trend evolution: With top-paper evidence concentrated in 2026, the visible trend
    is a shift from single-task generation toward unified multimodal benchmarks and
    engineering-oriented evaluation, while older years provide sparse context rather
    than clear sequential change.'
  - 'Open questions: Whether benchmark metrics align with real downstream decisions,
    why model rankings change across metrics and modality shifts, how far evaluation
    covers real CAD workflows, and how reliable automated judges are remain unresolved.'
  related_work_outline_zh:
  - 主流方向：当前前沿构建多模态CAD程序生成基准，并以可执行参数化程序为中心，结合几何指标、有效性和工程意图检查进行评估。
  - 研究共性：将CAD视为结构化可编辑构建序列，同时评估生成质量和程序可执行性；近期加入多指标压力测试以暴露鲁棒性缺口。
  - 关键差异：输入模态涵盖文本、图像、网格和点云；优化方式包括LLM微调/强化学习、混合几何优化、逐步重建和智能体澄清；评测目标从几何保真到可制造性/可装配性不等。
  - 趋势演进：Top论文证据集中在2026年，可见趋势是从单任务生成转向统一多模态基准与工程导向评估；早期年份仅有稀疏背景，难以推断连续历史变化。
  - 开放问题：指标与真实下游决策是否一致、模型排名为何随指标和模态迁移变化、评测覆盖真实CAD工作流的程度、自动评判器可靠性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal CAD evaluation suites
      what_it_solves: Compares heterogeneous CAD tasks such as text/image/point-to-CAD
        generation and reconstruction under shared multimodal evaluation settings.
      what_remains_open: Evidence does not show whether the sample distributions cover
        real-world CAD workflows, and ranking stability across metrics and modality
        shifts is unresolved.
    - line: Text-to-CAD program generation and grounding
      what_it_solves: Generates executable parametric CAD scripts from natural language,
        using structure alignment, parameter grounding, or clarification to improve
        validity and fidelity.
      what_remains_open: Engineering constraints beyond geometric validity, such as
        manufacturability and design intent, are only partially evaluated; ambiguity
        handling requires interaction overhead and curated data.
    - line: Mesh-to-CAD reverse engineering
      what_it_solves: Recovers editable parametric CAD construction sequences from
        meshes via stepwise fitting or hybrid optimization, improving volumetric fidelity
        and reducing invalid programs.
      what_remains_open: Evidence shows degradation with geometric complexity and
        brittleness under input modality shift; program compactness and generalization
        beyond existing datasets remain open.
    - line: Engineering-oriented evaluation and automated judging
      what_it_solves: Adds staged code, geometry, and design-intent checks for B-Rep
        assemblies, including manufacturability, functionality, and assemblability
        via VLM judges.
      what_remains_open: Automated judge reliability is only partially validated;
        fine-grained engineering criteria and real manufacturing constraints are not
        yet shown to align with downstream use.
    consensus:
    - Executable parametric CAD programs are the dominant target representation across
      generation, reconstruction, and evaluation pipelines.
    - A single aggregate metric is insufficient; evaluation increasingly combines
      geometric fidelity, executability or validity, compactness, and engineering-intent
      criteria.
    - CAD-specialized pipelines can outperform general vision-language models under
      controlled inputs, but success does not guarantee robust behavior under complexity
      growth or modality shift.
    - Benchmarks reveal a failure cascade from executable code to valid geometry to
      engineering-ready design, making staged evaluation necessary.
    disagreements:
    - 'Input representation and task scope differ: some work evaluates multimodal
      reconstruction and generation together, while others focus on text-to-CAD or
      mesh-to-CAD only.'
    - 'Optimization and supervision differ: LLM fine-tuning with reinforcement learning,
      ranking-based structure/parameter grounding, hybrid IoU-driven optimization,
      and stepwise intermediate geometry comparison each encode different inductive
      biases.'
    - 'Evaluation target differs: geometric fidelity and program validity are common,
      but engineering-focused evaluation adds manufacturability, functionality, and
      assemblability of assemblies rather than only single parts.'
    - 'Interaction mode differs: one-shot generation is standard, but proactive specification
      clarification introduces human-in-the-loop cost to resolve ambiguous prompts.'
    open_questions:
    - How well do proxy metrics align with downstream decisions engineers actually
      care about across manufacturability, functionality, and assemblability?
    - Why do model rankings change across metrics and input modality shifts, and what
      evaluation protocol would make them stable?
    - Do current CAD sample distributions adequately cover real-world complexity,
      ambiguity, and assembly workflows?
    - How can automated VLM judges be validated beyond limited human checks for fine-grained
      design-intent criteria?
    - Are reported conclusions stable across implementations, code availability, and
      compute budgets when several papers lack visible artifact or limitation details?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD评测套件
      解决的问题: 在共享多模态评测设置下比较文本/图像/点云到CAD生成、重建等异构任务。
      尚未覆盖: 证据未显示样本分布是否覆盖真实CAD工作流，指标稳定性与模态迁移下的排名稳定性仍未解决。
    - 路线: 文本到CAD程序生成与接地
      解决的问题: 从自然语言生成可执行参数化CAD脚本，通过结构对齐、参数接地或澄清提高有效性与保真度。
      尚未覆盖: 除几何有效性外的制造性、设计意图等工程约束只被部分评估；歧义处理依赖交互开销和精调数据。
    - 路线: 网格到CAD逆向工程
      解决的问题: 通过逐步拟合或混合优化从网格恢复可编辑参数化CAD构建序列，提高体积保真度并减少无效程序。
      尚未覆盖: 证据显示几何复杂度增加时质量下降，输入模态变化下鲁棒性不足；程序紧凑性与跨数据集泛化仍未知。
    - 路线: 工程导向评估与自动评判
      解决的问题: 对B-Rep装配体增加分层代码、几何和设计意图检查，通过VLM评判器评估可制造性、功能性和可装配性。
      尚未覆盖: 自动评判器仅部分验证；细粒度工程标准与真实制造约束是否对齐下游使用尚未证明。
    共识:
    - 可执行参数化CAD程序是生成、重建和评估流水线中的主导表示。
    - 单一聚合指标不足；评测越来越多地组合几何保真度、可执行性或有效性、简洁性及工程意图标准。
