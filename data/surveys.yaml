  related_work_outline:
  - 'Mainstream direction: The dominant direction is AI-assisted CAD program generation
    and reverse engineering, especially converting text, images, sketches, point clouds,
    or meshes into executable parametric CAD scripts or B-Rep structures, with new
    benchmarks evaluating geometric fidelity, executability, and engineering constraints.'
  - 'Shared research pattern: Work represents CAD as structured programs or parametric
    operations and trains or optimizes model outputs using geometric feedback, grounding,
    alignment, or program execution checks; many papers pair methods with evaluation
    suites to expose validity gaps and failure cascades.'
  - 'Key differences: Methods split between LLM-based text-to-CAD synthesis, hybrid
    or stepwise mesh-to-CAD reconstruction, unified multimodal multi-task models,
    and agentic specification clarification; evaluations differ in whether they target
    geometry, executability, program compactness, or engineering intent.'
  - 'Trend evolution: The visible high-evidence papers are concentrated in 2026, so
    the trend is within the current frontier: from single-task benchmarks and specialized
    generators toward unified multimodal CAD benchmarks, grounded text-to-CAD, and
    proactive interaction for robustness.'
  - 'Open questions: How can learned CAD generation satisfy manufacturability, functionality,
    and assemblability beyond geometric validity; why do rankings change across metrics
    and modalities; what component drives optimization-based reconstruction gains;
    and are agentic clarification benefits transferable and reproducible outside reported
    settings.'
  related_work_outline_zh:
  - 主流方向：主流方向是AI辅助CAD程序生成与逆向工程，尤其将文本、图像、草图、点云或网格转换为可执行参数化CAD脚本或B-Rep结构；新基准评估几何保真度、可执行性和工程约束。
  - 研究共性：将CAD表示为结构化程序或参数化操作，通过几何反馈、接地、对齐或程序执行检查训练或优化模型；方法常与评测套件结合，暴露有效性和失败级联。
  - 关键差异：方法分为基于LLM的文本到CAD合成、混合或逐步网格到CAD重建、统一多模态多任务模型，以及主动式规格澄清；评测目标在几何、可执行性、程序紧凑性和工程意图之间不同。
  - 趋势演进：可见高证据论文集中在2026年，趋势处于当前前沿：从单任务基准和专用生成器走向统一多模态CAD基准、接地文本到CAD和主动交互增强鲁棒性。
  - 开放问题：学习式CAD生成如何在几何有效性之外满足可制造性、功能性与可装配性；排名为何随指标和模态变化；优化重建的收益来源；主动澄清是否可迁移和可复现。
  literature_review:
    line_of_work_matrix:
    - line: Multimodal CAD generation and reverse-engineering benchmarks (e.g., CADBench,
        MUSE, UniCAD benchmark)
      what_it_solves: Standardized comparison of CAD program generation/reconstruction
        across inputs, metrics, tasks, and engineering criteria, exposing failure
        cascades from syntax to design intent.
      what_remains_open: Benchmarks report limited code/artifact or limitation details;
        whether metrics capture manufacturability and functionality beyond geometric
        utility remains partially addressed.
    - line: Text-to-CAD program synthesis with language grounding and parameter alignment
        (e.g., FutureCAD, HierCAD)
      what_it_solves: Translating natural-language prompts into executable CAD scripts
        with improved structural consistency, parameter grounding, and lower invalidity.
      what_remains_open: Evidence mostly reports generation metrics and lacks detailed
        limitation studies; fine-grained engineering criteria and generalization beyond
        reported datasets remain underexamined.
    - line: Mesh/3D-to-CAD reverse engineering and optimization (e.g., CADFit, CADENA)
      what_it_solves: Recovering editable parametric construction sequences from meshes
        or point clouds through stepwise fitting, geometric feedback, and IoU-driven
        optimization.
      what_remains_open: Performance degrades with geometric complexity and modality
        shift; attribution between learned prediction and optimization/feedback is
        not fully isolated.
    - line: Unified multi-modal multi-task CAD models (e.g., UniCAD-MLLM)
      what_it_solves: One end-to-end model for point-to-CAD reconstruction, text/image-to-CAD
        generation, and CAD question answering across text, image, sketch, and point-cloud
        inputs.
      what_remains_open: Reproducibility signals are limited; whether a single model
        transfers to engineering-level constraints and robust fine-grained evaluation
        is not yet established.
    - line: Interactive agentic specification clarification for CAD coding (e.g.,
        ProCAD)
      what_it_solves: Auditing ambiguous prompts, asking targeted questions, and then
        generating CAD programs to reduce invalid outputs and improve robustness.
      what_remains_open: Evidence is from one method and a curated dataset; interaction
        overhead and transfer to broader CAD tasks are not yet measured.
    consensus:
    - 'CAD generation is converging on structured program synthesis: outputs are executable
      parametric operations or B-Rep programs rather than unstructured meshes.'
    - Evaluation increasingly couples code validity, geometric fidelity, and task-specific
      engineering intent, often using multi-stage checks.
    - 'There is broad recognition of a failure cascade: models may produce valid code
      but fail geometry or fine-grained engineering requirements.'
    disagreements:
    - 'Supervision and optimization strategy differ: some methods use supervised fine-tuning
      plus reinforcement learning or grounding, while others rely on stepwise geometric
      feedback and IoU-driven optimization.'
    - 'Input and interaction settings differ: one group handles given text, image,
      or mesh inputs, while another introduces proactive clarification before program
      synthesis.'
    - 'Evaluation targets differ: some focus on geometric metrics and executability,
      while others emphasize manufacturability, functionality, and assemblability;
      model rankings also shift across metrics.'
    open_questions:
    - Can text-to-CAD methods move beyond valid geometry to manufacturable, functional,
      and assemblable designs when even strong LLMs show limited fine-grained engineering
      success?
    - Why do specialized CAD models become brittle under modality shift and why do
      rankings change across metrics, and what benchmark design would stabilize conclusions?
    - 'What part of hybrid or stepwise reconstruction contributes the accuracy and
      validity gains: the learned operation proposal, the geometric feedback, or the
      optimizer/validation loop?'
    - Does proactive clarification remain beneficial and low-overhead outside the
      reported text-to-CAD dataset, and can it be reproduced without the curated training
      data?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态CAD生成与逆向工程基准（如CADBench、MUSE、UniCAD基准）
      解决的问题: 跨输入、指标、任务和工程准则标准化比较CAD程序生成或重建，暴露从语法到设计意图的失败级联。
      尚未覆盖: 代码、工件或局限性细节有限；指标是否超越几何效用覆盖可制造性与功能性仍需进一步验证。
    - 路线: 面向文本到CAD的程序合成与语言接地及参数对齐（如FutureCAD、HierCAD）
      解决的问题: 将自然语言提示转换为可执行CAD脚本，提高结构一致性、参数接地并降低无效率。
      尚未覆盖: 证据主要报告生成指标，缺少局限性研究；细粒度工程准则和超出报告数据集的泛化性仍不充分。
    - 路线: 网格/3D到CAD逆向工程与优化（如CADFit、CADENA）
      解决的问题: 从网格或点云恢复可编辑参数化构建序列，通过逐步拟合、几何反馈和IoU驱动优化。
      尚未覆盖: 性能随几何复杂度和模态偏移下降；学习预测与优化或反馈的贡献尚未完全隔离。
    - 路线: 统一多模态多任务CAD模型（如UniCAD-MLLM）
      解决的问题: 在单一模型中端到端处理点云到CAD重建、文本/图像到CAD生成和CAD问答，覆盖文本、图像、草图、点云。
      尚未覆盖: 可复现信号有限；单一模型是否迁移到工程级约束和细粒度评估尚未建立。
    - 路线: 交互式智能体规格澄清（如ProCAD）
      解决的问题: 审核模糊提示并提出针对性问题，再生成CAD程序，以降低无效输出并提高鲁棒性。
      尚未覆盖: 证据来自单一方法和精选数据集；交互开销与向更广泛CAD任务的迁移尚未测量。
    共识:
    - CAD生成正在收敛为结构化程序合成：输出是可执行参数化操作或B-Rep程序，而非非结构化网格。
    - 评测越来越多地结合代码有效性、几何保真度和任务特定工程意图，常采用多阶段检查。
    - 普遍识别出失败级联：模型可能生成有效代码，但在几何或细粒度工程要求上失败。
    分歧:
    - 监督与优化策略不同：一些方法采用监督微调加强化学习或接地，另一些依赖逐步几何反馈和IoU驱动优化。
    - 输入与交互设置不同：一组处理给定的文本、图像或网格输入，另一组在程序合成前引入主动澄清。
    - 评测目标不同：部分关注几何指标和可执行性，另一些强调可制造性、功能性和可装配性；模型排名随指标变化。
    开放问题:
    - 即使最强LLM在细粒度工程准则上成功有限，文本到CAD方法如何从几何有效性进一步满足可制造性、功能性和可装配性？
    - 为何专用CAD模型在模态偏移下变脆弱，以及为何模型排名随指标变化？何种基准设计能稳定结论？
    - 混合或逐步重建中，学习到的操作提议、几何反馈或优化/验证循环各自贡献多少准确性和有效性提升？
    - 主动澄清能否在报告的数据集之外保持低交互开销并受益，且能否在没有精选训练数据的情况下复现？
