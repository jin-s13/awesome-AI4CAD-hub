  related_work_outline:
  - 'Mainstream direction: Build multimodal and LLM-driven parametric CAD generation
    pipelines that output executable CAD programs, while also creating unified benchmarks
    for text, image, mesh, point-cloud, and reverse-engineering tasks.'
  - 'Shared research pattern: Represent CAD as structured programs, construction sequences,
    or B-Rep primitives; train or optimize with supervised fine-tuning, reinforcement
    learning, or geometric feedback; evaluate executability and geometric fidelity
    together.'
  - 'Key differences: Works differ in input modality, output representation, interaction
    mode, and optimization signal; some use single-shot LLM script generation, others
    use stepwise mesh-to-CAD fitting, proactive clarification, or engineering-oriented
    evaluation.'
  - 'Trend evolution: The available evidence is concentrated in the 2026 frontier,
    showing movement from task-specific reconstruction toward unified multimodal multi-task
    models, agentic clarification, and benchmarks that add manufacturability and design-intent
    criteria.'
  - 'Open questions: How to stay robust under modality shift and geometric complexity;
    how to compare metrics when rankings change; how reliable VLM judges are for engineering
    criteria; and how much gain comes from method versus benchmark or system design.'
  related_work_outline_zh:
  - 主流方向：构建多模态、LLM驱动的参数化CAD生成流程，输出可执行CAD程序，同时建设统一的文本、图像、网格、点云到CAD及逆向工程基准。
  - 研究共性：把CAD表示为结构化程序、构建序列或B-Rep基元；用监督微调、强化学习或几何反馈进行训练/优化；同时评估可执行性与几何保真度。
  - 关键差异：输入模态、输出表示、交互模式和优化信号不同；有的做单步LLM脚本生成，有的做逐步网格到CAD拟合、主动澄清或工程设计评测。
  - 趋势演进：现有证据集中在2026年前沿，显示从任务特定重建走向统一多模态多任务模型、主动式智能体，以及加入可制造性和设计意图标准的基准。
  - 开放问题：如何在模态迁移和几何复杂度下保持鲁棒；指标排名变化时如何比较；VLM评判器对工程标准的可靠性；以及收益来自方法还是基准/系统设计。
  literature_review:
    line_of_work_matrix:
    - line: LLM-driven parametric CAD program generation with structure and primitive
        grounding
      what_it_solves: Converts text, image, sketch, or multimodal prompts into executable
        parametric CAD scripts or grounded B-Rep primitives, improving structure consistency
        and parameter accuracy through alignment and grounding.
      what_remains_open: Robustness under ambiguous prompts, modality shift, and complex
        geometry is still uncertain; evidence is limited on whether grounding choices
        transfer beyond curated text-to-CAD settings.
    - line: Optimization-based and stepwise reverse engineering from geometry
      what_it_solves: Recovers editable parametric CAD construction sequences from
        meshes or point clouds by incrementally fitting operations such as extrusions,
        revolutions, fillets, and chamfers, using geometric feedback or IoU-driven
        optimization.
      what_remains_open: Scalability to complex assemblies, metric consistency, and
        comparison with end-to-end generative models beyond the reported DeepCAD,
        Fusion 360, MCB, and related datasets remain unresolved.
    - line: Unified CAD benchmarks and evaluation protocols
      what_it_solves: Provides multimodal, multi-task evaluation suites and rubrics
        that assess geometry fidelity, executability, validity, manufacturability,
        functionality, and assemblability across varying input modalities and output
        programs.
      what_remains_open: VLM-judge reliability, dataset coverage, metric ranking instability,
        and accessible artifacts for controlled comparison remain verification gaps.
    - line: Agentic clarification before CAD code synthesis
      what_it_solves: Reduces ambiguous text-to-CAD failures by having a proactive
        agent audit prompts, ask targeted clarification questions, and produce a self-consistent
        specification before a coding agent generates executable CAD programs.
      what_remains_open: Interaction overhead, generalization beyond text-to-CadQuery
        workflows, and separation of clarification gains from coding-agent fine-tuning
        effects are not fully isolated.
    consensus:
    - CAD generation and reconstruction are predominantly formulated as structured
      program synthesis or parametric operation prediction rather than unstructured
      geometry generation.
    - The field is converging on multimodal inputs and unified evaluation, covering
      text, image, sketch, point cloud, and mesh conditions.
    - Executability, validity, and geometric fidelity are treated as core evaluation
      signals, not just sequence-level or linguistic quality.
    - LLM/code-generation approaches are central for text-to-CAD, while specialized
      geometric optimization still shows strong results for mesh-to-CAD under idealized
      inputs.
    - Grounding language to B-Rep primitives or parametric structures is viewed as
      necessary for improved consistency and lower invalid program rates.
    disagreements:
    - 'Output representation differs: some methods produce CadQuery scripts, others
      produce construction-tree reasoning trajectories, direct B-Rep primitives, or
      gradually fitted parametric operations.'
    - 'Optimization and supervision differ: some rely on supervised fine-tuning plus
      reinforcement learning, others use geometric feedback optimization, perturbation-based
      parameter grounding, or agentic fine-tuning.'
    - 'Evaluation targets differ: geometric reconstruction metrics are primary in
      some work, while others emphasize engineering-ready criteria such as manufacturability,
      functionality, and assemblability.'
    - 'Interaction mode differs: most systems are single-shot, while one line uses
      proactive clarification before code synthesis.'
    - 'Input and deployment emphasis differs: methods specialize in text, image, sketch,
      point cloud, mesh, or multi-view inputs; specialized mesh-to-CAD models and
      general multimodal LLMs show different strengths depending on input conditions
      and metrics.'
    open_questions:
    - How can CAD-specialized performance be preserved as input modality shifts and
      geometric complexity, such as B-rep face count, increases?
    - What evaluation setup can fairly compare different input modalities and output
      representations when model rankings change across metrics?
    - How reliable are VLM-based judges for manufacturability, functionality, and
      assemblability beyond the limited human validation reported?
    - How much of the improvement in clarification-based systems comes from the clarification
      agent rather than from fine-tuning the CAD coding agent?
    - What is the replication and generalization boundary given missing code, dataset,
      metric, and limitation details in much of the current evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于LLM的参数化CAD程序生成与结构/基元接地
      解决的问题: 将文本、图像、草图或多模态提示转换为可执行参数化CAD脚本或接地的B-Rep基元，通过结构对齐和参数接地提升结构一致性与参数准确性。
      尚未覆盖: 在模糊提示、模态偏移和复杂几何下的鲁棒性仍不确定；接地选择能否迁移到精选文本到CAD设置之外证据有限。
    - 路线: 基于优化和逐步式几何逆向工程
      解决的问题: 从网格或点云恢复可编辑的参数化CAD构建序列，通过增量拟合拉伸、旋转、倒圆角、倒角等操作，并利用几何反馈或IoU驱动优化。
      尚未覆盖: 复杂装配体的可扩展性、指标一致性，以及与端到端生成模型在DeepCAD、Fusion 360、MCB等数据集之外的比较仍不清楚。
    - 路线: 统一CAD基准与评测协议
      解决的问题: 提供多模态多任务评测套件和评分标准，在多种输入模态和输出程序间评估几何保真度、可执行性、有效性、可制造性、功能性和可装配性。
      尚未覆盖: VLM评判器可靠性、数据集覆盖、指标排名不稳定以及可访问工件用于受控比较，仍是验证缺口。
    - 路线: CAD代码合成前的主动澄清智能体
      解决的问题: 通过主动智能体审核提示、提出有针对性澄清问题并生成自洽规格，降低文本到CAD生成中的歧义失败，再由编码智能体生成可执行程序。
      尚未覆盖: 交互开销、在文本到CadQuery工作流之外的泛化，以及澄清收益与编码智能体微调收益的隔离，尚未充分证明。
    共识:
    - CAD生成与重建主要被表述为结构化程序合成或参数化操作预测，而非无结构几何生成。
    - 领域正在向多模态输入和统一评测收敛，覆盖文本、图像、草图、点云和网格条件。
    - 可执行性、有效性和几何保真度被视为核心评测信号，而不仅是序列级或语言质量。
    - LLM/代码生成方法在文本到CAD中占据核心，专用几何优化在理想化网格输入下仍表现强劲。
    - 将语言与B-Rep基元或参数化结构接地，被认为是提升一致性并降低无效程序率的关键。
    分歧:
    - 输出表示不同：有的方法生成CadQuery脚本，有的生成构建树推理轨迹、直接B-Rep基元或逐步拟合的参数化操作。
    - 优化和监督不同：有的依赖监督微调加强化学习，有的使用几何反馈优化、基于扰动的参数接地或智能体微调。
    - 评测目标不同：一些工作以几何重建指标为主，另一些强调可制造性、功能性和可装配性等工程就绪标准。
    - 交互模式不同：多数为单次生成，而一条路线在代码合成前使用主动澄清。
    - 输入和部署侧重不同：方法分别专注文本、图像、草图、点云、网格或多视图输入；专用网格到CAD模型与通用多模态LLM在不同输入和指标下表现各异。
    开放问题:
    - 当输入模态偏移和几何复杂度（例如B-rep面数）增加时，如何保持CAD专用性能？
    - 当模型排名随指标变化时，如何公平比较不同输入模态和输出表示？
    - 在有限人工验证之外，VLM评判器对可制造性、功能性、可装配性的可靠性如何？
    - 主动澄清系统的提升有多少来自澄清智能体，而不是来自CAD编码智能体的微调？
    - 在当前证据中代码、数据集、指标和局限性信息缺失的情况下，复现与泛化边界是什么？
