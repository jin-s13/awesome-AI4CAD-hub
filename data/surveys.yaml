  related_work_outline:
  - 'Mainstream direction: The dominant direction is generating or reverse-engineering
    editable parametric CAD programs, especially B-rep or CadQuery sequences, using
    LLM/VLM, transformer grounding, or hybrid geometric optimization.'
  - 'Shared research pattern: Methods couple a representation or program-synthesis
    stage with evaluation loops—geometric IoU/Chamfer, executability/validity, or
    engineering criteria—and report gains over specialized or LLM baselines.'
  - 'Key differences: Problem formulation varies across text-to-CAD generation, mesh-to-CAD
    reconstruction, and unified multi-task CAD; supervision ranges from SFT/RL to
    optimization-based fitting to agentic clarification.'
  - 'Trend evolution: The visible high-ranked evidence is concentrated in 2026, suggesting
    current-frontier consolidation around benchmarks, multimodal unification, and
    LLM program synthesis; long-term evolution cannot be inferred from this packet.'
  - 'Open questions: Which representations and objective choices transfer across datasets
    and tasks; how to align metrics with functional/engineering utility; and how much
    gain comes from model reasoning versus planner/checker/evaluation scaffolding.'
  related_work_outline_zh:
  - 主流方向：以可编辑参数化 CAD 程序（尤其 B-rep/CadQuery 序列）的生成为核心，采用 LLM/VLM、变换器接地或混合几何优化。
  - 研究共性：将表示或程序合成阶段与几何 IoU/Chamfer、可执行性/有效性或下游工程准则等评估回路结合，并在专用或 LLM 基线上报告改进。
  - 关键差异：问题表述在文本到CAD、网格到CAD重建和统一多任务CAD之间不同；监督信号从SFT/RL到优化拟合并延伸到主动澄清。
  - 趋势演进：可见高排序证据集中在2026年，反映当前前沿在基准、多模态统一和 LLM 程序合成方面的整合；无法从本包推断长期演化。
  - 开放问题：哪些表示与目标设计可跨数据集和任务迁移；指标如何对接功能/工程效用；模型推理与规划器/检查器/评估脚手架各贡献多少。
  literature_review:
    line_of_work_matrix:
    - line: Unified and engineering-grounded CAD benchmark design
      what_it_solves: Defines evaluation surfaces for CAD program generation across
        modalities, geometric complexity, executability, design intent, manufacturability,
        and multi-task performance.
      what_remains_open: Metric disagreement and ranking changes across criteria,
        dataset and rubric coverage for real engineering constraints, and reliability
        of VLM judges across tasks.
    - line: Parametric text-to-CAD program synthesis with structural and parameter
        grounding
      what_it_solves: Translates natural language specifications into executable CadQuery
        or B-rep programs while aligning topology and parameter choices to improve
        structural consistency.
      what_remains_open: Generalization beyond curated datasets, robustness to ambiguous
        prompts, interaction cost, and evidence isolating grounding modules from base
        LLM code ability.
    - line: Optimization- and stepwise-based mesh-to-CAD reverse engineering
      what_it_solves: Recovers editable parametric construction sequences from meshes
        by iterative fitting and validation or feature-by-feature construction with
        intermediate geometric feedback.
      what_remains_open: Coverage of complex topology and rich operations, sensitivity
        to mesh quality/noise, and isolation of optimization or feedback contribution
        versus learned priors.
    - line: Universal multi-modal multi-task CAD models and agents
      what_it_solves: Processes text, images, sketches, and point clouds in one framework
        for reconstruction, generation, and CAD QA, optionally adding clarification
        loops for ambiguous prompts.
      what_remains_open: Cross-task transfer evidence, modality-shift brittleness,
        interaction overhead, and whether unified models match specialized models
        under matched training and evaluation.
    consensus:
    - Editable parametric CAD programs, especially B-rep or CadQuery scripts, have
      become the dominant target representation rather than only mesh or point-cloud
      outputs.
    - Evaluation increasingly combines geometric fidelity, executability or validity,
      and design-intent or engineering criteria, but model rankings change across
      metrics.
    - LLM, VLM, or transformer-based program synthesis appears as a shared substrate
      across text-to-CAD, mesh-to-CAD, and CAD question answering.
    - Visible evidence often reports substantial improvement but lacks detailed limitations
      or artifact links, leaving reproducibility and failure boundaries under-specified.
    disagreements:
    - Central problem formulation differs across text-to-CAD generation, mesh-to-CAD
      reconstruction, and multi-modal multi-task unification.
    - Supervision and inference differ among supervised fine-tuning or RL, hybrid
      geometric optimization, and agentic clarification plus code synthesis.
    - Evaluation targets differ among geometric fidelity or executability, manufacturability
      or functionality or assemblability, and broad multi-task accuracy.
    - Interaction mode differs between single-pass generation and proactive clarification,
      with implicit disagreement about acceptable interaction overhead.
    - 'Unified versus specialized models differ: specialized models can outperform
      under idealized inputs while unified models target broader coverage but may
      be brittle under modality shift.'
    open_questions:
    - Which representation and objective choices transfer beyond the specific benchmark
      families and CAD program formats used in the visible top-ranked papers?
    - How should metrics be weighted or redesigned when geometric fidelity, executability,
      and engineering criteria produce conflicting model rankings?
    - How much of reported improvement comes from the learned model rather than from
      geometric feedback, planner or checker loops, or evaluation scaffolding?
    - What are the failure boundaries under complex geometry, noisy or shifted modalities,
      and ambiguous prompts, and how should they be measured?
    - Does unified multimodal CAD training generalize across heterogeneous CAD tasks
      without losing specialized reconstruction or generation accuracy?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一且面向工程准则的 CAD 基准设计
      解决的问题: 定义跨模态、几何复杂度、可执行性、设计意图、可制造性和多任务性能的 CAD 程序生成评估体系。
      尚未覆盖: 指标间不一致导致排序变化，真实工程约束的数据集与评分标准覆盖不足，VLM 评判器跨任务可靠性仍待验证。
    - 路线: 带结构与参数接地的参数化文本到 CAD 程序合成
      解决的问题: 将自然语言规格转换为可执行的 CadQuery 或 B-rep 程序，并对齐拓扑与参数选择以提升结构一致性。
      尚未覆盖: 超出精选数据集后的泛化、模糊提示鲁棒性、交互成本，以及接地模块与基础 LLM 代码能力贡献的隔离证据。
    - 路线: 基于优化或逐步构造的网格到 CAD 逆向工程
      解决的问题: 通过迭代拟合与验证或逐特征构造配合中间几何反馈，从网格恢复可编辑参数化构建序列。
      尚未覆盖: 复杂拓扑与丰富操作覆盖、网格质量和噪声敏感性，以及优化或反馈贡献与学习先验的贡献分离。
    - 路线: 统一多模态多任务 CAD 模型与智能体
      解决的问题: 在单一框架中处理文本、图像、草图和点云，用于重建、生成和 CAD 问答，并可选通过澄清回路处理模糊提示。
      尚未覆盖: 跨任务迁移证据、模态转换脆弱性、交互开销，以及统一模型在匹配训练与评估下能否达到专用模型精度。
    共识:
    - 可编辑参数化 CAD 程序（尤其 B-rep 或 CadQuery 脚本）已成为主要目标表示，而非仅输出网格或点云。
    - 评估越来越多地结合几何保真度、可执行性或有效性以及设计意图或工程准则，但模型排序会随指标变化。
    - LLM、VLM 或基于变换器的程序合成是文本到 CAD、网格到 CAD 和 CAD 问答的共享技术底座。
    - 可见证据常报告显著改进，但缺少详细局限或工件链接，因此可复现性和失败边界仍不明确。
    分歧:
    - 核心问题表述在文本到 CAD 生成、网格到 CAD 重建和多模态多任务统一之间存在差异。
    - 监督与推理方式在监督微调/强化学习、混合几何优化、主动澄清加代码合成之间不同。
    - 评估目标在几何保真度/可执行性、可制造性/功能性/可装配性以及广泛多任务精度之间不同。
    - 交互模式在单轮生成与主动澄清之间不同，隐含了对可接受交互开销的不同判断。
    - 统一模型与专用模型不同：专用模型在理想化输入下可能更强，统一模型覆盖更广但在模态转换下可能更脆弱。
    开放问题:
    - 哪些表示和目标设计能跨可见高排序论文所用的特定基准族和 CAD 程序格式迁移？
    - 当几何保真度、可执行性和工程准则导致模型排序冲突时，应如何加权或重新设计指标？
    - 报告中的改进有多少来自学习模型本身，而不是几何反馈、规划/检查回路或评估脚手架？
    - 在复杂几何、噪声或模态转换以及模糊提示下的失败边界是什么，应如何测量？
    - 统一多模态 CAD 训练能否在异构 CAD 任务间泛化而不损失专用重建或生成精度？
