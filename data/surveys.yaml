  related_work_outline_zh:
  - 主流方向：现有证据以可执行CAD程序生成为核心，评估体系成为主要推动力，而非孤立形式理论。
  - 研究共性：将自然语言、图像或三维输入映射到参数化CAD或可编辑B-Rep输出，并用执行、几何或设计意图检查验证。
  - 关键差异：表示与监督在CadQuery脚本生成、B-Rep基元接地、可微分参数曲面和状态空间序列建模之间不同；评测目标也涵盖几何保真度、可制造性与模糊鲁棒性。
  - 趋势演进：年份跨度较广，但高排名证据集中在2026年，显示当前前沿偏向多模态、智能体和工程感知的CAD评测。
  - 开放问题：基准指标是否预测真实设计质量、模型能否泛化到未见零件族、形式表示假设如何解释失败级联。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven CAD evaluation
      what_it_solves: Controlled comparison across input modalities, geometric complexity,
        task types, and engineering criteria for CAD program generation.
      what_remains_open: Generalization to unseen part families and fine-grained engineering
        intent remain weakly covered; several papers report limited out-of-distribution
        performance.
    - line: Grounded programmatic CAD generation via LLMs
      what_it_solves: Converting text prompts into executable CAD scripts while aligning
        topology and parameter choices to reduce invalidity and ambiguity.
      what_remains_open: Robustness under modality shift and complex operations such
        as sweeps and lofts is unresolved; formal conditions for parameter grounding
        are not established.
    - line: Direct editable B-Rep and parametric-surface generation
      what_it_solves: Learning editable boundary representations with weak point-level
        supervision or long sequence modeling, avoiding CAD-specific annotations.
      what_remains_open: Evidence for validity under engineering constraints, manufacturability,
        and real industrial complexity is missing or narrow.
    - line: Agentic specification clarification
      what_it_solves: Auditing ambiguous prompts and resolving missing design constraints
        before CAD code synthesis.
      what_remains_open: The interaction overhead and coverage of clarification for
        open-ended or multi-part assemblies are not fully measured.
    consensus:
    - Executable CAD code is not sufficient; outputs are increasingly checked through
      geometric validity or design-intent alignment.
    - Parametric or structural grounding improves fidelity compared with free-form
      code generation, as shown by topology alignment and parameter grounding approaches.
    - Current models degrade when complexity rises, modalities shift, or unseen part
      families appear.
    disagreements:
    - 'Representation differs: some lines use CadQuery scripts, some ground B-Rep
      primitives, some use differentiable Bézier surfaces, and some model latent parametric
      sequences.'
    - 'Supervision differs: point-level, text-to-code, reinforcement learning, and
      agentic fine-tuning are used under different annotation assumptions.'
    - 'Evaluation target differs: geometric fidelity, executability, code compactness,
      manufacturability, functionality, and assemblability are prioritized unevenly.'
    - 'Interaction mode differs: one line is one-shot generation, another interjects
      clarification before synthesis.'
    open_questions:
    - Which benchmark metric best predicts engineering-ready CAD, and what is lost
      when relying on a VLM judge?
    - What causes failure cascades from executable code to valid geometry to design-intent
      alignment?
    - Can text-to-CAD models generalize to unseen part families without sacrificing
      complex operations such as sweeps and lofts?
    - Do representation choices such as parametric patches or state-space latent sequences
      provide guarantees under real manufacturing constraints?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准驱动的CAD评估
      解决的问题: 在输入模态、几何复杂度、任务类型和工程标准之间提供受控比较，以衡量CAD程序生成能力。
      尚未覆盖: 对未见零件族的泛化以及细粒度工程意图覆盖不足；部分证据显示分布外性能仍然受限。
    - 路线: 基于大语言模型的接地式参数化CAD程序生成
      解决的问题: 将文本提示转换为可执行CAD脚本，并通过拓扑与参数对齐减少无效输出和模糊性。
      尚未覆盖: 模态偏移下以及扫掠、放样等复杂操作的鲁棒性未解决；参数接地的形式条件尚未建立。
    - 路线: 直接可编辑B-Rep与参数曲面生成
      解决的问题: 在点级弱监督或长序列建模下学习可编辑边界表示，减少对CAD标注的依赖。
      尚未覆盖: 在工程约束、可制造性和真实工业复杂度下的有效性证据仍较窄或缺失。
    - 路线: 智能体式规格澄清
      解决的问题: 在CAD代码合成前审核模糊提示并解决缺失设计约束。
      尚未覆盖: 开放设计或多部件装配下的交互开销与澄清覆盖率尚未充分测量。
    共识:
    - 可执行CAD代码不足以单独作为成功标准；输出越来越多通过几何有效性或设计意图对齐来检查。
    - 参数化或结构化接地相比自由代码生成更能提升保真度，例如拓扑对齐和参数接地策略。
    - 当前模型在复杂度升高、模态偏移或未见零件族下普遍退化。
    分歧:
    - 表示方式不同：有的使用CadQuery脚本，有的接地B-Rep基元，有的使用可微分Bézier曲面，还有的建模参数序列潜在表示。
    - 监督信号不同：点级监督、文本到代码、强化学习和智能体微调基于不同标注假设。
    - 评测目标不同：几何保真度、可执行性、程序紧凑性、可制造性、功能性与可装配性被不同侧重。
    - 交互模式不同：一种是单轮生成，另一种在合成前主动澄清。
    开放问题:
    - 哪个基准指标最能预测工程就绪的CAD，依赖VLM评判器会损失什么？
    - 什么原因导致从可执行代码到有效几何再到设计意图对齐的失败级联？
    - 文本到CAD模型能否泛化到未见零件族，同时不牺牲扫掠和放样等复杂操作？
    - 参数曲面或状态空间潜在序列等表示选择，是否能在真实制造约束下提供保证？
