  literature_review:
    line_of_work_matrix:
    - line: Multimodal benchmark and evaluation stacks for CAD program generation
      what_it_solves: provides comparable evaluation across input modalities and metrics
        for executable or parametric CAD output
      what_remains_open: whether automated and VLM judging aligns with engineering
        practice outside benchmark distributions
    - line: LLM-driven text-to-CAD and agentic specification pipelines
      what_it_solves: translates natural language specifications into executable parametric
        CAD programs, with grounding or clarification to improve validity
      what_remains_open: coverage of real-world design prompts, complex assemblies,
        and robustness to ambiguous or multi-constraint requirements
    - line: Mesh and reverse-engineering reconstruction to parametric CAD
      what_it_solves: recovers editable CAD construction sequences or programs from
        3D geometry via optimization or stepwise fitting
      what_remains_open: scaling to complex geometry, modality shifts, and reducing
        invalid outputs outside benchmarked families
    - line: Unified multi-task multi-modal CAD systems
      what_it_solves: handles heterogeneous CAD tasks, such as reconstruction, generation,
        and question answering, in a single end-to-end model
      what_remains_open: generalization beyond the benchmark's task and modality mix
