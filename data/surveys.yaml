  related_work_outline:
  - 'Mainstream direction: CAD generation and reconstruction are centered on executable
    parametric CAD programs, with LLM-based text-to-CAD and geometry-to-CAD reverse
    engineering as dominant sub-directions; unified benchmarks and multi-modal evaluation
    are emerging.'
  - 'Shared research pattern: Methods align a symbolic or neural representation with
    parametric CAD structure, such as scripts, construction sequences, or primitive
    grounding, and optimize geometric validity, executability, or design intent rather
    than only mesh similarity.'
  - 'Key differences: They differ in input modality, generation route, supervision
    signal, and evaluation target; some use LLM scripting, hybrid iterative optimization,
    or unified multimodal models, while evaluation ranges from geometry to engineering
    criteria.'
  - 'Trend evolution: The available top evidence is concentrated in 2026, so the observable
    trend is a current-frontier move toward LLM-driven CAD programs, benchmark-driven
    evaluation, and agentic or multimodal generalization rather than a long historical
    arc.'
  - 'Open questions: How well benchmark metrics align with engineering usability,
    whether gains transfer beyond reported datasets and prompt distributions, and
    whether specialized models remain preferable under noisy or shifted modalities.'
  related_work_outline_zh:
  - 主流方向：CAD生成与重建聚焦于可执行参数化CAD程序，基于LLM的文本到CAD和几何到CAD逆向工程成为主要子方向，统一基准与多模态评估正在兴起。
  - 研究共性：方法将符号或神经表示与参数化CAD结构对齐，如脚本、构建序列、基元接地，并以几何有效性、可执行性或设计意图为优化目标，而非仅追求网格相似度。
  - 关键差异：输入模态、生成路线、监督信号和评估目标不同；部分使用LLM脚本生成，部分使用混合迭代优化或统一多模态模型，评测范围从几何到工程标准各异。
  - 趋势演进：可见高证据集中在2026年，当前前沿趋势是向LLM驱动的CAD程序、基准驱动评估以及智能体化或多模态泛化演进，尚不能推断长期历史轨迹。
  - 开放问题：基准指标与工程可用性的对齐程度；收益能否迁移到报告数据集和提示分布之外；在噪声或模态偏移下专用模型是否仍更优。
  literature_review:
    line_of_work_matrix:
    - line: Unified multi-modal CAD benchmarks and evaluation protocols
      what_it_solves: Creates controlled comparisons across text, image, mesh, and
        point-cloud inputs and CAD program outputs, separating executability, geometric
        fidelity, and engineering intent.
      what_remains_open: Whether benchmark metrics align with downstream engineering
        usability and whether metric-dependent rankings reflect model limitations
        or evaluation choices.
    - line: LLM-driven text-to-CAD program generation with geometric grounding
      what_it_solves: Converts natural-language design intent into executable parametric
        scripts and grounds textual or structural references to B-Rep primitives or
        construction trajectories.
      what_remains_open: Generalization beyond curated prompt and dataset distributions,
        and independent evidence that high-fidelity outputs are not largely inherited
        from the base LLM or dataset.
    - line: Geometry-to-CAD reverse engineering via parametric optimization
      what_it_solves: Recovers editable parametric operation sequences from meshes
        or point clouds by incremental fitting, validation, and feature-level construction.
      what_remains_open: Robustness under noisy or realistic modality shifts and complex
        geometry, and whether IoU or Chamfer gains translate into valid, editable
        CAD programs.
    - line: Universal multi-modal multi-task CAD models
      what_it_solves: Handles reconstruction, generation, and CAD question answering
        in a single model by consuming multiple modalities end-to-end.
      what_remains_open: Whether unified models provide gains independent of training
        data and evaluation scope, or mainly simplify deployment.
    - line: Agentic or interactive specification clarification for CAD generation
      what_it_solves: Reduces ambiguous text-to-CAD failures by auditing prompts and
        asking targeted clarification questions before code synthesis.
      what_remains_open: How much improvement comes from the clarification policy
        versus the coding model and curated fine-tuning set; interaction cost at scale
        is not yet bounded.
    consensus:
    - Parametric CAD programs are the preferred output representation because they
      preserve editability, compactness, and manufacturing-related structure compared
      with raw meshes.
    - Research is shifting toward multi-modal and multi-metric evaluation that checks
      geometric fidelity, executability or validity, and design-intent or engineering
      criteria.
    - LLM-based or sequence-based CAD generators are usually coupled to a grounding,
      alignment, or optimization stage that enforces structural or geometric consistency.
    - Specialized CAD methods can outperform general visual-language models on idealized
      inputs, but reported robustness under modality shift and geometric complexity
      remains uneven.
    disagreements:
    - 'Representation choices differ: some methods generate textual or executable
      scripts, while others directly fit parametric operations or construction sequences
      from geometry.'
    - 'Supervision signals differ: supervised fine-tuning plus reinforcement learning,
      structure-aligned trajectory matching with ranking-based parameter grounding,
      and proactive clarification fine-tuning are all present.'
    - 'Evaluation targets differ: some focus on geometric fidelity and program validity,
      while others assess manufacturability, functionality, and assemblability through
      rubric-based or VLM judges.'
    - 'Interaction mode differs: one-shot multimodal generation versus agentic clarification
      before generation.'
    - 'Deployment scope differs: task-specific mesh-to-CAD and text-to-CAD models
      versus a universal multi-task multimodal model.'
    open_questions:
    - Do benchmark metrics such as IoU, Chamfer distance, executability, and VLM-based
      design-intent scores correlate with real-world engineering usability?
    - Can LLM-based CAD generators retain accuracy when prompts, input modalities,
      and geometric complexity shift beyond curated benchmarks?
    - What portion of observed gains comes from the proposed representation or policy,
      rather than from base LLM capability, dataset curation, evaluation protocol,
      or optimizer choices?
    - Under what conditions should a unified multi-task CAD model replace specialized
      models, given reported brittleness and metric-dependent rankings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD基准与评估协议
      解决的问题: 在文本、图像、网格和点云输入与CAD程序输出之间建立受控比较，区分可执行性、几何保真度和工程意图。
      尚未覆盖: 基准指标是否与下游工程可用性一致，以及指标间排名变化应归因于模型能力还是评估选择。
    - 路线: 基于LLM并带几何接地的文本到CAD程序生成
      解决的问题: 将自然语言设计意图转换为可执行参数化脚本，并将文本或结构引用对齐到B-Rep基元或构建轨迹。
      尚未覆盖: 能否泛化到精心整理的数据和提示分布之外；高保真输出是否部分继承自底层LLM或数据集仍缺乏独立证据。
    - 路线: 通过参数化优化的几何到CAD逆向工程
      解决的问题: 从网格或点云中通过增量拟合、验证和特征级构建恢复可编辑参数化操作序列。
      尚未覆盖: 在噪声或真实模态偏移和复杂几何下的鲁棒性，以及IoU或Chamfer增益能否转化为有效且可编辑的CAD程序。
    - 路线: 通用多模态多任务CAD模型
      解决的问题: 通过接收多种模态并以端到端方式处理重建、生成和CAD问答，减少异构任务系统。
      尚未覆盖: 统一模型是否真正带来超越训练数据和评估范围的方法增益，或只是简化部署。
    - 路线: 面向CAD生成的智能体化或交互式需求澄清
      解决的问题: 在代码合成前审核提示并提出有针对性的澄清问题，减少模糊文本到CAD的失败。
      尚未覆盖: 改进有多少来自澄清策略而非编码模型和整理后的微调数据；交互成本尚未受控验证。
    共识:
    - 参数化CAD程序成为主流输出表示，因为相比网格能更好保留可编辑性、紧凑性和面向制造的结构。
    - 研究共同转向多模态、多指标评估，同时检查几何保真度、可执行性或有效性，以及设计意图或工程标准。
    - 基于LLM或序列的生成通常耦合到接地、对齐或优化阶段，以增强结构或几何一致性。
    - 在理想化输入下，专用CAD方法可优于通用视觉语言模型，但模态偏移和复杂度下的鲁棒性仍不一致。
    分歧:
    - 表示选择不同：有些方法生成文本化或可执行脚本，另一些则直接拟合参数化操作或从几何构建序列。
    - 监督信号不同：样本分别使用监督微调加强化学习、结构对齐轨迹匹配加基于排序的参数接地、以及主动澄清微调。
    - 评测目标不同：有的比较几何保真度和程序有效性，有的通过评分标准或VLM法官评估可制造性、功能性和可装配性。
    - 交互模式不同：一次式多模态生成与生成前智能体澄清形成对比。
    - 部署范围不同：任务专用的网格到CAD和文本到CAD模型与通用多任务多模态模型并存。
    开放问题:
    - 基准指标（如IoU、Chamfer距离、可执行性和基于VLM的设计意图评分）是否与真实工程可用性相关？
    - 当提示、输入模态和几何复杂度超出精心整理的基准分布时，基于LLM的CAD生成是否仍保持准确？
    - 观测到的收益中有多少来自提出表示或策略，而非来自基础LLM、数据整理、评估协议或优化器选择？
    - 在何种条件下统一多任务CAD模型应取代专用模型，尤其是考虑到已报告的脆弱性和指标依赖的排名变化？
