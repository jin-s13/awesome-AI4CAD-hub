  - 'Shared research pattern: Work treats CAD as structured programs or construction
    sequences, decomposes generation into reasoning, grounding, and execution, and
    evaluates specialized versus general models on aggregated benchmarks.'
  - 'Key differences: Methods differ in input modality, CAD representation, supervision
    signal, and evaluation target, spanning geometric fidelity, executability, and
    manufacturability/assemblability criteria.'
  - 'Trend evolution: Available high-ranked evidence is from 2026, so the visible
    trend is current-frontier convergence on unified benchmarks, LLM-driven text-to-CAD,
    optimization-based reverse engineering, and proactive clarification.'
  - 'Open questions: Cross-modality and complexity transfer, isolation of method contribution
    from curated data and benchmarks, missing limitation evidence, and the gap from
    executable code to engineering-ready CAD remain unresolved.'
  related_work_outline_zh:
  - 主流方向：当前前沿集中在参数化CAD程序生成与逆向工程，多模态基准和LLM/智能体流水线主导高可见度工作。
  - 研究共性：将CAD视为结构化程序/构建序列，分解为推理、接地与执行，并通过多模态聚合基准比较专用与通用模型。
  - 关键差异：输入模态、CAD表示、监督信号和评测目标不同，从几何保真度到可制造性/可装配性标准不等。
  - 趋势演进：证据中高影响力工作集中在2026年，统一基准、LLM驱动文本到CAD、优化式逆向工程与主动澄清形成当前前沿汇合。
  - 开放问题：跨模态与复杂度迁移、方法贡献与数据/基准贡献的隔离、局限信息缺失、从可执行代码到工程就绪CAD的差距。
  literature_review:
    line_of_work_matrix:
    - line: Multimodal CAD benchmark and evaluation-protocol design
      what_it_solves: Controlled comparison across input modalities, dataset families,
        metrics, and failure modes for CAD program generation and reconstruction.
      what_remains_open: Rankings change across metrics and modalities; engineering-intent
        criteria are not yet standardized; artifact and reproducibility evidence is
        incomplete.
    - line: Text-to-CAD program generation through LLMs and structured grounding
      what_it_solves: Turning text prompts into executable parametric CAD programs
        with better structural consistency and parameter accuracy.
      what_remains_open: Limitation fields are blank; training-data influence, real-world
        coverage, and robustness boundaries are not fully verified.
    - line: Optimization-based and stepwise reverse engineering from mesh/image inputs
      what_it_solves: Recovering editable parametric CAD construction sequences while
        enforcing geometric and validity constraints.
      what_remains_open: Transfer to complex engineering assemblies and metrics beyond
        geometric fidelity and invalid ratio is unresolved.
    - line: Proactive clarification and agentic interaction for ambiguous text-to-CAD
      what_it_solves: Specification disambiguation before code synthesis, reducing
        invalid outputs and geometric error.
      what_remains_open: Interaction cost, complex-assembly scalability, and isolation
        of agent behavior from curated fine-tuning data remain open.
    - line: Unified multi-modal multi-task CAD modeling
      what_it_solves: Single-framework processing of point, text, image, and sketch
        inputs for reconstruction, generation, and CAD question answering.
      what_remains_open: Specialized-task fidelity and distribution-shift robustness
        of universal models are not yet evidenced.
    - line: Engineering-oriented manufacturability, functionality, and assemblability
        evaluation
      what_it_solves: Assessing CAD beyond geometry and executability against manufacturing
        and assembly readiness.
      what_remains_open: Automatic judge reliability beyond limited validation and
        closing the executable-to-engineering-ready cascade remain open.
    consensus:
    - High-visibility work treats CAD as executable program or parametric sequence
      generation rather than unstructured geometry regression.
    - Evaluation is moving toward multimodal, multi-metric benchmarks that jointly
      report geometric fidelity, executability, and design-intent or engineering criteria.
    - Several methods decompose generation into symbolic reasoning, primitive or parameter
      grounding, and code or operation synthesis instead of one-shot output.
    - Benchmarks separate specialized CAD models from general-purpose multimodal LLMs;
      specialized models can be stronger under idealized inputs, but rankings and
      robustness vary by modality and metric.
    - Invalidity or executability ratios are reported alongside geometric scores,
      showing dual concern for syntactic validity and geometric quality.
    disagreements:
    - 'Representation: CadQuery/script generation, B-Rep primitive grounding, construction-tree
      or stepwise operations, and unified multimodal tokenization.'
    - 'Supervision: supervised fine-tuning plus reinforcement learning, ranking-based
      structure/parameter supervision, hybrid geometric optimization, and agent-generated
      clarification trajectories.'
    - 'Evaluation target: Chamfer/IoU geometric fidelity, executability or invalid
      ratio, or manufacturability/functionality/assemblability rubrics.'
    - 'Task scope: some approaches unify text/image/point-to-CAD and CAD question
      answering in one model, while others specialize on one input interface.'
    - 'Interaction mode: proactive clarification agents intervene before synthesis,
      while non-agent pipelines assume complete inputs and directly optimize.'
    open_questions:
    - Which method contributions transfer across reported benchmarks when input modality,
      object complexity, and metric weighting shift?
    - How much of reported gain comes from curated datasets, benchmark construction,
      or base-model capability rather than the proposed representation or objective?
    - What is the limiting failure in the cascade from executable code to valid geometry
      to engineering-ready design, and how should it be measured?
    - Do unified multi-task CAD models retain specialized reconstruction fidelity
      and robustness under distribution shift?
    - How reliable are automatic VLM-judge rubrics for engineering criteria compared
      with human review outside limited validation sets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态CAD基准与评估协议设计
      解决的问题: 在输入模态、数据集族、指标和失败模式之间对CAD程序生成与重建进行受控比较。
      尚未覆盖: 排序随模态和指标变化；工程意图标准尚未统一；工件与复现证据不完整。
    - 路线: 基于LLM与结构化接地的文本到CAD程序生成
      解决的问题: 将文本提示转换为可执行参数化CAD程序，并提升结构一致性和参数准确性。
      尚未覆盖: 局限字段多为空白；训练数据影响、真实世界覆盖和鲁棒性边界未充分验证。
    - 路线: 面向网格/图像输入的优化式与逐步式逆向工程
      解决的问题: 在几何和有效性约束下恢复可编辑参数化CAD构建序列。
      尚未覆盖: 向复杂工程装配体的迁移，以及几何保真度和无效率之外的指标仍不明确。
    - 路线: 面向模糊文本到CAD的主动澄清与智能体交互
      解决的问题: 在代码合成前消解规格歧义，降低无效输出和几何误差。
      尚未覆盖: 交互成本、复杂装配扩展性，以及智能体行为与策划微调数据贡献的隔离仍然开放。
    - 路线: 统一多模态多任务CAD模型
      解决的问题: 在单一框架中处理点云、文本、图像和草图输入，完成重建、生成和CAD问答。
      尚未覆盖: 通用模型在专用任务上的保真度与分布偏移鲁棒性尚无充分证据。
    - 路线: 面向可制造性、功能性和可装配性的工程化评估
      解决的问题: 将CAD评测从几何和可执行性拓展到制造与装配就绪度。
      尚未覆盖: 自动评判器在有限验证外的可靠性，以及从可执行代码到工程就绪设计的差距仍未解决。
    共识:
    - 高可见度工作普遍将CAD视为可执行程序或参数化序列生成，而非仅做非结构化几何回归。
    - 评测正在转向多模态、多指标基准，同时报告几何保真度、可执行性以及设计意图或工程准则。
    - 多类方法将生成分解为符号推理、基元或参数接地、代码或操作合成，而非一次性输出。
    - 基准区分专用CAD模型与通用多模态LLM；在理想化输入下专用模型可更强，但排序和鲁棒性随模态与指标变化。
    - 无效比率或可执行性指标与几何评分联合报告，体现对语法有效性和几何质量的双重关注。
    分歧:
    - 表示不同：CadQuery/脚本生成、B-Rep基元接地、构建树或逐步操作、统一多模态token化。
    - 监督信号不同：监督微调加RL、基于排序的结构/参数监督、混合几何优化、智能体生成澄清轨迹。
    - 评测目标不同：Chamfer/IoU几何保真、可执行性或无效率，或可制造性/功能性/可装配性评分。
    - 任务范围不同：部分方法统一处理文本/图像/点云到CAD与CAD问答，另一些只聚焦单一交互界面。
    - 交互模式不同：主动澄清智能体在合成前介入，非智能体管道假设输入完整并直接优化。
    开放问题:
    - 当输入模态、对象复杂度和指标权重变化时，哪些方法贡献能迁移到已报告基准之外？
    - 报告提升中有多少来自策划数据、基准构造或基础模型能力，而不是提出的表示或目标设计？
    - 从可执行代码到有效几何再到工程就绪设计，级联中的限制环节是什么，应如何测量？
    - 统一多任务CAD模型能否在分布偏移下保持专用重建保真度和鲁棒性？
    - 自动VLM评判器/评分标准在有限人工验证外的工程准则可靠性如何？
