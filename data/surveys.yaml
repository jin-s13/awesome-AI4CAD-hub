  - 'Mainstream direction: Establishing multimodal benchmarks and evaluation protocols
    for AI-assisted CAD program generation, with a focus on executable B-Rep representations
    and text/image-to-CAD pipelines.'
  - 'Shared research pattern: All papers adopt parametric CAD programs (mainly CadQuery)
    as the output representation and evaluate geometric fidelity, executability, and
    structural correctness, revealing a consistent failure cascade from code generation
    to valid engineering geometry.'
  - 'Key differences: Work differs in evaluation scope (geometric metrics vs. engineering
    intent), input modality handling, training supervision (point-level vs. program-level),
    and incorporation of interactive clarification or progressive reasoning.'
  - 'Trend evolution: The topic is concentrated at the 2026 frontier, shifting from
    single-task mesh-to-CAD models toward unified multimodal benchmarks and LLM-driven
    agents that assess beyond geometry to include manufacturability and functionality.'
  - 'Open questions: Whether benchmarks predict real-world CAD success, how to achieve
    generalization to unseen part families, and how to reliably automate the evaluation
    of fine-grained design intent and engineering constraints.'
  related_work_outline_zh:
  - 主流方向：建立面向AI辅助CAD程序生成的多模态基准与评估协议，以可执行B-Rep表示和文本/图像到CAD管道为核心。
  - 研究共性：各论文均采用参数化CAD程序（以CadQuery为主）作为输出表示，并评估几何保真度、可执行性和结构正确性，一致揭示了从代码生成到有效工程几何的失败级联。
  - 关键差异：工作差异体现在评估范围（几何指标vs.工程意图）、输入模态处理、训练监督信号（点级vs.程序级）、以及是否引入交互式澄清或渐进式推理。
  - 趋势演进：该主题集中在2026年前沿，正从单任务的网格到CAD模型转向统一的多模态基准和LLM驱动智能体，评估超出几何而涵盖可制造性和功能性。
  - 开放问题：基准能否预测真实CAD设计成功，如何实现对未见零件族的泛化，以及如何可靠地自动化评估细粒度设计意图和工程约束。
  literature_review:
    line_of_work_matrix:
    - line: Multimodal CAD benchmarks
      what_it_solves: Provides unified evaluation frameworks covering diverse input
        modalities, metrics, and industrial complexity, enabling systematic comparison
        of CAD generation models.
      what_remains_open: Whether these benchmarks capture real engineering design
        success; automated judges (e.g., VLM-based) for design intent remain unvalidated
        for fine-grained manufacturability and functionality.
    - line: Text-to-CAD generation with LLMs
      what_it_solves: Generates editable parametric CAD programs from natural language
        descriptions, improving structural consistency, parameter accuracy, and robustness
        to ambiguity via hierarchical reasoning or proactive clarification.
      what_remains_open: Generalization to unseen part families is limited; deep understanding
        of design intent and reliable generation of engineering-grade constrained
        assemblies remain unsolved.
    - line: Self-supervised and differentiable CAD representations
      what_it_solves: Enables learning from unannotated 3D data or handling long parametric
        sequences using novel architectures (state-space models) and differentiable
        parametric surfaces.
      what_remains_open: Evaluation is mostly on geometric fidelity; integration with
        multimodal benchmarks and real-world engineering constraints is not yet demonstrated.
    consensus:
    - Parametric CAD programs, especially B-Rep-based CadQuery scripts, are the preferred
      output representation for AI-assisted design.
    - Evaluation must go beyond geometric similarity to include executability, structural
      validity, and adherence to design specifications.
    - 'Current models exhibit a failure cascade: even when code is syntactically correct,
      the resulting geometry often fails to meet engineering intent, especially for
      complex parts.'
    - Specialized CAD models outperform general-purpose VLMs under ideal input conditions,
      but are brittle under modality shift.
    disagreements:
    - 'Evaluation targets differ: some benchmarks prioritize geometric fidelity and
      compactness, while others introduce downstream criteria like manufacturability
      and assemblability.'
    - 'Supervision strategy varies: models like DreamCAD use point-level supervision
      on unannotated data, whereas LLM-based methods rely on curated text-code pairs
      with supervised fine-tuning or RL.'
    - 'Interaction mode: ProCAD incorporates proactive clarification to resolve ambiguity,
      while other methods assume a single-turn generation from a complete prompt.'
    - 'Representation approach: HierCAD uses hierarchical decomposition of construction
      trees, while DreamCAD uses continuous parametric patches, and Mamba-CAD explores
      a latent-space GAN with state-space models.'
    open_questions:
    - How can we validate that benchmark metrics correlate with practical CAD engineering
      success, especially for fine-grained design intent?
    - What is the minimal additional supervision or interaction needed to achieve
      reliable generalization to unseen part families?
    - Can automated judges based on VLMs be trusted to evaluate manufacturability
      and functional constraints, or is human evaluation always required?
