  related_work_outline_zh:
  - 主流方向：从专用网格到CAD模型转向基于多模态LLM的程序化CAD生成，同时建立全面的基准，不仅评估几何保真度，还评估可执行性、设计意图和工程可行性。
  - 研究共性：将CAD生成形式化为参数化表示（B-Rep、CadQuery）上的序列到序列或程序合成任务，然后在大规模CAD数据集上应用监督微调、强化学习或自监督预训练。
  - 关键差异：输出表示（CadQuery脚本 vs. B-Rep基元 vs. 参数化贝塞尔曲面）、评估重点（几何相似性 vs. 可制造性 vs. 设计对齐）、训练范式（监督
