  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal and multi-task CAD platforms and benchmarks
      what_it_solves: Evaluating heterogeneous CAD tasks across text, image, sketch,
        mesh, and point cloud inputs, with executable program generation and geometric
        or engineering checks.
      what_remains_open: Generalization to external CAD tools and deployment settings,
        independent reproduction, and avoiding metric or judge failure cascades.
    - line: Agentic and grounded text-to-CAD program generation
      what_it_solves: Turning natural-language design intent into executable parametric
        CAD scripts through hierarchical structure alignment, parameter grounding,
        and proactive clarification.
      what_remains_open: Interaction overhead versus output quality, coverage of real-world
        CAD corpora, and robustness beyond curated prompts.
    - line: Geometry-to-CAD reconstruction and reverse engineering pipelines
      what_it_solves: Recovering editable parametric CAD construction sequences from
        meshes or point clouds through incremental optimization or stepwise construction.
      what_remains_open: Scaling to complex assemblies, noisy or shifted modalities,
        and validity beyond geometric metrics.
    - line: Engineering-readiness evaluation and design-intent alignment
      what_it_solves: Assessing manufacturability, functionality, and assemblability
        beyond geometric similarity.
      what_remains_open: VLM-judge reliability, limited human validation, and missing
        lifecycle or deployment evidence.
    consensus:
    - Executable parametric CAD programs are favored as an intermediate representation
      because they support editability and validity checking.
    - Evaluation is moving beyond shape similarity toward geometric fidelity, executability,
      program compactness, and engineering intent.
    - Recent systems increasingly use LLMs, VLMs, or learned agents to generate structured
      CAD code with grounding or feedback loops.
    disagreements:
    - 'Evaluation target differs: some work prioritizes geometric reconstruction accuracy,
      while others target design-intent alignment, manufacturability, functionality,
      and assemblability.'
    - 'Input supervision differs: text, images, sketches, point clouds, and meshes
      are treated as separate modalities in some systems and unified in others.'
    - 'Interaction mode differs: some systems generate in a single pass, while others
      use proactive clarification agents or stepwise iterative reconstruction.'
    - 'Optimization and supervision differ: approaches include supervised fine-tuning
      with reinforcement learning, ranking-based parameter grounding, IoU-driven optimization,
      and agentic supervised fine-tuning.'
    open_questions:
    - Can unified models maintain consistent rankings when metrics span geometric
      fidelity, executability, compactness, and engineering readiness?
    - How well do these pipelines transfer to real CAD tools, hardware, or user-specific
      constraints beyond the benchmark families?
    - How much interaction budget should clarification agents use before overhead
      outweighs the reduction in generation error?
    - How reliable are VLM judges for manufacturability and functionality without
      broader human validation?
    - Which assumptions in mesh-to-CAD reconstruction break under noisy, partial,
      or cross-domain geometry?
    - What is the independent reproduction status across teams, datasets, and infrastructures
      when several papers lack visible limitations or OpenAlex-derived citation evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态多任务CAD平台与基准
      解决的问题: 覆盖文本、图像、草图、网格和点云输入，评估可执行程序生成及几何或工程检查。
      尚未覆盖: 外部CAD工具与部署环境泛化、独立复现、避免指标或评判器失效级联。
    - 路线: 智能体与接地式文本到CAD程序生成
      解决的问题: 将自然语言设计意图转为可执行参数化CAD脚本，结合层次结构对齐、参数接地与主动澄清。
      尚未覆盖: 交互开销与输出质量权衡、真实CAD语料覆盖、对非策划提示的鲁棒性。
    - 路线: 几何到CAD重建与逆向工程流水线
      解决的问题: 通过增量优化或逐步构建，从网格或点云恢复可编辑参数化CAD构建序列。
      尚未覆盖: 复杂装配体扩展、噪声与跨模态转换、几何指标以外的有效性。
    - 路线: 面向工程就绪的设计意图对齐评测
      解决的问题: 评估可制造性、功能性、可装配性，超越几何相似度。
      尚未覆盖: VLM评判可靠性、人工验证有限、生命周期与部署证据缺失。
    共识:
    - 可执行参数化CAD程序作为中间表示受到青睐，因为它支持可编辑性和有效性检查。
    - 评估正从单纯形状相似度扩展到几何保真、可执行性、程序紧凑性及工程意图。
    - 越来越多系统采用LLM、VLM或学习型智能体生成结构化CAD代码，并引入接地或反馈循环。
    分歧:
    - 评测目标不同：部分关注几何重构精度，部分关注设计意图对齐、可制造性、功能性和可装配性。
    - 输入模态不同：文本、图像、草图、点云和网格在不同系统中被分别处理或统一建模。
    - 交互模式不同：有单次生成，也有主动澄清或逐步迭代重建。
    - 优化与监督不同：包括监督微调加强化学习、排序式参数接地、IoU驱动优化和智能体监督微调。
    开放问题:
    - 统一模型能否在几何保真、可执行性、紧凑性和工程就绪度等多指标间保持排名一致？
    - 这些流水线在真实CAD工具、硬件和用户约束下能否泛化？
    - 主动澄清的交互预算多大时，其开销会超过生成错误减少带来的收益？
    - VLM评判器在缺乏更广泛人工验证时对可制造性/功能性的判断有多可靠？
    - 网格到CAD重建在噪声、部分或跨域几何输入下会失效于哪些假设？
    - 当若干论文缺少可见局限性或OpenAlex引用证据时，跨团队、数据集和基础设施的独立复现状态如何？
