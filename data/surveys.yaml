    - 'Supervision differs: supervised fine-tuning with reinforcement learning, ranking-based
      parameter grounding with perturbations, or agent-generated clarification trajectories.'
    - 'Evaluation targets differ: geometric fidelity and invalid ratio versus design-intent
      rubrics such as functionality, manufacturability, and assemblability.'
    - 'Interaction mode differs: single-pass generation versus proactive clarification
      before drawing, creating trade-offs in latency, user burden, and robustness.'
    open_questions:
