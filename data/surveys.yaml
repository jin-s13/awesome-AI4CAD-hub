    are absent.'
  related_work_outline_zh:
  - 主流方向：2026年前沿集中在从文本、图像、网格和点云生成参数化CAD程序，由LLM/智能体或几何感知模型生成可执行构建序列，并以有效性与几何保真度为主要评测。
  - 研究共性：论文把模糊输入转换为结构化CAD程序或基元操作，将语言/几何对齐到参数化拓扑与参数，并以可执行性、几何相似性或设计意图评分来评测。
  - 关键差异：输入模态与模型族不同；生成策略包括直接LLM代码合成、层次化接地、混合优化、逐步逆向工程和主动澄清；评测重点从几何到可制造性不等；监督来自强化学习、排序损失或几何反馈。
  - 趋势演进：从专用单任务重建走向统一多模态多任务CAD基准与通用模型，并在当前前沿加入面向装配的工程准则和智能体澄清。
  - 开放问题：通用模型能否在模态转换下弥合专用与通用差距？指标应如何平衡有效性、保真度、紧凑性与可制造性？混合或智能体系统中哪些贡献被隔离？代码、数据或局限性缺失仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Parametric program synthesis and multimodal CAD generation
      what_it_solves: Converting text, image, sketch, or point cloud inputs into editable,
        executable CAD programs and grounding language to B-Rep primitives or topology/parameter
        sequences.
      what_remains_open: Cross-modal transfer and robustness under input shift; exact
        attribution to representation, fine-tuning, RL, or agentic prompting; missing
        code, data, and limitation evidence for reproduction.
    - line: Geometry-aware reconstruction and optimization
      what_it_solves: Recovering CAD construction sequences from meshes or images
        through iterative parametric fitting, hybrid optimization, or stepwise geometric
        comparison while preserving editability and validity.
      what_remains_open: Rich operation coverage and complex geometry; separating
        optimization gain from model contribution versus task prior; long-horizon
        and large assembly evidence is limited.
    - line: Benchmark-driven evaluation for CAD methods
      what_it_solves: Controlled evaluation across modalities, geometric complexity,
        validity, and engineering criteria such as manufacturability, functionality,
        and assemblability.
      what_remains_open: Metric stability and whether automated judges align with
        human design intent; model rankings shift across metrics; B-rep and STEP family
        coverage remains partial.
    - line: Interactive and agentic text-to-CAD workflows
      what_it_solves: Resolving ambiguous specifications through targeted clarification
        before code synthesis and reducing invalid outputs while controlling interaction
        overhead.
      what_remains_open: Scaling to multi-part assemblies; transfer of clarification
        policy across base coding models; trade-off between dialogue overhead and
        generation quality is not fully measured.
    consensus:
    - Current methods concentrate on producing parametric CAD programs or construction
      sequences because programmatic output enables editability, compactness, and
      executability.
    - LLM-based program synthesis is becoming a common substrate across text, image,
      sketch, and point inputs, while geometry-specialized models retain advantages
      for idealized mesh reconstruction.
    - Evaluation commonly includes executability/validity and geometric fidelity such
      as IoU or Chamfer distance, but newer work adds engineering intent rubrics;
      model rankings are metric- and modality-sensitive.
    - Missing code, dataset, metric, baseline, and limitation details in the packet
      are verification gaps rather than evidence that methods lack reproducibility.
    disagreements:
    - 'Model and input focus differs: some methods rely on CAD-specialized reconstruction,
      others on general LLM/VLM code generation, and others on a single universal
      multimodal model; evidence suggests specialization helps idealized inputs but
      is brittle under modality shift.'
    - 'Generation strategy differs: direct autoregressive program synthesis, hierarchical
      decomposition with parameter grounding, hybrid optimization, stepwise geometric
      feedback, and proactive clarification place corrective signals at different
      stages.'
    - 'Evaluation target differs: geometric fidelity and executability are central
      in some work, while others foreground manufacturability, functionality, assemblability,
      or multi-task question answering, leading to different conclusions about model
      quality.'
    - 'Supervision and interaction differ: supervised fine-tuning plus RL, ranking-based
      parameter supervision, IoU-driven optimization, and agentic clarification are
      used, so reported gains may mix model, optimization loop, and prompt or agent
      contributions.'
    open_questions:
    - Can a universal model match task-specific reconstruction or generation across
      clean/noisy meshes, single/multi-view, text, and sketches without modality brittleness?
    - How should CAD benchmarks weight geometric fidelity, executability, compactness,
      and engineering criteria such as manufacturability or assemblability, and do
      automated judges align with expert design intent?
    - 'Which component contributes in hybrid optimization, agentic clarification,
      or unified MLLM pipelines: the model, the planner or optimization loop, the
      dataset, or the interaction policy?'
    - What remains uncovered for complex B-Rep assemblies, rich operations, and long-horizon
      design tasks, given current evidence focuses heavily on single-object or benchmark-sample
      generation?
    - Editing and retrieval method evidence is sparse in the bounded packet; the current
      frontier is concentrated on generation, reconstruction, and CAD question answering,
      leaving editing and retrieval-specific contributions unverified.
    - To what extent do absent code, dataset, metric, baseline, and limitation details
      limit reproducibility and cross-method comparison in this topic?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 参数化程序合成与多模态CAD生成
      解决的问题: 将文本、图像、草图和点云输入转换为可编辑、可执行的CAD程序，并将语言或几何接地到B-Rep基元或拓扑/参数序列。
      尚未覆盖: 输入迁移下的跨模态鲁棒性；表示、微调、RL或智能体提示的贡献归属；代码、数据与局限性证据缺失影响复现。
    - 路线: 几何感知重建与优化
      解决的问题: 通过迭代参数拟合、混合优化或逐步几何比较，从网格或图像恢复CAD构建序列，并保持可编辑性和有效性。
      尚未覆盖: 复杂几何和丰富操作扩展；优化收益来自模型贡献还是任务先验；长序列和大规模装配证据有限。
    - 路线: 面向CAD方法的基准评测
      解决的问题: 在多模态、几何复杂度、有效性和可制造性、功能性、可装配性等工程准则上进行受控评测。
      尚未覆盖: 指标稳定性以及自动化评判器是否与人类设计意图一致；不同指标下排名变化；B-rep与STEP家族覆盖仍不完整。
    - 路线: 交互式与智能体文本到CAD工作流
      解决的问题: 在代码合成前通过定向澄清解决模糊规格，减少无效输出并控制交互开销。
      尚未覆盖: 多部件装配扩展；澄清策略在不同基础编码模型上的迁移；对话开销与生成质量之间的权衡尚未充分测量。
    共识:
    - 当前方法集中于生成参数化CAD程序或构建序列，因为程序化输出带来可编辑性、紧凑性和可执行性。
    - LLM程序合成正在成为跨文本、图像、草图和点云输入的共同基础，但几何专用模型在理想化网格重建上仍有优势。
    - 评测普遍包含可执行性/有效性和几何保真度，如IoU或Chamfer距离，较新工作加入工程意图评分；模型排名会随指标和模态变化。
    - 证据包中缺少代码、数据集、指标、基线和局限性细节是验证缺口，不等于方法缺乏可复现性。
    分歧:
    - 模型和输入重点不同：有的依赖CAD专用重建模型，有的依赖通用LLM/VLM代码生成，还有的采用统一多模态模型；证据显示专用模型在理想化输入下更强，但在模态变化下脆弱。
    - 生成策略不同：直接自回归程序合成、层次化分解与参数接地、混合优化、逐步几何反馈和主动澄清，在不同阶段引入纠正信号。
    - 评测目标不同：几何保真度与可执行性在部分工作中为核心，另一些工作强调可制造性、功能性、可装配性或多任务问答，因此对模型质量的结论不同。
    - 监督与交互不同：监督微调加RL、排序式参数监督、IoU驱动优化和智能体澄清并存；报告收益可能混合了模型、优化循环和提示或智能体贡献。
    开放问题:
    - 一个通用模型能否在干净/噪声网格、单/多视图、文本和草图等输入条件下，不出现模态脆性地匹配专用重建或生成方法？
    - CAD基准应如何在几何保真度、可执行性、紧凑性与可制造性/可装配性等工程准则之间加权？自动化评判器能否对齐专家设计意图？
    - 混合优化、主动澄清或统一MLLM流水线中，模型、规划/优化循环、数据集和交互策略各自贡献如何隔离？
    - 当前证据主要集中在单对象或基准样本生成，复杂B-Rep装配、丰富操作和长周期设计任务仍缺少覆盖。
    - 证据包中面向编辑和检索的方法证据较少；当前前沿集中在生成、重建和CAD问答，编辑与检索特定贡献尚待验证。
    - 代码、数据集、指标、基线和局限性细节的缺失在多大程度上限制跨方法复现与比较？
