      尚未覆盖: 对真实扫描、草图和复杂拓扑的泛化；高几何精度是否同时保留下游可编辑性与有效实体语义。
    - 路线: 多模态与代码生成式CAD模型
      解决的问题: 将文本、图像、草图或点云输入映射到可编辑CAD代码或统一多任务CAD输出。
      尚未覆盖: 对合成图像-代码对之外的现实鲁棒性、未见操作，以及制造公差或CAE/CAM约束。
    - 路线: 长序列生成式CAD程序建模
      解决的问题: 用潜在或状态空间生成架构建模参数化CAD序列，以生成更长的有效命令序列。
      尚未覆盖: 更长序列生成是否对应有意义的设计复杂度、参数有效性和下游任务价值；数据集覆盖与操作语义验证不足。
    - 路线: 演化式与合成型CAD数据生成
      解决的问题: 通过VLM引导的迭代编辑和验证创建复杂CadQuery程序，并用增强脚本-几何对训练下游图像到CAD模型。
