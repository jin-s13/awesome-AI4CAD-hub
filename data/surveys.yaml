  related_work_outline:
  - 'Mainstream direction: Benchmark-driven evaluation of multimodal CAD program generation
    and reverse engineering, using shared datasets and metrics across text/image/mesh/point
    inputs; representative examples include CADBench and UniCAD.'
  - 'Shared research pattern: Papers combine executable CAD program outputs with geometric
    fidelity and validity checks, use multimodal conditioning, and report multiple
    metrics because model rankings shift across metrics.'
  - 'Key differences: Evaluation target ranges from geometric fidelity and validity
    to manufacturability, functionality, assemblability, or design-intent alignment;
    scope varies from single-task mesh/text-to-CAD to unified multi-task benchmarks;
    interaction mode and generation mechanism also differ.'
  - 'Trend evolution: The evidence is concentrated in 2026 despite a wider year span;
    the visible frontier moves from geometry-only scoring toward unified, multimodal,
    engineering-relevant benchmarks that expose failure cascades and interaction robustness.'
  - 'Open questions: Whether multi-metric rankings remain stable across implementations
    and compute budgets, how well proxy metrics track engineering decisions, and whether
    empty limitation fields and missing reproduction artifacts leave generalizability
    unverified.'
  related_work_outline_zh:
  - 主流方向：以基准驱动的多模态CAD程序生成与逆向工程评估为主，覆盖文本/图像/网格/点云输入，评估可执行参数化CAD/B-Rep输出；代表如CADBench、UniCAD。
  - 研究共性：论文普遍共享数据集、指标和基线，关注可执行性、几何保真度和程序有效性，采用多模态输入与多指标排序，强调可编辑参数化CAD。
  - 关键差异：评估目标不同，从几何保真度、有效性到可制造性、功能性、可装配性和设计意图；任务范围不同，从单一任务到统一多任务；交互模式与生成机制也不同。
  - 趋势演进：数据年份跨度大，但高证据论文集中在2026，趋势处于当前前沿；基准从几何评分走向统一、多模态、工程相关评估，并暴露失败级联和交互鲁棒性问题。
  - 开放问题：多指标排名在不同实现和算力下是否稳定；代理指标是否对应真实工程决策；局限性与复现材料缺失是否足以验证泛化性。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal CAD benchmark and task design
      what_it_solves: Creates comparable evaluation across text, image, sketch, point
        cloud, and mesh inputs for program generation, reverse engineering, and question
        answering.
      what_remains_open: Whether task distributions cover realistic engineering settings
        and whether rankings transfer across modality shifts and geometric complexity.
    - line: Metric and stress-test design for CAD outputs
      what_it_solves: Separates executable validity, geometric fidelity, and design-intent
        criteria, while stress-testing robustness to ambiguous prompts and complex
        geometry.
      what_remains_open: Alignment between proxy metrics such as IoU, Chamfer distance,
        invalid ratio, or VLM judging and downstream manufacturability, assemblability,
        and user decisions.
    - line: Comparable baselines and reporting for CAD program synthesis
      what_it_solves: Provides shared baselines, multi-metric rankings, and validity
        reporting so that specialized and general models can be audited on the same
        outputs.
      what_remains_open: Whether benchmark conclusions remain stable across implementations
        and compute budgets, and whether missing limitation and artifact details limit
        auditability.
    consensus:
    - CAD benchmarks treat outputs as executable programs and evaluate both program
      validity and resulting geometry.
    - Multimodal conditioning is a shared evaluation setting, spanning text, images,
      meshes, point clouds, and sketches.
    - Multi-metric evaluation is necessary because model rankings change across geometric,
      validity, and design-oriented metrics.
    - Benchmarks commonly measure reconstruction quality and invalid program ratio,
      emphasizing editable parametric B-Rep or CAD sequence recovery.
    disagreements:
    - 'Evaluation target differs: some work emphasizes geometric fidelity and executability,
      while others assess manufacturability, functionality, assemblability, and design-intent
      alignment.'
    - 'Task scope differs: some benchmarks target a single task such as mesh-to-CAD
      or text-to-CAD, while others unify multiple tasks and modalities in one suite.'
    - 'Interaction mode differs: some systems are end-to-end generators, while others
      use proactive clarification before CAD code synthesis.'
    - 'Generation and supervision mechanisms differ: LLM script generation, structure
      and parameter grounding, hybrid optimization, and stepwise reverse engineering
      each address CAD reconstruction differently.'
    - 'CAD representation differs: CadQuery scripts, hierarchical construction trees,
      parametric sequences, and B-Rep assemblies are evaluated under different assumptions.'
    open_questions:
    - Do multi-metric benchmark rankings remain stable across different implementations,
      compute budgets, and dataset samples?
    - Which proxy metrics validly reflect engineering decisions such as manufacturability,
      assemblability, and design intent?
    - How well do current CAD benchmarks cover ambiguous prompts, modality shift,
      and complex geometric settings?
    - The packet leaves limitation fields empty for many top works and lacks consistent
      code/dataset/artifact evidence, leaving generalizability and failure boundaries
      unverified.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD基准与任务设计
      解决的问题: 在文本、图像、草图、点云和网格等多输入下比较程序生成、逆向工程和问答任务。
      尚未覆盖: 任务分布是否覆盖真实工程设置，排名是否在模态转换和几何复杂度变化下保持可迁移。
    - 路线: CAD输出的指标与压力测试设计
      解决的问题: 分离可执行性、几何保真度和设计意图标准，并测试模型对模糊提示和复杂几何的鲁棒性。
      尚未覆盖: IoU、Chamfer距离、无效率或VLM评判等代理指标与下游可制造性、可装配性及用户决策之间的一致性。
    - 路线: 可比基线与CAD程序合成报告规范
      解决的问题: 通过共享基线、多指标排名和有效性报告，使专用模型和通用模型可在相同输出上被审计。
      尚未覆盖: 基准结论是否在不同实现和算力预算下保持稳定，以及缺失的局限性和工件信息是否影响可审计性。
    共识:
    - CAD基准将输出视为可执行程序，并同时评估程序有效性与生成的几何结果。
    - 多模态条件输入是共同评估设置，涵盖文本、图像、网格、点云和草图。
    - 多指标评估是必要的，因为模型排序会随几何、有效性和设计导向指标而变化。
    - 基准普遍衡量重建质量和无效程序率，强调可编辑参数化B-Rep或CAD序列恢复。
    分歧:
    - 评估目标不同：一些工作强调几何保真度和可执行性，另一些评估可制造性、功能性、可装配性和设计意图对齐。
    - 任务范围不同：一些基准针对网格到CAD或文本到CAD等单一任务，另一些在统一套件中覆盖多任务和多模态。
    - 交互模式不同：一些系统是端到端生成器，另一些在CAD代码合成前采用主动澄清。
    - 生成与监督机制不同：LLM脚本生成、结构与参数接地、混合优化和逐步逆向工程各自处理CAD重建。
    - CAD表示不同：CadQuery脚本、层次化构建树、参数化序列和B-Rep装配体在不同假设下被评估。
    开放问题:
    - 多指标基准排名是否在不同实现、算力预算和数据集样本下保持稳定？
    - 哪些代理指标能有效反映可制造性、可装配性和设计意图等工程决策？
    - 当前CAD基准在多大程度上覆盖模糊提示、模态转换和复杂几何设置？
    - 数据包中许多顶层工作的局限性字段为空，且缺少一致的代码/数据集/工件证据，使泛化性和失败边界无法验证。
