  related_work_outline:
  - 'Mainstream direction: Text/image/point-to-CAD generation through executable parametric
    programs, with LLM-driven code synthesis and benchmark-driven evaluation of B-Rep
    and CadQuery outputs.'
  - 'Shared research pattern: Generate an executable CAD representation, ground inputs
    to geometric primitives or parameters, then evaluate code validity, geometry fidelity,
    and design intent through staged or multi-metric protocols.'
  - 'Key differences: Representations include CadQuery scripts, construction trees,
    B-Rep parametric patches, and latent CAD sequences; supervision ranges from curated
    text and execution verification to point-level and self-supervised signals; evaluation
    targets span geometric fidelity, manufacturability, and parameter accuracy.'
  - 'Trend evolution: Within the 2026 frontier represented here, benchmarks are shifting
    toward industrial part families, multi-task/multimodal evaluation, hierarchical
    reasoning, and engineering readiness rather than isolated geometry generation.'
  - 'Open questions: Generalization to unseen part families and modality shifts, alignment
    of metrics with engineering usability, robust handling of ambiguous prompts, and
    preservation of complex parametric operations.'
  related_work_outline_zh:
  - 主流方向：通过可执行参数化程序进行文本/图像/点云到CAD生成，重点是基于LLM的代码合成与面向B-Rep和CadQuery输出的基准评测。
  - 研究共性：生成本质上是可执行的CAD表示，把输入对齐到几何基元或参数，再通过代码、几何和设计意图等分阶段或多指标协议评测。
  - 关键差异：表示层包括CadQuery脚本、构建树、B-Rep参数面片和潜在CAD序列；监督信号覆盖精选文本、执行验证、点级和自监督；评测目标涵盖几何保真度、可制造性与参数准确性。
  - 趋势演进：在当前2026年前沿证据中，基准正从孤立几何生成转向工业零件族、多任务多模态评测、层次化推理和工程就绪程度。
  - 开放问题：对未见零件族和模态偏移的泛化，指标与工程实用性的一致性，模糊提示的鲁棒处理，以及复杂参数化操作的保持。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven multimodal and industrial CAD evaluation
      what_it_solves: Standardizes comparison across input modalities, datasets, and
        tasks while measuring code executability, geometric fidelity, and design-intent
        or engineering criteria.
      what_remains_open: Generalization beyond curated part families, agreement across
        metrics and judges, and verification of code, dataset, and artifact availability.
    - line: LLM-based programmatic text-to-CAD generation
      what_it_solves: Translates natural-language specifications into executable parametric
        scripts with structural or parameter grounding, reducing invalid code and
        ambiguity errors.
      what_remains_open: Preserving complex operations such as sweeps and lofts, handling
        unseen design distributions, and reducing dependence on curated fine-tuning.
    - line: Parametric CAD sequence and latent generative modeling
      what_it_solves: Scales generation of long parametric CAD sequences or editable
        B-Reps from weak, self-supervised, or unannotated signals.
      what_remains_open: Engineering-level constraints, robustness under modality
        shift, and validation beyond geometric metrics.
    - line: Differentiable B-Rep and parametric surface representation
      what_it_solves: Directly generates editable B-Reps from point-level supervision
        without CAD-specific annotations by connecting mesh generation to parametric
        surfaces.
      what_remains_open: Complex topology and assembly manufacturability, evaluation
        on industrial part families, and reproducibility details.
    consensus:
    - Executable CAD programs are treated as the shared interface for generated outputs
      across benchmarks and methods.
    - Grounding language or visual inputs to parametric primitives, parameters, or
      topology improves structural consistency.
    - Multi-stage evaluation separates code validity, geometry validity, and design-intent
      or engineering readiness.
    - Frontier models recover coarse outer geometry better than fine parametric structure
      and complex operations.
    disagreements:
    - One branch uses autoregressive or LLM code generation with textual supervision,
      while another uses GAN, state-space, or differentiable surface generative models.
    - 'Evaluation targets differ: geometric fidelity, parameter sequence accuracy,
      and manufacturability or assemblability are each prioritized differently.'
    - 'Representations differ: CadQuery scripts, procedural construction trees, latent
      CAD sequences, and B-Rep Bézier patches coexist.'
    - 'Interaction mode differs: single-turn generation versus proactive clarification
      for ambiguous prompts.'
    - 'Supervision differs: curated text-to-CAD pairs, execution-verified programs,
      self-supervised reconstruction, and point-level supervision.'
    open_questions:
    - Can models generalize to unseen industrial part families after fine-tuning and
      reinforcement learning?
    - Which evaluation protocol predicts practical manufacturability and engineering
      usability rather than only benchmark ranking?
    - How should metric-dependent ranking instability and modality shift be resolved?
    - What evidence exists for preserving sweeps, lofts, and fine design parameters
      under realistic input variation?
    - How much do missing limitation and artifact details in several papers limit
      reproducibility and failure-boundary verification?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准驱动的多模态与工业CAD评测
      解决的问题: 统一比较不同输入模态、数据集和任务，衡量代码可执行性、几何保真度与设计意图或工程标准。
      尚未覆盖: 策划零件族之外的泛化、指标间和评判器间一致性、代码与数据集等工件可用性验证。
    - 路线: 基于LLM的程序化文本到CAD生成
      解决的问题: 把自然语言规格转化为可执行参数化脚本，并通过结构或参数接地减少无效代码和歧义错误。
      尚未覆盖: 保持扫掠、放样等复杂操作，处理未见设计分布，减少对精选微调数据的依赖。
    - 路线: 参数化CAD序列与潜在生成建模
      解决的问题: 以弱监督、自监督或无标注信号生成长参数化CAD序列和可编辑B-Rep。
      尚未覆盖: 工程级约束、模态偏移鲁棒性，以及超出几何指标的验证。
    - 路线: 可微分B-Rep与参数化曲面表示
      解决的问题: 无需CAD标注，从点级监督直接生成可编辑B-Rep，连接网格生成与参数化曲面。
      尚未覆盖: 复杂拓扑与装配可制造性、工业零件族评测和复现细节。
    共识:
    - 多个基准和方法都把可执行CAD程序作为生成输出的共同接口。
    - 将语言或视觉输入与参数化基元、参数或拓扑对齐能提升结构一致性。
    - 多阶段评测区分代码有效性、几何有效性和设计意图或工程就绪度。
    - 前沿模型通常能恢复粗略外部几何，但难以保持精细参数化结构和复杂操作。
    分歧:
    - 一个分支使用自回归或LLM代码生成并依赖文本监督，另一个分支使用GAN、状态空间或可微分曲面生成模型。
    - 评测目标不同：几何保真度、参数序列精度、可制造性或可装配性各有侧重。
    - 表示不同：CadQuery脚本、程序化构建树、潜在CAD序列和B-Rep贝塞尔曲面并行存在。
    - 交互方式不同：单轮生成与面向歧义的主动澄清。
    - 监督信号不同：精选文本到CAD对、执行验证程序、自监督重建和点级监督。
    开放问题:
    - 模型在微调和强化学习后能否泛化到未见工业零件族？
    - 哪种评测协议能预测实际可制造性和工程可用性，而不只是基准排名？
    - 如何解决指标导致的排名不稳定和模态偏移问题？
    - 关于在真实输入变化下保持扫掠、放样和精细设计参数，现有证据是否充分？
    - 多篇论文缺少局限性和工件细节，这对复现性和失效边界验证造成多大限制？
