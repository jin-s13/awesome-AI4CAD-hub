  - 趋势演进：证据集中在2026年，显示从单一模态、仅几何指标的快速转向，朝向评估功能性、可装配性和可制造性的统一基准，以及处理模糊用户输入的智能体系统。
  - 开放问题：这些系统在硬件、部署环境和用户特定约束下的泛化能力；VLM评判器能否可靠替代人类评估工程意图；以及如何在实时交互循环中平衡速度、保真度和可控性。
  literature_review:
    line_of_work_matrix:
    - line: Multimodal generative pipelines for editable CAD
      what_it_solves: Producing boundary-representation (B-Rep) or parametric CAD
        programs from diverse inputs (text, image, mesh, point cloud) on large, often
        unannotated 3D datasets.
      what_remains_open: Training on unannotated data relies on differentiable rendering
        or point-level supervision, but verification gaps exist for deployment-scale
        robustness, real-time performance, and model brittleness under input modality
        shifts.
    - line: Unified benchmarks and evaluation protocols for CAD
      what_it_solves: Standardizing comparison across tasks and modalities with metrics
        for geometry, executability, and design-intent alignment, including manufacturability
        and assemblability.
      what_remains_open: VLM-based judging still lacks independent validation against
        expert engineer assessments; stratification by geometric complexity is preliminary,
        and the cascading failure from code to engineering-ready design is not yet
        solved.
    - line: Agentic and interactive text-to-CAD systems
      what_it_solves: Handling ambiguous natural language prompts by proactively clarifying
        requirements before generating CAD programs, improving robustness and reducing
        invalid outputs.
      what_remains_open: The interaction overhead and clarification strategies are
        evaluated only in single-turn settings; long-term, multi-turn dialogue with
        real users and adaptation to downstream manufacturing constraints remain untested.
    - line: Optimization-based mesh-to-CAD reconstruction
      what_it_solves: Recovering parametric CAD operations (extrusions, revolutions,
        fillets) from mesh inputs with high geometric fidelity, using IoU-driven optimization
        over structured programs.
      what_remains_open: The approach assumes known operation types and may not scale
        to arbitrary freeform surfaces; independent reproduction across different
        mesh topologies and CAD kernels is not yet shown.
    consensus:
    - All works treat CAD generation as a structured prediction problem that must
      produce executable, editable outputs, not just static meshes.
    - Geometric fidelity (Chamfer Distance, IoU) and executability/validity ratios
      are universally reported, signaling a shared baseline for evaluation.
    - 'Multimodality is a common design goal: systems ingest at least two modalities,
      and unified models are promoted as the path forward.'
    - LLMs and transformers are the dominant backbone, whether for direct script generation,
      grounding to B-Rep primitives, or as a VLM judge.
    disagreements:
    - 'Output representation: some works generate CadQuery scripts, others use parametric
      patches or construction trees, leading to different error profiles and editability
      trade-offs.'
    - 'Supervision type: point-level supervision leverages unannotated data, while
      program-level supervision requires curated CAD datasets; the choice affects
      scalability and precision.'
    - 'Evaluation depth: some benchmarks stop at geometric similarity, while others
      demand manufacturability, functionality, and assemblability, creating a gap
      between research and engineering readiness.'
    - 'Interaction paradigm: most systems operate in a single-shot generation mode,
      but one introduces proactive clarification, revealing a split on whether user
      interaction should be minimized or embraced.'
    open_questions:
    - Can VLM-based judges for design-intent alignment be calibrated to match expert
      engineer assessments across diverse manufacturing domains?
    - How do these systems degrade when deployed outside the training distribution,
      particularly with legacy CAD kernels, hardware variations, and real-world noise?
    - What is the trade-off between geometric fidelity, program compactness, and real-time
      interactivity for closed-loop design exploration?
    - Are the improvements in robustness from proactive clarification generalizable
      to multi-turn, collaborative design workflows with actual users?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态可编辑CAD生成流水线
      解决的问题: 从文本、图像、网格、点云等多种输入生成边界表示（B-Rep）或参数化CAD程序，并利用大型未标注3D数据集进行训练。
      尚未覆盖: 在未标注数据上训练依赖可微分渲染或点级监督，但部署规模的鲁棒性、实时性能以及模型在输入模态转换下的脆弱性，目前缺乏验证。
    - 路线: 统一CAD基准与评估协议
      解决的问题: 通过几何、可执行性和设计意图对齐（包括可制造性和可装配性）指标，标准化跨任务和模态的比较。
      尚未覆盖: 基于VLM的评判缺乏与专家工程师评估的独立验证；按几何复杂度分层仍是初步尝试，从代码到工程就绪设计的失败级联问题尚未解决。
    - 路线: 智能体与交互式文本到CAD系统
      解决的问题: 在生成CAD程序前主动澄清模糊的自然语言提示，提高鲁棒性并减少无效输出。
      尚未覆盖: 交互开销和澄清策略仅在单轮设置中评估；与实际用户的多轮对话以及下游制造约束的适应性未测试。
    - 路线: 基于优化的网格到CAD重建
      解决的问题: 使用IoU驱动的结构化程序优化，从网格输入中恢复参数化CAD操作（拉伸、旋转、倒角等），实现高几何保真度。
      尚未覆盖: 假设已知操作类型，可能无法扩展至任意自由曲面；跨不同网格拓扑和CAD内核的独立复现未展示。
    共识:
    - 所有工作都将CAD生成视为必须产生可执行、可编辑输出的结构化预测问题，而非静态网格。
    - 几何保真度（倒角距离、IoU）和可执行性/有效性比率被普遍报告，形成了共同的评估基线。
    - 多模态是共同的设计目标：系统至少摄入两种模态，统一模型被视为前进方向。
    - LLM和Transformer是主流骨干，无论是用于直接脚本生成、B-Rep基元接地，还是作为VLM评判器。
    分歧:
    - 输出表示：有些工作生成CadQuery脚本，有些使用参数化面片或构建树，导致不同的错误模式和可编辑性权衡。
    - 监督类型：点级监督利用未标注数据，而程序级监督需要精心策划的CAD数据集，影响可扩展性和精度。
    - 评估深度：部分基准止步于几何相似性，另一些则要求可制造性、功能性和可装配性，造成研究与工程就绪之间的差距。
    - 交互范式：多数系统采用单次生成模式，但一项工作引入了主动澄清，反映出在是否应最小化或拥抱用户交互上的分歧。
    开放问题:
    - 基于VLM的设计意图对齐评判器能否被校准，以匹配不同制造领域中专家工程师的评估？
    - 这些系统在训练分布外部署时，特别是在遗留CAD内核、硬件变化和真实噪声下，性能如何退化？
    - 在闭环设计探索中，几何保真度、程序紧凑性和实时交互性之间的权衡是什么？
    - 主动澄清带来的鲁棒性提升能否泛化到与实际用户的多轮协作设计工作流中？
