  related_work_outline:
  - 'Mainstream direction: The top-ranked evidence centers on unified multimodal CAD
    benchmarks and co-designed generative or reverse-engineering models for producing
    editable parametric programs from text, images, meshes, point clouds, and sketches.'
  - 'Shared research pattern: CAD output is formalized as executable programs or construction
    sequences, with evaluation layered across syntactic executability, geometric validity,
    and design-intent or engineering-readiness checks.'
  - 'Key differences: Work differs by input modality, output representation such as
    CadQuery scripts versus construction sequences versus B-Rep assemblies, and evaluation
    depth from geometric fidelity to manufacturability and functionality.'
  - 'Trend evolution: Visible top-ranked papers cluster in 2026, so the observable
    trend is within the current frontier: benchmarks move toward multi-task unification,
    staged engineering evaluation, and robustness probes for ambiguous prompts and
    modality shift.'
  - 'Open questions: Metric-to-utility alignment, judge reliability, model-ranking
    stability across modalities and metrics, and reproducibility under missing code,
    dataset, or limitation evidence remain open.'
  related_work_outline_zh:
  - 主流方向：高排名证据集中在统一多模态CAD基准，以及从文本、图像、网格、点云和草图生成可编辑参数化程序的配套模型。
  - 研究共性：CAD输出被形式化为可执行程序或构建序列，并分层检查语法可执行性、几何有效性和设计意图或工程就绪度。
  - 关键差异：输入模态、输出表示如CadQuery脚本、构建序列或B-Rep装配体不同，评估深度也从几何保真延伸到可制造性和功能性。
  - 趋势演进：可见高排名论文集中在2026年，趋势处于当前前沿：基准走向多任务统一、分阶段工程评估，以及针对模糊提示和模态迁移的鲁棒性测试。
  - 开放问题：指标与效用的对齐、评判器可靠性、跨模态与跨指标的排名稳定性，以及在缺失代码、数据集或局限性证据时的可复现性仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Unified benchmark task and dataset design
      what_it_solves: Builds shared multimodal and multi-task CAD evaluation suites
        spanning text, image, sketch, point cloud, and mesh inputs for parametric
        program generation and reverse engineering.
      what_remains_open: Coverage of real-world engineering, manufacturing, assembly,
        and ambiguous design distributions is not yet established.
    - line: Metric and staged evaluation design
      what_it_solves: Layers syntactic executability, geometric fidelity, program
        compactness, and design-intent alignment checks to go beyond aggregate scores.
      what_remains_open: Proxy metrics and VLM-judge rubrics lack demonstrated alignment
        with downstream engineering decisions.
    - line: Comparable baselines and reporting
      what_it_solves: Uses shared dataset families and baseline comparisons across
        CAD-specialist and general LLM/VLM systems to make claims comparable.
      what_remains_open: Stability across implementations, compute budgets, and missing
        code or artifact evidence remains a verification gap.
    - line: Parametric CAD generation and reverse-engineering validation
      what_it_solves: Generates editable CAD programs or construction sequences from
        text, mesh, image, and point inputs, with validity and geometric fidelity
        objectives.
      what_remains_open: Robustness under modality shift, geometric complexity scaling,
        and ambiguous prompts is only partially addressed.
    consensus:
    - CAD generation is evaluated as executable parametric programs or construction
      sequences rather than as mesh output alone.
    - Evaluation is increasingly multi-stage, separating code executability, geometric
      validity, and design-intent or engineering readiness.
    - Shared dataset families and metrics enable cross-model comparison, but rankings
      can shift across metrics or conditions.
    disagreements:
    - Input scope ranges from single modalities such as text or mesh to unified multi-modal
      interfaces covering multiple CAD tasks.
    - Evaluation target ranges from geometric fidelity and invalid-ratio reduction
      to manufacturability, functionality, and assemblability.
    - 'Generation approach differs: LLM script generation, stepwise reverse engineering,
      hybrid optimization, and proactive clarification agents.'
    - Deployment settings differ by prompt ambiguity, rendering noise, surface complexity,
      and assembly-level evaluation.
    open_questions:
    - Do Chamfer, IoU, and validity metrics predict downstream manufacturability,
      functionality, and assembly outcomes?
    - Are VLM-judge evaluations stable enough to replace human engineering judgment
      for design-intent alignment?
    - Do model rankings remain stable across input modalities, geometric complexity,
      and metric choices?
    - Would benchmark conclusions hold under different implementations, compute budgets,
      and released artifacts given observed evidence gaps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一基准任务与数据集设计
      解决的问题: 构建文本、图像、草图、点云和网格输入的统一多模态多任务CAD评测套件，覆盖参数化程序生成与逆向工程。
      尚未覆盖: 真实工程、制造、装配和模糊设计分布是否被充分覆盖仍不明确。
    - 路线: 指标与分阶段评估设计
      解决的问题: 通过可执行性、几何保真、程序紧凑性和设计意图对齐等多层检查，超越单一总分进行评测。
      尚未覆盖: 代理指标和VLM评判量规与下游工程决策的一致性尚未得到证明。
    - 路线: 可比基线与报告规范
      解决的问题: 借助共享数据集家族和基线对比，使CAD专用模型与通用LLM/VLM的结果可比较。
      尚未覆盖: 不同实现、算力预算以及缺失代码或工件的证据下，结论是否稳定仍是验证缺口。
    - 路线: 参数化CAD生成与逆向工程验证
      解决的问题: 从文本、网格、图像和点云生成可编辑CAD程序或构建序列，并以有效性和几何保真为目标。
      尚未覆盖: 模态迁移、几何复杂度扩展和模糊提示下的鲁棒性只被部分解决。
    共识:
    - CAD生成被评价为可执行参数化程序或构建序列，而不是单纯的网格输出。
    - 评测越来越多采用分阶段方式，区分代码可执行性、几何有效性和设计意图或工程就绪度。
    - 共享数据集与指标支持跨模型比较，但模型排名会随指标或条件而变化。
    分歧:
    - 输入范围从单一模态到统一多模态多任务界面不等。
    - 评测目标从几何保真和无效率降低扩展到可制造性、功能性和可装配性。
    - 生成路线包括LLM脚本生成、逐步逆向工程、混合优化和主动澄清智能体。
    - 部署设置涉及不同提示模糊度、渲染噪声、模型复杂度和装配级评估。
    开放问题:
    - Chamfer、IoU和有效性指标能否预测下游可制造性、功能性和装配结果？
    - VLM评判器是否足够稳定，可以替代人类工程判断来评估设计意图？
    - 模型排名在不同输入模态、几何复杂度和指标选择下是否保持稳定？
    - 在代码、数据集或局限性细节缺失的证据缺口下，基准结论能在多大程度上被复现？
