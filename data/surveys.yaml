  related_work_outline:
  - 'Mainstream direction: LLM/agentic and optimization-based methods that generate
    or recover executable parametric CAD programs dominate the available 2026 frontier,
    with multimodal benchmarks exposing generalization limits.'
  - 'Shared research pattern: CAD is represented as a program or construction sequence;
    text, image, mesh, sketch, or point cloud inputs are aligned to parametric operations
    and checked with geometric and validity metrics.'
  - 'Key differences: generative LLM code synthesis versus optimization-based fitting;
    task-specific versus unified multimodal models; geometric-only versus design-intent
    and manufacturability evaluation; one-shot versus interactive clarification.'
  - 'Trend evolution: the available evidence is concentrated in 2026, so the trend
    is within the current frontier; work appears to be shifting from single-task generation
    or reconstruction toward unified benchmarks, multimodal LLMs, and agentic workflows.'
  - 'Open questions: whether gains come from the method or from curated data and surrounding
    system choices; how models handle modality shift and geometric complexity; which
    metric should govern when rankings conflict; reproducibility gaps remain.'
  related_work_outline_zh:
  - 主流方向：在可用的2026年前沿证据中，以可执行参数化CAD程序为核心，用LLM/智能体或结构化优化方法从文本、图像、网格、草图或点云生成或恢复CAD模型，并通过多模态基准暴露泛化边界。
  - 研究共性：将CAD表示为程序或构建序列，把多模态输入对齐到参数化操作，并以几何、有效性、可执行性等指标进行校验。
  - 关键差异：生成式LLM代码合成与基于优化的拟合恢复形成路线差异；评测目标从几何保真度扩展到设计意图、可制造性和可装配性；交互方式分为一次性生成与主动澄清。
  - 趋势演进：可用证据集中在2026年，趋势属于当前前沿；工作从单任务生成或重建转向统一基准、多模态大模型和智能体流程，评测也从可执行性和几何保真度扩大到工程就绪度。
  - 开放问题：提升来自方法本身还是数据与系统选择；模型在模态转移和几何复杂度下是否稳定；当指标排序冲突时如何取舍；许多2026年论文的可复现证据仍不完整。
  literature_review:
    line_of_work_matrix:
    - line: LLM/agentic text-to-CAD program generation
      what_it_solves: Translates natural or ambiguous specifications into executable
        parametric CAD scripts by grounding language to B-rep primitives or parameters
        and refining through hierarchical alignment or clarification.
      what_remains_open: Generalization beyond curated text-CAD datasets, quantification
        of interaction overhead, and whether improvements transfer to unseen design
        constraints or real-world ambiguity.
    - line: Geometry-to-CAD reverse engineering and program optimization
      what_it_solves: Recovers editable parametric CAD construction sequences from
        meshes or images by incremental feature fitting and geometric feedback, improving
        validity and geometric fidelity.
      what_remains_open: Behavior under noisy or real-world geometry, coverage of
        operation sets, and separation of search or optimization benefits from learned
        components.
    - line: Unified multimodal multi-task CAD models
      what_it_solves: Handles heterogeneous CAD tasks such as reconstruction, generation,
        and question answering within one model across text, image, sketch, and point
        cloud inputs.
      what_remains_open: Whether single-model breadth sacrifices task-specific accuracy,
        and gaps in benchmark coverage, artifacts, and reproducibility evidence.
    - line: Multimodal CAD benchmarks and evaluation protocols
      what_it_solves: Provides standardized, modality-stratified comparisons and exposes
        failure modes beyond geometric metrics, including executability, manufacturability,
        functionality, and assemblability.
      what_remains_open: Metric disagreement, VLM judge reliability, dataset and code
        availability, and representativeness of benchmark stratification.
    consensus:
    - CAD generation and reconstruction are being reformulated as prediction of executable
      programs or construction sequences rather than raw geometry alone.
    - Shared benchmarks with multiple metrics show that model rankings can shift across
      metrics, so single-metric claims are insufficient.
    - Current systems consistently degrade with geometric complexity or modality shift,
      and evaluation reveals an executable-to-valid-to-engineering-ready failure cascade.
    - Methods that add grounded parameter or geometry feedback, fine-tuning, or reinforcement
      learning tend to report improved validity and geometric fidelity.
    disagreements:
    - Some work uses generative LLM code synthesis, while others use optimization-based
      fitting and iterative geometry comparison for mesh-to-CAD recovery.
    - 'Supervision and grounding differ: some align hierarchical reasoning trajectories
      and parameters, others use IoU-driven search over operations, and others use
      multimodal end-to-end LLM training.'
    - 'Evaluation scope differs: geometric fidelity and executability versus downstream
      engineering criteria such as manufacturability, functionality, and assemblability.'
    - 'Task scope and interaction differ: specialized single-task models versus unified
      multi-task models, and one-shot generation versus proactive clarification workflows.'
    open_questions:
    - Under what conditions do improvements result from the proposed model rather
      than from curated datasets, benchmark selection, or surrounding system components?
    - How can unified multimodal CAD models maintain task-specific fidelity while
      covering reconstruction, generation, and question answering?
    - How should evaluation reconcile disagreements among geometric metrics and design-intent
      or manufacturability judgments?
    - How robust are text-to-CAD generation and mesh-to-CAD reconstruction to modality
      shift and increasing geometric complexity?
    - Many 2026 papers lack visible code, dataset, baseline, metric, or limitation
      details; what would be required to verify reproducibility and isolate method
      contributions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: LLM/智能体文本到CAD程序生成
      解决的问题: 将自然语言或模糊规格转换为可执行参数化CAD脚本，通过B-Rep基元或参数接地、层次对齐或主动澄清提高一致性。
      尚未覆盖: 超出精选文本到CAD数据集的泛化、交互开销量化，以及改进能否迁移到未见的工程约束或真实世界模糊场景。
    - 路线: 几何到CAD逆向工程与程序优化
      解决的问题: 通过增量特征拟合和几何反馈，从网格或图像恢复可编辑参数化CAD构建序列，提高有效性和几何保真度。
      尚未覆盖: 在噪声或真实几何下的表现、操作集覆盖范围，以及搜索或优化收益与学习组件贡献的分离。
    - 路线: 统一多模态多任务CAD模型
      解决的问题: 在单一模型中跨文本、图像、草图和点云处理重建、生成、问答等异构CAD任务。
      尚未覆盖: 统一模型的广度是否会牺牲任务级精度，以及基准覆盖、工件和复现证据的缺口。
    - 路线: 多模态CAD基准与评测协议
      解决的问题: 提供标准化、按模态分层的比较，并暴露几何指标之外的失败模式，包括可执行性、可制造性、功能性和可装配性。
      尚未覆盖: 指标间分歧、VLM评判器可靠性、数据集和代码可用性，以及基准分层是否具有代表性。
    共识:
    - CAD生成与重建正在被重新表述为可执行程序或构建序列预测，而非仅预测原始几何。
    - 共享基准和多指标评测显示模型排名会随指标变化，单一指标结论不足。
    - 当前系统在几何复杂度增加或模态转移时普遍退化，并出现从可执行代码到有效几何再到工程就绪的失败级联。
    - 加入参数或几何反馈监督、微调或强化学习的方法通常报告更高的有效性和几何保真度。
    分歧:
    - 生成式LLM代码合成与基于优化的拟合和迭代几何比较在网格到CAD恢复上存在路线差异。
    - 监督与接地方式不同：层次推理轨迹与参数对齐、基于IoU的操作搜索、多模态端到端LLM训练同时存在。
    - 评测范围不同：有的关注几何保真度和可执行性，有的扩展为可制造性、功能性和可装配性等下游工程标准。
    - 任务范围与交互方式不同：专用单任务模型与统一多任务模型并存，一次性生成与主动澄清流程并存。
    开放问题:
    - 在什么条件下提升来自所提方法本身，而不是精选数据集、基准选择或周边系统组件？
    - 统一多模态CAD模型如何在覆盖重建、生成和问答的同时保持任务级精度？
    - 当几何指标与设计意图或可制造性判断冲突时，评测应如何取舍？
    - 文本到CAD生成和网格到CAD重建对模态转移和几何复杂度的鲁棒性如何？
    - 许多2026年论文缺少可见代码、数据集、基线、指标或局限细节，复现与方法贡献隔离需要哪些补充？
