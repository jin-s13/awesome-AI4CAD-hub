  related_work_outline:
  - 'Mainstream direction: The field is converging on unified multi-modal benchmarks
    and evaluation protocols for CAD generation, moving beyond geometric fidelity
    to assess manufacturability, functionality, and assemblability.'
  - 'Shared research pattern: Papers pair new generative methods with dedicated benchmarks
    or evaluation suites, using standardized metrics like Chamfer distance, IoU, and
    executability to compare models, while stress-testing under modality shifts and
    geometric complexity.'
  - 'Key differences: Benchmarks diverge in the properties they evaluate—some prioritize
    geometric accuracy, others enforce engineering constraints, and a few introduce
    interactive, agent-based evaluation with proactive clarification; representation
    choices (B-Rep vs. mesh, parametric sequences vs. implicit) also shape evaluation
    targets.'
  - 'Trend evolution: Within the 2026 frontier, the trend is from single-task, single-modality
    CAD evaluation toward multi-task, multi-modal, and design-rule-aware benchmarks,
    with emerging interest in agentic and human-aligned judging.'
  - 'Open questions: Whether proxy metrics align with engineering design intent, how
    benchmark conclusions vary across implementations and compute budgets, and whether
    task distributions cover real-world downstream use cases remain unresolved.'
  related_work_outline_zh:
  - 主流方向：领域正朝统一的多模态基准和评估协议收敛，从几何保真度扩展到可制造性、功能性和可装配性评估。
  - 研究共性：论文将新生成方法与专用基准或评估套件配对，使用Chamfer距离、IoU和可执行性等标准化指标比较模型，并在模态转换和几何复杂度下进行压力测试。
  - 关键差异：基准在评估属性上分化——有的侧重几何精度，有的强调工程约束，还有的引入基于智能体的交互式评估和主动澄清；表征选择（B-Rep与网格、参数序列与隐式）也塑造了评估目标。
  - 趋势演进：在2026年前沿内，趋势是从单任务、单模态CAD评估转向多任务、多模态和设计规则感知的基准，并出现对智能体和人类对齐评判的兴趣。
  - 开放问题：代理指标是否与工程设计意图一致，基准结论在不同实现和算力预算下是否稳定，任务分布是否覆盖真实下游用例仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make CAD generation
        claims comparable across models, input modalities, and geometric complexity.
      what_remains_open: Whether the task distribution covers real-world engineering
        constraints (manufacturability, functional intent) and how stable benchmark
        rankings are under dataset shift or sampling bias.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction quality, controllability, robustness, and
        decision utility beyond aggregate scores, including failure mode analysis
        and design-intent alignment.
      what_remains_open: Alignment between proxy metrics (e.g., Chamfer distance,
        VLM-based rubrics) and the downstream engineering decisions users actually
        care about; metric sensitivity to adversarial perturbations.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable through common baselines, artifacts,
        and reporting conventions, enabling head-to-head comparisons on standardized
        benchmarks.
      what_remains_open: Whether benchmark conclusions remain stable across implementations,
        compute budgets, and fine-tuning protocols; reproducibility of agent-based
        or interactive evaluation setups.
    consensus:
    - Standardized evaluation is critical for measuring progress in CAD generation,
      and benchmarks must cover multiple input modalities and metrics.
    - Geometric fidelity (e.g., IoU, Chamfer distance) and program executability are
      necessary but insufficient criteria for assessing practical CAD systems.
    - 'Current models exhibit consistent failure modes: performance degrades with
      geometric complexity, models are brittle under modality shift, and model rankings
      depend on the chosen metric.'
    disagreements:
    - 'Evaluation targets differ: some benchmarks emphasize geometric accuracy, while
      others incorporate engineering properties like manufacturability, assemblability,
      and functional intent.'
    - 'Judging mechanisms vary: fully automatic metrics vs. VLM-based scoring rubrics
      vs. interactive agent-mediated clarification loops, leading to different interpretations
      of a model''s robustness.'
    - 'Representation choices affect evaluation: parametric B-Rep sequences are evaluated
      on compactness and executability, whereas mesh-based methods focus on surface
      reconstruction quality, creating cross-representation comparison challenges.'
    open_questions:
    - How well do automatic metrics and VLM judges correlate with human expert assessments
      of design intent in real engineering workflows?
    - Under what conditions do benchmark rankings invert when switching between different
      evaluation protocols, datasets, or compute budgets?
    - Can interactive evaluation frameworks (e.g., proactive clarification) remain
      reproducible and scalable across diverse user populations and CAD domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使CAD生成主张在模型、输入模态和几何复杂度之间具有可比性。
      尚未覆盖: 任务分布是否覆盖真实工程约束（可制造性、功能意图），基准排名在数据集偏移或采样偏差下是否稳定。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测质量、可控性、鲁棒性和决策效用，包括失败模式分析和设计意图对齐。
      尚未覆盖: 代理指标（如Chamfer距离、基于VLM的评分标准）与用户真正关心的下游工程决策之间的一致性；指标对对抗性扰动的敏感性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、工件和报告规范让结果可审计，实现在标准化基准上的直接对比。
      尚未覆盖: 基准结论在不同实现、算力预算和微调协议下是否稳定；基于智能体或交互式评估设置的可复现性。
    共识:
    - 标准化评估对衡量CAD生成进展至关重要，基准必须覆盖多输入模态和多指标。
    - 几何保真度（如IoU、Chamfer距离）和程序可执行性是评估实用CAD系统的必要但不充分标准。
    - 当前模型展现出一致的失败模式：性能随几何复杂度下降，模型在模态转换下脆弱，模型排名取决于所选指标。
    分歧:
    - 评估目标不同：一些基准强调几何精度，另一些纳入可制造性、可装配性和功能意图等工程属性。
    - 评判机制多样：全自动指标、基于VLM的评分标准、交互式智能体中介的澄清循环，导致对模型鲁棒性有不同解读。
    - 表征选择影响评估：参数化B-Rep序列评估紧凑性和可执行性，而基于网格的方法侧重表面重建质量，造成跨表征比较的挑战。
    开放问题:
    - 自动指标和VLM评判器与人类专家对真实工程流程中设计意图的评估有多一致？
    - 在何种条件下，基准排名会在不同评估协议、数据集或算力预算之间发生反转？
    - 交互式评估框架（如主动澄清）能否在不同用户群体和CAD领域中保持可复现性和可扩展性？
