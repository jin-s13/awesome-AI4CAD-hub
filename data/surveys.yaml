  related_work_outline:
  - 'Mainstream direction: Construction of multi-modal, multi-task CAD benchmarks
    that evaluate programmatic CAD generation (B-rep/construction sequences) under
    standardized protocols, shifting from purely geometric fidelity toward engineering
    and manufacturing readiness.'
  - 'Shared research pattern: Benchmarks introduce a labeled dataset with multiple
    input modalities (text, images, point clouds, meshes), define tasks such as text-to-CAD,
    mesh-to-CAD, or CAD question answering, and adopt metrics that combine geometric
    accuracy, executability, and design-intent alignment.'
  - 'Key differences: Assessment targets diverge—some benchmarks focus on reconstruction
    fidelity and modality robustness, others on downstream manufacturability, functionality,
    and assemblability, while unified suites aim to cover many tasks within one framework.'
  - 'Trend evolution: The field has moved from small-scale, single-modality CAD datasets
    toward large, multi-family benchmarks integrating photorealistic renders, noisy
    meshes, and B-rep assemblies, with recent work adopting VLM-based judges for engineering
    rubrics.'
  - 'Open questions: Whether proxy metrics (e.g., VLM scores) align with expert engineering
    decisions, how to cover real manufacturing constraints, and why model rankings
    change across different benchmarks and metrics remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建多模态、多任务CAD基准，以标准化协议评估程序化CAD生成（B-rep/构建序列），从单纯几何保真度转向工程与制造就绪度。
  - 研究共性：基准引入标注数据集，覆盖文本、图像、点云、网格等多模态输入，定义文本到CAD、网格到CAD等任务，采用几何精度、可执行性和设计意图对齐等组合指标。
  - 关键差异：评估目标分化——有的关注重建保真度和模态鲁棒性，有的关注可制造性、功能性和可装配性，而统一套件则试图在一个框架内覆盖多任务。
  - 趋势演进：从小规模单模态数据集演进到集成逼真渲染、噪声网格和B-rep装配体的大型多家族基准，近期工作开始采用基于VLM的评判器进行工程化评分。
  - 开放问题：代理指标（如VLM评分）与专家工程决策的一致性、如何覆盖真实制造约束、以及模型排名在不同基准与指标间为何变化，仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared evaluation suites with multimodal inputs (text,
        images, meshes, point clouds) and programmatic CAD outputs (B-rep sequences)
        so that generative models can be compared on geometric fidelity, executability,
        and program compactness.
      what_remains_open: Whether the task distribution and object complexity cover
        the full range of real engineering workflows—including large assemblies, manufacturing
        tolerances, and physical constraints—and whether model robustness across modality
        shifts is adequately tested.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality beyond aggregate scores by introducing
        engineering-specific criteria (manufacturability, functionality, assemblability),
        multi-stage evaluation protocols, and VLM-based judges to detect failure cascades
        from code validity to design intent.
      what_remains_open: Alignment between VLM-driven rubrics and human expert judgments,
        the reliability of such proxies for safety-critical downstream decisions,
        and the sensitivity of metric rankings to geometric complexity and noise.
    - line: Comparable baselines and reporting
      what_it_solves: Provides a unified evaluation framework under which specialized
        CAD models and general-purpose VLMs can be benchmarked side-by-side, making
        results auditable through common artifacts and reporting conventions.
      what_remains_open: Stability of benchmark conclusions across different implementations,
        compute budgets, and dataset splits; the extent to which current baselines
        overfit to narrow geometric distributions; and the lack of reproducibility
        protocols for VLM-based evaluation.
    consensus:
    - Programmatic CAD representations, particularly B-rep construction sequences
      and executable scripts, are the primary output format for evaluation and are
      assessed through executability and geometric validity.
    - Multi-modal input (text, images, meshes, point clouds) and multi-task evaluation
      are becoming standard, with a shared goal of unifying previously fragmented
      benchmarks.
    - Geometric fidelity metrics (Chamfer distance, volumetric IoU) and validity ratios
      are foundational, but there is a recognized need for higher-level engineering
      criteria such as functionality and assemblability.
    - 'Current models, including strong LLMs and VLMs, exhibit a failure cascade:
      they often produce executable but geometrically invalid or engineering-unsuitable
      designs, especially under increased geometric complexity or modality shift.'
    disagreements:
    - 'Evaluation target: some benchmarks prioritize geometric reconstruction accuracy
      and cross-modal robustness, while others emphasize downstream manufacturing
      properties (e.g., MUSE''s design-intent alignment), leading to different task
      formulations and success criteria.'
    - 'Metric design: one line uses traditional geometric distances and execution
      rates, another introduces design-specific rubrics and VLM judges, raising questions
      about the objectivity and generalizability of AI-assisted scoring.'
    - 'Task scope: unification benchmarks aim to cover reconstruction, generation,
      and QA under one suite, whereas specialized benchmarks focus on a single high-value
      scenario (e.g., text-to-CAD with assemblies), creating tension between breadth
      and depth of evaluation.'
    - 'Interaction model: current benchmarks assume static, unambiguous inputs, while
      some methods propose proactive clarification; there is no consensus on whether
      and how to incorporate interactive specification into evaluation protocols.'
    open_questions:
    - To what extent do VLM-based engineering rubrics correlate with decisions made
      by practicing mechanical engineers, and how can we validate such judges at scale?
    - How can benchmarks be extended to include manufacturing constraints (tolerances,
      material properties, machining processes) and physical simulation outcomes without
      making evaluation prohibitively expensive?
    - What explains the observed instability of model rankings across different metrics
      and benchmarks, and how should practitioners select the most appropriate evaluation
      suite for a given deployment context?
    - Is the current focus on static, unambiguous prompts sufficient to assess real-world
      text-to-CAD workflows, or should benchmarks incorporate interactive, iterative
      clarification phases?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享评估套件，提供多模态输入（文本、图像、网格、点云）和程序化CAD输出（B-rep序列），使生成模型在几何保真度、可执行性和程序紧凑性上可比较。
      尚未覆盖: 任务分布和对象复杂度是否覆盖真实工程全流程，包括大型装配体、制造公差和物理约束，以及模型在模态转换下的鲁棒性是否被充分测试。
    - 路线: 指标与压力测试设计
      解决的问题: 通过引入工程特定标准（可制造性、功能性、可装配性）、多阶段评估协议和基于VLM的评判器，探测聚合分数之外的预测质量，揭示从代码有效到设计意图的失败级联。
      尚未覆盖: VLM评判标准与人类专家判断的一致性，此类代理在安全关键下游决策中的可靠性，以及指标排名对几何复杂度和噪声的敏感性。
    - 路线: 可比基线与报告规范
      解决的问题: 提供统一评估框架，使专用CAD模型和通用VLM能够并排比较，通过共同工件和报告惯例使结果可审计。
      尚未覆盖: 基准结论在不同实现、算力预算和数据集划分下的稳定性，当前基线对狭窄几何分布的过拟合程度，以及针对VLM评估的复现性协议缺失。
    共识:
    - 程序化CAD表示，特别是B-rep构建序列和可执行脚本，是评估的主要输出格式，并通过可执行性和几何有效性进行衡量。
    - 多模态输入（文本、图像、网格、点云）和多任务评估正成为标准，共同目标是统一之前碎片化的基准。
    - 几何保真度指标（Chamfer距离、体积IoU）和有效性比率是基础，但业界认识到需要更高层次的工程标准，如功能性和可装配性。
    - 当前模型，包括强大的LLM和VLM，表现出失败级联：它们通常生成可执行但几何无效或工程上不适合的设计，尤其在几何复杂度增加或模态转换时。
    分歧:
    - 评估目标：一些基准优先考虑几何重建准确性和跨模态鲁棒性，另一些则强调下游制造属性（如MUSE的设计意图对齐），导致任务定义和成功标准不同。
    - 指标设计：一类使用传统几何距离和执行率，另一类引入设计特定评分标准和VLM评判器，引发了关于AI辅助评分客观性和泛化性的问题。
    - 任务范围：统一基准试图在一个套件中覆盖重建、生成和问答，而专用基准聚焦于单一高价值场景（如带装配体的文本到CAD），在评估的广度和深度之间形成张力。
    - 交互模式：当前基准假设静态、无歧义的输入，而一些方法提出主动澄清；对于是否以及如何将交互式规格纳入评估协议，尚无共识。
    开放问题:
    - 基于VLM的工程评分标准与执业机械工程师决策的相关性如何，以及我们如何在大规模上验证这些评判器？
