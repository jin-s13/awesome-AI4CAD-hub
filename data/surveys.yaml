  related_work_outline_zh:
  - 主流方向：当前前沿集中于统一多模态CAD评测系统与通用CAD模型，端到端处理文本、图像、草图、点云、网格和渲染输入，生成或评估CAD程序。
  - 研究共性：工作普遍把参数化CAD视为可执行程序或有序构建序列，并以代码可执行性、几何有效性和重建保真度作为核心评测轴。
  - 关键差异：系统在输入模态覆盖、监督策略、交互方式和输出形式上有别：直接代码生成、层次化接地推理、基于优化的网格到CAD恢复、生成前主动澄清，以及评测优先设计。
  - 趋势演进：可见的顶层证据集中在2026年，因此可观察趋势限于当前前沿：从任务特定重建模型走向统一多任务、多模态和智能体式CAD流水线。
  - 开放问题：关于独立复现、在受控评测样本之外的部署、延迟与交互权衡，以及可制造性/可装配性等工程标准能否迁移到真实设计流程的证据仍不足。
  literature_review:
    line_of_work_matrix:
    - line: Unified cross-modal CAD evaluation and model systems
      what_it_solves: Provide controlled evaluation across input modalities, complexity
        strata, and multiple metrics for CAD program generation and multi-task CAD
        models.
      what_remains_open: Whether evaluation rankings and automated judge results transfer
        to real engineering workflows, deployment shifts, and independent reproduction
        remains unclear.
    - line: LLM-driven text-to-CAD program generation with geometric grounding
      what_it_solves: Convert natural-language specifications into executable parametric
        CAD scripts and align hierarchical structure or B-Rep primitive references.
      what_remains_open: Visible evidence mostly reports task performance; robustness
        to ambiguous prompts, unseen geometric complexity, and long-horizon engineering
        constraints is not fully established.
    - line: Optimization-based mesh-to-CAD program recovery
      what_it_solves: Recover editable parametric CAD construction sequences from
        meshes or images by incrementally fitting operations and validating them with
        geometric feedback.
      what_remains_open: Trade-offs among operation coverage, complex-design validity,
        and computational cost, plus generalization across dataset families and modality
        shifts, need more evidence.
    - line: Agentic interactive CAD generation with clarification
      what_it_solves: Resolve specification ambiguity and reduce invalid code by asking
        targeted clarification questions before program synthesis, with low interaction
        overhead.
      what_remains_open: Deployment latency, question quality across different users,
        and integration with broader CAD tools remain verification gaps.
    consensus:
    - Parametric CAD is treated as executable code or ordered construction sequences
      rather than only as mesh or point-cloud output.
    - Evaluation typically includes code executability, geometric validity or fidelity,
      and often program compactness or reconstruction error.
    - Recent work shares a shift toward multimodal or unified evaluation and generation
      systems spanning text, image, mesh, point cloud, sketch, and render inputs.
    - There is a recognized failure cascade from executable code to valid geometry
      to engineering-ready design, especially for complex assemblies.
    disagreements:
    - 'Supervision and generation strategy differ: supervised fine-tuned LLM code
      generation, hierarchical structure alignment, reinforcement fine-tuning, hybrid
      geometric optimization, and stepwise reconstruction coexist.'
    - 'Input and output focus differs: some systems target text-to-CAD, others mesh-to-CAD
      or point-to-CAD, and others aim for one model handling multiple tasks across
      modalities.'
    - 'Evaluation target differs: geometric fidelity and reconstruction metrics are
      used alongside manufacturability, functionality, and assemblability rubrics.'
    - 'Interaction mode differs: one-shot generation is contrasted with proactive
      clarification before drawing.'
    open_questions:
    - How well do current CAD systems generalize from curated evaluation samples to
      noisy real-world design, manufacturing, and assembly constraints?
    - What are the latency, cost, and controllability trade-offs of agentic or optimization-based
      CAD pipelines in interactive design tools?
    - 'Which evaluation signals best predict downstream engineering utility: code
      executability, geometric error, program compactness, or design-intent rubrics?'
    - Where is independent reproducibility weakest when code, datasets, judge protocols,
      or compute details are not fully documented in the visible evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一跨模态CAD评测与模型系统
      解决的问题: 为CAD程序生成和多任务CAD模型提供跨输入模态、复杂度分层和多项指标的受控评测。
      尚未覆盖: 评测排名和自动化评判结果能否迁移到真实工程流程、部署偏移和独立复现仍不确定。
    - 路线: 基于LLM的文本到CAD程序生成与几何接地
      解决的问题: 把自然语言规格转换为可执行的参数化CAD脚本，并对齐层次结构或B-Rep基元引用。
      尚未覆盖: 可见证据主要报告任务性能；对模糊提示、未知几何复杂度和长程工程约束的鲁棒性尚未充分验证。
    - 路线: 基于优化的网格到CAD程序恢复
      解决的问题: 通过逐步拟合参数化操作并用几何反馈验证，从网格或图像恢复可编辑的CAD构建序列。
      尚未覆盖: 操作覆盖、复杂设计有效性与计算开销之间的权衡，跨数据集和模态偏移的泛化，需要更多证据。
    - 路线: 智能体式交互式CAD生成与澄清
      解决的问题: 在程序合成前提出有针对性的澄清问题，以较低交互开销消除规格歧义并降低无效代码。
      尚未覆盖: 部署延迟、不同用户下的提问质量，以及与更广CAD工具的集成仍是验证缺口。
    共识:
    - 参数化CAD被视为可执行代码或有序构建序列，而非仅网格或点云输出。
    - 评测普遍包含代码可执行性、几何有效性或保真度，并常关注程序紧凑性或重建误差。
    - 近期工作共同向多模态或统一评测与生成系统演进，覆盖文本、图像、网格、点云、草图和渲染输入。
    - 研究承认从可执行代码到有效几何再到工程就绪设计存在失败级联，复杂装配体尤其明显。
    分歧:
    - 监督与生成策略不同：监督微调LLM代码生成、层次结构对齐、强化微调、混合几何优化和逐步重建并存。
    - 输入输出重点不同：有些面向文本到CAD，有些面向网格到CAD或点云到CAD，也有单一模型处理多模态多任务。
    - 评测目标不同：几何保真度和重建指标与可制造性、功能性和可装配性评分标准并存。
    - 交互模式不同：一次性生成与生成前主动澄清形成对照。
    开放问题:
    - 当前CAD系统从受控评测样本泛化到含噪声的真实设计、制造和装配约束时表现如何？
    - 智能体式或基于优化的CAD流水线在交互式设计工具中的延迟、成本和可控性权衡是什么？
    - 哪种评测信号最能预测下游工程效用：代码可执行性、几何误差、程序紧凑性，还是设计意图评分标准？
    - 在可见证据中，代码、数据集、评判协议或计算细节未充分记录的地方，独立复现最弱哪些环节？
