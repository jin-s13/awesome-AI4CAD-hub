  related_work_outline:
  - 'Mainstream direction: The current frontier concentrates on executable generative
    CAD systems where LLMs, multimodal models, and agent pipelines convert text, images,
    meshes, or point clouds into parametric CAD programs or B-rep outputs, with unified
    benchmarks such as CADBench, MUSE, and UniCAD evaluating fidelity, executability,
    and design intent.'
  - 'Shared research pattern: Papers frame CAD generation as program synthesis or
    structured geometry recovery rather than raw shape prediction. They combine datasets,
    automated metrics, executable code checks, and geometric or design-intent evaluation,
    while reporting stronger specialized performance under aligned conditions and
    weaker generalization under distribution shifts.'
  - 'Key differences: Systems differ in input modality, output representation such
    as CadQuery scripts, construction trees, B-rep grounded primitives, or structured
    programs, in supervision or optimization through SFT, RL, hybrid IoU optimization,
    or agent clarification, and in evaluation emphasis from geometry to manufacturability
    and interaction.'
  - 'Trend evolution: Evidence is concentrated in the current 2026 frontier. The direction
    is moving from isolated geometry-only benchmarks toward unified multi-modal, multi-task
    CAD evaluation and agent-based clarification, with increasing emphasis on valid
    executable outputs and engineering-ready design rather than only geometric similarity.'
  - 'Open questions: Independent deployment and cross-team reproducibility remain
    unverified. VLM design-intent judges need stronger engineering validation. Latency
    and interactivity trade-offs are underexplored. Model rankings shift across metrics,
    leaving no single accepted success criterion.'
  related_work_outline_zh:
  - 主流方向：当前前沿集中于可执行的生成式CAD系统，LLM、多模态模型和智能体流水线将文本、图像、网格或点云转化为参数化CAD程序或B-rep输出，并以CADBench、MUSE、UniCAD等统一基准评估保真度、可执行性和设计意图。
  - 研究共性：论文将CAD生成视为程序合成或结构化几何恢复，而非单纯形状预测；普遍结合数据集、自动指标、可执行代码检查以及几何或设计意图评估，且在匹配条件下专用模型较强，在分布偏移下泛化较弱。
  - 关键差异：系统在输入模态、输出表示（如CadQuery脚本、构造树、B-rep接地基元或结构化程序）、监督或优化方式（监督微调、强化学习、混合IoU优化、智能体澄清）以及从几何到可制造性和交互的评估重点上存在差异。
  - 趋势演进：证据集中在2026年当前前沿，从孤立几何基准走向统一多模态多任务CAD评估和智能体澄清，越来越重视有效可执行输出与工程可用设计，而非仅看几何相似度。
  - 开放问题：独立部署和跨团队复现仍未验证；VLM设计意图评判器需要更强工程验证；延迟与交互权衡研究不足；模型排名随指标变化，缺少统一成功标准。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal CAD evaluation artifacts
      what_it_solves: Creates common evaluation surfaces across text, image, mesh,
        and point-cloud CAD program generation, exposing failures from code validity
        to engineering-ready design.
      what_remains_open: Rankings shift across metrics; manufacturability and assemblability
        judging relies on VLM rubrics with limited physical validation; independent
        cross-team reproduction is not shown.
    - line: Programmatic text-to-CAD generation agents
      what_it_solves: Converts natural language prompts into executable parametric
        CAD scripts and improves structure alignment, parameter grounding, or specification
        clarity before synthesis.
      what_remains_open: Fine-grained design intent and manufacturability remain limited;
        robustness beyond curated training data and interaction latency are unresolved.
    - line: Mesh/point-to-CAD reverse-engineering methods
      what_it_solves: Recovers editable parametric CAD construction sequences from
        meshes, point clouds, or images through incremental fitting, stepwise validation,
        or hybrid optimization.
      what_remains_open: Performance degrades with geometric complexity and modality
        shift; invalid programs still occur; operation coverage and deployment outside
        benchmark datasets are not established.
    - line: Engineering-ready B-rep assembly evaluation
      what_it_solves: Evaluates generated assemblies beyond geometry by checking code
        executability, valid geometry, and alignment with functionality, manufacturability,
        and assemblability requirements.
      what_remains_open: The judge is a VLM with human validation on limited cases;
        downstream manufacturing or physical simulation evidence is missing.
    - line: Interactive specification clarification
      what_it_solves: Reduces ambiguity errors by auditing prompts and asking targeted
        clarification questions before CAD code synthesis.
      what_remains_open: Interaction overhead and real-time serving trade-offs are
        only lightly evidenced; generalization across CAD kernels and user workflows
        is not covered.
    consensus:
    - CAD generation is treated as structured, executable program generation rather
      than unstructured shape prediction.
    - Evaluation must combine geometric fidelity, executability, and design-intent
      checks because code-valid outputs can still fail geometric or engineering criteria.
    - Specialized geometry-to-CAD methods outperform generic code-generating VLMs
      under idealized matched inputs, but no single model dominates across all metrics
      and modalities.
    - Parametric CAD operations and B-rep representations are shared substrates for
      editable, manufacturable outputs.
    disagreements:
    - Output representation varies from CadQuery scripts to construction-tree trajectories,
      text-grounded B-rep primitives, and structured program sequences.
    - 'Learning or optimization differs: supervised fine-tuning with RL, hybrid IoU-driven
      optimization, progressive hierarchical alignment, and agent-based clarification
      embed different biases.'
    - 'Evaluation targets differ: some optimize Chamfer distance and IoU, others emphasize
      executability and invalid ratio, while newer work targets functionality, manufacturability,
      and assemblability.'
    - Interaction mode differs between one-shot generation and multi-turn proactive
      clarification, with unresolved effects on latency and user burden.
    - Some works pursue a universal multi-task model across input modalities, while
      others retain specialized mesh-to-CAD, text-to-CAD, or reverse-engineering pipelines.
    open_questions:
    - Which evaluation signals best predict downstream engineering usability and manufacturability
      of generated CAD assemblies?
    - How well do these systems transfer when deployed with different CAD kernels,
      datasets, or user-specific constraints?
    - Can generic multimodal LLM or agent systems match specialized geometry-to-CAD
      methods without losing robustness under modality shift?
    - What is the acceptable interaction and latency budget for proactive clarification
      in real-time CAD workflows?
    - How can benchmarks close the gap between valid executable geometry and true
      design intent, physical function, and assembly constraints?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD评估工件
      解决的问题: 为文本、图像、网格和点云到CAD程序生成建立统一评测面，暴露从代码有效性到工程可用设计的失败级联。
      尚未覆盖: 模型排名随指标变化；可制造性与可装配性判断依赖VLM评分标准，物理验证有限；缺少跨团队独立复现证据。
    - 路线: 程序化文本到CAD生成智能体
      解决的问题: 将自然语言提示转化为可执行的参数化CAD脚本，并在合成前改善结构对齐、参数接地或规格澄清。
      尚未覆盖: 细粒度设计意图和可制造性仍有限；在有监督训练数据之外的鲁棒性以及交互延迟未解决。
    - 路线: 网格/点云到CAD逆向工程方法
      解决的问题: 通过逐步拟合、分步验证或混合优化，从网格、点云或图像中恢复可编辑的参数化CAD构建序列。
      尚未覆盖: 性能随几何复杂度和模态偏移下降；无效程序仍会发生；基准外的操作覆盖和部署尚未建立。
    - 路线: 面向工程可用的B-rep装配体评估
      解决的问题: 在代码可执行性、几何有效性和功能/可制造性/可装配性对齐层面评估生成装配体，而不仅看几何相似度。
      尚未覆盖: 评判器为VLM，仅在有限案例上做人工验证；缺少下游制造或物理仿真证据。
    - 路线: 交互式规格澄清
      解决的问题: 通过审核提示并提出有针对性的澄清问题，在CAD代码合成前减少歧义错误。
      尚未覆盖: 交互开销和实时服务权衡仅少量验证；跨CAD内核和用户工作流的泛化尚未覆盖。
    共识:
    - CAD生成被视作结构化、可执行程序生成，而不是非结构化形状预测。
    - 评估必须结合几何保真度、可执行性和设计意图检查，因为代码有效仍可能在几何或工程标准上失败。
    - 专用几何到CAD方法在理想化匹配输入下优于通用代码生成VLM，但没有单一模型在所有指标和模态上占优。
    - 参数化CAD操作和B-rep表示是可编辑、可制造输出的共享基础。
    分歧:
    - 输出表示不同，包括CadQuery脚本、构造树轨迹、文本接地的B-rep基元和结构化程序序列。
    - 学习或优化方式不同：监督微调加强化学习、混合IoU驱动优化、层次化渐进对齐和智能体澄清各有不同偏差。
    - 评测目标不同：部分优化Chamfer距离和IoU，部分强调可执行性与无效比率，较新工作转向功能性、可制造性和可装配性。
    - 交互模式不同：一次性生成与多轮主动澄清并存，对延迟和用户负担的影响尚未解决。
    - 部分工作追求跨输入模态的通用多任务模型，另一些保留网格到CAD、文本到CAD或逆向工程专用流水线。
    开放问题:
    - 哪些评估信号能最好地预测生成CAD装配体的下游工程可用性和可制造性？
    - 这些系统在不同CAD内核、数据集或用户特定约束下部署时迁移能力如何？
    - 通用多模态LLM或智能体系统能否在保持模态偏移鲁棒性的同时，匹配专用几何到CAD方法？
    - 实时CAD工作流中主动澄清的可接受交互和延迟预算是多少？
    - 基准如何弥合有效可执行几何与真实设计意图、物理功能和装配约束之间的差距？
