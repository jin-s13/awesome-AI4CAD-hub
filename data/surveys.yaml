  related_work_outline:
  - 'Mainstream direction: Unified parametric CAD generation and evaluation is moving
    toward multimodal benchmarks that combine geometric fidelity, program executability,
    and engineering intent checks.'
  - 'Shared research pattern: Work couples CAD program generation or reconstruction
    with datasets and metrics that stress validity, geometry, and downstream design
    quality rather than surface similarity alone.'
  - 'Key differences: Some settings evaluate mesh-to-CAD reverse engineering, while
    others target text-to-CAD assemblies; evaluation ranges from IoU and Chamfer distance
    to VLM-judged manufacturability, functionality, and assemblability.'
  - 'Trend evolution: The available evidence is concentrated in the current frontier,
    shifting from single-task generation toward assembly-aware, multimodal, and interactive
    or clarification-based CAD evaluation.'
  - 'Open questions: Ranking stability across metrics and modalities, alignment of
    proxy metrics with engineering decisions, VLM judge reliability, real-world distribution
    coverage, and unreported limitations or artifacts remain verification gaps.'
  related_work_outline_zh:
  - 主流方向：统一参数化CAD生成与评测正在走向多模态基准，同时考虑几何保真度、程序可执行性和工程意图。
  - 研究共性：工作将CAD程序生成或重建与数据集、指标结合，强调有效性、几何质量和下游设计质量，而非仅限于表面相似度。
  - 关键差异：部分设置评估网格到CAD逆向工程，部分面向文本到CAD装配体；评测从IoU、Chamfer距离到VLM判断的可制造性、功能性、可装配性不等。
  - 趋势演进：现有证据集中在当前前沿，正从单任务生成转向装配感知、多模态和主动澄清式CAD评测。
  - 开放问题：跨指标和模态排名稳定性、代理指标与工程决策对齐、VLM评判可靠性、真实分布覆盖，以及未报告限制与工件仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal CAD benchmark construction
      what_it_solves: Provides shared evaluation surfaces across mesh, image, text,
        sketch, and point-cloud inputs and across multiple CAD tasks.
      what_remains_open: Whether the curated task distribution covers real noisy,
        deployed, or assembly-level settings, and whether rankings remain stable across
        metrics and modality shifts.
    - line: Engineering-intent evaluation with design specification rubrics
      what_it_solves: Moves evaluation beyond executable geometry to manufacturability,
        functionality, and assemblability using staged checks and a VLM judge.
      what_remains_open: VLM judge reliability is only partially supported by human
        annotation, and alignment with real downstream engineering approval remains
        unshown.
    - line: Geometric reconstruction and stress testing of parametric CAD programs
      what_it_solves: Recovers editable CAD construction sequences from 3D meshes
        and reports fidelity or validity on shared datasets.
      what_remains_open: Generalization under increased geometric complexity and noisy
        or multi-modal inputs is not fully bounded by the available evidence.
    - line: Structurally grounded and interactive text-to-CAD generation
      what_it_solves: Improves structural consistency, parameter accuracy, and ambiguity
        handling before CAD program synthesis.
      what_remains_open: Real-world prompt coverage, interaction overhead, and consistent
        benefit across different model families need further evidence.
    consensus:
    - Parametric, editable CAD outputs are preferred over raw mesh or surface-only
      outputs.
    - Evaluation should combine code validity, geometric fidelity, and design-intent
      or engineering-quality signals.
    - Performance degrades with geometric complexity and under changes in input modality.
    - Model rankings are sensitive to the chosen metric, so single-metric conclusions
      are insufficient.
    - Recent work increasingly uses large language or multimodal models for CAD program
      generation, but specialized or stepwise methods can still outperform on idealized
      geometry-to-CAD tasks.
    disagreements:
    - Some work evaluates mesh-to-CAD reverse engineering with geometric metrics,
      while other work evaluates text-to-CAD assemblies with manufacturability, functionality,
      and assemblability rubrics.
    - Some systems use a single unified multimodal model end to end, while others
      combine grounded modules, stepwise construction, or optimization over structured
      CAD programs.
    - 'Ambiguous text is handled differently: one line treats clarification as an
      interactive pre-generation step, while others assume a fixed prompt and focus
      on generation fidelity.'
    - Evaluation authority varies between geometric or executable checks, design-specific
      rubrics judged by a VLM, and human validation reliability evidence.
    open_questions:
    - Which proxy metrics align with the engineering decisions that downstream CAD
      users actually need?
    - Do benchmark conclusions remain stable across different implementations, compute
      budgets, and dataset sampling choices?
    - How reliable are VLM judges for fine-grained design intent beyond the reported
      human validation?
    - Does the current benchmark distribution cover noisy, real-world, and assembly-level
      CAD scenarios sufficiently?
    - Limitation fields and artifact availability are not reported for several entries,
      so boundary conditions and reproducibility remain unverified.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD基准构建
      解决的问题: 在网格、图像、文本、草图和点云等输入以及多种CAD任务之间提供统一评测与可比性。
      尚未覆盖: 当前任务分布是否覆盖真实噪声、部署场景和装配级设置，以及排名在指标与模态变化下是否稳定仍需证明。
    - 路线: 基于设计规范量规的工程意图评测
      解决的问题: 将评测从可执行几何扩展到可制造性、功能性与可装配性，采用分阶段检查与VLM评判。
      尚未覆盖: VLM评判可靠性仅得到部分人工标注支持，与真实下游工程审批之间的对齐尚未充分证明。
    - 路线: 参数化CAD程序的几何重建与压力测试
      解决的问题: 从3D网格恢复可编辑CAD构建序列，并在共享数据集上报告保真度与有效性。
      尚未覆盖: 在更高几何复杂度以及噪声或多模态输入下的泛化边界，现有证据尚未充分覆盖。
    - 路线: 结构化接地与交互式文本到CAD生成
      解决的问题: 在CAD程序合成前改善结构一致性、参数准确性以及对模糊需求的处理。
      尚未覆盖: 真实提示分布覆盖、交互开销以及跨模型族的稳定收益仍需更多证据。
    共识:
    - 参数化、可编辑的CAD输出优于仅输出网格或仅看表面相似度。
    - 评测应同时结合代码有效性、几何保真度以及设计意图或工程质量信号。
    - 性能会随几何复杂度上升以及输入模态变化而下降。
    - 模型排名对所选指标敏感，单一指标结论不足。
    - 近期工作越来越多使用大语言或多模态模型生成CAD程序，但专用或逐步式方法在理想化几何到CAD任务上仍可能更强。
    分歧:
    - 部分工作评测网格到CAD逆向工程并使用几何指标，另一部分则面向文本到CAD装配体并使用可制造性、功能性与可装配性量规。
    - 部分系统使用单一统一多模态模型端到端处理，另一部分则组合接地模块、逐步构建或对结构化CAD程序做优化。
    - 对模糊文本的处理方式不同：一条路线将澄清作为生成前的交互步骤，另一些路线假定给定提示并专注于生成保真度。
    - 评测权威来源在几何或可执行检查、由VLM判断的设计量规与人工验证证据之间有所不同。
    开放问题:
    - 哪些代理指标真正对齐下游CAD用户需要的工程决策？
