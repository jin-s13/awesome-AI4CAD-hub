  literature_review:
    line_of_work_matrix:
    - line: Multimodal benchmarks for AI-assisted CAD program generation and evaluation
      what_it_solves: Standardizes evaluation across text, image, and 3D inputs; separates
        code executability, geometric validity, and design-intent or engineering readiness.
      what_remains_open: Generalization to unseen part families and real manufacturing
        workflows, plus reliable automated design-intent assessment.
    - line: LLM-driven text-to-CAD program generation with structural grounding
      what_it_solves: Translates natural language design specifications into executable
        parametric CAD scripts using hierarchy, grounding, or specification clarification.
      what_remains_open: Stable handling of fine-grained engineering constraints,
        complex assemblies, and generalization beyond curated training distributions.
    - line: Latent or sequence generative modeling for parametric CAD
      what_it_solves: Learns self-supervised latent representations and generates
        long parametric CAD sequences without relying only on language supervision.
      what_remains_open: Whether long-sequence validity transfers to complex topology,
        editability, and distribution shift under modality or geometric complexity
        changes.
    - line: Differentiable parametric surface and B-Rep representation learning
      what_it_solves: Produces editable B-Rep from point-level supervision without
        CAD-specific annotations, supporting text, image, and point modalities.
      what_remains_open: Scaling to assemblies and engineering constraints beyond
        geometry-oriented benchmarks such as ABC and Objaverse.
    consensus:
    - The field distinguishes code executability, geometric validity, and design-intent
      or engineering readiness; success at one stage does not guarantee downstream
      success.
    - Editable B-Rep or parametric CAD is the shared target representation, rather
      than only mesh or point-cloud output.
    - Multiple metrics are necessary because model rankings change across geometric,
      executability, and compactness-style measures.
    - Models perform better under idealized or curated inputs and become brittle under
      complex geometry or modality shift.
    disagreements:
    - 'Representation and supervision differ: differentiable parametric patches, LLM-generated
      scripts, and latent sequence models use different training signals and assumptions.'
    - 'Evaluation targets differ: some work prioritizes geometric fidelity and executability,
      while other work targets manufacturability, assemblability, design-intent alignment,
      or industrial code editing.'
    - 'Interaction mode differs: some approaches generate in a single pass, while
      others introduce proactive clarification before code synthesis.'
    - 'Data setting differs: curated text-to-CAD datasets, large unannotated 3D data,
      and industrial part-family program collections create different generalization
      conditions.'
    open_questions:
    - Can current text-to-CAD methods generalize to unseen part families and real
      manufacturing constraints rather than only improving in-distribution performance?
    - When is proactive clarification necessary, and how can ambiguity be resolved
      with low interaction overhead?
    - Can differentiable B-Rep representations scale to complex assemblies and arbitrary
      topology while remaining editable?
    - When multiple metrics conflict, which metrics predict real engineering utility?
    - Several ranked papers lack visible code, dataset, metric, or limitation details;
      how much do these reproducibility gaps affect the claimed state-of-the-art results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态程序化CAD基准
      解决的问题: 统一评估文本、图像和3D输入下的可执行性、几何有效性与设计意图或工程就绪度。
      尚未覆盖: 对未见零件族和真实制造流程的泛化，以及可靠的设计意图自动评估。
    - 路线: LLM驱动的文本到CAD程序生成
      解决的问题: 通过层次结构、接地或规格澄清，将自然语言设计规格转换为可执行参数化CAD脚本。
      尚未覆盖: 细粒度工程约束、复杂装配以及在精选训练分布之外的稳定泛化。
    - 路线: 潜变量或序列生成模型
      解决的问题: 学习自监督潜变量表示，并生成长参数化CAD序列。
      尚未覆盖: 长序列有效性是否能在复杂拓扑、可编辑性和分布偏移下保持。
    - 路线: 可微参数曲面与B-Rep表示学习
      解决的问题: 从点级监督生成可编辑B-Rep，无需CAD专用标注，支持文本、图像和点输入。
      尚未覆盖: 扩展到装配体和超越ABC、Objaverse等几何基准的工程约束。
    共识:
    - 研究普遍区分代码可执行性、几何有效性与设计意图或工程就绪度，三者存在失败级联。
    - 当前共享目标是生成可编辑的B-Rep或参数化CAD，而非仅输出网格或点云。
    - 多指标评测被接受，因为模型排名会随几何、可执行性和紧凑性等指标变化。
    - 模型在理想化或精选输入下表现较好，但在复杂几何或模态转移下会明显变脆弱。
    分歧:
    - 表示与监督不同：可微参数面片、LLM生成脚本和潜变量序列模型使用不同的训练信号和假设。
    - 评测目标不同：有的关注几何保真度和可执行性，有的关注可制造性、可装配性、设计意图对齐或工业代码编辑。
    - 交互模式不同：有的方法单次生成，有的在代码合成前主动澄清。
    - 数据设置不同：精选文本到CAD数据集、大规模未标注3D数据和工业零件族程序集形成不同的泛化条件。
    开放问题:
    - 当前文本到CAD方法能否泛化到未见零件族和真实制造约束，而不仅仅是提升分布内性能？
    - 何时需要主动澄清，如何在低交互开销下解决模糊规格？
    - 可微B-Rep表示能否扩展到复杂装配和任意拓扑并保持可编辑性？
    - 多个指标冲突时，哪些指标能预测真实工程有效性？
    - 部分论文缺少可见的代码、数据集、指标或局限性细节，这些可复现性缺口会在多大程度上影响最先进结论？
