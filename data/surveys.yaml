  related_work_outline:
  - 'Mainstream direction: Building unified multimodal benchmarks and large-model
    methods for parametric CAD program generation and reconstruction, with 2026 evidence
    centering on text/mesh/image-to-CAD and CAD question answering.'
  - 'Shared research pattern: Representing CAD as executable parametric programs or
    construction sequences, then aligning text, image, mesh, or point-cloud inputs
    to geometry through LLMs, hierarchical reasoning, hybrid optimization, or agentic
    clarification.'
  - 'Key differences: Input modality and task scope; supervision or training strategy;
    evaluation emphasis on geometric fidelity, executability, or engineering readiness;
    and interaction mode from single-shot generation to clarification.'
  - 'Trend evolution: Within the current 2026 frontier, work is moving from task-specific
    mesh-to-CAD or text-to-CAD toward unified multi-task and multimodal models and
    benchmarks that add manufacturability, assemblability, and agentic interaction
    to evaluation.'
  - 'Open questions: How to preserve validity and design intent under noisy or ambiguous
    inputs, whether unified models can match specialized reconstructors on complex
    B-rep geometry, and which evaluation protocol predicts production-ready CAD.'
  related_work_outline_zh:
  - 主流方向：构建统一多模态基准和大模型方法，用于参数化CAD程序生成与重建；2026年证据集中在文本/网格/图像到CAD及CAD问答。
  - 研究共性：将CAD表示为可执行参数化程序或构造序列，通过LLM、层次推理、混合优化或主动澄清，将文本、图像、网格或点云输入对齐到几何。
  - 关键差异：输入模态与任务范围、监督或训练策略、评价重点（几何保真、可执行性或工程就绪）以及交互方式存在差异。
  - 趋势演进：在当前2026年前沿内，从单一任务的网格到CAD或文本到CAD走向统一多任务多模态模型和基准，并加入可制造性、可装配性和智能体交互评估。
  - 开放问题：噪声或模糊输入下如何保持有效性和设计意图；统一模型能否在复杂B-rep几何上匹敌专用重建方法；哪个评估协议能预测生产级CAD。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal CAD benchmarks and evaluation protocols
      what_it_solves: Providing controlled sample stratification, input modalities,
        and metrics for comparing CAD program generation across geometric complexity
        and task settings.
      what_remains_open: Whether benchmark rankings and failure modes transfer to
        noisy real-world engineering workflows; missing code, dataset, or artifact
        signals leave verification gaps.
    - line: LLM-based text-to-CAD program generation with grounded parameter and structure
        reasoning
      what_it_solves: Converting text prompts into executable parametric CAD programs
        with better topology and parameter consistency.
      what_remains_open: Evidence mostly reports aggregate state-of-the-art; robustness
        to ambiguous specifications, real-world text diversity, and the isolated contribution
        of grounding or reinforcement-learning modules remain unclear.
    - line: Mesh/image-to-CAD reverse engineering by stepwise or optimization-based
        reconstruction
      what_it_solves: Recovering editable parametric CAD operations and construction
        sequences from meshes or images with improved geometric fidelity and validity.
      what_remains_open: Scalability beyond evaluated part families, sensitivity to
        noisy or photorealistic modalities, and how intermediate geometric comparison
        generalizes remain unresolved.
    - line: Universal multimodal multi-task CAD models
      what_it_solves: Handling point-to-CAD reconstruction, text/image-to-CAD generation,
        and CAD question answering in one end-to-end framework.
      what_remains_open: Cross-task transfer and whether single-model generality loses
        accuracy against specialized mesh-to-CAD under complex geometry are not established.
    - line: Agentic interaction and clarification for CAD program synthesis
      what_it_solves: Reducing specification errors by auditing and clarifying ambiguous
        prompts before code synthesis.
      what_remains_open: Evidence is limited to curated text-to-CadQuery data and
        a specific baseline; multi-turn robustness, interaction overhead, and integration
        with other CAD tasks are not established.
    consensus:
    - The target representation is an executable parametric CAD program or construction
      sequence rather than only a mesh or point cloud.
    - Evaluation commonly includes geometric fidelity and program validity or executability,
      with increasing use of multimodal inputs.
    - Specialized CAD reconstruction methods and general LLM/VLM-based methods are
      compared directly, revealing that model ranking can change with metric and modality.
    - There is a recognized failure cascade from executable code to valid geometry
      to engineering-ready design.
    disagreements:
    - 'Evaluation target: geometric fidelity metrics versus executability or invalid
      ratio versus manufacturability, functionality, and assemblability.'
    - 'Supervision: supervised fine-tuning plus reinforcement learning versus structure-aligned
      and parameter-grounded training versus optimization-based fitting.'
    - 'Generation strategy: direct script generation, hierarchical trajectory reasoning,
      stepwise feature construction, or proactive clarification before synthesis.'
    - 'Model scope: task-specific CAD models versus a single multimodal multi-task
      model, with trade-offs between reliability and generalization.'
    - 'Interaction mode: single-turn generation from a complete prompt versus agentic
      clarification that asks follow-up questions.'
    open_questions:
    - Which evaluation criteria, beyond geometric similarity and executability, best
      predict manufacturable and assemblable CAD?
    - Can unified multimodal models match task-specific mesh-to-CAD models on complex
      B-rep geometry and under noisy or photorealistic inputs?
    - How well do proactive clarification and grounding strategies transfer beyond
      curated CAD datasets to real-world design specifications?
    - What part of text-to-CAD gains comes from the LLM, grounding module, training
      data, or reinforcement-learning stage rather than from the surrounding system?
    - Are benchmark rankings stable across geometric complexity, input modality, and
      metric definitions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD基准与评估协议
      解决的问题: 提供受控样本分层、多种输入模态和指标，比较不同复杂度与任务下的CAD程序生成。
      尚未覆盖: 基准排名与失败模式能否迁移到噪声真实工程流程仍未知；缺少代码、数据集或工件信号形成验证缺口。
    - 路线: 基于LLM并带有结构与参数接地的文本到CAD程序生成
      解决的问题: 将文本提示转换为可执行参数化CAD程序，并提高拓扑和参数一致性。
      尚未覆盖: 多数证据只给聚合的最先进结果；对模糊规格、真实文本多样性以及强化学习或接地模块的独立贡献尚未隔离。
    - 路线: 基于逐步或优化策略的网格/图像到CAD逆向工程
      解决的问题: 从网格或图像恢复可编辑参数化CAD操作和构建序列，提高几何保真度和有效性。
      尚未覆盖: 在已评测零件族之外的可扩展性、对噪声或逼真模态的敏感性，以及中间几何比较的泛化性仍不清楚。
    - 路线: 统一多模态多任务CAD模型
      解决的问题: 在单一端到端框架中处理点云到CAD、文本/图像到CAD与CAD问答。
      尚未覆盖: 跨任务迁移以及单模型通用性在复杂几何下是否会损失专用方法的精度仍未证实。
    - 路线: 面向CAD程序合成的主动式交互与澄清
      解决的问题: 在代码合成前审核并澄清模糊提示，减少规格错误。
      尚未覆盖: 证据局限于精选的文本到CadQuery数据和特定基线；多轮回鲁棒性、交互开销及与其他CAD任务的集成尚未建立。
    共识:
    - 目标表示是可执行参数化CAD程序或构建序列，而不只是网格或点云。
    - 评估通常同时包含几何保真度和程序有效性/可执行性，并越来越多地使用多模态输入。
    - 专用CAD重建方法与通用LLM/VLM方法被直接比较，结果表明模型排名会随指标和模态变化。
    - 存在从可执行代码到有效几何再到工程就绪设计的失败级联。
    分歧:
    - 评测目标不同：几何保真度、可执行性/无效率，还是可制造性、功能性与可装配性。
    - 监督方式不同：监督微调加强化学习、结构与参数接地训练，或基于优化的拟合。
    - 生成策略不同：直接脚本生成、层次轨迹推理、逐步特征构造或合成前主动澄清。
    - 模型范围不同：任务专用CAD模型与单一多模态多任务模型之间存在可靠性与泛化取舍。
    - 交互模式不同：基于完整提示的单轮生成与主动提出后续问题的智能体澄清。
    开放问题:
    - 除几何相似度和可执行性外，哪些评估标准能最好地预测可制造和可装配的CAD？
    - 统一多模态模型能否在复杂B-rep几何以及噪声或逼真输入下匹敌专用网格到CAD模型？
    - 主动澄清和接地策略能多好地迁移到真实世界设计规格，而不是仅限于精选CAD数据集？
    - 文本到CAD的收益中有多少来自LLM、接地模块、训练数据或强化学习阶段，而不是周边系统选择？
    - 基准排名在几何复杂度、输入模态和指标定义上是否稳定？
