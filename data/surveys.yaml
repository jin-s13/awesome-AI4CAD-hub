      解决的问题: 利用新颖架构（状态空间模型）和可微分参数曲面，从无标注3D数据中学习或处理长参数化序列。
      尚未覆盖: 评估主要集中在几何保真度；与多模态基准和真实工程约束的集成尚未得到展示。
