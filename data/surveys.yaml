  related_work_outline_zh:
  - 主流方向：证据集中在2026年的程序化/文本到CAD生成与基准构建，而非孤立的形式化几何理论。
  - 研究共性：系统将文本、图像、网格或点云映射到可执行CAD程序或可编辑B-Rep，并以几何保真度、可执行性和设计意图评分进行评估。
  - 关键差异：CADBench、MUSE、BenchCAD等偏重评测与失败级联分析；FutureCAD、HierCAD、ProCAD、Mamba-CAD、DreamCAD等偏重生成架构与训练信号。
  - 趋势演进：当前前沿从理想化重建扩展至可制造性、可装配性、多模态转换和主动澄清。
  - 开放问题：基准收益能否迁移到未见零件族、形式约束能否替代VLM评判、长序列B-Rep生成如何在稀缺标注下扩展，仍有待验证。
  literature_review:
    line_of_work_matrix:
    - line: Unified CAD program generation benchmarks
      what_it_solves: Controlled comparison of image/3D-to-CAD and text-to-CAD models
        across modalities, geometric complexity, execution validity, and design-intent
        rubrics.
      what_remains_open: Evidence that benchmark rankings transfer to unseen part
        families and from idealized inputs to industrial deployment; formal geometric
        constraint coverage is not directly addressed.
    - line: LLM and agentic text-to-CAD program synthesis
      what_it_solves: Translating natural language or clarified specifications into
        executable CAD programs and grounding language to B-Rep primitives.
      what_remains_open: Fine-grained engineering criteria remain hard; ambiguity
        handling and code synthesis rely on curated high-quality datasets and interaction
        overhead.
    - line: Parametric, B-Rep, and state-space generative modeling
      what_it_solves: Learning generative mappings from text, image, point clouds,
        or latent representations to editable parametric CAD/B-Rep outputs, including
        longer sequences.
      what_remains_open: Long-sequence scalability, point-supervision without CAD
        annotations, and robustness under modality shift are not yet fully validated.
    - line: Engineering-oriented design-intent evaluation
      what_it_solves: Assessing manufacturability, functionality, and assemblability
        via staged code, geometry, and design-intent alignment checks.
      what_remains_open: Whether automated VLM-judge rubrics match human engineering
        judgment and whether they change model design choices.
    - line: Formal geometric representation and constraint analysis
      what_it_solves: Would clarify representation choices and formal constraints
        for parametric CAD, B-Rep, and design reasoning.
      what_remains_open: The available top-paper evidence does not directly address
        formal geometric theory; this remains a verification gap.
    consensus:
    - Executable programmatic CAD and editable B-Rep outputs are treated as a shared
      interface for studying generative CAD.
    - Evaluation must be multidimensional because models are ranked differently by
      geometric fidelity, executability, and program compactness.
    - Frontier models often recover coarse outer geometry but miss fine 3D structure,
      parameter semantics, and complex operations such as sweeps and lofts.
    - Fine-tuning, reinforcement learning, or curation improves in-distribution performance
      but leaves out-of-distribution part-family generalization limited.
    disagreements:
    - 'Approach: program synthesis via LLMs versus state-space/latent generative modeling
      versus differentiable parametric surface fitting.'
    - 'Supervision: curated CAD code and reinforcement/ranking signals versus point-level
      supervision on unannotated 3D data.'
    - 'Evaluation target: idealized geometric reconstruction versus multimodal robustness
      versus downstream design-intent engineering properties.'
    - 'Interaction: proactive clarification before generation versus direct generation
      from possibly ambiguous prompts.'
    open_questions:
    - Do results from current CAD benchmarks predict performance on unseen industrial
      part families and real engineering workflows?
    - Can formal geometric constraint checks replace or supplement VLM-based design-intent
      rubrics?
    - Why do model rankings change across metrics, and which evaluation setting should
      govern deployment?
    - How can long-sequence parametric CAD generation scale without scarce execution-verified
      and CAD-annotated data?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一CAD程序生成基准
      解决的问题: 对图像/3D到CAD和文本到CAD模型进行受控比较，覆盖模态、几何复杂度、执行有效性和设计意图评分。
      尚未覆盖: 基准排名能否迁移到未见工业零件族及部署环境证据不足；形式几何约束覆盖不足。
    - 路线: LLM与智能体式文本到CAD程序合成
      解决的问题: 将自然语言或澄清后的规格转换为可执行CAD程序，并实现语言到B-Rep基元的接地。
      尚未覆盖: 细粒度工程标准仍难实现；模糊处理依赖高质量代码数据和交互成本。
    - 路线: 参数化、B-Rep与状态空间生成建模
      解决的问题: 从文本、图像、点云或潜在表示学习可编辑参数化CAD/B-Rep输出的生成映射。
      尚未覆盖: 长序列扩展、无CAD标注的点级监督、模态转换鲁棒性尚未充分验证。
    - 路线: 面向工程的设计意图评估
      解决的问题: 通过分阶段代码、几何和设计意图对齐检查评估可制造性、功能性和可装配性。
      尚未覆盖: 自动化VLM评判是否匹配人工工程判断，是否能反向改变模型设计尚未确认。
    - 路线: 形式化几何表示与约束分析
      解决的问题: 可澄清参数化CAD、B-Rep和设计推理的表示选择与形式约束。
      尚未覆盖: 可见的顶级论文证据未直接处理形式几何理论，属于验证缺口。
    共识:
    - 可执行程序化CAD和可编辑B-Rep输出被视作研究生成式CAD的共同接口。
    - 评估必须是多维的，因为模型在几何保真度、可执行性和程序紧凑性上排名不一致。
    - 前沿模型通常能恢复粗略外形，但常忽略精细三维结构、参数语义以及扫掠、放样等复杂操作。
    - 微调、强化学习或数据治理能改善分布内表现，但对未见零件族的泛化仍然有限。
    分歧:
    - 方法路线：基于LLM的程序合成、状态空间/潜在生成建模、可微分参数曲面拟合之间存在不同选择。
    - 监督信号：精选CAD代码与强化/排序信号，与未标注3D点云监督之间存在差异。
    - 评测目标：理想化重建、多模态鲁棒性与下游工程属性之间存在不同侧重。
    - 交互模式：生成前主动澄清与直接接受模糊提示生成之间存在分歧。
    开放问题:
    - 当前CAD基准上的结果能否预测未见工业零件族和真实工程流程中的表现？
    - 形式几何约束检查能否替代或补充基于VLM的设计意图评分？
    - 为何模型在不同指标上排名变化？部署时应以哪个评测设置为准？
    - 在缺乏执行验证和CAD标注数据的情况下，如何扩展长序列参数化CAD生成？
