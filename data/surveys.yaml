  related_work_outline:
  - 'Mainstream direction: Constructing multi-modal CAD benchmarks that unify evaluation
    across geometric fidelity, executability, and manufacturability constraints to
    make AI-assisted CAD generation models comparable.'
  - 'Shared research pattern: Large-scale benchmarking with multiple metrics uncovers
    failure modes related to geometric complexity, modality shift, and ambiguous prompts,
    showing that model rankings change across metrics.'
  - 'Key differences: Evaluation granularity ranges from geometric similarity to design-intent
    alignment and engineering constraints; input modalities span text, images, meshes,
    and point clouds; interaction modes include one-shot generation and proactive
    clarification.'
  - 'Trend evolution: Within the 2026 frontier, benchmarks are rapidly moving from
    single-modal geometric evaluation toward multi-dimensional engineering-aware benchmarks
    that incorporate manufacturing checks and interactive evaluation.'
  - 'Open questions: Whether current benchmarks cover real design iteration, how proxy
    metrics align with downstream engineering decisions, and whether benchmark conclusions
    remain stable across implementations and compute budgets.'
  related_work_outline_zh:
  - 主流方向：构建多模态CAD基准，统一评估几何保真度、可执行性和制造约束，使AI辅助CAD生成模型具备可比性。
  - 研究共性：通过大规模基准测试和多指标评估，揭示模型在几何复杂度、模态转换和模糊输入下的失败模式，且模型排名随指标变化。
  - 关键差异：评估粒度从几何相似度扩展到设计意图对齐和工程约束；输入模态包括文本、图像、网格、点云；交互方式分为一次性生成和主动澄清。
  - 趋势演进：在2026年这一前沿年份内，基准正从单一几何评估迅速转向纳入制造检验和交互式评估的多维工程级基准。
  - 开放问题：现基准是否覆盖真实设计迭代，代理指标与下游工程决策的一致性，以及基准结论在不同实现和算力下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design (e.g., CADBench, MUSE, UniCAD)
      what_it_solves: Creating shared tasks and multi-modal datasets so that CAD generation
        models—from code-generating VLMs to specialized mesh-to-CAD systems—can be
        compared under standardized conditions.
      what_remains_open: Whether the task distributions cover the full range of real-world
        CAD workflows, including iterative design, complex assemblies, and manufacturing
        constraints that go beyond the current benchmark families.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction robustness, controllability, and design-intent
        alignment beyond aggregate geometric scores by using multi-metric suites (executability,
        geometric fidelity, program compactness) and engineering-stage evaluation
        protocols.
      what_remains_open: Alignment between proxy metrics (e.g., VLM judge scores,
        invalid ratio) and the downstream engineering decisions users actually care
        about, and the reliability of those metrics under distribution shift.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable through common evaluation protocols,
        large-scale model comparisons, and unified benchmarks that expose failure
        cascades and ranking instability.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations, compute budgets, and reporting practices; standardized failure
        analysis is still missing.
    consensus:
    - Evaluating CAD generation requires going beyond geometric similarity to include
      executability, manufacturing constraints, and design-intent alignment.
    - Multi-metric evaluation is essential because model rankings change depending
      on the metric, exposing brittle performance.
    - Current state-of-the-art models, including powerful LLMs, still show limited
      success on fine-grained engineering criteria, revealing a failure cascade from
      executable code to valid geometry to engineering-ready design.
    disagreements:
    - 'How to assess design intent: some works rely on automatic geometric metrics
      and program validity, while others introduce VLM judges with design-specific
      rubrics.'
    - Whether the input modality should be fixed (text-only, mesh-only) or unified
      multi-modal, and how to handle the brittleness under modality shift.
    - Whether generation should be a one-shot process or an interactive loop with
      proactive clarification to resolve ambiguous specifications.
    open_questions:
    - How can benchmarks be extended to cover real-world iterative design processes
      and complex assembly constraints beyond the current curated datasets?
    - What is the reliability of VLM-based judges for engineering assessment, and
      how do they correlate with human expert evaluations?
    - How can we ensure that model rankings and failure analyses remain consistent
      across different software environments, compute budgets, and engineering domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计（如 CADBench、MUSE、UniCAD）
      解决的问题: 创建共享任务和多模态数据集，使代码生成VLM和专用网格到CAD模型等不同方法在标准化条件下可比较。
      尚未覆盖: 任务分布是否覆盖真实世界CAD工作流的全部范围，包括迭代设计、复杂装配体和超出当前基准家族的制造约束。
    - 路线: 指标与压力测试设计
      解决的问题: 在聚合几何得分之外，通过多指标套件（可执行性、几何保真度、程序紧凑性）和工程阶段评估协议，检验预测的鲁棒性、可控性和设计意图对齐。
      尚未覆盖: 代理指标（如VLM评判分数、无效比率）与用户真正关心的下游工程决策之间的一致性，以及这些指标在分布偏移下的可靠性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一评估协议、大规模模型比较和揭示失败级联与排名不稳定性的共享基准，使结果可审计。
      尚未覆盖: 基准结论在不同实现、算力预算和报告实践下是否稳定；标准化的失败分析仍然缺失。
    共识:
    - 评估CAD生成需要超越几何相似度，纳入可执行性、制造约束和设计意图对齐。
    - 多指标评估至关重要，因为模型排名随指标变化，暴露出脆弱的性能。
    - 当前最先进的模型，包括强大的LLM，在细粒度工程标准上依然表现有限，揭示了从可执行代码到有效几何再到工程就绪设计的失败级联。
    分歧:
    - 如何评估设计意图：部分工作依赖自动几何指标和程序有效性，另一些引入基于设计评分标准的VLM评判器。
    - 输入模态应固定（纯文本、纯网格）还是统一为多模态，以及如何处理模态转换下的脆弱性。
    - 生成应是一次性过程还是需要主动澄清的交互循环，以解决模糊的规格描述。
    开放问题:
    - 如何将基准扩展到真实世界的迭代设计过程和复杂装配体约束，而不仅限于当前精心策划的数据集？
    - 基于VLM的工程评估评判器的可靠性如何，其与人类专家评估的相关性怎样？
    - 如何确保模型排名和失败分析在不同软件环境、算力预算和工程领域下保持一致？
