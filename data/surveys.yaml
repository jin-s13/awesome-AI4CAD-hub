  related_work_outline_zh:
  - 主流方向：当前前沿集中在AI辅助的参数化CAD程序生成与重建，以及多模态基准和统一模型。
  - 研究共性：以可执行CAD脚本/程序为表示，结合几何验证与评测；多模态输入趋同；强调无效程序减少。
  - 关键差异：生成方式包括LLM代码生成、混合几何优化、逐步逆向工程和主动澄清智能体；评测目标从几何保真到可制造性/装配性存在差异。
  - 趋势演进：证据中的代表性论文高度集中在2026年，趋势表现为统一多模态基准、反馈/智能体流程在当前前沿内整合。
