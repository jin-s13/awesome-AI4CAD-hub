  - 'Mainstream direction: The evidence is dominated by methods and benchmarks that
    generate editable parametric CAD programs from text, images, meshes, and point
    clouds, with unification across modalities and tasks.'
  - 'Shared research pattern: Systems model CAD as structured scripts or construction
    sequences, optimize for executability and geometric fidelity, and evaluate on
    code validity, reconstruction error, and increasingly engineering intent.'
  - 'Key differences: They split by task conditioning, optimization or supervision
    strategy, and evaluation target; some target single-pass generation, some iterative
    reconstruction, and some proactive clarification, while benchmarks emphasize different
    criteria such as manufacturability versus geometric metrics.'
  - 'Trend evolution: Within the available 2026-heavy evidence, long-term trends cannot
    be inferred; the current frontier is moving from single-task reconstruction toward
    unified multimodal multi-task models and from geometric-only scoring toward design-intent
    and manufacturability evaluation.'
  - 'Open questions: The packet leaves open whether metric and ranking differences
    generalize, whether agentic clarification scales to real CAD workflows, and whether
    reported gains reproduce across teams and infrastructure without uniform artifacts.'
  related_work_outline_zh:
  - 主流方向：证据主要集中于从文本、图像、网格和点云生成或重建可编辑参数化CAD程序的方法与基准，并趋向多模态多任务统一。
  - 研究共性：将CAD建模为结构化脚本或构建序列，强调可执行性、几何保真度与程序有效性，并在统一评测中比较。
  - 关键差异：任务条件、监督或优化策略和评测目标不同；系统分为单轮生成、逐步逆向重建和主动澄清，基准在几何指标与可制造性等工程意图之间侧重不同。
  - 趋势演进：在可用证据偏重当前前沿的情况下，趋势是从单任务重建走向统一多模态多任务，从几何评分走向设计意图和可制造性评估。
  - 开放问题：指标与模态变化下排名是否稳定、主动澄清能否扩展到真实CAD工作流、以及缺少统一工件时跨团队复现性如何，仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Parametric CAD program generation and reverse engineering from heterogeneous
        conditions
      what_it_solves: Converts text, images, meshes, sketches, and point clouds into
        editable, executable parametric CAD programs or construction sequences.
      what_remains_open: Robustness under modality shift, geometric complexity, and
        independent reproduction outside reported benchmark distributions remains
        weakly evidenced.
    - line: Benchmark and evaluation suites for CAD generation systems
      what_it_solves: Measures code executability, geometric fidelity, program compactness,
        and engineering intent such as manufacturability, functionality, and assemblability.
      what_remains_open: Metric rankings can conflict across evaluation dimensions,
        and learned judge reliability plus cross-dataset and cross-infrastructure
        reproduction remain verification gaps.
    - line: Agentic interactive CAD workflows
      what_it_solves: Resolves ambiguous specifications through proactive clarification
        before CAD program synthesis, reducing invalid programs and improving robustness.
      what_remains_open: The evidence does not show scaling to complex real-world
        CAD sessions, user-specific constraints, or deployment environments with higher
        interaction overhead.
    consensus:
    - CAD generation is framed around structured parametric programs or construction
      sequences rather than only static geometry outputs.
    - Executability, program validity, and geometric consistency are treated as necessary
      evaluation dimensions across the analyzed systems.
    - The output target remains editable parametric CAD, even when systems accept
      multimodal inputs or unify multiple tasks.
    disagreements:
    - 'Evaluation emphasis differs: some works focus on reconstruction error and program
      validity, while others add manufacturability, functionality, and assemblability
      criteria.'
    - 'Optimization and supervision differ: supervised fine-tuning with reinforcement
      learning, hierarchical structure alignment, hybrid IoU optimization, stepwise
      geometry comparison, and agentic clarification training coexist.'
    - 'Interaction mode differs: single-pass generation, proactive clarification before
      synthesis, and iterative reconstruction from geometry imply different system
      assumptions.'
    - 'Coverage differs: some systems target a single conditioning modality or task,
      while others attempt unified multimodal multi-task handling.'
    open_questions:
    - Which evaluation targets best predict usable engineering output when model rankings
      change across geometric metrics and design-intent criteria?
    - Can proactive clarification remain low-overhead and robust when user specifications
      are incomplete, conflicting, or embedded in real CAD workflows?
    - Are reported gains reproducible across independent teams, datasets, B-rep kernels,
      and infrastructure when code, data, and artifacts are not uniformly present
      in the packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 异构条件下的参数化CAD程序生成与逆向重建
      解决的问题: 将文本、图像、网格、草图和点云转换为可编辑、可执行的参数化CAD程序或构建序列。
      尚未覆盖: 模态偏移、几何复杂度以及独立复现的边界仍缺少统一证据。
    - 路线: CAD生成系统的基准与评测套件
      解决的问题: 衡量代码可执行性、几何保真度、程序紧凑性及可制造性、功能性、可装配性等工程意图。
      尚未覆盖: 评估指标可能冲突，自动评判器可靠性与跨数据集、跨基础设施复现仍是验证缺口。
    - 路线: 智能体式交互CAD工作流
      解决的问题: 在合成前通过主动澄清消解模糊规格，减少无效程序并提升鲁棒性。
      尚未覆盖: 复杂真实CAD会话、用户特定约束和更高交互开销下的可扩展性尚未被充分验证。
    共识:
    - CAD生成被普遍框架化为结构化参数化程序或构建序列的生成，而非仅输出静态几何。
    - 可执行性、程序有效性和几何一致性被视为分析系统中必要的评测维度。
    - 即便系统接收多模态输入或统一多任务，核心输出仍是可编辑的参数化CAD程序。
    分歧:
    - 评测重点不同：有的侧重重建误差和程序有效性，有的加入可制造性、功能性和可装配性等准则。
    - 优化与监督方式不同：监督微调加强化学习、层次结构对齐、混合IoU优化、逐步几何比较和智能体澄清训练并存。
    - 交互模式不同：单轮生成、先澄清再生成和从几何逐步逆向重建具有不同的系统预设。
    - 覆盖范围不同：部分系统面向单一条件，部分系统尝试统一处理多模态多任务。
    开放问题:
    - 当模型排名随几何指标和设计意图指标变化时，哪种评测目标最能预测真实可用的工程输出？
    - 主动澄清在受控提示下有效，但能否在用户规格不完整或冲突的真实CAD工作流中保持低开销和鲁棒性？
    - 在代码、数据和工件未统一提供的情况下，报告的性能提升能否跨团队、数据集、B-rep内核和基础设施复现？
