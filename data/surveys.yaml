    and physical validation.'
  related_work_outline_zh:
  - 主流方向：利用大语言/视觉模型从多模态输入生成可编辑的参数化CAD表示，实现从非结构化数据到设计知识的自动化转换。
  - 研究共性：将CAD建模视为序列生成或程序合成问题，采用预训练微调、强化学习或优化，以几何一致性和语法有效性为核心目标。
  - 关键差异：输出表示（命令序列、CadQuery代码、STEP文件、带指针的B-rep）与监督信号（图像、网格、点云、正交视图、语言）的选择，以及是否支持逐步编辑或交互反馈。
  - 趋势演进：从单模态重建走向多模态统一框架，架构从Transformer扩展到Mamba和VLM，并引入检索增强与演化策略以提升复杂度和鲁棒性。
  - 开放问题：工业级复杂零件、装配体与制造约束下的泛化能力，以及跨CAD软件和物理验证的可靠性。
  literature_review:
    line_of_work_matrix:
    - line: Parametric CAD reconstruction from observations
      what_it_solves: Recovers editable CAD construction sequences from meshes, images,
        or point clouds, enabling reverse engineering and design modification.
      what_remains_open: Reconstruction accuracy for complex topologies and industrial
        parts, and maintaining global consistency across multiple steps.
    - line: Multi-modal CAD generation
      what_it_solves: Generates CAD models from text descriptions, images, or sketches,
        lowering the barrier for design creation.
      what_remains_open: Generalization to real-world photos and hand-drawn sketches,
        and the manufacturability of generated outputs.
    - line: Generative sequence modeling for CAD
      what_it_solves: Learns the distribution of CAD construction sequences to generate
        novel designs, handling long sequences effectively.
      what_remains_open: Diversity and practical utility of generated designs, and
        accumulation of topological errors in long sequences.
    - line: Unified benchmarks and universal models for CAD
      what_it_solves: Provides a multi-task evaluation suite and a single model capable
        of handling heterogeneous CAD tasks, avoiding redundant task-specific designs.
      what_remains_open: Limited coverage of the full CAD workflow, and whether the
        approach extends to assembly, simulation, and manufacturing stages.
    - line: Representation and interactive editing
      what_it_solves: Integrates B-rep geometric information with command sequences
        to support precise entity selection and editing, reducing quantization errors.
      what_remains_open: Real-time constraint solving and accurate user intent understanding
        during dynamic editing sessions.
    consensus:
    - All works cast CAD modeling as a learnable sequence generation or program synthesis
      problem.
    - Geometric similarity metrics (IoU, Chamfer distance) and syntactic validity
      are universally adopted as core evaluation criteria.
    - Output representations are designed to be editable, ensuring compatibility with
      existing CAD software.
    disagreements:
    - 'Output representation varies: command sequences, Python code, STEP files, or
      B-rep with pointer mechanisms, each affecting editability and precision differently.'
    - Supervisory signals differ across geometry (meshes, point clouds), multi-view
      (orthographic projections), and language, leading to divergent input modality
      requirements and generalization challenges.
    - Training paradigms contrast optimization-based fitting, offline reinforcement
      learning, and end-to-end VLM fine-tuning, while interaction ranges from single-step
      generation to iterative evolutionary refinement.
    open_questions:
    - How well do these methods perform on unseen industrial CAD parts, multi-component
      assemblies, and complex freeform surfaces?
    - Can manufacturability constraints (e.g., tolerances, machining feasibility)
      be embedded to make generated outputs directly usable in production?
    - Do current benchmarks (DeepCAD, Fusion360, MCB) adequately represent real-world
      application scenarios, or are more diverse evaluation dimensions needed?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 从观测数据进行参数化CAD重建
      解决的问题: 从网格、图像或点云恢复可编辑的CAD构建序列，支持逆向工程与设计修改。
      尚未覆盖: 复杂拓扑和工业零件的重建精度，以及多步骤全局一致性。
    - 路线: 多模态CAD生成
      解决的问题: 根据文本描述、图像或草图自动生成CAD模型，降低设计门槛。
      尚未覆盖: 对现实世界照片、手绘草图的泛化，以及生成结果的制造可行性。
    - 路线: CAD序列生成建模
      解决的问题: 学习CAD构建序列的分布，生成新设计，并能有效处理长序列。
      尚未覆盖: 生成设计的多样性与实际可用性，以及长序列中拓扑错误的累积。
    - 路线: 统一基准与通用模型
      解决的问题: 提供多任务评估套件，使单一模型能处理异构CAD任务，避免重复设计。
      尚未覆盖: 覆盖的CAD工作流有限，能否扩展到装配、仿真和制造环节。
    - 路线: 表示与交互式编辑
      解决的问题: 将B-rep几何信息与命令序列融合，支持精确实体选择和编辑，减少量化误差。
      尚未覆盖: 动态编辑过程中的实时约束求解和用户意图精准理解。
    共识:
    - 所有工作均将CAD建模转化为可学习的序列生成或程序合成问题。
    - 普遍采用几何相似度（IoU、Chamfer距离）和语法有效性作为核心评估指标。
    - 输出表示均强调可编辑性，以保证与现有CAD软件的兼容。
    分歧:
    - 输出表示不同：命令序列、Python代码、STEP文件或带指针的B-rep，各自对可编辑性和精度的影响不同。
    - 监督信号覆盖纯几何、多视图和语言，造成对输入模态的依赖和泛化要求各异。
    - 训练范式存在基于优化的拟合、离线强化学习和端到端VLM微调等差异，交互方式从单步生成到迭代演化。
    开放问题:
    - 这些方法在未见过的工业CAD零件、多部件装配体和复杂曲面上表现如何？
    - 能否嵌入制造约束（如公差、可加工性），使生成结果直接用于生产？
    - 当前基准（DeepCAD、Fusion360、MCB）是否充分代表实际应用场景，是否需要更多评估维度？
  synthesis_status: llm
  generation_notes: []
