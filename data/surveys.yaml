  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal evaluation of programmatic CAD generation
      what_it_solves: Measures executability, geometric fidelity, compactness, and
        image/code QA across clean, noisy, single-view, multi-view, and 3D inputs
        using large stratified sample sets.
      what_remains_open: Metric rankings and model rankings shift across metrics;
        specialized models degrade under modality shift; generalization to unseen
        industrial part families remains limited after fine-tuning and reinforcement
        learning.
    - line: Industrial design-intent evaluation for manufacturable and assemblable
        CAD
      what_it_solves: Adds structured design specifications and a code-geometry-design-intent
        protocol to evaluate functionality, manufacturability, and assemblability
        of B-Rep assemblies with VLM judges.
      what_remains_open: A failure cascade from executable code to engineering-ready
        design persists; VLM judge reliability beyond limited human validation and
        low success on fine-grained engineering criteria remain verification gaps.
    - line: LLM and agent-driven program synthesis with structural or parameter grounding
      what_it_solves: Converts text or image inputs into executable CadQuery or parametric
        CAD scripts by grounding B-Rep primitives, aligning construction-tree trajectories,
        or clarifying ambiguous specifications before synthesis.
      what_remains_open: Complex operations such as sweeps and lofts are often simplified
        to sketch-and-extrude; unseen workflow generalization, interaction overhead,
        and direct evidence for RL/agentic benefit are unresolved.
    - line: Representation-centric generative models for long sequences and editable
        B-rep surfaces
      what_it_solves: Uses state-space latent generation or differentiable parametric
        patches to handle longer parametric CAD sequences and generate editable BReps
        from point-level supervision.
      what_remains_open: Geometric complexity degrades reconstruction quality; robustness
        under modality shift, longer-sequence validity, and downstream editability
        comparisons are not fully established.
    consensus:
    - 'A recurring code-to-geometry-to-design-intent failure cascade appears: models
      may generate executable code or coarse shapes while missing fine 3D structure
      and parameter fidelity.'
    - Structured representations and grounding, including construction trees, B-Rep
      primitives or patches, and program formats, improve validity and fidelity over
      unstructured generation.
    - Evaluation is moving beyond geometry and executability toward design intent,
      manufacturability, functionality, and assemblability.
    - Input modality shift, geometric complexity, and unseen part families are common
      boundary conditions that degrade performance.
    disagreements:
    - 'Representation choices differ: parametric CAD sequences, CadQuery scripts,
      B-Rep primitive grounding, latent sequence encodings, and differentiable B-rep
      patches imply different editability and supervision assumptions.'
    - 'Supervision and optimization differ: point-level self-supervision, curated
      text-CAD pairs, structured design specifications, supervised fine-tuning, reinforcement
      learning, and agent-collected clarification trajectories.'
    - 'Evaluation targets differ: geometric fidelity, executability, and compactness
      versus industrial code QA and editing versus manufacturing, functionality, and
      assemblability.'
    - 'Interaction mode differs: direct end-to-end generation, progressive hierarchical
      reasoning, and proactive clarification before code synthesis.'
    open_questions:
    - Do benchmark gains transfer to unseen industrial part families when current
      fine-tuning and reinforcement-learning evidence shows limited generalization?
    - Can models preserve complex parametric operations such as sweeps and lofts rather
      than substituting simpler sketch-and-extrude patterns?
    - How should VLM-based design-intent judges be validated for engineering criteria
      beyond limited human agreement studies?
    - Can point-level supervision or differentiable surface representations match
      CAD-specific annotation quality while preserving editability and parametric
      fidelity?
    - What formal representation assumptions would align with programmatic CAD generation
      and yield testable correctness guarantees?
