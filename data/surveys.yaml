  related_work_outline:
  - 'Mainstream direction: The dominant direction is unified, multi-modal CAD benchmarks
    and evaluation suites paired with parametric/B-rep generation models; recent work
    clusters around text-to-CAD and mesh/point-to-CAD with executability, geometric
    fidelity, and design-intent checks.'
  - 'Shared research pattern: Benchmarks aggregate existing datasets, stratify by
    geometric complexity such as B-rep face count, evaluate across input modalities,
    and report several metrics; generator papers use these suites to compare task-specific
    models and LLM/VLM-based models.'
  - 'Key differences: Evaluation targets range from broad dataset-level comparison
    to assembly-level design specifications; design-intent scoring varies between
    geometric metrics and VLM rubric judges; interaction mode differs between single-pass
    generation and proactive clarification.'
  - 'Trend evolution: Within the current frontier, the trend moves from isolated reconstruction
    datasets toward unified multi-modal multi-task CAD benchmarks, and from aggregate
    similarity toward engineering-oriented validity and design-intent criteria; the
    available top-paper evidence is concentrated in 2026 despite a wider year span.'
  - 'Open questions: Whether task distributions cover real CAD engineering settings;
    whether model rankings remain stable across multiple metrics; whether VLM design-intent
    judgments align with human engineers; and what code, dataset, artifact, and limitation
    gaps hide.'
  related_work_outline_zh:
  - 主流方向：以统一多模态CAD基准和评估套件为主导，并与参数化/B-rep生成模型配合；近期工作集中在文本到CAD、网格/点云到CAD，关注可执行性、几何保真度和设计意图检查。
  - 研究共性：基准聚合既有数据集，按B-rep面数等几何复杂度分层，跨输入模态评估并报告多个指标；生成方法论文用这些基准比较任务特定模型与基于LLM/VLM的模型。
  - 关键差异：评估目标从宽泛的数据集比较到装配级设计规范不等；设计意图评分在几何指标与VLM评分规则之间存在差异；交互方式有单次生成与主动澄清之分。
  - 趋势演进：在当前前沿内，趋势从孤立重建数据集转向统一多模态多任务CAD基准，并从聚合相似度转向工程导向的有效性和设计意图；尽管年份跨度较大，现有顶层证据主要集中在2026年。
  - 开放问题：任务分布是否覆盖真实CAD工程设置；模型排名在多个指标下是否稳定；VLM设计意图判断是否与人类工程师一致；代码、数据集、工件和局限性缺失隐藏了哪些差异。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared CAD generation and reconstruction tasks with
        datasets that make model claims comparable across input modalities, object
        families, and geometric complexity levels.
      what_remains_open: Whether the aggregated task distribution covers real engineering
        settings such as complex assemblies, design specifications, noisy shop-floor
        inputs, and manufacturing constraints.
    - line: Metric and stress-test design
      what_it_solves: Probes geometric fidelity, executability and validity, program
        compactness, design-intent alignment, and engineering quality beyond a single
        aggregate similarity score.
      what_remains_open: Alignment between proxy metrics or VLM rubric judgments and
        downstream design decisions; missing details on human validation, metric calibration,
        and judge reliability across fine-grained criteria.
    - line: Comparable baselines and reporting
      what_it_solves: Supports auditable model comparison through common baseline
        classes, cross-benchmark evaluation, and reporting of validity, geometric,
        and design-intent signals.
      what_remains_open: Stability of benchmark conclusions across implementations,
        compute budgets, missing code or dataset artifacts, and absent limitation
        reporting remains under-evidenced.
    consensus:
    - Unified evaluation should cover multiple input modalities and multiple quality
      axes rather than a single geometric similarity score.
    - Executability, geometric validity, parametric or B-rep editability, and design-intent
      alignment are essential evaluation concerns for CAD generation.
    - Recent LLM/VLM-based CAD generation remains brittle under prompt ambiguity,
      modality shift, and increasing geometric complexity.
    - Stratification or structured design specifications are needed to expose failure
      cascades from code generation to geometry to engineering-ready design.
    disagreements:
    - 'Evaluation scope: some research targets broad dataset-level comparison across
      many model types, while other research targets assembly-level design intent
      with structured specifications.'
    - 'Design-intent evidence: some work relies on geometric metrics and program validity,
      while other work introduces VLM rubric judges; agreement with human engineering
      judgment is not yet established.'
    - 'Interaction setting: most evaluation assumes single-pass generation, but at
      least one line evaluates proactive clarification and interaction overhead.'
    - 'Reference and supervision: some work uses B-rep face-count-stratified dataset
      families, while other work uses real-world CadQuery datasets or ranking-based
      parameter supervision, which changes which failure modes are detectable.'
    open_questions:
    - Do aggregated CAD task distributions cover the real design, assembly, and manufacturing
      settings where CAD automation is expected to help?
    - How stable are model rankings when evaluators move among geometric metrics,
      executability, compactness, and design-intent rubric scores?
    - Do VLM-judged functionality, manufacturability, and assemblability scores align
      with human engineering judgment beyond limited annotation?
    - What verification gaps are introduced by missing code, dataset, artifact, and
      limitation details in the evaluated papers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的CAD生成与重建任务和数据集，使模型在不同输入模态、物体家族和几何复杂度水平之间可比较。
      尚未覆盖: 聚合的任务分布是否覆盖真实工程设置，例如复杂装配、设计规范、噪声车间输入和制造约束，仍缺乏证据。
    - 路线: 指标与压力测试设计
      解决的问题: 在单一聚合相似度之外，检验几何保真度、可执行性与有效性、程序紧凑性、设计意图对齐和工程质量。
      尚未覆盖: 代理指标或VLM评分规则判断是否与下游设计决策一致；人工验证、指标校准和细粒度工程标准下评判器可靠性细节不足。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线类别、跨基准评估以及有效性、几何和设计意图信号报告，使模型比较可审计。
      尚未覆盖: 基准结论在不同实现、算力预算、缺失代码或数据集工件以及缺失局限性报告下是否稳定，仍缺乏验证。
    共识:
    - 统一评估应覆盖多种输入模态和多个质量轴，而不是单一的几何相似度分数。
    - 可执行性、几何有效性、参数化或B-rep可编辑性以及设计意图对齐是CAD生成的核心评估关注点。
    - 近期基于LLM/VLM的CAD生成在提示歧义、模态转换和几何复杂度增加时仍然脆弱。
    - 需要通过分层或结构化设计规范来暴露从代码生成到几何再到工程就绪设计的失败级联。
    分歧:
    - 评估范围：有的研究面向跨模型类型的宽泛数据集比较，有的研究面向带结构化规范的装配级设计意图。
    - 设计意图证据：有的工作依赖几何指标和程序有效性，有的工作引入VLM评分规则；其与人类工程判断的一致性尚未建立。
    - 交互设置：多数评估假设单次生成，但至少有一条路线评估主动澄清和交互开销。
    - 参考与监督：有的工作使用按B-rep面数分层的数据集家族，有的使用真实世界CadQuery数据集或基于排序的参数监督；这会影响可检测的失败模式。
