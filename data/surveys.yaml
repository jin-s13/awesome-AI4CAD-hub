  related_work_outline:
  - 'Mainstream direction: Building multi-modal, multi-task CAD benchmarks that assess
    AI-generated CAD programs beyond geometric fidelity, incorporating manufacturability,
    functionality, and design intent alignment through structured protocols and LLM/VLM
    judges.'
  - 'Shared research pattern: Decomposing evaluation into staged protocols (code check
    → geometry check → design intent), using multiple metrics to expose failure modes,
    and adopting automated judges to scale assessment.'
  - 'Key differences: Task definitions vary across program synthesis, reverse engineering,
    and question answering; input modalities range from pure text to point clouds
    and meshes; evaluation targets differ in prioritizing geometric accuracy versus
    engineering practicality.'
  - 'Trend evolution: Rapid progression from single-modality, geometry-only metrics
    toward comprehensive, manufacturing-aware benchmarks, with a surge of unified
    frameworks in 2025–2026 pushing multi-task and multi-modal coverage.'
  - 'Open questions: Alignment between proxy metrics and downstream engineering decisions
    remains unverified; reliability and generalization of VLM-based judges across
    diverse CAD domains are not yet established; coverage of complex assemblies and
    real manufacturing constraints is still limited.'
  related_work_outline_zh:
  - 主流方向：构建多模态、多任务的CAD基准，通过结构化协议和LLM/VLM评判器，超越几何保真度，评估可制造性、功能性和设计意图对齐。
  - 研究共性：将评估分解为阶段性协议（代码检查→几何检查→设计意图），使用多指标揭示失败模式，并采用自动评判器扩展评估规模。
  - 关键差异：任务定义涵盖程序合成、逆向工程和问答；输入模态从纯文本到点云、网格不等；评估目标在几何精度与工程实用性之间各有侧重。
  - 趋势演进：从单一模态、仅几何指标快速演进到面向制造的综合基准，2025–2026年涌现统一框架，覆盖多任务和多模态。
  - 开放问题：代理指标与下游工程决策的一致性尚未验证；基于VLM的评判器在跨领域CAD中的可靠性和泛化性未确立；复杂装配体和真实制造约束的覆盖仍不足。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared, standardized evaluation settings for AI-assisted
        CAD generation, reverse engineering, and question answering, enabling fair
        comparison across methods.
      what_remains_open: Whether the task distributions and object categories cover
        the full range of real-world mechanical design, including complex assemblies,
        noisy inputs, and engineering constraints such as tolerances and material
        properties.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality, controllability, and robustness beyond
        aggregate scores by stratifying samples by geometric complexity, measuring
        multiple failure modes, and evaluating design intent alignment.
      what_remains_open: The alignment between these proxy metrics and the actual
        downstream decisions engineers care about (e.g., manufacturability, cost)
        has not been empirically validated, and the sensitivity of VLM judges to domain
        shift is unclear.
    - line: Comparable baselines and reporting
      what_it_solves: Provides unified datasets, evaluation protocols, and public
        leaderboards that make results auditable and models comparable under consistent
        conditions.
      what_remains_open: Stability of benchmark conclusions across different implementations,
        compute budgets, and the reproducibility of LLM-based judges has not been
        systematically studied.
    consensus:
    - Evaluation is moving from single geometric metrics (e.g., Chamfer distance)
      to multi-dimensional assessments that include executability, program compactness,
      and engineering criteria.
    - Staged evaluation protocols are adopted to isolate failures in code syntax,
      shape validity, and design intent, rather than collapsing everything into one
      score.
    - Automated judges based on large language or vision-language models are increasingly
      used to assess semantic and functional aspects of CAD models at scale.
    - Benchmarks are designed to expose specific failure modes—such as brittleness
      under modality shift and degradation with geometric complexity—rather than just
      ranking models.
    disagreements:
    - 'Task definitions diverge: some benchmarks focus on generative program synthesis
      from text or images, while others target reverse engineering of meshes into
      parametric sequences, leading to incompatible evaluation setups.'
    - Input modalities vary from single-view images and point clouds to multi-view
      renders and sketches, making cross-benchmark comparisons difficult and raising
      questions about which modality best reflects real-world use.
    - 'The definition of a successful CAD model differs: one line of work treats geometric
      fidelity as the primary goal, while another emphasizes design intent, manufacturability,
      and assemblability, often requiring human or VLM judgment.'
    - 'Interaction modes are treated differently: most benchmarks assume a single-turn
      generation, but one line of work introduces proactive clarification agents,
      challenging the assumption that prompts are self-contained specifications.'
    open_questions:
    - How reliably can VLM-based judges assess engineering criteria such as functionality
      and manufacturability, and how do they compare to expert human evaluation?
    - Do current benchmarks cover the diversity of real manufacturing constraints,
      including tolerances, material choices, and assembly processes, or are they
      limited to idealized geometric shapes?
    - Can findings from one benchmark (e.g., mesh-to-CAD) transfer to another (e.g.,
      text-to-CAD) when the task definitions and success metrics are fundamentally
      different?
    - How stable are the reported model rankings under changes in implementation details,
      compute budgets, or the specific subset of samples used for evaluation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 为AI辅助CAD生成、逆向工程和问答创建共享的标准化评估设置，使不同方法可公平比较。
      尚未覆盖: 任务分布和对象类别是否覆盖真实机械设计的全部范围，包括复杂装配体、噪声输入以及公差、材料等工程约束。
    - 路线: 指标与压力测试设计
      解决的问题: 通过按几何复杂度分层采样、测量多种失败模式和评估设计意图对齐，超越总分，检验预测质量、可控性和鲁棒性。
      尚未覆盖: 这些代理指标与工程师真正关心的下游决策（如可制造性、成本）之间的一致性尚未实证验证，且VLM评判器对领域偏移的敏感性不明。
    - 路线: 可比基线与报告规范
      解决的问题: 提供统一数据集、评估协议和公开排行榜，使结果可审计，模型在一致条件下可比较。
      尚未覆盖: 基准结论在不同实现、算力预算下的稳定性，以及基于LLM的评判器的可复现性尚未系统研究。
    共识:
    - 评估正从单一几何指标（如Chamfer距离）转向多维度评估，包含可执行性、程序紧凑性和工程标准。
    - 采用阶段性评估协议，将代码语法、形状有效性和设计意图的错误分离，而非压缩为单一分数。
    - 基于大语言或视觉语言模型的自动评判器越来越多地用于评估CAD模型的语义和功能方面，以扩展评估规模。
    - 基准设计旨在暴露特定失败模式（如模态转换下的脆弱性、几何复杂度增加时的性能下降），而非仅对模型排名。
    分歧:
    - 任务定义存在差异：部分基准关注从文本或图像生成程序，另一些则关注从网格逆向重建参数化序列，导致评估设置不兼容。
    - 输入模态从单视图图像、点云到多视图渲染和草图各不相同，跨基准比较困难，且哪个模态最能反映实际使用需求尚无定论。
    - 对成功CAD模型的定义不同：一类工作以几何保真度为主，另一类则强调设计意图、可制造性和可装配性，往往需要人工或VLM评判。
    - 交互模式处理方式不同：多数基准假设单轮生成，但有一类工作引入主动澄清智能体，挑战了提示词即自包含规格的假设。
    开放问题:
    - 基于VLM的评判器在评估功能性和可制造性等工程标准时的可靠性如何，与专家人工评估相比又如何？
    - 当前基准是否覆盖了真实制造约束的多样性（包括公差、材料选择和装配流程），还是仅限于理想化几何形状？
    - 当任务定义和成功指标根本不同时，一个基准（如网格到CAD）的发现能否迁移到另一个基准（如文本到CAD）？
    - 在实现细节、算力预算或所选用评估样本子集变动时，报告的模型排名稳定性如何？
