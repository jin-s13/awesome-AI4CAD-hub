  related_work_outline:
  - 'Mainstream direction: Recent work centers on learned generation and reconstruction
    of parametric CAD programs, especially text-to-CAD and mesh/image/point-to-CAD,
    with LLM/VLM or transformer methods mapping multimodal inputs to executable CAD
    scripts or construction sequences.'
  - 'Shared research pattern: Papers formulate CAD as structured program generation;
    they ground natural language or geometry to B-Rep/parametric primitives, then
    evaluate geometric fidelity, executability, and program validity on benchmarks.'
  - 'Key differences: They differ in input modality, generation target, and supervision:
    text-to-CAD versus mesh-to-CAD, direct B-Rep versus CadQuery scripts, single-pass
    generation versus agentic clarification, unified multimodal models versus task-specific
    optimizers, and geometry-only versus manufacturability-aware evaluation.'
  - 'Trend evolution: The visible top-paper evidence is concentrated in 2026, so the
    trend is within the current frontier: from single-task mesh reconstruction toward
    unified multimodal benchmarks, LLM/VLM program generation, and evaluation protocols
    that include engineering design intent.'
  - 'Open questions: How well methods transfer across geometric complexity, modality
    shift, and real CAD assemblies; whether rankings remain stable across metrics;
    whether agent/planner or representation choices drive gains; and reproducibility
    gaps from missing dataset, code, and limitation details.'
  related_work_outline_zh:
  - 主流方向：近期工作聚焦参数化CAD程序的学习式生成与重建，尤其是文本到CAD和网格/图像/点云到CAD；基于LLM/VLM与Transformer的方法将多模态输入映射为可执行CAD脚本或构建序列。
  - 研究共性：论文将CAD建模为结构化程序生成，把自然语言或几何输入接地到B-Rep/参数化基元，并在基准上评估几何保真度、可执行性和程序有效性。
  - 关键差异：输入模态、生成目标和监督信号不同：文本到CAD与网格到CAD、直接B-Rep与CadQuery脚本、单次生成与主动澄清、统一多模态模型与专用优化器；评测从几何指标延伸到可制造性/可装配性。
  - 趋势演进：可见的核心论文证据集中在2026年，趋势处于当前前沿：从单任务网格重建，走向统一多模态基准、LLM/VLM程序生成，以及纳入工程设计意图的评测协议。
  - 开放问题：方法在几何复杂度、模态偏移和真实装配体上如何迁移；不同指标下排名是否稳定；增益来自表示/模型还是智能体/规划器；以及数据集、代码和局限性缺失带来的复现缺口。
  literature_review:
    line_of_work_matrix:
    - line: Multimodal CAD benchmark construction and evaluation protocols, such as
        CADBench and MUSE
      what_it_solves: Provides controlled comparison across datasets, input modalities,
        and metrics; measures geometric fidelity, executability, program compactness,
        and design-intent alignment.
      what_remains_open: Model rankings change across metrics and modalities; VLM
        judges and manufacturability/assemblability rubrics need broader validation
        beyond reported samples.
    - line: LLM-driven text-to-CAD program generation with structure and parameter
        grounding, such as FutureCAD and HierCAD
      what_it_solves: Maps natural language to executable parametric scripts and grounded
        B-Rep primitives; improves structural consistency and parameter accuracy.
      what_remains_open: Real-world CAD coverage and generalization beyond fine-tuned
        datasets; contribution of reinforcement learning versus supervised fine-tuning
        is not isolated.
    - line: Mesh/point-to-CAD reverse engineering via optimization or stepwise construction,
        such as CADFit and CADENA
      what_it_solves: Recovers editable parametric CAD sequences from geometry with
        operations such as extrusions and fillets; improves volumetric IoU, Chamfer
        distance, and program validity.
      what_remains_open: Scaling to complex designs and diverse feature types; sensitivity
        to geometry noise, modality shift, and initial mesh quality remains underexplored.
    - line: Agentic clarification and interaction for text-to-CAD generation, such
        as ProCAD
      what_it_solves: Reduces ambiguity and specification errors before code synthesis,
        lowering Chamfer distance and invalid program ratio.
      what_remains_open: Interaction overhead and clarification quality are tested
        mainly on curated prompts; clarification policy versus coding agent contribution
        is not separated.
    - line: Universal multimodal multi-task CAD models, such as UniCAD
      what_it_solves: Handles point cloud, text, image, sketch, and question-answering
        tasks in one framework for reconstruction and generation.
      what_remains_open: Whether one model matches specialized models across all geometric
        complexity and engineering criteria; benchmark generalization and reproducibility
        need more evidence.
    consensus:
    - CAD is represented as structured, executable programs or construction sequences
      rather than only meshes or point clouds.
    - Multimodal inputs such as text, images, meshes, and point clouds are aligned
      to parametric primitives or CAD scripts before evaluation.
    - Geometric fidelity, executability/validity, and program structure are common
      evaluation targets; benchmarks further separate geometry-level success from
      design-intent or engineering criteria.
    - Recent systems use LLMs/VLMs or transformer-based grounding to generate or reconstruct
      CAD operations.
    disagreements:
    - 'Input modality and task scope differ: some address text-to-CAD script generation,
      others mesh/point-to-CAD reverse engineering, and others unify multiple tasks.'
    - 'Evaluation target differs: geometric-only metrics versus code executability
      versus manufacturability, functionality, and assemblability; rankings shift
      across metrics.'
    - 'Generation target differs: CadQuery/Python-like scripts, direct B-Rep primitive
      grounding, or parametric construction sequences.'
    - 'Interaction and supervision differ: pure single-pass generation, agentic clarification,
      optimization-based fitting, and supervised fine-tuning with reinforcement learning.'
    open_questions:
    - Do reported gains transfer to complex B-Rep assemblies and real-world CAD production
      data beyond benchmark families?
    - Which components such as LLM, grounding module, optimizer, planner, or agent
      drive improvements when ablations are incomplete?
    - How robust are current benchmark conclusions when model rankings change across
      metrics and modalities?
    - What is the reproducibility status of models claiming state-of-the-art when
      code, datasets, and limitation details are not consistently available?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态CAD基准构建与评测协议，如CADBench、MUSE
      解决的问题: 在多样数据集、输入模态和指标下提供受控比较，评估几何保真度、可执行性、程序紧凑性和设计意图对齐。
      尚未覆盖: 模型排名随指标和模态变化；VLM评判和可制造性/可装配性评分需要在更广真实样本上验证。
    - 路线: 基于LLM的文本到CAD程序生成及结构/参数接地，如FutureCAD、HierCAD
      解决的问题: 将自然语言映射为可执行参数化脚本和B-Rep基元，提升结构一致性和参数准确性。
      尚未覆盖: 真实CAD数据的覆盖与微调数据集外的泛化；强化学习相对监督微调的贡献未被单独衡量。
    - 路线: 基于优化或逐步构建的网格/点云到CAD逆向工程，如CADFit、CADENA
      解决的问题: 从几何中恢复可编辑参数化CAD序列，支持拉伸、旋转、倒角等操作，改善体积IoU、Chamfer距离和程序有效性。
      尚未覆盖: 复杂设计、多样特征类型、噪声和初始几何质量影响；模态偏移下的鲁棒性不足。
    - 路线: 面向文本到CAD的主动澄清与交互方法，如ProCAD
      解决的问题: 在代码合成前降低提示歧义和规格错误，从而降低Chamfer距离和无效程序比例。
      尚未覆盖: 交互成本和澄清质量仅在精选提示上验证；澄清策略与编码智能体各自贡献未分离。
    - 路线: 统一多模态多任务CAD模型，如UniCAD
      解决的问题: 在单一框架内处理点云、文本、图像、草图，完成重建、生成和CAD问答。
      尚未覆盖: 单模型是否在所有几何复杂度和工程标准上匹配专用模型；基准泛化与复现证据仍需补充。
    共识:
    - CAD被表示为结构化、可执行程序或构建序列，而不是仅作为网格或点云处理。
    - 多模态输入（文本、图像、网格、点云）先与参数化基元或CAD脚本对齐，再进行评估。
    - 几何保真度、可执行性/有效性和程序结构是常见评测目标；部分基准进一步区分几何成功与工程/设计意图。
    - 近期系统普遍采用LLM/VLM或Transformer接地来生成或重建CAD操作。
    分歧:
    - 输入模态和任务范围不同：文本到CAD脚本生成、网格/点云到CAD逆向工程，以及多任务统一建模各自侧重不同。
    - 评测目标不同：几何指标、代码可执行性，或可制造性/功能性/可装配性；模型排名在不同指标间会变化。
    - 生成目标不同：CadQuery/Python风格脚本、直接B-Rep基元接地，或参数化构建序列。
    - 交互和监督不同：单次生成、主动澄清、优化拟合，以及监督微调加强化学习并存。
    开放问题:
    - 报告的性能增益能否迁移到复杂B-Rep装配体和真实CAD生产数据之外？
    - 当消融不完整时，哪些组件（LLM、接地模块、优化器、规划器、智能体）真正驱动了改进？
    - 模型排名随指标和模态变化时，当前基准结论有多稳健？
    - 在代码、数据集和局限性说明不一致的情况下，宣称最先进的方法复现性如何？
