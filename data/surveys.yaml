  - 'Mainstream direction: Parametric CAD generation and reverse engineering dominate,
    especially recovering or producing editable CAD programs from images, point clouds,
    meshes, and text via multimodal LLMs, sequence models, or optimization.'
  - 'Shared research pattern: Most work represents CAD as structured parametric programs,
    uses reconstruction or generation supervision, and evaluates geometric or programmability
    outcomes such as IoU, Chamfer Distance, invalid ratio, syntax rate, or solid similarity.'
  - 'Key differences: Methods differ in input modality, supervision signal, and generation
    strategy, including optimization-based fitting, multimodal language modeling,
    state-space sequence generation, stepwise RL, and program evolution.'
  - 'Trend evolution: Available top papers cluster in 2025-2026 and move from single-task
    image- or mesh-to-CAD toward unified multi-task models, synthetic program-evolution
    datasets, and diagnostic evaluations of design-intent conditioning.'
  - 'Open questions: Real-world generalization, long-sequence and manufacturing-grade
    complexity, metric circularity, and the robustness of design-intent conditioning
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以参数化CAD程序为目标的生成与逆向工程占主导，重点从图像、点云、网格或文本恢复或生成可编辑CAD程序。
  - 研究共性：多将CAD表示为结构化参数化程序，采用重建或生成监督，并以IoU、倒角距离、无效率、语法率或实体相似度等几何或程序指标评测。
  - 关键差异：输入模态、监督信号和生成策略不同，包括优化拟合、多模态语言模型、状态空间序列生成、逐步强化学习和程序演化。
  - 趋势演进：现有高相关论文集中在2025-2026，呈现从单任务图像或网格到CAD，走向统一多任务模型、程序演化数据增强与条件化诊断评测。
  - 开放问题：真实世界泛化、复杂制造级长序列、指标循环性及设计意图条件化的鲁棒性仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: Optimization-driven mesh-to-CAD reconstruction
      what_it_solves: Recovers editable parametric CAD construction sequences from
        mesh geometry using geometric feedback and validity constraints.
      what_remains_open: Generalization beyond benchmark parts, support for broader
        manufacturing features, and incomplete evidence on limitations for complex
        real-world geometries.
    - line: Unified multimodal CAD generation and benchmarking
      what_it_solves: Handles image, text, point-cloud, and sketch inputs plus multiple
        CAD tasks such as reconstruction, generation, and question answering in one
        model or benchmark.
      what_remains_open: Robustness to real-world images and unseen operations is
        only partially demonstrated; artifact availability and multi-task generalization
        remain verification gaps.
    - line: CAD program evolution and synthetic data scaling
      what_it_solves: Mitigates data scarcity and constructs complex, realistic CAD
        programs by iteratively evolving or augmenting executable parametric code.
      what_remains_open: Whether generated programs remain valid across CAD kernels
        and whether gains transfer beyond curated image-to-CAD benchmarks is not established.
    - line: Stepwise process supervision and sequential decision-making
      what_it_solves: Uses intermediate geometric comparisons or offline RL to reconstruct
        CAD action sequences and align decisions with target geometry.
      what_remains_open: Data efficiency and transfer to noisy, real-world or manufacturing-grade
        inputs with broader action spaces are underevidenced.
    - line: Diagnostic and independent evaluation of CAD conditioning
      what_it_solves: Tests whether design-intent headers actually guide CAD program
        completion and replaces circular text-matching metrics with geometric assertions.
      what_remains_open: Evidence is limited to one small model checkpoint and one
        CAD code domain; several design intents remain at a generation floor and cannot
        inform the contrast.
    consensus:
    - Parametric CAD programs are treated as the preferred editable and verifiable
      output representation.
    - Models are evaluated through geometric or programmability outcomes such as volumetric
      similarity, surface distance, invalid rate, syntax rate, or solid similarity
      rather than text matching alone.
    - Iterative feedback, geometric alignment, or program validation is used to improve
      CAD reconstruction and generation.
    - Dataset scale and synthetic augmentation are common levers for improving complex
      CAD generation.
    disagreements:
    - 'Input representations and supervision differ: some methods condition on meshes
      or orthographic views with geometric feedback, while others use image-code or
      text-image pairs end to end.'
    - 'Generation mechanisms differ: hybrid optimization, state-space sequence models,
      multimodal large language models, offline RL decision transformers, and program
      evolution each assign credit differently.'
    - 'Evaluation targets differ: task-specific benchmarks, unified multi-task suites,
      image-to-CAD transfer, and independent geometric-header diagnostics emphasize
      different success criteria.'
    - 'Deployment evidence differs: some papers expose open-source code, dataset,
      or repository signals while others leave the reproduction path incomplete.'
    open_questions:
    - How do current image- and mesh-to-CAD methods behave on real-world scans with
      noise, partial observations, or manufacturing features outside synthetic benchmark
      distributions?
    - Can unified multimodal CAD models maintain geometric validity and program correctness
      when scaling to longer, more heterogeneous CAD sequences and unseen operations?
    - What evaluation setup can avoid metric circularity while still capturing semantic
      design intent beyond B-rep assertion pass/fail?
    - How robust is design-intent conditioning across different model scales, CAD
      languages, and prefix or conditioning regimes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 优化驱动的网格到CAD重建
      解决的问题: 从网格几何恢复可编辑的参数化CAD构建序列，并利用几何反馈和有效性约束。
      尚未覆盖: 对基准零件之外的泛化、更复杂制造特征的支持以及对复杂真实几何的局限性证据不足。
    - 路线: 统一多模态CAD生成与评测
      解决的问题: 在单一模型或基准中处理图像、文本、点云、草图等多模态输入及重建、生成、问答等多类CAD任务。
      尚未覆盖: 真实图像与未见操作的鲁棒性仅有部分展示；工件可获得性和多任务泛化仍是验证缺口。
    - 路线: CAD程序演化与合成数据扩展
      解决的问题: 通过迭代演化或增强可执行参数化代码，缓解数据稀缺并构建复杂、真实的CAD程序。
      尚未覆盖: 生成程序在不同CAD内核中的有效性及收益能否迁移到策展图像到CAD基准之外尚不明确。
    - 路线: 逐步过程监督与序列决策
      解决的问题: 利用中间几何比较或离线强化学习重建CAD操作序列，使决策与目标几何对齐。
      尚未覆盖: 数据效率及向噪声、真实世界或制造级输入的迁移，以及更广泛动作空间的证据不足。
    - 路线: CAD条件化的诊断与独立评估
      解决的问题: 检验设计意图头是否真正引导CAD程序补全，并用几何断言替代循环文本匹配指标。
      尚未覆盖: 证据仅限一个小模型检查点和一个CAD代码域；若干设计意图仍处于生成下限，无法用于对比。
    共识:
    - 参数化CAD程序被视为可编辑、可验证的首选输出表示。
    - 模型通过体积相似度、表面距离、无效率、语法率或实体相似度等几何或可执行性指标评测，而非仅靠文本匹配。
    - 迭代反馈、几何对齐或程序验证被用于改进CAD重建与生成。
    - 数据规模与合成增强是提升复杂CAD生成的常见手段。
    分歧:
    - 输入表示与监督信号不同：部分方法基于网格或正交视图并依赖几何反馈，部分方法采用图像-代码或文本-图像对的端到端监督。
    - 生成机制不同：混合优化、状态空间序列模型、多模态大语言模型、离线强化学习决策Transformer和程序演化对成功条件的归因不同。
    - 评测目标不同：任务特定基准、统一多任务套件、图像到CAD迁移以及独立的几何头信息诊断强调不同的成功标准。
    - 部署证据不同：部分论文公开了代码、数据集或仓库信号，部分论文的复现路径仍不完整。
    开放问题:
    - 当前图像和网格到CAD方法在真实扫描、噪声、局部观测或合成基准分布之外的制造特征上表现如何？
    - 统一多模态CAD模型在扩展到更长、更异质的CAD序列和未见操作时，如何保持几何有效性和程序正确性？
    - 怎样的评测设置既能避免指标循环性，又能捕捉超出B-rep断言通过/失败的语义设计意图？
    - 设计意图条件化在不同模型规模、CAD语言和前缀或条件化机制下有多鲁棒？
