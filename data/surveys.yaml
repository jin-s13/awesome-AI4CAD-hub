      尚未覆盖: 模型经常误解设计参数，将复杂操作替换为简单草图-拉伸模式，且缺乏对模糊提示的鲁棒性，交互式澄清未普遍采用。
    - 路线: 层次化结构推理的CAD生成
      解决的问题: 将CAD构建树分解为对象级和部件级推理轨迹，通过结构对齐和参数接地提高结构一致性和参数准确性。
      尚未覆盖: 层次分解是否适用于带部件间约束的装配体，以及轨迹对齐方法能否扩展到更大的多样化CAD数据集尚不明确。
    - 路线: 面向模糊规格的主动澄清
      解决的问题: 通过在代码生成前提出澄清问题，将模糊提示转化为自洽规格，减少无效输出并提高鲁棒性。
      尚未覆盖: 交互开销及智能体在无人干预下处理高度复杂或领域特定设计需求的能力未经验证。
    - 路线: 可微分参数曲面CAD生成
      解决的问题: 通过将B-Rep表示为可微分贝塞尔面片，利用点级监督在未标注3D数据上训练，从多模态生成可编辑CAD模型。
      尚未覆盖: 该方法在大规模装配体上的可扩展性及在尖锐特征和高曲率区域保持精度的能力尚未展示。
    - 路线: 面向长参数化CAD序列的序列建模架构
      解决的问题: 利用状态空间模型（Mamba）和自监督预训练处理长CAD命令序列，生成超出以往上下文窗口限制的有效复杂参数化模型。
      尚未覆盖: 验证仅限于特定评估指标；模型捕获设计语义及适应不同CAD脚本语言的能力未展示。
    共识:
    - 所有方法都将CAD生成视为生成参数化命令序列或B-Rep曲面，共同目标是可编辑、可执行的输出。
    - 几何保真度（如Chamfer距离）和可执行性是主要指标，但所有论文都承认这些指标未能捕捉更高层次的设计意图。
    - 模型表现出从可执行代码到有效几何再到工程就绪设计的失败级联，在复杂或未见零件族上性能急剧下降。
    - 大语言模型和Transformer是主流骨干，或直接用于代码生成，或经过CAD特定分词和注意力机制改造。
    分歧:
    - 表示方式：部分工作使用离散程序令牌（CadQuery脚本），另一些使用连续参数曲面面片（贝塞尔），导致训练监督信号不同（文本 vs. 点云）。
    - 评测：基准如CADBench和MUSE在优先几何相似度、紧凑性还是工程标准（可制造性、可装配性）上存在分歧，造成模型排名矛盾。
    - 交互：ProCAD引入主动澄清作为生成前步骤，而其他方法假设从完整提示一次性生成。
    - 专业化：一些工作主张使用微调的CAD专用模型（如网格到CAD）优于通用VLM，认为在理想化条件下性能更佳，而另一些使用LLM结合强化学习改善代码生成。
    开放问题:
    - 当微调仅提升分布内性能时，模型如何泛化至未见零件族和扫掠、放样等复杂操作？
    - 哪些几何与设计意图指标的组合能可靠预测真实CAD工程师的接受度？
    - 主动澄清在包含多利益相关方和不断演进规范的真实设计工作流中能扩展到何种程度？
    - 可微分参数表示在优化过程中能否保持严格的工程约束（如水密性、公差）？
