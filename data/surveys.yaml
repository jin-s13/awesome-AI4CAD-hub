  related_work_outline:
  - 'Mainstream direction: Recent work concentrates on unified, multimodal CAD benchmarks
    that evaluate program generation and reconstruction from text, images, meshes,
    and point clouds; representative examples include CADBench, MUSE, and UniCAD.'
  - 'Shared research pattern: Papers construct evaluation samples, define staged or
    multiple metrics, and compare specialized CAD models with general LLM/VLM baselines
    to expose failure modes such as validity collapse, modality shift brittleness,
    and metric-dependent rankings.'
  - 'Key differences: Benchmarks differ in evaluation target: geometric fidelity,
    executability, and program compactness; design intent and assembly readiness;
    or multi-task multi-modal command. Input modality coverage and domains from mechanical
    parts to real-world assemblies also differ.'
  - 'Trend evolution: Available top evidence is concentrated in 2026, showing movement
    from isolated reconstruction benchmarks toward unified multimodal multi-task suites
    and design-intent, manufacturability, and agentic clarification evaluations; older
    years listed but not represented in this packet.'
  - 'Open questions: Whether geometric proxy metrics align with downstream engineering
    utility; whether rankings are stable across complexity, modality shift, and metric
    choices; and whether automated judges and clarification interactions are reliable
    at scale.'
  related_work_outline_zh:
  - 主流方向：近期工作集中于统一多模态CAD基准，评估从文本、图像、网格和点云生成或重建CAD程序的能力；代表性工作包括CADBench、MUSE和UniCAD。
  - 研究共性：构建评估样本、分层或分阶段指标，比较专用CAD模型与通用LLM/VLM基线，以揭示有效性崩溃、模态偏移脆弱和指标依赖排名等失败模式。
  - 关键差异：基准评测目标不同，有的关注几何保真度、可执行性和程序紧凑性，有的关注设计意图与装配就绪，有的覆盖多任务多模态；输入模态、数据域和是否引入澄清交互也存在差异。
  - 趋势演进：现有强证据集中在2026年，显示从单一重建基准向统一多模态多任务套件、可制造性/装配性评估和智能体澄清评估演进；年份跨度虽广，但本包未提供早期论文细节。
  - 开放问题：几何代理指标是否与下游工程效用一致；排名在几何复杂度、模态偏移和指标变化下是否稳定；自动化评判与澄清交互是否可规模化且可靠。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal CAD benchmark and task design
      what_it_solves: Comparing CAD program generation and reconstruction across text,
        image, mesh, and point cloud inputs through shared tasks, stratified samples,
        and multiple metrics.
      what_remains_open: Whether the task distribution covers practical engineering
        constraints and whether model rankings remain stable across modality shifts
        and metric choices.
    - line: Geometric validity and reverse-engineering evaluation
      what_it_solves: Measuring mesh/image-to-CAD reconstruction fidelity and program
        validity through geometric metrics such as IoU, Chamfer distance, and invalid
        program ratio.
      what_remains_open: Whether these geometric and executability metrics capture
        editable, manufacturable output and scale to complex mechanical parts.
    - line: Design-intent, manufacturability, and assembly readiness evaluation
      what_it_solves: Assessing generated B-Rep assemblies against structured design
        specifications using staged code, geometry, and design-intent checks with
        rubric-based judging.
      what_remains_open: Reliability and calibration of VLM judges for fine-grained
        engineering acceptance, and whether the protocol generalizes beyond curated
        design cases.
    - line: Interaction-aware robustness evaluation for text-to-CAD
      what_it_solves: Evaluating ambiguous text prompts by adding agentic clarification
        before CAD program synthesis and measuring validity and geometric error reduction.
      what_remains_open: Interaction overhead, coverage of real ambiguous prompts,
        and whether clarified specifications generalize beyond curated text-to-CadQuery
        data.
    consensus:
    - Recent evaluations treat CAD generation as a composite capability rather than
      a single aggregate score, using multiple metrics or staged checks.
    - They compare specialized CAD or reconstruction models with general LLM/VLM methods
      to reveal complementary failure modes.
    - Dataset construction is informed by stratification, diversity sampling, or practical
      design specifications to challenge models beyond simple objects.
    - Program executability and geometric validity remain core criteria even when
      higher-level design intent is evaluated.
    - Several top papers provide methodology and result evidence but do not show detailed
      limitations, leaving evaluation ceiling and artifact completeness as verification
      gaps.
    disagreements:
    - 'Evaluation target: some benchmarks focus on geometric fidelity and program
      executability, while others prioritize manufacturability, functionality, and
      assemblability.'
    - 'Input and task coverage: some use a single framework to cover point/image/text/CAD
      QA, while others isolate image/mesh-to-CAD or text-to-CAD boundaries.'
    - 'Measurement method: geometric metrics like IoU, Chamfer distance, and invalid
      ratio differ from rubric-based VLM judging for design criteria.'
    - 'Interaction setting: most benchmarks assume a single generation turn, while
      one evidence path introduces proactive clarification and changes the evaluation
      protocol.'
    open_questions:
    - Do current CAD benchmarks cover the manufacturing and assembly constraints that
      determine whether generated programs are usable in practice?
    - Are geometric proxy scores aligned with downstream engineering utility, and
      how should validity be weighted in benchmark totals?
    - Are model rankings stable across input modality shifts, geometric complexity
      strata, and different metric choices?
    - Can rubric-based VLM judges reliably supplement or replace human engineering
      evaluation without being overfit to the judge?
    - What is the additional cost and failure mode of interactive clarification in
      benchmark settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD基准与任务设计
      解决的问题: 通过共享任务、分层样本和多指标，比较不同输入模态下的CAD程序生成与重建能力。
      尚未覆盖: 任务分布是否覆盖实际工程约束，模型排名在模态偏移和指标变化下是否稳定。
    - 路线: 几何有效性与逆向工程评测
      解决的问题: 通过IoU、Chamfer Distance和无效程序比例衡量网格/图像到CAD重建的保真度和程序有效性。
      尚未覆盖: 几何和可执行性指标是否捕获可编辑、可制造输出，并能否扩展到复杂机械零件。
    - 路线: 设计意图、可制造性与装配就绪评测
      解决的问题: 使用结构化设计规范和分阶段代码、几何、设计意图检查，评估生成B-Rep装配体。
      尚未覆盖: VLM评判器在细粒度工程验收中的可靠性和校准，以及协议能否泛化到人工设计案例之外。
    - 路线: 交互感知的文本到CAD鲁棒性评测
      解决的问题: 通过主动澄清减少模糊提示下的不可执行输出，并测量有效性和几何误差变化。
      尚未覆盖: 交互开销、真实模糊提示覆盖，以及澄清后规格能否泛化到精选text-to-CadQuery数据之外。
    共识:
    - 近期评测倾向把CAD生成作为复合能力度量，使用多指标或分阶段检查，而不是单一总分。
    - 普遍同时评估专用CAD或重建模型与通用LLM/VLM方法，以暴露互补失败模式。
    - 数据构建通过分层、多样性采样或实际设计规范提升难度和代表性。
    - 即使在设计意图评测中，程序可执行性和几何有效性仍是基础指标。
    - 多个顶级论文缺少详细限制说明，代码/数据工件完整性和评测上限仍是验证缺口。
    分歧:
    - 评测目标不同：一些侧重几何保真度和可执行性，另一些侧重可制造性、功能性和可装配性。
    - 任务和模态覆盖不同：有的采用统一多任务多模态框架，有的聚焦网格/图像到CAD或文本到CAD的单一边界。
    - 测量方法不同：IoU、Chamfer Distance、invalid ratio等几何/语法指标与基于评分规则的VLM评判器存在差异。
    - 交互设置不同：多数基准假设单轮生成，另有证据路径引入先澄清后绘制的交互协议。
    开放问题:
    - 当前CAD基准是否覆盖决定生成程序能否实际使用的制造和装配约束？
    - 几何代理指标是否与下游工程效用一致，validity应在基准总分中如何权重？
    - 模型排名在输入模态偏移、几何复杂度分层和指标变化下是否稳定？
    - 基于评分规则的VLM评判器能否可靠补充或替代人工工程评估，且不易被过拟合？
    - 基准设置中主动澄清的交互成本和新失败模式如何评估？
