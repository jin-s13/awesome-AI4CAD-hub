  related_work_outline:
  - 'Mainstream direction: Establishing unified, multimodal benchmarks for CAD program
    generation and reconstruction, covering text-to-CAD, mesh-to-CAD, and image-to-CAD
    tasks with multi-metric evaluation suites.'
  - 'Shared research pattern: Aggregating large-scale CAD datasets, defining multiple
    geometric and engineering metrics, and comparing specialized CAD models against
    general-purpose vision-language models to reveal failure modes.'
  - 'Key differences: Evaluation protocols range from single-stage geometric fidelity
    to multi-stage engineering readiness checks; input modality coverage varies (text,
    mesh, image, sketch, point cloud); some benchmarks emphasize design intent and
    manufacturability, while others focus on reconstruction accuracy.'
  - 'Trend evolution: The field is moving from pure geometric reconstruction benchmarks
    toward holistic assessments that include executability, design specification alignment,
    and interactive clarification, with an increasing role for LLM/VLM-based evaluators.'
  - 'Open questions: How well benchmark tasks align with real-world CAD workflows;
    whether proxy metrics generalize to downstream engineering decisions; the stability
    of conclusions across different implementations and compute budgets; the reliability
    of automated VLM-based judges.'
  related_work_outline_zh:
  - 主流方向：建立统一的多模态CAD基准，覆盖文本到CAD、网格到CAD、图像到CAD等任务，并采用多指标评估体系。
  - 研究共性：聚合大规模CAD数据集，定义几何与工程多维度指标，对比专用CAD模型与通用视觉语言模型，揭示失败模式。
  - 关键差异：评估协议从单阶段几何保真度到多阶段工程就绪检查；输入模态范围不同（文本、网格、图像、草图、点云）；部分基准强调设计意图与可制造性，部分侧重重建精度。
  - 趋势演进：从纯几何重建基准向包含可执行性、设计规范对齐和交互式澄清的整体评估演进，基于LLM/VLM的自动评判器角色日益重要。
  - 开放问题：基准任务与实际CAD工作流的对齐程度；代理指标能否推广到下游工程决策；不同实现和算力下结论的稳定性；自动化VLM评判器的可靠性。
  literature_review:
    line_of_work_matrix:
    - line: Comprehensive multimodal CAD benchmarks
      what_it_solves: Unifying diverse input modalities and tasks into a single evaluation
        suite, enabling fair comparison of heterogeneous models on CAD generation
        and reconstruction.
      what_remains_open: Task distribution may not cover the full range of real-world
        CAD workflows; alignment between multi-metric scores and practical engineering
        quality remains uncertain.
    - line: Task-specific reverse engineering and reconstruction benchmarks
      what_it_solves: Providing detailed evaluation of parametric CAD reconstruction
        from 3D meshes, often with stepwise or iterative operation validation.
      what_remains_open: Benchmark conclusions may be sensitive to dataset composition
        and geometric complexity; generalizability to broader mechanical part categories
        is not fully verified.
    - line: Engineering-utility and design-intent benchmarks
      what_it_solves: Assessing generated CAD beyond geometry, including manufacturability,
        functionality, assemblability, and robustness to ambiguous prompts through
        interactive clarification.
      what_remains_open: Automated evaluation relies on VLM judges whose reliability
        and alignment with human expert judgment are still being validated; interaction
        protocols for clarification are not standardized.
    consensus:
    - Multi-metric evaluation is necessary to capture different failure modes, as
      model rankings shift across geometric fidelity, executability, and engineering
      criteria.
    - Large-scale, curated datasets with stratification by geometric complexity and
      diversity sampling are essential for controlled benchmarking.
    - Specialized CAD models outperform general-purpose LLMs/VLMs on idealized inputs,
      but both suffer from brittleness under modality shift and geometric complexity.
    disagreements:
    - 'Evaluation protocol design: some benchmarks apply a single-stage geometric
      and code check, while others employ multi-stage cascades that include engineering
      intent alignment.'
    - 'Evaluation target: some prioritize volumetric IoU and Chamfer distance as primary
      metrics, others emphasize reduction of invalid programs and compliance with
      design specifications.'
    - 'Role of interaction: proactive clarification is treated as part of the generation
      loop in some frameworks, whereas others evaluate offline after a single text-to-CAD
      step.'
    - 'Model scope: benchmarks differ in whether they compare specialized mesh-to-CAD
      models, code-generating VLMs, or multi-task multimodal large language models.'
    open_questions:
    - To what extent do current benchmarks represent the iterative, constraint-driven
      nature of real-world CAD authoring?
    - How can proxy metrics like Chamfer distance be linked to downstream engineering
      decisions and user satisfaction?
    - Are benchmark conclusions stable across different software implementations and
      compute budgets, especially for LLM-based systems?
    - What is the inter-rater reliability of VLM-based judges against human expert
      evaluations in engineering assessment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 综合性多模态CAD基准
      解决的问题: 将多种输入模态和任务统一到单一评估套件中，使异构模型在CAD生成和重建上的公平比较成为可能。
      尚未覆盖: 任务分布可能未覆盖真实CAD工作流的全部范围；多指标评分与实际工程质量之间的一致性尚不确定。
    - 路线: 任务特定的逆向工程与重建基准
      解决的问题: 提供对从3D网格重建参数化CAD的详细评估，常包含逐步或迭代操作验证。
      尚未覆盖: 基准结论可能对数据集组成和几何复杂程度敏感；对更广泛的机械零件类别的泛化性尚未完全验证。
    - 路线: 工程实用性与设计意图基准
      解决的问题: 在几何之外评估生成CAD，包括可制造性、功能性、可装配性，以及通过交互式澄清应对模糊提示的鲁棒性。
      尚未覆盖: 自动化评估依赖VLM评判器，其可靠性和与人类专家判断的一致性仍在验证中；澄清交互协议尚未标准化。
    共识:
    - 多指标评估是必要的，因为模型排名在几何保真度、可执行性和工程标准之间会发生变化。
    - 大规模、精心策划并按几何复杂度和多样性采样的数据集是受控基准测试的基础。
    - 在理想化输入下，专用CAD模型优于通用LLM/VLM，但两者在模态转换和几何复杂度增加时都表现出脆弱性。
    分歧:
    - 评估协议设计：部分基准采用单阶段几何和代码检查，其他则采用多阶段级联，包括工程意图对齐。
    - 评估目标：有些将体积交并比和倒角距离作为主要指标，另一些强调降低无效程序比例和符合设计规范。
    - 交互角色：主动澄清在某些框架中被视为生成循环的一部分，而其他框架则在单次文本到CAD步骤后离线评估。
    - 模型范围：基准在比较专用网格到CAD模型、代码生成VLM或多任务多模态大语言模型时各有侧重。
    开放问题:
    - 当前基准在多大程度上代表了真实CAD设计的迭代和约束驱动特性？
    - 像倒角距离这样的代理指标如何与下游工程决策和用户满意度关联？
    - 基准结论在不同软件实现和算力预算下是否稳定，特别是对于基于LLM的系统？
    - 在工程评估中，基于VLM的评判器与人类专家评估的评分者间信度如何？
