  literature_review_zh:
    研究路线矩阵:
    - 路线: 从网格/图像到参数化CAD重建
      解决的问题: 从几何或视觉输入恢复可编辑的参数化CAD操作序列。
      尚未覆盖: 在真实工业零件和评估数据集之外的迁移尚未确定，局限性细节缺失。
    - 路线: 统一多模态CAD任务建模
      解决的问题: 在单一模型中处理点云、文本、图像、草图以及CAD问答等多类任务。
      尚未覆盖: 对未见操作和 Fusion360/UniCAD 之外的泛化仍不明确。
    - 路线: 长序列CAD生成表示学习
      解决的问题: 通过自监督潜在表示和状态空间建模生成更长的有效参数化CAD序列。
      尚未覆盖: 下游可编辑性和更广泛指标下的有效性证据有限。
    - 路线: 视觉语言CAD代码生成与程序演化
      解决的问题: 从图像直接生成CAD代码，并通过演化程序生成扩展训练数据。
      尚未覆盖: 真实世界鲁棒性仅为部分；合成增强与实际工业复杂度的关系未完全证明。
    - 路线: 设计意图条件化与度量诊断
      解决的问题: 诊断CAD程序补全是否读取设计意图，以及评测指标是否循环。
      尚未覆盖: 单一模型和条件补全场景使一般性不确定；无条件生成和其他意图仍开放。
    共识:
    - 近期工作将可编辑参数化CAD程序或可执行代码作为应用CAD工作流的主要输出。
    - 普遍采用结构化CAD操作和逐步或迭代的几何反馈来提升有效性，优于一次性预测。
    - 评测依赖几何相似度和程序有效性，并开始关注可执行断言和设计意图一致性。
    - 利用大规模任务数据集、统一基准和多模态模型扩展CAD生成与重建。
    - 可复现性证据不均衡；数据包中多篇高排名论文缺少可见的局限或工件细节。
    分歧:
    - 输入与目标表示不同：网格、图像、点云、正交视图、文本设计意图头和可执行CAD代码。
    - 监督与生成机制不同：混合优化、离线强化学习、状态空间潜在生成、视觉语言模型微调和程序演化成长。
    - 评测重点不同：体积交并比与倒角距离、语法有效率、无效率、可执行几何断言和设计意图一致性各有侧重。
    - 有的系统端到端单模型完成，有的按步骤、前缀或程序演化分解重建。
    - 部署假设不同：部分方法报告强基准增益，仅少数测试真实图像、未见操作或条件化失败。
    开放问题:
    - 当前网格/图像到CAD方法在策展学术数据集之外的真实机械零件上有何迁移能力，目前只有部分真实图像证据？
    - 哪些评测指标与下游工业可编辑性一致，尤其是几何断言可显著降低头信息收益时？
    - 统一多模态CAD模型能否在已知基准之外保持长序列、工业级序列的有效性和可编辑性？
    - 当错误设计意图会损害生成且效应具有场景条件性时，应如何监督设计意图条件化？
    - 数据包中未显示代码、数据集、基线、指标或局限性细节时，顶级方法的可复现性缺口是什么？
