  related_work_outline_zh:
  - 主流方向：统一参数化CAD生成与评测正在走向多模态基准，同时考虑几何保真度、程序可执行性和工程意图。
  - 研究共性：工作将CAD程序生成或重建与数据集、指标结合，强调有效性、几何质量和下游设计质量，而非仅限于表面相似度。
  - 关键差异：部分设置评估网格到CAD逆向工程，部分面向文本到CAD装配体；评测从IoU、Chamfer距离到VLM判断的可制造性、功能性、可装配性不等。
  - 趋势演进：现有证据集中在当前前沿，正从单任务生成转向装配感知、多模态和主动澄清式CAD评测。
