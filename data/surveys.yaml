  related_work_outline:
  - 'Mainstream direction: The frontier is building unified multimodal CAD benchmarks
    and evaluation protocols that assess CAD program generation and reverse engineering
    from text, image, mesh, point-cloud, sketch, and multi-view inputs.'
  - 'Shared research pattern: Works aggregate existing CAD datasets, define multi-metric
    evaluation over executability, geometric fidelity, compactness, and design intent,
    then compare specialized CAD models against general-purpose LLM/VLM systems.'
  - 'Key differences: Some efforts target text/image-to-CAD generation, others mesh/point-to-CAD
    reconstruction; evaluations range from geometric scores to manufacturability,
    functionality, and assemblability rubrics; interaction varies from one-shot to
    clarification-based or stepwise.'
  - 'Trend evolution: Evidence is concentrated in 2026, so the trend is within the
    current frontier: from single-task CAD datasets toward unified multi-task benchmarks
    that expose failure cascades from code validity to engineering-ready geometry.'
  - 'Open questions: Whether proxy metrics align with downstream design decisions,
    how models perform under modality shift and ambiguity, and whether benchmark conclusions
    remain stable across implementations and compute budgets remain unverified.'
  related_work_outline_zh:
  - 主流方向：当前前沿集中于构建统一多模态CAD基准与评估协议，覆盖文本、图像、网格、点云、草图和视图输入，评估参数化程序与B-Rep生成。
  - 研究共性：工作通常汇集CAD数据集，设定可执行性、几何保真度、程序紧凑性与设计意图等多指标，并比较专用CAD模型与通用LLM/VLM系统。
  - 关键差异：部分面向文本/图像到CAD生成，部分面向网格/点云到CAD重建；评测从几何分数到可制造性、功能性、可装配性；交互从一次性生成到主动澄清或逐步构建。
  - 趋势演进：证据集中在2026年，只能判断当前前沿内趋势：从单任务CAD数据集转向统一多任务基准，并揭示从代码有效到工程可用几何的失败级联。
  - 开放问题：代理指标是否与下游设计决策一致、模型在模态转换与模糊输入下的鲁棒性、基准结论在不同实现和算力预算下是否稳定，仍未验证。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared CAD evaluation suites spanning text, image, mesh,
        point-cloud, and sketch inputs with multi-task outputs such as program generation,
        reverse engineering, and question answering.
      what_remains_open: Coverage of real design workflows, complex assemblies, manufacturing
        constraints, noisy inputs, and distribution shift is not established; several
        datasets and artifacts lack visibility or limitations.
    - line: Metric and stress-test design
      what_it_solves: Probes beyond aggregate accuracy through executability, validity,
        geometric fidelity, compactness, design-intent rubrics, and staged checks
        for engineering readiness.
      what_remains_open: Alignment between proxy metrics and downstream engineering
        decisions is unproven; model rankings change across metrics, and VLM-judge
        reliability or geometric metric sensitivity is not fully verified.
    - line: Comparable baselines and reporting
      what_it_solves: Supports auditability by reusing shared benchmarks and comparing
        task-specific models, LLM/VLM models, hybrid optimization, and agentic methods
        under common metrics.
      what_remains_open: Stability across implementations, compute budgets, and reproductions
        is unclear; multiple top papers have missing limitation details or limited
        code/artifact evidence.
    consensus:
    - CAD evaluation requires multiple signals rather than a single aggregate score,
      including validity, geometric error, and design-specific criteria.
    - Benchmarks increasingly reuse existing CAD dataset families and stratify by
      complexity to enable controlled comparison across model types.
    - There is a recurring cascade from executable code to geometrically valid output
      to engineering-ready design, with current models showing different bottlenecks.
    - General-purpose language or vision models and CAD-specialized models are compared
      under common tasks, revealing specialization-performance tradeoffs under clean
      and shifted inputs.
    disagreements:
    - 'Evaluation target differs: some works emphasize low-level geometry such as
      IoU, Chamfer distance, and invalid ratio, while others assess manufacturability,
      functionality, assemblability, or broader CAD question answering.'
    - 'Input-output focus differs: text/image-to-CAD generation, mesh/point-to-CAD
      reconstruction, and unified multimodal multi-task CAD are not the same problem
      setting.'
    - 'Interaction mode differs: one-shot program generation is contrasted with proactive
      clarification and stepwise construction, which trade interaction overhead against
      robustness.'
    - 'Supervision and optimization differ: supervised fine-tuning with reinforcement
      learning, ranking-based parameter grounding, hybrid geometric optimization,
      and VLM-judge feedback are used separately or in combination.'
    - 'Representation choice differs: some methods generate parametric construction
      sequences or CadQuery scripts, while others reason over B-Rep primitives and
      assemblies.'
    open_questions:
    - How well do current geometric and design-intent metrics predict downstream usefulness
      in real CAD workflows, given that model rankings change across metrics?
    - What benchmark task distributions are needed to cover noisy, ambiguous, or cross-modal
      inputs without making evaluation brittle or overly curated?
    - How stable are reported benchmark conclusions across implementations, compute
      budgets, VLM-judge choices, and dataset splits?
    - What assumptions explain the reported failure cascade from syntactically valid
      code to engineering-ready geometry, and which limitations are unmeasured?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 建立共享CAD评测套件，覆盖文本、图像、网格、点云和草图等输入，支持程序生成、逆向工程和问答等多任务。
      尚未覆盖: 真实设计流程、复杂装配、制造约束、噪声输入和分布偏移的覆盖尚未建立；部分数据集与工件缺乏可见信息或局限性说明。
    - 路线: 指标与压力测试设计
      解决的问题: 超越总分，通过可执行性、有效性、几何保真度、程序紧凑性、设计意图评分和分阶段检查来检验工程可用性。
      尚未覆盖: 代理指标与下游工程决策之间的一致性未证实；模型排名随指标变化，VLM评判器可靠性或几何指标敏感性尚未完全验证。
    - 路线: 可比基线与报告规范
      解决的问题: 通过复用共享基准，在统一指标下比较任务特定模型、LLM/VLM、混合优化和智能体方法，提升可审计性。
      尚未覆盖: 不同实现、算力预算和复现条件下的稳定性尚不清晰；多篇论文缺少局限性细节或代码、工件证据有限。
    共识:
    - CAD评估需要多信号而非单一总分，包括有效性、几何误差和设计特定准则。
    - 基准越来越多地复用既有CAD数据集族，并依据复杂度分层，以支持跨模型类型的受控比较。
    - 反复出现从可执行代码到几何有效输出再到工程就绪设计的失败级联，不同模型呈现不同瓶颈。
    - 通用语言或视觉模型与CAD专用模型在共同任务下比较，揭示清晰输入与分布偏移下的专用化性能差异。
    分歧:
    - 评测目标不同：有的强调IoU、Chamfer距离、无效比例等低层几何，有的评估可制造性、功能性、可装配性或更广泛的CAD问答。
    - 输入输出重点不同：文本/图像到CAD生成、网格/点云到CAD重建、统一多模态多任务CAD不是同一问题设置。
    - 交互模式不同：一次性程序生成与主动澄清、逐步构建存在差异，在交互开销和鲁棒性之间进行不同权衡。
    - 监督与优化不同：监督微调加强化学习、基于排序的参数接地、混合几何优化和VLM评判器反馈被分别或组合使用。
    - 表示方式不同：有的生成参数化构建序列或CadQuery脚本，有的围绕B-Rep基元与装配体进行推理。
    开放问题:
    - 当前几何和设计意图指标在真实CAD工作流中能否预测下游效用，尤其是模型排名会随指标变化？
    - 需要什么样的基准任务分布来覆盖噪声、模糊和跨模态输入，同时避免评估过于脆弱或过度策划？
    - 报告中的基准结论在不同实现、算力预算、VLM评判器选择和数据集划分下是否稳定？
    - 哪些假设解释了从语法有效代码到工程就绪几何的失败级联，还有哪些局限性未被测量？
