  related_work_outline_zh:
  - 主流方向：近期最相关证据集中在程序化CAD生成与评测，使用可执行CadQuery或可编辑B-Rep输出，接受文本、图像、点云或网格输入，评估几何、可执行性与工程意图。
  - 研究共性：系统将CAD表示为程序或参数曲面，训练或提示LLM、Transformer、状态空间模型，并通过从代码有效性到几何与设计意图的多阶段检查，揭示从粗略几何到忠实参数的失败级联。
