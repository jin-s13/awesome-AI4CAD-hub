  related_work_outline:
  - 'Mainstream direction: Multimodal and LLM-driven CAD program generation dominates,
    with benchmarks evaluating parametric scripts across text, image, mesh, and point-cloud
    inputs; FutureCAD, HierCAD, UniCAD, CADBench, and MUSE illustrate this pattern.'
  - 'Shared research pattern: Work converges on executable CAD program generation,
    structured geometric grounding or optimization, and multi-metric evaluation separating
    code validity, geometric fidelity, and downstream design intent.'
  - 'Key differences: Methods differ in input-to-output route: one-pass LLM generation,
    hierarchical text-to-CAD reasoning, hybrid optimization for mesh reconstruction,
    or proactive clarification; evaluation targets range from geometry and executability
    to manufacturability.'
  - 'Trend evolution: The evidence is concentrated in the current 2026 frontier, moving
    from single-task geometry-only reconstruction toward unified multi-task CAD models,
    agentic specification handling, and engineering-aware benchmarks.'
  - 'Open questions: Robustness across modality shift and geometric complexity, transfer
    of geometric metrics to manufacturability, separation of method contribution from
    datasets and benchmarks, and balancing clarification cost against CAD validity
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：多模态和LLM驱动的CAD程序生成是主导方向，基准测试从文本、图像、网格和点云等输入评估参数化脚本；FutureCAD、HierCAD、UniCAD、CADBench和MUSE体现了这一模式。
  - 研究共性：工作汇聚到可执行CAD程序生成、结构化几何接地或优化，以及区分代码有效性、几何保真度和下游设计意图的多指标评估。
  - 关键差异：方法的输入到输出路线不同：一次LLM生成、层次化文本到CAD推理、基于混合优化的网格重建或主动澄清；评估目标也从几何和可执行性扩展到可制造性。
  - 趋势演进：证据集中在当前2026年前沿，趋势从单任务几何重建转向统一多任务CAD模型、智能体式规格处理和工程感知基准。
  - 开放问题：模态迁移与几何复杂度下的鲁棒性、几何指标向可制造性的迁移、方法贡献与数据集及基准选择的分离、澄清成本与CAD有效性的平衡仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal CAD benchmarks and evaluation protocols
      what_it_solves: Standardized comparison across text, image, mesh, and point-cloud
        inputs and across geometric, executable, and design-intent metrics.
      what_remains_open: Metric rankings disagree across conditions, automated judges
        are not fully aligned with human engineering judgment, and coverage is not
        unified across all CAD tasks.
    - line: Parametric CAD program generation with large or multimodal language models
      what_it_solves: Converting text, image, sketch, or point-cloud prompts into
        executable CAD scripts and structured CAD sequences with hierarchical or grounded
        representations.
      what_remains_open: Models stay brittle under modality shift and high geometric
        complexity; parameter accuracy and the code-to-geometry-to-design validity
        chain still degrade.
    - line: Mesh/image-to-CAD reverse engineering via stepwise or optimization-based
        reconstruction
      what_it_solves: Recovering editable parametric CAD operations from discrete
        geometry by incremental fitting, IoU-driven refinement, and intermediate geometric
        validation.
      what_remains_open: Complex designs still produce invalid programs, and evidence
        is limited to the reported operation sets and datasets.
    - line: Agentic and interactive text-to-CAD specification resolution
      what_it_solves: Reducing ambiguity in natural-language CAD requests before program
        synthesis by targeted clarification and self-consistent specification generation.
      what_remains_open: Interaction overhead may not be acceptable in all workflows;
        gains may depend on curated training trajectories and the paired coding model.
    - line: Engineering-aware CAD generation and downstream design evaluation
      what_it_solves: Assessing manufacturability, functionality, and assemblability
        beyond geometric fidelity through staged code, geometry, and design-intent
        checks.
      what_remains_open: Strongest models still show limited engineering-ready success,
        and scalable rubric-based judging needs broader validation.
    consensus:
    - Executable parametric CAD program generation is the shared output format across
      reconstruction, text-to-CAD, and unified multimodal tasks.
    - Geometric fidelity alone is insufficient; evaluations combine multiple metrics
      because executability, compactness, and design-intent criteria rank models differently.
    - Grounding or validating generated programs against geometry or CAD structure
      improves fidelity over unconstrained generation.
    - A failure cascade from executable code to valid geometry to engineering-ready
      design is consistently observed.
    disagreements:
    - 'Representation choices differ: tokenized scripts or CAD sequences, hierarchical
      construction trajectories, incremental parametric operations, and B-Rep primitive
      grounding.'
    - 'Supervision and objectives differ: supervised fine-tuning with reinforcement
      learning, ranking-based parameter perturbation, IoU-driven optimization, and
      agent-generated clarification trajectories.'
    - 'Evaluation targets differ: some focus on geometric fidelity or executability,
      others on manufacturability, functionality, assemblability, or multi-task coverage.'
    - 'Interaction mode differs: one-pass generation, proactive clarification, and
      end-to-end multimodal task execution make different deployment assumptions.'
    open_questions:
    - How should evaluation choose among conflicting metrics and model rankings across
      modality shift and geometric complexity?
    - Which geometric and code-level metrics predict real manufacturability, functionality,
      and assemblability?
    - How much of reported gains in agentic, unified, or optimization-based CAD methods
      comes from the proposed method versus dataset curation, benchmark design, or
      paired baselines?
    - Can reverse-engineering and text-to-CAD models remain valid as B-Rep complexity
      and operation richness increase?
    - Does proactive clarification provide sufficient robustness to justify the added
      interaction cost in CAD workflows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD基准与评估协议
      解决的问题: 跨文本、图像、网格和点云输入，以及几何、可执行和设计意图指标进行标准化比较。
      尚未覆盖: 指标排名在不同条件下不一致，自动化评判器与人类工程判断仍缺乏全面对齐，基准覆盖不统一。
    - 路线: 基于大语言或多模态语言模型的参数化CAD程序生成
      解决的问题: 将文本、图像、草图或点云提示转换为可执行CAD脚本，并通过层次化或接地表示生成结构化CAD序列。
      尚未覆盖: 在模态迁移和高几何复杂度下仍脆弱；参数准确性以及从代码到几何再到设计有效性的链路仍会退化。
    - 路线: 通过逐步或优化方式从网格/图像逆向重建CAD
      解决的问题: 通过增量拟合、IoU驱动优化和中间几何验证，从离散几何恢复可编辑的参数化CAD操作。
      尚未覆盖: 复杂设计仍会产生无效程序，证据限于已报告的操作集和数据集。
    - 路线: 面向文本到CAD的智能体式与交互式规格澄清
      解决的问题: 在程序合成前通过针对性澄清和自洽规格生成，降低自然语言CAD需求中的歧义。
      尚未覆盖: 交互开销并非所有流程都可接受；收益可能依赖精心策划的训练轨迹和配套编码模型。
    - 路线: 面向工程属性的CAD生成与下游设计评估
      解决的问题: 通过代码、几何和设计意图的分阶段检查，评估几何保真度之外的制造性、功能性和可装配性。
      尚未覆盖: 最强模型在工程就绪设计上仍有限，基于评分标准的可扩展评判器需要更广泛验证。
    共识:
    - 可执行参数化CAD程序生成已成为重建、文本到CAD和统一多模态任务的共同输出形式。
    - 仅靠几何保真度不够；评估需要结合可执行性、紧凑性和设计意图等多个指标，因为不同指标会导致不同模型排名。
    - 将生成结果对几何或CAD结构进行接地或验证，比无约束生成更能提升保真度。
    - 从可执行代码到有效几何再到工程就绪设计，反复观察到失败级联。
    分歧:
    - 表示选择不同：脚本或CAD序列的标记化、层次化构建轨迹、增量参数化操作、B-Rep基元接地。
    - 监督和优化目标不同：带强化学习的监督微调、基于排序的参数扰动、IoU驱动优化、智能体生成的澄清轨迹。
    - 评估目标不同：有些关注几何保真度或可执行性，另一些关注可制造性、功能性、可装配性或多任务覆盖。
    - 交互方式不同：一次生成、主动澄清和端到端多模态任务执行采用了不同部署假设。
    开放问题:
    - 在模态迁移和几何复杂度变化导致指标和模型排名冲突时，应如何选择评估协议？
    - 哪些几何与代码级指标能够预测真实的可制造性、功能性和可装配性？
    - 智能体、统一或多模态优化CAD方法中，报告收益有多少来自方法本身，而不是数据集整理、基准设计或配对比基线？
    - 随着B-Rep复杂度和操作类型增加，逆向工程和文本到CAD模型能否保持输出有效？
    - 主动澄清带来的鲁棒性收益是否足以证明CAD工作流中额外交互成本是合理的？
