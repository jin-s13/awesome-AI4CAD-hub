  related_work_outline:
  - 'Mainstream direction: LLM/VLM-driven generation of editable parametric CAD programs
    from images, meshes, point clouds, and natural language, aiming to replace manual
    CAD modeling.'
  - 'Shared research pattern: fine-tuning large foundation models on paired CAD data
    (programs, code, STEP) to map multimodal inputs to structured CAD representations,
    evaluated with geometric metrics.'
  - 'Key differences: input modalities (image, mesh, point cloud, text), output representations
    (parametric sequences, CadQuery code, STEP files), and optimization strategies
    (hybrid optimization, RL, evolution, supervised fine-tuning).'
  - 'Trend evolution: since 2025, a sharp shift from hand-crafted geometry processing
    to learning-based CAD generation, with growing emphasis on multi-modal, multi-task
    frameworks and industrial-scale datasets.'
  - 'Open questions: generalization to real-world industrial CAD, robust handling
    of design intent, unbiased evaluation, and integration into professional CAD workflows.'
  related_work_outline_zh:
  - 主流方向：基于大语言模型/视觉语言模型的可编辑参数化CAD生成，从图像、网格、点云和自然语言输入中直接构建CAD模型，取代手工建模。
  - 研究共性：在配对CAD数据上微调大模型，将多模态输入映射到结构化CAD表示（序列、代码、STEP），并采用IoU、Chamfer距离等几何指标评估。
  - 关键差异：输入模态（图像、网格、点云、文本）、输出表示（参数化序列、CadQuery代码、STEP文件）和优化策略（混合优化、强化学习、进化、监督微调）。
  - 趋势演进：自2025年起，从传统几何处理快速转向AI驱动生成，多模态多任务统一框架和工业级数据集成为新焦点。
  - 开放问题：在真实工业CAD中的泛化能力，设计意图的鲁棒融入，评估指标的独立性，以及与专业CAD工作流的集成。
  literature_review:
    line_of_work_matrix:
    - line: Parametric CAD reconstruction from visual data (mesh, image, point cloud)
      what_it_solves: Converting unstructured 3D or 2D data into editable parametric
        CAD sequences (extrusions, revolutions, etc.) for downstream engineering modification.
      what_remains_open: Robustness to noisy real-world scans, generalization to unseen
        CAD operations and complex topological variations, and verification on industrial
        parts.
    - line: Text-to-CAD generation
      what_it_solves: Enabling natural language description to directly produce CAD
        models (STEP or CadQuery code), lowering the barrier for design entry.
      what_remains_open: Guaranteeing geometric accuracy and fidelity to nuanced design
        intent, and covering the full range of CAD primitives and constraints.
    - line: Unified multi-modal multi-task CAD frameworks
      what_it_solves: Building a single model that handles heterogeneous tasks (reconstruction,
        generation, question answering) across multiple input modalities within one
        architecture.
      what_remains_open: Comprehensive benchmark coverage of real CAD workflows, and
        demonstrated practical utility beyond academic benchmarks.
    - line: Diagnosis and control of LLM behavior in CAD generation
      what_it_solves: Investigating whether LLMs genuinely use design intent headers
        and how to prevent spurious correlations, using causal derangement and independent
        evaluation metrics.
      what_remains_open: Generalization beyond a single model and narrow design intents,
        and development of reliable, non-circular evaluation protocols for CAD generation.
    consensus:
    - All works aim to generate editable CAD representations rather than static meshes,
      emphasizing parametric history or code.
    - They rely on large-scale datasets of CAD programs and fine-tune foundation models
      or use hybrid optimization, with geometric metrics (IoU, Chamfer distance) as
      primary evaluation.
    - State-of-the-art claims are made on established benchmarks (DeepCAD, Fusion
      360, MCB), indicating a shared evaluation landscape.
    disagreements:
    - 'Output representation: some generate step-by-step parametric CAD sequences,
      others produce high-level code (CadQuery Python) or STEP files, affecting editability
      and compatibility with CAD software.'
    - 'Input modality emphasis: works specialize in image-to-CAD, mesh-to-CAD, point-cloud-to-CAD,
      or text-to-CAD, with different assumptions about available input data.'
    - 'Training paradigm: a mix of supervised fine-tuning, offline reinforcement learning,
      evolutionary optimization, and hybrid optimization, reflecting different trade-offs
      between correctness and exploration.'
    - 'Role of design intent: one study demonstrates that wrong design headers harm
      performance, while derangement control shows the effect is learned; other works
      assume design intent headers are beneficial without causal verification.'
    open_questions:
    - How do these methods perform on real-world industrial CAD data with complex
      assemblies, noisy scans, and incomplete specifications?
    - Can evaluation metrics be decoupled from the generation process to avoid inflated
      performance and metric circularity?
    - What is the minimal set of CAD operations and constraints needed to make a generated
      model truly editable in professional CAD software?
    - How to ensure that design intent is faithfully captured and not merely a statistical
      artifact of training data?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 从视觉数据（网格、图像、点云）重建参数化CAD
      解决的问题: 将非结构化2D/3D数据转换为可编辑的参数化CAD序列（拉伸、旋转等），支持下游工程修改。
      尚未覆盖: 对真实世界噪声扫描的鲁棒性、未见CAD操作和复杂拓扑的泛化、工业零件上的验证。
    - 路线: 文本到CAD生成
      解决的问题: 使自然语言描述直接生成CAD模型（STEP或CadQuery代码），降低设计输入门槛。
      尚未覆盖: 保证几何精度和细微设计意图的忠实度，覆盖全部CAD基元和约束。
    - 路线: 统一多模态多任务CAD框架
      解决的问题: 在单一架构中处理异构任务（重建、生成、问答）并支持多种输入模态。
      尚未覆盖: 对真实CAD工作流的全面基准覆盖，以及超越学术基准的实际效用验证。
    - 路线: LLM在CAD生成中的行为诊断与控制
      解决的问题: 探究LLM是否真正使用设计意图头，如何防止虚假关联，通过因果错乱和独立度量进行评估。
      尚未覆盖: 超越单一模型和狭窄设计意图的泛化，以及可靠、非循环的CAD生成评估协议。
    共识:
    - 所有工作都致力于生成可编辑的CAD表示（参数历史或代码），而非静态网格。
    - 依赖大规模CAD程序数据集，微调基础模型或采用混合优化，以几何指标（IoU、Chamfer距离）作为主要评价。
    - 在DeepCAD、Fusion 360、MCB等基准上声称达到最先进水平，形成共享的评估生态。
    分歧:
    - 输出表示：有的生成逐步参数化CAD序列，有的输出高阶代码（CadQuery Python）或STEP文件，影响可编辑性和软件兼容性。
    - 输入模态侧重：分别专注于图像到CAD、网格到CAD、点云到CAD或文本到CAD，对可用输入数据有不同假设。
    - 训练范式：混合使用监督微调、离线强化学习、进化优化和混合优化，反映正确性与探索的不同权衡。
    - 设计意图的作用：一项研究显示错误设计头会损害性能，错乱控制表明效应是学习到的；其他工作假设设计头有益但未做因果验证。
    开放问题:
    - 这些方法在真实工业CAD数据（复杂装配、噪声扫描、不完整规格）上表现如何？
    - 评估指标能否与生成过程解耦，以避免膨胀的性能和指标循环性？
    - 使生成模型在专业CAD软件中真正可编辑所需的最小操作和约束集是什么？
    - 如何确保设计意图被忠实捕获，而不仅仅是训练数据的统计伪影？
