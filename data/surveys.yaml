  related_work_outline:
  - 'Mainstream direction: Generating editable parametric CAD programs, code, or STEP
    models from visual, textual, or geometric inputs using large vision-language models
    and sequence models.'
  - 'Shared research pattern: Modeling CAD construction as a sequence of operations,
    using geometric feedback or reinforcement learning to improve fidelity, and emphasizing
    editability over static mesh output.'
  - 'Key differences: Input modalities vary (mesh, image, point cloud, natural language);
    output formats differ (CAD command sequences, CadQuery Python, STEP); training
    paradigms include supervised fine-tuning, reinforcement learning, hybrid optimization,
    and evolutionary approaches.'
  - 'Trend evolution: Work has shifted from geometry reconstruction toward end-to-end
    generative models, recently incorporating pre-trained LLMs/VLMs, multi-modal benchmarks,
    and direct code generation, reflecting a current frontier focus.'
  - 'Open questions: Robustness to real-world images and unseen operations, reliability
    of design intent conditioning, cross-tool and cross-dataset transfer, and scaling
    to long, complex CAD sequences.'
  related_work_outline_zh:
  - 主流方向：利用大型视觉语言模型和序列模型，从视觉、文本或几何输入生成可编辑的参数化CAD程序、代码或STEP模型。
  - 研究共性：将CAD构建建模为操作序列，使用几何反馈或强化学习提升保真度，强调可编辑性而非静态网格输出。
  - 关键差异：输入模态各异（网格、图像、点云、自然语言）；输出格式不同（CAD命令序列、CadQuery Python代码、STEP）；训练范式包括监督微调、强化学习、混合优化和进化方法。
  - 趋势演进：研究从几何重建转向端到端生成模型，近期融入预训练LLM/VLM、多模态基准和直接代码生成，反映当前前沿动态。
  - 开放问题：对真实世界图像和未见过操作的鲁棒性、设计意图条件化的可靠性、跨工具和跨数据集迁移，以及向长复杂CAD序列的扩展能力。
  literature_review:
    line_of_work_matrix:
    - line: Parametric CAD sequence reconstruction from geometry
      what_it_solves: Recovering editable CAD construction history (extrusion, revolution,
        fillet) from mesh or point cloud inputs.
      what_remains_open: Generalization to complex topologies with long operation
        sequences, and dependency on dataset-specific patterns.
    - line: Multi-modal unified CAD models
      what_it_solves: Handling heterogeneous tasks (reconstruction, generation, QA)
        and input modalities (point cloud, image, sketch, text) within a single model
        framework.
      what_remains_open: Coverage of richer CAD operations and real-world deployment
        beyond the benchmark setting.
    - line: Image-to-CAD code generation
      what_it_solves: Directly translating visual inputs into editable Python CAD
        code (CadQuery) using fine-tuned vision-language models.
      what_remains_open: Robustness to real-world photographs and unseen CAD operations,
        and the complexity ceiling of generated programs.
    - line: Evolutionary CAD program synthesis
      what_it_solves: Creating complex, realistic CAD models by iteratively evolving
        simple primitives under VLM guidance, generating large-scale executable code
        datasets.
      what_remains_open: Ensuring structural validity across all generations and applicability
        to assembly-level or multi-part designs.
    - line: Design intent conditioning and controllability
      what_it_solves: Understanding and controlling how high-level design headers
        influence low-level CAD program generation, and mitigating harmful incorrect
        intent.
      what_remains_open: Generalization across different models and CAD domains, and
        extending the findings to longer generation horizons.
    - line: Natural language to STEP model generation
      what_it_solves: Converting free-text descriptions into industry-standard STEP
        B-rep models using LLMs with retrieval-augmented generation and reinforcement
        learning.
      what_remains_open: Handling complex assemblies and maintaining exact geometric
        constraints in a graph-structured output.
    consensus:
    - Editable parametric representations (CAD history, code, STEP) are preferred
      over static mesh outputs for downstream engineering workflows.
    - Geometric fidelity metrics such as Intersection-over-Union, Chamfer Distance,
      and validity rates are core evaluation standards.
    - Pretrained large language and vision-language models can be effectively fine-tuned
      for CAD generation tasks.
    - Sequence modeling of CAD construction steps is a dominant paradigm, whether
      via autoregressive transformer, state space model, or decision transformer.
    - Incorporating geometric feedback, either through rewards or optimization loops,
      improves generation accuracy.
    disagreements:
    - 'Output format: some works generate CAD command sequences, others generate Python
      code (CadQuery) or STEP B-rep files, reflecting different editability and interoperability
      goals.'
    - 'Input modality: methods differ in assuming mesh, single image, multi-view orthographic
      projections, point clouds, or natural language as input.'
    - 'Training paradigm: approaches range from supervised fine-tuning, offline reinforcement
      learning, and GAN-based generation to hybrid optimization and evolutionary iterative
      refinement.'
    - 'Evaluation benchmarks: results are reported on different datasets (DeepCAD,
      Fusion 360, UniCAD, MCB, custom splits), making cross-comparison difficult.'
    - 'Use of retrieval: some methods employ retrieval-augmented generation, while
      others rely solely on model parameters, indicating a split on external knowledge
      grounding.'
    open_questions:
    - Can the image-to-CAD code models generalize to real-world, cluttered photographs
      instead of synthetic renderings?
    - How reliable is design intent conditioning when the model is given incorrect
      or ambiguous headers, and can this be mitigated?
    - What is the upper limit on the complexity and length of CAD sequences that current
      generative models can handle without losing validity?
    - Are the performance gains observed on specific benchmarks transferable across
      different CAD software, file formats, and engineering domains?
    - Can the evolutionary or RL-based methods be scaled to assembly-level tasks involving
      multiple parts and constraints?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 从几何重建参数化CAD序列
      解决的问题: 从网格或点云输入恢复可编辑的CAD构建历史（拉伸、旋转、倒角等）。
      尚未覆盖: 对具有长操作序列的复杂拓扑的泛化，以及对数据集特定模式的依赖。
    - 路线: 多模态统一CAD模型
      解决的问题: 在单一模型框架内处理异构任务（重建、生成、问答）和多种输入模态（点云、图像、草图、文本）。
      尚未覆盖: 更丰富CAD操作的覆盖，以及基准设置之外的真实世界部署。
    - 路线: 图像到CAD代码生成
      解决的问题: 使用微调的视觉语言模型，将视觉输入直接翻译为可编辑的Python CAD代码（CadQuery）。
      尚未覆盖: 对真实照片和未见过CAD操作的鲁棒性，以及生成程序的复杂度上限。
    - 路线: 进化式CAD程序合成
      解决的问题: 在VLM引导下，通过从简单基元逐步进化，创建复杂逼真的CAD模型，并生成大规模可执行代码数据集。
      尚未覆盖: 确保所有生成结果的结构有效性，以及向装配级或多零件设计的适用性。
    - 路线: 设计意图条件化与可控性
      解决的问题: 理解并控制高层设计意图头如何影响低层CAD程序生成，并减轻错误意图的有害影响。
      尚未覆盖: 在不同模型和CAD领域间的泛化，以及将发现扩展到更长生成范围。
    - 路线: 自然语言到STEP模型生成
      解决的问题: 利用具有检索增强生成和强化学习的大语言模型，将自由文本描述转换为工业标准STEP边界表示模型。
      尚未覆盖: 处理复杂装配体，并在图结构输出中维持精确的几何约束。
    共识:
    - 可编辑的参数化表示（CAD历史、代码、STP）优于静态网格输出，更适合下游工程工作流。
    - 几何保真度指标，如交并比、倒角距离和有效性比率，是核心评估标准。
    - 预训练的大型语言和视觉语言模型可以有效地为CAD生成任务进行微调。
    - CAD构建步骤的序列建模，无论是通过自回归Transformer、状态空间模型还是决策Transformer，都是主导范式。
    - 通过奖励或优化循环引入几何反馈，能提升生成精度。
    分歧:
    - 输出格式：有的工作生成CAD命令序列，有的生成Python代码（CadQuery）或STEP B-rep文件，反映了不同的可编辑性和互操作性目标。
    - 输入模态：方法假设的输入各异，包括网格、单张图像、多视图正交投影、点云或自然语言。
    - 训练范式：方法涵盖监督微调、离线强化学习、基于GAN的生成、混合优化和进化式迭代优化。
    - 评估基准：结果在不同的数据集（DeepCAD、Fusion 360、UniCAD、MCB、自定义划分）上报告，导致跨比较困难。
    - 检索使用：部分方法采用检索增强生成，其他方法仅依赖模型参数，表明在外部知识锚定上存在分歧。
    开放问题:
    - 图像到CAD代码模型能否泛化到真实世界杂乱场景的照片，而非合成渲染图？
    - 当模型接收到错误或模糊的设计意图头时，其条件化可靠性如何，能否缓解此问题？
    - 当前生成模型在处理CAD序列的复杂度和长度时，其有效性上限在哪里，还能保持有效吗？
    - 在特定基准上观察到的性能增益，能否跨不同CAD软件、文件格式和工程领域迁移？
    - 进化式或基于强化学习的方法能否扩展到涉及多个零件和约束的装配级任务？
