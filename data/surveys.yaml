  related_work_outline:
  - 'Mainstream direction: 2026 CAD method research is dominated by generative and
    multimodal models that output parametric CAD programs, with benchmarks for text-to-CAD,
    geometry-to-CAD reconstruction, and multi-task CAD.'
  - 'Shared research pattern: methods treat CAD as executable programs or construction
    sequences and use geometric grounding, stepwise comparison, optimization, or agentic
    clarification to improve validity and fidelity.'
  - 'Key differences: input mode and supervision vary from text-only LLM code generation
    to multimodal end-to-end MLLMs and hybrid optimization; evaluation targets span
    geometric, executability, and engineering-intent criteria.'
  - 'Trend evolution: within the 2026 frontier, work is shifting from single-task
    reconstruction/generation toward unified multimodal multi-task models and design-intent/assembly-level
    evaluation; older-year evidence is not represented in the top papers.'
  - 'Open questions: robustness under ambiguity and modality shift, attribution of
    gains, validation of engineering-readiness metrics, and missing limitation evidence
    remain open.'
  related_work_outline_zh:
  - 主流方向：2026年CAD方法研究以生成式与多模态模型输出参数化CAD程序为主，覆盖文本到CAD、几何到CAD重建和多任务CAD评测。
  - 研究共性：将CAD视为可执行程序或构建序列，通过几何接地、逐步比较、优化或智能体澄清来提高有效性和保真度。
  - 关键差异：输入模态与监督方式不同，包括文本大模型代码生成、多模态端到端模型、混合优化；评测目标覆盖几何、可执行性和工程意图。
  - 趋势演进：在当前2026前沿内，研究从单任务重建/生成转向统一多模态多任务模型，以及面向设计意图和装配级评测；早期年份在顶部论文中证据不足。
  - 开放问题：模糊性和模态迁移鲁棒性、收益归因、工程就绪度指标验证，以及局限性证据缺失仍是缺口。
  literature_review:
    line_of_work_matrix:
    - line: Text-to-CAD program generation via LLMs with parametric/B-rep grounding
      what_it_solves: Translates natural language design specifications into executable,
        editable parametric CAD programs while aligning geometric primitives and structure.
      what_remains_open: Robustness to ambiguous prompts, generalization beyond curated
        text-to-CadQuery datasets, and attribution of gains to representation versus
        base model or agent.
    - line: Geometry-to-CAD reconstruction and reverse engineering
      what_it_solves: Recovers parametric CAD construction sequences from meshes or
        point clouds, balancing geometric fidelity and program validity.
      what_remains_open: Scaling to complex geometry, handling modality shift, and
        separating learned model effects from incremental optimization and validation.
    - line: Unified multimodal multi-task CAD modeling
      what_it_solves: Provides a single model or framework for point-to-CAD, text/image-to-CAD,
        and CAD question answering across input modalities.
      what_remains_open: Whether end-to-end multi-task training maintains task-specific
        accuracy and how model rankings change across metrics.
    - line: CAD evaluation benchmarks and protocols
      what_it_solves: Defines multimodal, stratified, and design-intent-aware evaluation
        for CAD program generation and assemblies.
      what_remains_open: Validation of engineering-readiness metrics beyond VLM judges,
        coverage across complex assemblies, and comparability across benchmarks.
    consensus:
    - Parametric CAD is represented as executable programs or construction sequences,
      making editability and validity explicit rather than treating output as raw
      meshes.
    - Geometric grounding, intermediate comparison, or optimization feedback is used
      to improve fidelity and reduce invalid programs.
    - Evaluation is expanding beyond single geometric metrics to include executability,
      complexity stratification, and design intent.
    - Agentic or stepwise processes can resolve specification ambiguity or refine
      intermediate geometry, but reported gains often depend on final-output metrics.
    disagreements:
    - 'Representation and supervision differ: some use CadQuery code generation with
      supervised fine-tuning or reinforcement learning, others use construction-tree
      decomposition with perturbation/ranking, and others use IoU-driven hybrid optimization.'
    - 'Input and interaction modes differ: text-only single-pass generation, multimodal
      end-to-end generation, and proactive clarification before coding.'
    - 'Evaluation targets differ: geometric fidelity and executability versus manufacturability,
      functionality, and assemblability versus unified multi-task performance.'
    - 'Deployment assumptions differ: idealized mesh inputs favor specialized reconstructors,
      while real-world text-to-CAD with engineering intent exposes cascading failures.'
    open_questions:
    - How well do text-to-CAD models preserve engineering intent on complex assemblies
      beyond the limited success reported in current benchmarks?
    - Which model components—representation, grounding, optimization, agent, or base
      LLM—explain gains without full ablation evidence?
    - How robust are CAD-specialized models under modality shift and increasing B-rep
      face count, given benchmark-documented ranking instability?
    - Can VLM-judge engineering-readiness metrics be validated as reliable and aligned
      with real manufacturability and assemblability outcomes?
    - Several included papers leave limitations empty, so boundary conditions and
      failure modes are underreported in this evidence packet.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向文本到CAD程序生成的大模型与参数/B-Rep接地
      解决的问题: 将自然语言设计需求转换为可执行、可编辑的参数化CAD程序，并对齐几何基元与结构。
      尚未覆盖: 模糊提示下的鲁棒性、跨文本-CadQuery数据集的泛化，以及方法贡献与基座模型/智能体之间的归因。
    - 路线: 面向几何到CAD的重建与逆向工程
      解决的问题: 从网格或点云恢复参数化CAD构建序列，平衡几何保真度与程序有效性。
      尚未覆盖: 复杂几何扩展、模态转换鲁棒性，以及学习模型与增量式优化/验证的贡献区分。
    - 路线: 统一多模态多任务CAD建模
      解决的问题: 在单一模型中处理点云到CAD、文本/图像到CAD和CAD问答等多模态任务。
      尚未覆盖: 端到端多任务训练是否保持任务相对精度，以及模型排名是否随指标变化。
    - 路线: CAD评测基准与协议
      解决的问题: 定义多模态、分层和面向设计意图的CAD程序生成与装配评测。
      尚未覆盖: 超越VLM评委的工程就绪度指标验证，复杂装配覆盖，以及跨基准可比性。
    共识:
    - 参数化CAD被表示为可执行程序或构建序列，明确支持可编辑性和有效性，而非仅输出原始网格。
    - 通过几何接地、中间比较或优化反馈来提高几何保真度并降低无效程序比例。
    - 评测正在从单一几何指标扩展到可执行性、复杂度分层和设计意图。
    - 智能体或逐步式流程可以解决规格模糊或细化中间几何，但收益多依赖最终输出指标。
    分歧:
    - 表示与监督方式不同：有些使用CadQuery代码生成并配合监督微调或强化学习，有些使用构建树分解与扰动/排序监督，有些使用IoU驱动的混合优化。
    - 输入与交互模式不同：包括纯文本单步生成、多模态端到端生成，以及编码前的主动澄清。
    - 评测目标不同：几何保真度与可执行性、可制造性/功能性/可装配性、统一多任务性能各有侧重。
    - 部署假设不同：理想化网格输入有利于专用重建模型，而真实文本到CAD和工程意图场景会暴露执行到几何再到设计意图的级联失败。
    开放问题:
    - 文本到CAD模型在复杂装配上能在多大程度上保持工程意图，而不只是当前基准中的有限成功？
    - 在缺乏完整消融证据的情况下，表示、接地、优化、智能体或基座LLM中哪一部分解释了性能提升？
    - 在模态迁移和B-rep面数增加时，CAD专用模型有多鲁棒？基准已显示模型排名会随指标变化。
    - VLM评委给出的工程就绪度指标能否被可靠验证，并与真实可制造性和可装配性结果一致？
    - 多篇论文的局限性字段为空，因此该证据包中边界条件和失败模式证据不足。
