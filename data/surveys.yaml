  literature_review:
    line_of_work_matrix:
    - line: Runnable CAD pipelines and deployment stacks
      what_it_solves: Turning model-based CAD generation into end-to-end workflows
        from multimodal input to executable parametric programs.
      what_remains_open: Reliability under external deployment, hardware changes,
        and user-specific settings is not evidenced by the packet.
    - line: Real-time and interactive serving
      what_it_solves: Meeting interactivity requirements through proactive clarification
        and stepwise feedback before or during CAD program generation.
      what_remains_open: Trade-offs between latency, fidelity, controllability, and
        system complexity remain unmeasured in the available evidence.
    - line: Artifacts and reproducible engineering
      what_it_solves: Making CAD systems inspectable and reusable through benchmarks,
        datasets, and evaluation protocols.
      what_remains_open: Independent reproduction across teams, datasets, and infrastructure
        environments is still a verification gap.
    consensus:
    - Parametric CAD programs or scripts are the central representation because they
      are executable, editable, and support geometric validation.
    - Benchmarks evaluate more than one dimension, including geometric fidelity, executability
      or validity, compactness, and design intent.
    - Systems increasingly couple generation with validation or feedback in order
      to reduce invalid program ratios.
    - Multimodal inputs such as text, images, meshes, point clouds, and sketches are
      being integrated into unified tasks or systems.
    - There is a repeating failure cascade from code validity to geometry validity
      to engineering-ready design.
    disagreements:
    - 'Representation and supervision differ: LLM script generation, structured parameter
      optimization, stepwise reverse engineering, and unified multimodal models use
      distinct training and inference paths.'
    - 'Interaction mode differs: non-interactive generation contrasts with proactive
      clarification agents that query the user before synthesis.'
    - 'Evaluation targets differ: geometric fidelity, program compactness, manufacturability,
      functionality, and assemblability are not equivalent and can change model rankings.'
    - 'Input modality coverage differs: single text, single-modality reconstruction,
      and multimodal multi-task systems address different system boundaries.'
    - 'System goals differ: some methods optimize reconstruction under idealized inputs,
      while others target robustness to ambiguous prompts or engineering-ready design.'
    open_questions:
    - How well do these systems generalize across CAD kernels, dataset families, and
      hardware or deployment environments?
    - Can proactive clarification scale to complex assemblies while keeping interaction
      overhead low?
    - Do improvements in geometric metrics transfer to manufacturable, functional,
      and assemblable designs?
    - What latency and resource trade-offs are required for real-time interactive
      CAD systems?
    - Independent reproduction across teams and external deployment reliability remain
      unverified by the available evidence.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将模型能力转为从输入到可执行CAD程序的端到端工作流。
      尚未覆盖: 外部部署、硬件变化和用户特定设置下的可靠性证据不足。
    - 路线: 实时与交互式服务
      解决的问题: 通过主动澄清和逐步反馈满足闭环交互需求。
      尚未覆盖: 延迟、保真度、可控性与系统复杂度之间的权衡未系统评估。
    - 路线: 工件与可复现工程
      解决的问题: 通过基准与评估协议使系统可检查、可复用。
      尚未覆盖: 跨团队、数据集和基础设施的独立复现仍不明确。
    共识:
    - 参数化CAD程序/脚本是主要表示，因为可执行、可编辑并支持几何验证。
    - 基准测试同时关注几何保真度、有效性/可执行性和设计意图，而不是单一指标。
    - 系统趋向将生成与验证/反馈耦合，以降低无效程序率。
    - 多模态输入（文本、图像、网格、点云、草图）正被整合到统一任务或系统。
    - 从代码有效性到几何有效再到工程就绪存在级联失败。
    分歧:
    - 表示与监督：LLM脚本生成、结构化参数优化、逐步逆向工程和统一多模态模型采用不同训练与推断方式。
    - 交互模式：非交互式生成与主动澄清智能体在用户参与程度上不同。
    - 评测目标：几何保真、程序紧凑性、可制造性/功能性/可装配性不等价，导致模型排名变化。
    - 输入模态重点：单一文本、单一模态重建与多模态多任务系统覆盖范围不同。
    - 系统目标：部分追求理想化输入下的重建精度，部分面向模糊提示鲁棒性或工程就绪设计。
    开放问题:
    - 现有系统在CAD内核、数据集家族和硬件/部署环境中泛化如何？
    - 主动澄清能否扩展到复杂装配体并保持低交互开销？
