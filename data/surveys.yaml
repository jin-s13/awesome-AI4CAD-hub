  related_work_outline:
  - 'Mainstream direction: The field is converging on using large language models
    and vision-language models to generate parametric CAD programs (mainly B-Rep and
    construction sequences) from text, images, meshes, and point clouds, with a parallel
    push toward unified benchmarks that assess geometric fidelity, executability,
    and engineering properties.'
  - 'Shared research pattern: Most works adopt a pipeline that encodes an input (text,
    2D, or 3D) into a latent representation, then decodes a structured CAD program
    or construction sequence; evaluation is dominated by geometric metrics (IoU, Chamfer)
    and validity ratios, with a growing use of LLM-based or rubric-based judges for
    design intent.'
  - 'Key differences: Systems differ in the input modality they support (text-only
    vs. image vs. mesh vs. multi-modal), the generation strategy (one-shot vs. stepwise
    optimization vs. hybrid fitting), the targeted CAD representation (CadQuery scripts,
    generic construction trees, feature-based operations), and the depth of downstream
    engineering evaluation (purely geometric vs. manufacturability and assemblability).'
  - 'Trend evolution: The evidence packet is concentrated in 2026, indicating a current
    frontier shift from single-task, idealized-input CAD generation toward multi-modal,
    multi-task systems, interactive clarifying agents, and benchmarks that explicitly
    measure manufacturability and functional intent beyond geometric accuracy.'
  - 'Open questions: How to close the gap between geometry-valid outputs and engineering-ready
    designs; how to scale interactive clarification without excessive user burden;
    whether current benchmarks capture the diversity of real-world CAD workflows;
    and how to robustly handle complex, multi-part assemblies with physical constraints.'
  related_work_outline_zh:
  - 主流方向：领域正汇聚于使用大语言模型和视觉语言模型，从文本、图像、网格和点云生成参数化CAD程序（主要是B-Rep和构建序列），并同步推进统一基准，以评估几何保真度、可执行性和工程属性。
  - 研究共性：多数工作采用编码器-解码器范式，将输入（文本、2D或3D）编码为隐空间表示，再解码为结构化CAD程序或构建序列；评估以几何指标（IoU、Chamfer距离）和有效性比率为主，并越来越多地使用基于LLM或评分标准的评判器来衡量设计意图。
  - 关键差异：系统在支持的输入模态（纯文本、图像、网格、多模态）、生成策略（一次性生成、逐步优化、混合拟合）、目标CAD表示（CadQuery脚本、通用构建树、基于特征的步骤）以及下游工程评估深度（纯几何
    vs. 可制造性和可装配性）上存在差异。
  - 趋势演进：证据包集中在2026年，显示当前前沿正从单一任务、理想化输入的CAD生成转向多模态、多任务系统、交互式澄清智能体，以及明确衡量可制造性和功能意图的基准。
  - 开放问题：如何弥合几何有效输出与工程就绪设计之间的鸿沟；如何在不增加用户负担的情况下扩展交互式澄清；当前基准能否覆盖真实世界CAD工作流的多样性；以及如何鲁棒地处理带有物理约束的复杂多部件装配体。
  literature_review:
    line_of_work_matrix:
    - line: Text/multimodal-to-CAD program generation
      what_it_solves: Translating natural language descriptions, images, or point
        clouds directly into executable parametric CAD programs, enabling rapid design
        prototyping and accessibility for non-experts.
      what_remains_open: Robustness to ambiguous or underspecified prompts; guaranteeing
        that generated programs produce manufacturable and functionally correct assemblies;
        generalization to unseen design intents and complex multi-part structures.
    - line: Mesh/point cloud to parametric CAD reverse engineering
      what_it_solves: Recovering editable CAD construction sequences from 3D scans
        or meshes, which supports legacy part digitization and design reuse.
      what_remains_open: Handling high geometric complexity, noise, and missing data;
        ensuring the reverse-engineered sequence is compact and semantically meaningful;
        validating on real-world scanned parts rather than synthetic meshes.
    - line: Unified benchmarks and evaluation protocols for CAD generation
      what_it_solves: Providing standardized multi-modal datasets, metrics, and evaluation
        pipelines that enable fair comparison across CAD generation and reconstruction
        methods.
      what_remains_open: Whether geometric and validity metrics correlate with downstream
        engineering usability; the absence of multi-stage benchmarks that assess manufacturability,
        functionality, and assemblability at scale; the reliability of automated judges
        versus human expert evaluation.
    - line: Interactive and agentic CAD generation with clarification
      what_it_solves: Improving generation quality under ambiguous user prompts by
        having an agent proactively ask for clarification before code synthesis.
      what_remains_open: Optimal trade-off between interaction cost and output quality;
        how to extend the clarifying dialogue to cover complex engineering constraints;
        and whether the approach scales to multi-turn, collaborative design workflows.
    consensus:
    - Parametric CAD programs (construction sequences, B-Rep-based scripts) are the
      preferred output representation because they preserve editability and manufacturing
      history.
    - Geometric fidelity and executability are the primary evaluation dimensions;
      most works report intersection-over-union, Chamfer distance, and invalid ratio.
    - Large language models and vision-language models are the dominant backbone,
      often fine-tuned on curated CAD datasets.
    - There is a growing recognition that purely geometric metrics are insufficient
      and that benchmarks must incorporate design-intent alignment, manufacturability,
      and functional requirements.
    disagreements:
    - Whether to generate CAD programs in a single pass or via iterative optimization
      and stepwise verification; one-shot methods are simpler but often less accurate,
      while stepwise methods improve fidelity at higher computational cost.
    - 'The choice of CAD scripting language and representation: some works target
      CadQuery, others use custom construction trees or feature-based operations,
      which affects portability and compatibility with existing CAD tools.'
    - 'The granularity of evaluation: some benchmarks focus on single-part geometry,
      while others push toward multi-part assemblies with engineering constraints,
      leading to different conclusions about model capability.'
    - 'The role of interaction: systems like ProCAD introduce explicit clarification
      loops, whereas most other works assume the input is self-contained, revealing
      a split on whether user-in-the-loop is necessary for practical deployment.'
    open_questions:
    - Can current text-to-CAD systems produce outputs that satisfy real manufacturing
      constraints such as tolerances, material properties, and assembly fit without
      human post-processing?
    - How reliable are VLM-based judges for assessing design intent, and can their
      judgments be calibrated against domain expert evaluations?
    - What is the minimal set of clarifying interactions needed to resolve most practical
      ambiguities in text-to-CAD, and does proactive clarification improve outcomes
      in a real user study?
    - To what extent do mesh-to-CAD reverse engineering methods generalize to scanned
      industrial parts with defects, occlusions, and non-ideal topology?
    - How can the community build a living benchmark that evolves with CAD toolchains
      and captures the diversity of mechanical, architectural, and electronic design
      domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 文本/多模态到CAD程序生成
      解决的问题: 将自然语言描述、图像或点云直接转换为可执行的参数化CAD程序，实现快速设计原型制作，并降低非专业用户的使用门槛。
      尚未覆盖: 对模糊或欠约束提示的鲁棒性；保证生成程序产生可制造且功能正确的装配体；对未见设计意图和复杂多部件结构的泛化能力。
    - 路线: 网格/点云到参数化CAD逆向工程
      解决的问题: 从3D扫描或网格中恢复可编辑的CAD构建序列，支持遗留零件数字化和设计重用。
      尚未覆盖: 处理高几何复杂度、噪声和数据缺失；确保逆向工程序列紧凑且语义合理；在真实扫描零件（而非合成网格）上的验证。
    - 路线: CAD生成的统一基准与评估协议
      解决的问题: 提供标准化的多模态数据集、指标和评估流程，以便公平比较不同的CAD生成和重建方法。
      尚未覆盖: 几何和有效性指标是否与下游工程可用性相关；缺乏大规模评估可制造性、功能性和可装配性的多阶段基准；自动化评判器与人类专家评估的可靠性。
    - 路线: 交互式与智能体驱动的CAD生成（含澄清机制）
      解决的问题: 通过智能体在代码合成前主动请求澄清，提高模糊用户提示下的生成质量。
      尚未覆盖: 交互成本与输出质量之间的最优权衡；如何将澄清对话扩展到复杂工程约束；该方法能否扩展到多轮协作设计流程。
    共识:
    - 参数化CAD程序（构建序列、基于B-Rep的脚本）是优先选择的输出表示，因为它们保留了可编辑性和制造历史。
    - 几何保真度和可执行性是主要评估维度；大多数工作都报告交并比、Chamfer距离和无效比率。
    - 大语言模型和视觉语言模型是主要技术路线，通常在精心策划的CAD数据集上微调。
    - 逐渐认识到纯几何指标不足，基准必须纳入设计意图对齐、可制造性和功能性要求。
    分歧:
    - 生成CAD程序时采用一次性生成还是迭代优化与逐步验证：一次性方法更简单但精度较低，逐步方法提高保真度但计算成本更高。
    - CAD脚本语言和表示的选择：一些工作以CadQuery为目标，其他工作使用自定义构建树或基于特征的步骤，这影响了可移植性和与现有CAD工具的兼容性。
    - 评估粒度：部分基准关注单零件几何，另一些推进到带工程约束的多部件装配体，导致对模型能力的结论不同。
    - 交互的作用：ProCAD等系统引入了显式澄清循环，而大多数其他工作假定输入是自包含的，这反映出在用户是否在环是实际部署必要条件上的分歧。
    开放问题:
    - 当前的文本到CAD系统能否生成满足真实制造约束（如公差、材料属性、装配配合）的输出，而无需人工后处理？
    - 基于VLM的评判器在评估设计意图时有多可靠，其判断能否与领域专家评估对齐？
    - 解决文本到CAD中大多数实际模糊性所需的最少澄清交互集是什么？主动澄清在真实用户研究中是否能改善结果？
    - 网格到CAD逆向工程方法在多大程度上能泛化到带有缺陷、遮挡和非理想拓扑的扫描工业零件？
    - 社区如何构建一个随CAD工具链演进并覆盖机械、建筑和电子设计领域多样性的活体基准？
