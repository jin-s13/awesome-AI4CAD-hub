  related_work_outline:
  - 'Mainstream direction: Top evidence focuses on generation and reconstruction of
    editable parametric CAD, especially text-to-CAD, mesh/point-to-CAD, and multimodal
    benchmark protocols; retrieval and reasoning are less represented.'
  - 'Shared research pattern: Methods treat CAD as executable parametric programs
    or construction sequences, combining learned models with geometric validation,
    benchmark metrics, and sometimes agentic clarification or optimization feedback.'
  - 'Key differences: Problem formulation varies from one-shot LLM program synthesis,
    hierarchical structure/parameter grounding, and proactive clarification to stepwise
    or hybrid optimization reverse engineering and unified multi-task models.'
  - 'Trend evolution: Available top evidence is concentrated in 2026, so the observed
    trend is within the current frontier, moving from task-specific geometry-to-CAD
    models toward multimodal LLM benchmarks and design-intent evaluation.'
  - 'Open questions: It remains unclear how benchmark metrics and model rankings transfer
    beyond sampled datasets, how learned grounding or optimization preserves editability
    under complex geometry and ambiguous prompts, and which missing code/dataset/limitation
    details are verification gaps.'
  related_work_outline_zh:
  - 主流方向：主要证据集中在可编辑参数化CAD的生成与重建，尤其是文本到CAD、网格/点云到CAD和多模态基准协议；检索与推理覆盖较少。
  - 研究共性：将CAD视为可执行参数化程序或构建序列，结合学习模型、几何验证和基准指标，有时加入智能体澄清或优化反馈。
  - 关键差异：问题形式包括一次性LLM程序合成、层次化结构与参数接地、主动澄清、逐步或混合优化逆向工程以及统一多任务模型；评测侧重从可执行性到可制造性等不同标准。
  - 趋势演进：现有主要证据集中在2026年，趋势属于当前前沿：从特定任务的几何到CAD模型向多模态LLM基准、智能体交互和设计意图评测演进。
  - 开放问题：基准指标与模型排名在抽样数据之外是否可迁移；学习式接地或优化能否在复杂几何和模糊提示下保持可编辑性；缺失的代码、数据集和局限性细节应作为验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal CAD benchmarks and evaluation protocols
      what_it_solves: Provides shared samples, modalities, and metrics to compare
        CAD program generation and expose failure modes across code executability,
        geometry, and design intent.
      what_remains_open: Whether rankings and failure patterns transfer beyond the
        aggregated datasets; missing reproducibility details for several benchmarks
        are verification gaps.
    - line: LLM-based text-to-CAD program synthesis with structure and parameter grounding
      what_it_solves: Converts natural-language prompts into executable parametric
        CAD scripts or construction trees, improving structural consistency and parameter
        accuracy.
      what_remains_open: How much benefit comes from grounding objectives, reinforcement
        fine-tuning, or curated text-CAD data rather than the base LLM; limitation
        evidence is mostly absent.
    - line: Proactive specification clarification for text-to-CAD agents
      what_it_solves: Resolves ambiguous prompts through targeted clarification before
        code synthesis, reducing invalid outputs and geometric error with low interaction
        overhead.
      what_remains_open: Coverage of ambiguity types and how clarification overhead
        scales beyond the reported text-to-CadQuery setting.
    - line: Parametric geometry-to-CAD reverse engineering via stepwise or optimization-based
        fitting
      what_it_solves: Recovers editable CAD operation sequences from meshes or point
        clouds by incremental feature fitting and geometric feedback, improving validity
        and fidelity.
      what_remains_open: Whether IoU and Chamfer metrics capture editability; scalability
        to more operations, assemblies, and noisy multi-view inputs is underevidenced.
    - line: Universal multi-task multi-modal CAD models
      what_it_solves: Unifies point-to-CAD reconstruction, text/image-to-CAD generation,
        and CAD question answering in a single multimodal model.
      what_remains_open: Generalization beyond reported benchmarks and whether one
        evaluation suite can fairly cover heterogeneous CAD tasks.
    consensus:
    - Current methods represent CAD as executable parametric programs or construction
      sequences rather than raw geometry alone.
    - Evaluation increasingly spans multiple input modalities and combines executability,
      geometric fidelity, and design-intent checks.
    - Recent evidence shows a failure cascade from syntactically valid code to valid
      geometry to engineering-ready design.
    - Specialized geometry-to-CAD approaches can outperform general code-generating
      LLMs under idealized inputs, while LLM-based methods are pushed toward broader
      language and multi-task interfaces.
    disagreements:
    - 'Interaction mode: one-shot generation versus proactive clarification before
      program synthesis.'
    - 'Supervision and optimization: supervised fine-tuning plus RL, structured alignment
      and ranking, agentic fine-tuning, or geometric IoU-driven optimization.'
    - 'Evaluation target: geometric fidelity and executability versus manufacturability,
      functionality, and assemblability versus multi-task coverage.'
    - 'Input and output focus: text-to-CAD with B-Rep grounding or CadQuery scripts,
      geometry-to-CAD reverse engineering, or unified multimodal CAD tasks.'
    open_questions:
    - What benchmark metrics and model rankings remain stable when datasets grow beyond
      current sampled and stratified test sets?
    - How can text-to-CAD models preserve both program validity and engineering intent
      under ambiguous prompts without excessive clarification?
    - Do current reverse-engineering gains transfer to complex assemblies, noisy or
      multi-view inputs, and richer operation sets?
    - Which missing code, dataset, baseline, and limitation details should be treated
      as verification gaps rather than evidence of absence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD基准与评测协议
      解决的问题: 提供共享样本、模态和指标，比较CAD程序生成，并暴露从代码可执行性、几何有效性到设计意图的失败模式。
      尚未覆盖: 模型排名和失败模式在聚合数据集之外是否可迁移；若干基准的可复现细节缺失属于验证缺口。
    - 路线: 基于LLM的文本到CAD程序合成，含结构与参数接地
      解决的问题: 将自然语言提示转换为可执行参数化CAD脚本或构建树，提升结构一致性和参数准确性。
      尚未覆盖: 收益来自接地目标、强化微调还是精选数据尚不清晰；局限性证据大多缺失。
    - 路线: 面向文本到CAD的主动式规格澄清
      解决的问题: 在代码合成前通过定向澄清消除模糊提示，降低无效输出和几何误差，并保持较低交互开销。
      尚未覆盖: 模糊类型的覆盖范围以及澄清开销在报告场景之外的扩展性仍缺乏证据。
    - 路线: 基于逐步或优化拟合的参数化几何到CAD逆向工程
      解决的问题: 从网格或点云恢复可编辑CAD操作序列，通过增量特征拟合和几何反馈提高有效性与保真度。
      尚未覆盖: IoU和倒角距离是否反映可编辑性；向更多操作、装配体和噪声多视图输入的扩展证据不足。
    - 路线: 通用多任务多模态CAD模型
      解决的问题: 在单一多模态模型中统一处理点云到CAD重建、文本/图像到CAD生成和CAD问答。
      尚未覆盖: 在报告基准之外的泛化能力，以及单一评测套件能否公平覆盖异构CAD任务。
    共识:
    - 当前方法将CAD表示为可执行参数化程序或构建序列，而非仅处理原始几何。
    - 评测逐渐覆盖多种输入模态，并结合可执行性、几何保真度和设计意图检查。
    - 近期证据显示从可执行代码到有效几何再到工程就绪设计存在失败级联。
    - 在理想化输入下，专用几何到CAD方法可优于通用代码生成LLM，而LLM方法向语言和多任务接口扩展。
    分歧:
    - 交互模式：一次性生成与在程序合成前主动澄清。
    - 监督与优化：监督微调加强化学习、结构对齐与排序、智能体微调或基于几何IoU的优化。
    - 评测目标：几何保真度与可执行性，对比可制造性、功能性和可装配性，或对比多任务覆盖。
    - 输入输出重点：基于B-Rep接地或CadQuery脚本的文本到CAD、几何到CAD逆向工程，或统一多模态CAD任务。
    开放问题:
    - 当数据集扩展到当前采样和分层测试集之外时，哪些基准指标和模型排名仍然稳定？
    - 文本到CAD模型如何在模糊提示下同时保持程序有效性和工程意图，并避免过多澄清交互？
    - 当前逆向工程的增益能否迁移到复杂装配体、噪声或多视图输入以及更丰富的操作集？
    - 缺失的代码、数据集、基线和局限性细节中，哪些应作为验证缺口而非能力缺失的证据？
