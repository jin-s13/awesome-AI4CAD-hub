  - 'Key differences: They diverge in geometric representation (B-rep vs. mesh vs.
    point cloud), generation paradigm (autoregressive, reinforcement learning, GNN),
    and task setup (generation, reconstruction, alignment, interaction).'
  - 'Trend evolution: The field is shifting from classical geometry processing toward
    learning-based methods, with recent emphasis on complex topology generation, controllability,
