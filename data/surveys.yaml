  literature_review:
    line_of_work_matrix:
    - line: Executable text-to-parametric-CAD generation
      what_it_solves: Converts natural-language design specifications into editable
        CAD construction sequences or scripts, aiming for structural consistency and
        parameter accuracy.
      what_remains_open: Robustness under ambiguous prompts, exact grounding to B-Rep
        primitives, and generalization beyond curated text-to-CadQuery datasets or
        user settings.
    - line: Geometry-to-parametric-CAD reverse engineering
      what_it_solves: Recovers editable parametric CAD operation sequences from meshes,
        images, sketches, or point clouds while improving geometric fidelity and program
        validity.
      what_remains_open: Degradation under modality shift and growing geometric complexity,
        and stable unification of image-to-CAD with mesh-to-CAD workflows.
    - line: Unified multimodal CAD benchmarks and evaluation systems
      what_it_solves: Provides standardized evaluation across CAD tasks and input
        modalities, adding code executability, geometric validity, manufacturability,
        functionality, and assemblability checks.
      what_remains_open: Metric disagreement, the failure cascade from executable
        code to valid geometry to engineering-ready design, and independent validation
        of rubric-based or VLM judges.
    - line: Interactive and agentic CAD systems
      what_it_solves: Clarifies ambiguous specifications before program synthesis
        to reduce invalid outputs and geometric error while limiting interaction overhead.
      what_remains_open: Closed-loop latency, fidelity-controllability-complexity
        trade-offs, integration with real CAD kernels, and scaling to complex assemblies.
    consensus:
