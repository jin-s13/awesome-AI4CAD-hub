  related_work_outline:
  - 'Mainstream direction: The current frontier centers on structured CAD program
    generation and reconstruction, with LLM/agentic text-to-CAD pipelines, mesh-to-CAD
    optimization, and unified multimodal benchmarks dominating the evidence.'
  - 'Shared research pattern: Papers formalize CAD tasks as executable parametric
    program prediction rather than raw geometry regression; they use hierarchical
    or stepwise reasoning, align structure and parameters, and evaluate validity,
    fidelity, and design intent.'
  - 'Key differences: They differ in input interface, optimization signal, evaluation
    target, and deployment form. Inputs range from text, mesh, image, and point cloud
    to multimodal combinations; supervision ranges from SFT/RL and IoU optimization
    to stepwise comparison and clarification agents.'
  - 'Trend evolution: All top evidence is from 2026, so the trend is within the current
    frontier: from single-task text-to-CAD or mesh-to-CAD toward unified benchmarks
    and multimodal agents that explicitly expose failure cascades and modality shifts.'
  - 'Open questions: Which representations transfer across CAD tasks? How should geometric,
    executable, and engineering design criteria be reconciled? Are rankings stable
    across metrics and modalities? What is the model contribution versus planner,
    agent, or benchmark scaffolding?'
  related_work_outline_zh:
  - 主流方向：当前前沿集中在结构化CAD程序生成与重建，以LLM/智能体文本到CAD管线、网格到CAD优化和统一多模态基准为主要证据。
  - 研究共性：论文将CAD任务形式化为可执行参数化程序预测，使用层次化或逐步推理并对齐结构与参数，同时评估有效性、保真度和设计意图。
  - 关键差异：输入接口、优化信号、评估目标和部署形态不同。输入包括文本、网格、图像、点云和多模态；监督包括SFT/RL、IoU优化、逐步比较与澄清智能体。
  - 趋势演进：所有顶层证据均来自2026年，趋势属于当前前沿：从单任务文本到CAD或网格到CAD走向统一基准和多模态智能体，明确暴露失败级联和模态偏移。
  - 开放问题：哪些表示可跨CAD任务迁移？如何协调几何、可执行与工程设计准则？排名在指标和模态间是否稳定？模型贡献与规划器、智能体或基准脚手架如何区分？
  literature_review:
    line_of_work_matrix:
    - line: Text-to-CAD program generation with language grounding and agentic clarification
      what_it_solves: Converts natural-language specifications into executable parametric
        CAD programs; aligns object/part structure and primitive parameters to reduce
        ambiguity and invalid programs.
      what_remains_open: Most evidence reports aggregate SOTA or selected comparisons;
        generalization to real-world engineering requirements, fine-grained design
        intent, and interaction overhead remains unresolved.
    - line: Geometry-to-CAD reconstruction and reverse engineering
      what_it_solves: Recovers editable parametric CAD construction sequences from
        meshes, images, or point clouds by stepwise fitting or optimization, improving
        geometric fidelity and validity.
      what_remains_open: Reported gains are strongest for mechanical parts and idealized
        inputs; scalability to complex assemblies, noisy modalities, and manufacturability
        constraints lacks direct evidence.
    - line: Unified multimodal multi-task CAD modeling
      what_it_solves: Combines text, image, sketch, and point-cloud inputs for reconstruction,
        generation, and CAD question answering in one framework.
      what_remains_open: Cross-task transfer and trade-offs are not isolated; unified-model
        claims depend on benchmark design, and limitation analyses are largely unreported.
    - line: CAD evaluation benchmarks and failure-mode analysis
      what_it_solves: Standardizes evaluation across modalities, metrics, and engineering
        design intent; exposes failure cascades, metric ranking shifts, and model
        modality brittleness.
      what_remains_open: Benchmark coverage and rubric reliability are still being
        validated; no stable, unified protocol yet reconciles geometric, executable,
        and manufacturability criteria.
    consensus:
    - CAD generation and reconstruction are formalized as executable parametric programs
      rather than unstructured geometry output.
    - Hierarchical or stepwise structure alignment is repeatedly used to improve structural
      consistency and parameter accuracy.
    - Evaluation is moving beyond geometric similarity to include executability, validity,
      design intent, and modality robustness.
    - Multiple evidence points show that geometric complexity, modality shift, and
      metric choice can change model performance and ranking.
    disagreements:
    - 'Supervision and optimization differ: supervised fine-tuning or RL, IoU-driven
      hybrid optimization, stepwise intermediate geometry comparison, and agentic
      clarification trajectories.'
    - 'Input assumptions differ: ideal clean meshes, noisy meshes, text prompts, images,
      sketches, point clouds, or multimodal combinations.'
    - 'Evaluation targets differ: sequence generation or reconstruction quality, manufacturability/functionality/assemblability,
      or multi-task completion.'
    - 'Interaction mode differs: single-shot generation versus proactive clarification
      and agentic specification confirmation.'
    - 'Deployment form differs: specialized reconstruction models, code-generating
      visual-language models, and unified multi-task multimodal models.'
    open_questions:
    - Given that model rankings change across metrics and modalities, which evaluation
      setting should serve as the primary judgment?
    - What are the boundaries of current methods on complex B-Rep assemblies when
      moving from executable code to engineering-ready design?
    - How much of the robustness gain from proactive clarification comes from the
      clarification agent versus the coding agent fine-tuning?
    - Does unified multi-task CAD performance come from the model architecture or
      from benchmark and training construction choices?
    - Can optimization-based reconstruction scale beyond mechanical parts to noisy
      inputs, complex assemblies, and manufacturability constraints?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 文本到CAD程序生成与语言/智能体澄清
      解决的问题: 将自然语言规范转换为可执行参数化CAD程序，并对齐结构、拓扑和参数以降低歧义和无效程序。
      尚未覆盖: 多数证据只报告整体SOTA或选择性比较；对真实工程需求、细粒度设计意图和交互成本的泛化仍不明确。
    - 路线: 几何到CAD重建与逆向工程
      解决的问题: 从网格、图像或点云恢复可编辑的参数化CAD构建序列，通过逐步拟合或优化提升几何保真度和有效性。
      尚未覆盖: 报告收益主要集中在机械零件和理想化输入；对复杂装配、噪声模态和可制造性约束的可扩展性证据不足。
    - 路线: 统一多模态多任务CAD建模
      解决的问题: 在单一框架中处理文本、图像、草图和点云，以完成重建、生成和CAD问答任务。
      尚未覆盖: 跨任务迁移和权衡未被隔离；统一模型结论依赖基准设计，局限性分析大多缺失。
    - 路线: CAD评估基准与失败模式分析
      解决的问题: 在多模态、多指标和工程设计意图下标准化评估，揭示失败级联、指标排名变化和模态脆弱性。
      尚未覆盖: 基准覆盖与评分标准可靠性仍在验证；尚无统一协议同时调和几何、可执行与可制造性准则。
    共识:
    - CAD生成与重建被形式化为可执行参数化程序，而非仅预测非结构化几何。
    - 层次化或逐步结构对齐被反复用于提高结构一致性与参数准确性。
    - 评估正从几何相似性扩展到可执行性、有效性、设计意图和模态鲁棒性。
    - 多个证据显示几何复杂度、模态偏移和指标选择会改变模型表现与排名。
    分歧:
    - 监督与优化方式不同：监督微调或强化学习、IoU驱动混合优化、逐步几何比较、基于智能体轨迹的澄清。
    - 输入假设不同：理想干净网格、噪声网格、文本提示、图像、草图、点云或多模态组合。
    - 评估目标不同：序列生成或重建质量、可制造性/功能性/可装配性、或多任务完成情况。
    - 交互模式不同：单次生成与主动澄清、智能体式规格确认。
    - 部署形态不同：专用重建模型、代码生成视觉语言模型、统一多任务多模态模型。
    开放问题:
    - CADBench显示模型排名随指标与模态变化，哪套评估应作为主判定？
    - MUSE揭示从可执行代码到有效几何再到工程可用的失败级联，现有方法在复杂B-Rep装配上的边界在哪里？
    - ProCAD的鲁棒性提升中有多少来自澄清智能体、多少来自编码智能体微调？
    - UniCAD的统一多任务能力是否来自模型架构，还是基准与训练组合的周边选择？
    - CADFit等优化重建方法能否扩展到噪声输入、复杂装配和可制造性约束？
