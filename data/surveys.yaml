    - 路线: 基于LLM的文本到CAD生成
      解决的问题: 从自然语言描述生成可编辑的参数化CAD程序，通过层次化推理或主动澄清提升结构一致性、参数准确性和对模糊性的鲁棒性。
      尚未覆盖: 对未见零件族的泛化能力有限；对设计意图的深层理解和可靠生成工程级约束装配体仍待解决。
