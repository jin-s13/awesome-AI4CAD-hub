  related_work_outline:
  - 'Mainstream direction: Recent work centers on generating editable parametric CAD
    programs and on multidimensional benchmarks that evaluate more than surface similarity,
    including code validity, geometric fidelity, and engineering design intent.'
  - 'Shared research pattern: Most methods represent CAD as parametric programs or
    construction sequences, align them with language or geometry via learned or optimization-based
    objectives, and evaluate with multiple CAD-specific metrics.'
  - 'Key differences: Methods differ in input modality, generation strategy such as
    single-pass LLM code, stepwise reverse engineering, hybrid optimization, hierarchical
    grounding, or interactive clarification, and in task scope ranging from specialized
    to universal.'
  - 'Trend evolution: The available 2026 top papers indicate a within-frontier shift
    from mainly shape-matching reconstruction toward unified multimodal benchmarks,
    agentic specification clarification, and manufacturability/functionality-oriented
    evaluation.'
  - 'Open questions: Generalization under complex geometry and modality shift, metric-independent
    evaluation, interaction cost, and isolation of method contribution from datasets,
    baselines, and implementation choices remain unresolved.'
  related_work_outline_zh:
  - 主流方向：近期工作集中于生成可编辑的参数化CAD程序，并用多维基准同时评估代码有效性、几何保真度和工程设计意图，而不只是表面相似度。
  - 研究共性：多数方法将CAD表示为参数化程序或构建序列，通过学习或优化目标与语言/几何对齐，并用多种CAD特定指标评测。
  - 关键差异：输入模态、生成策略如单步LLM代码、逐步逆向、混合优化、层次接地或交互澄清，以及任务范围从专用到通用均有不同。
  - 趋势演进：可见的2026年论文显示当前前沿从单一形状重建转向统一多模态基准、智能体澄清和面向可制造性与功能性的评测。
  - 开放问题：复杂几何与模态偏移上的泛化、不依赖指标的评测、交互成本，以及方法贡献与数据集/基线等系统因素的隔离仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Text-to-CAD program synthesis
      what_it_solves: Generating executable parametric CAD programs from natural language
        specifications while preserving editability.
      what_remains_open: Ambiguous prompts, fine-grained engineering constraints,
        and generalization to complex assemblies are not fully covered.
    - line: Geometry-to-CAD reverse engineering
      what_it_solves: Recovering parameterized CAD construction sequences from meshes
        or point clouds through stepwise or optimization-based reconstruction.
      what_remains_open: Scaling to high geometric complexity, avoiding invalid operations,
        and robustness under modality shift remain open.
    - line: Unified multimodal multi-task CAD modeling and evaluation
      what_it_solves: Supporting point, text, image, sketch, and perhaps other inputs
        while addressing multiple CAD tasks in one framework.
      what_remains_open: Whether universal models remain competitive with specialized
        models under distribution shift, resource limits, and metric variation is
        unresolved.
    - line: CAD program optimization and grounding objectives
      what_it_solves: Aligning symbolic CAD structure with geometry and parameters
        through structure alignment, primitive grounding, or geometric feedback optimization.
      what_remains_open: Which objective designs transfer beyond the reported datasets
        and task families is unclear.
    - line: Benchmark and evaluation protocol design
      what_it_solves: Measuring executability, geometric fidelity, program compactness,
        manufacturability, functionality, and assemblability in controlled CAD evaluation
        settings.
      what_remains_open: Consistent metrics and judge reliability across geometric
        complexity and long-tail designs need more evidence.
    - line: Interactive or clarifying text-to-CAD agents
      what_it_solves: Resolving ambiguous specifications before program synthesis
        to reduce invalid or low-fidelity outputs.
      what_remains_open: Interaction overhead, user-level benefit, and deployment
        evidence remain limited.
    consensus:
    - CAD is increasingly represented as executable parametric programs or construction
      sequences rather than only boundary geometry, enabling editability and validity
      checks.
    - Evaluation is moving beyond geometric similarity to include code executability,
      compactness, manufacturability, functionality, and assemblability.
    - LLMs and multimodal models are common generators, but specialized optimization,
      grounding, or stepwise verification mechanisms are needed for high-fidelity
      geometry and complex parts.
    - Benchmarks stratify by geometric complexity or design intent to expose failure
      modes hidden by aggregate scores.
    disagreements:
    - 'Representation and supervision differ: direct code generation, stepwise feature
      construction, hybrid geometric optimization, hierarchical structure alignment,
      and interactive clarification all coexist.'
    - 'Evaluation targets differ: some work optimizes geometric fidelity alone, while
      others prioritize code validity, invalid ratio, or engineering design intent
      such as manufacturability and assemblability.'
    - 'Interaction mode differs: single-shot generation is contrasted with agentic
      clarification that asks targeted questions before synthesis, trading interaction
      overhead for robustness.'
    - 'Task scope differs: specialized mesh-to-CAD or text-to-CAD methods report higher
      idealized-input performance, while unified multimodal frameworks pursue broader
      task coverage.'
    open_questions:
    - How should models maintain CAD construction fidelity when geometric complexity
      and input modality shift together?
    - What evaluation protocol can balance shape fidelity, code validity, and engineering
      design intent without rankings changing substantially across metrics?
    - How much of reported gains is attributable to method design versus dataset quality,
      baseline choice, metric selection, or post-hoc verification, given limited code
      and limitation evidence in this packet?
    - For clarification-driven and agentic systems, how much user interaction is required
      and what evidence supports real-world use?
    - Can unified multimodal CAD models remain competitive with specialized models
      on distribution shifts, rare CAD operations, and practical design constraints?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 文本到CAD程序生成
      解决的问题: 从自然语言生成可执行的参数化CAD程序，同时保持可编辑性。
      尚未覆盖: 模糊提示、细粒度工程约束和复杂装配体的泛化尚未充分覆盖。
    - 路线: 几何到CAD逆向工程
      解决的问题: 通过逐步或基于优化的方式从网格或点云恢复参数化CAD构建序列。
      尚未覆盖: 高几何复杂度扩展、避免无效操作和模态偏移鲁棒性仍待解决。
    - 路线: 统一多模态多任务CAD建模与评测
      解决的问题: 在单一框架中支持点云、文本、图像、草图等输入并处理多种CAD任务。
      尚未覆盖: 通用模型在分布偏移、资源限制和指标变化下能否匹配专用模型仍不明确。
    - 路线: CAD程序优化与接地目标
      解决的问题: 通过结构对齐、基元接地或几何反馈优化，将符号CAD结构与几何和参数对齐。
      尚未覆盖: 哪些目标设计能迁移到已报告数据集和任务族之外尚不清楚。
    - 路线: 基准与评测协议设计
      解决的问题: 在受控CAD评测中测量可执行性、几何保真度、程序紧凑性、可制造性、功能性和可装配性。
      尚未覆盖: 跨几何复杂度和长尾设计的一致指标与评委可靠性仍需更多证据。
    - 路线: 交互式或澄清型文本到CAD智能体
      解决的问题: 在程序合成前消解模糊规格，以减少无效或低保真输出。
      尚未覆盖: 交互开销、用户层面收益和部署证据仍然有限。
    共识:
    - CAD越来越多地被表示为可执行参数化程序或构建序列，而不仅是边界几何，从而支持可编辑性和有效性检查。
    - 评测正从几何相似度扩展到代码可执行性、紧凑性、可制造性、功能性和可装配性。
    - LLM和多模态模型是常见生成器，但高保真几何和复杂零件仍需专门优化、接地或逐步验证机制。
    - 基准按几何复杂度或设计意图分层，以暴露汇总分数掩盖的失败模式。
    分歧:
    - 表示和监督不同：直接代码生成、逐步特征构建、混合几何优化、层次结构对齐和交互澄清同时存在。
    - 评测目标不同：有些工作只优化几何保真度，有些优先代码有效性、无效比例或可制造性与可装配性等工程设计意图。
    - 交互模式不同：单次生成与智能体澄清形成对比，后者在合成前提出针对性问题，以交互开销换取鲁棒性。
    - 任务范围不同：专用网格到CAD或文本到CAD方法在理想化输入下表现更高，而统一多模态框架追求更广泛的任务覆盖。
    开放问题:
    - 当几何复杂度和输入模态同时变化时，模型如何保持CAD构建保真度？
    - 什么评测协议能在形状保真度、代码有效性和工程设计意图之间取得平衡，同时避免模型排名随指标显著变化？
    - 在代码和局限性证据有限的情况下，报告增益有多少来自方法设计，而不是数据集质量、基线选择、指标敏感性或后处理验证？
    - 对于澄清驱动和智能体系统，需要多少用户交互，是否有证据支持实际部署？
    - 统一多模态CAD模型能否在分布偏移、稀有CAD操作和实际设计约束下保持对专用模型的竞争力？
