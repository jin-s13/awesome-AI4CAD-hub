  related_work_outline:
  - 'Mainstream direction: AI methods for CAD generation and reverse engineering are
    coalescing around program synthesis, where parametric CAD models are represented
    as executable sequences or scripts generated by sequence models, LLMs, or hybrid
    optimization pipelines.'
  - 'Shared research pattern: Most works decompose CAD into a structured program (command
    sequences, CadQuery, B-Rep operations) and learn to generate it from modalities
    such as text, images, point clouds, or meshes, evaluated via geometric fidelity,
    executability, and design-intent alignment.'
  - 'Key differences: Representations differ (sketch-extrude command sequences, CadQuery
    scripts, B-Rep primitive sequences); supervision varies (direct supervised fine-tuning,
    reinforcement learning, IoU-driven optimization); interaction modes range from
    single-pass generation to proactive clarification agents.'
  - 'Trend evolution: Within the 2025–2026 frontier, papers shift from task-specific
    sequence models to unified multi-modal LLM frameworks, introduce interactive clarification,
    and develop multi-dimensional benchmarks that assess manufacturability, assemblability,
    and robustness beyond simple geometric metrics.'
  - 'Open questions: How to maintain reconstruction quality as geometric complexity
    increases; how to make models robust to modality shift; how to systematically
    incorporate engineering constraints (manufacturability, functionality) into generation;
    and how to close the evaluation gap between synthetic metrics and real-world design
    utility.'
  related_work_outline_zh:
  - 主流方向：面向CAD生成与逆向工程的AI方法正汇聚于程序合成范式，将参数化CAD模型表示为可执行序列或脚本，由序列模型、LLM或混合优化流水线生成。
  - 研究共性：多数工作将CAD分解为结构化程序（命令序列、CadQuery脚本、B-Rep操作），并从文本、图像、点云或网格等模态学习生成，通过几何保真度、可执行性及设计意图对齐进行评估。
  - 关键差异：表示方式不同（草绘-拉伸命令序列、CadQuery脚本、B-Rep基元序列）；监督信号不同（直接监督微调、强化学习、IoU驱动优化）；交互模式从单次生成到主动澄清智能体。
  - 趋势演进：在2025–2026前沿期，论文从任务专用序列模型转向统一多模态LLM框架，引入交互式澄清，并发展出可评估可制造性、可装配性及鲁棒性的多维基准，超越简单几何指标。
  - 开放问题：几何复杂度增加时如何保持重建质量；如何使模型对模态转换鲁棒；如何将工程约束（可制造性、功能性）系统融入生成；如何缩小合成指标与真实世界设计效用的评估差距。
  literature_review:
    line_of_work_matrix:
    - line: Parametric CAD program generation from multi-modal inputs
      what_it_solves: Transforms text, image, point cloud, or mesh inputs into editable
        parametric CAD programs (command sequences, CadQuery scripts, B-Rep operations)
        via autoregressive models, LLMs, or hybrid optimization.
      what_remains_open: Whether the chosen program representation and training objective
        generalize beyond the dataset family; robustness to modality shift and geometric
        complexity escalation; integration of engineering constraints beyond geometric
        similarity.
    - line: Mesh-to-CAD reverse engineering via stepwise or optimization-based reconstruction
      what_it_solves: Recovers parametric CAD construction sequences from 3D meshes
        by iteratively fitting operations and validating against intermediate or final
        geometry, often using IoU-driven optimization or step-by-step feature addition.
      what_remains_open: How much of the reconstruction accuracy comes from the optimization
        post-processing vs. the learned prior; failure modes for complex topologies
        and non-standard operations like fillets/chamfers; need for richer operation
        sets and benchmarks.
    - line: Multi-modal multi-task unified frameworks and benchmarks for CAD
      what_it_solves: Provides a single model or evaluation suite that handles heterogeneous
        CAD tasks (reconstruction, generation, QA) across modalities, with standardized
        metrics covering executability, geometric fidelity, and design intent.
      what_remains_open: Whether unified models truly outperform task-specific ones
        on all dimensions; the reliability of VLM-based judges for engineering criteria;
        benchmark coverage of real-world manufacturing constraints and assembly contexts.
    - line: Interactive and agentic clarification for robust text-to-CAD generation
      what_it_solves: Improves robustness to ambiguous prompts by introducing a proactive
        clarifying agent that audits the prompt and asks targeted questions before
        CAD code synthesis, reducing invalid outputs and geometric errors.
      what_remains_open: Scalability of the agentic framework to complex multi-part
        assemblies; how many clarification turns are needed without overburdening
        users; whether the clarifying agent can be trained without large-scale human
        annotation.
    consensus:
    - CAD generation is best treated as a structured program synthesis problem, where
      the output is an executable CAD program rather than a raw mesh or point cloud.
    - Multi-modal conditioning (text, image, mesh, point cloud) is necessary for practical
      CAD creation workflows, and state-of-the-art methods incorporate at least two
      modalities.
    - Evaluation must go beyond geometric similarity (Chamfer distance, IoU) to include
      executability, structural validity, and design-intent alignment, often using
      multiple metrics and staged protocols.
    - Large language models and vision-language models are becoming core components,
      either as generators fine-tuned on CAD code or as evaluators/judges in benchmarks.
    disagreements:
    - 'Representation format: some works use auto-regressive sketch-extrude command
      sequences, others generate CadQuery or Python scripts, and some directly predict
      B-Rep primitive operations, leading to different trade-offs in editability and
      precision.'
    - 'Supervision and optimization: supervised fine-tuning on curated datasets (e.g.,
      FutureCAD, HierCAD) vs. hybrid optimization with geometric feedback (e.g., CADFit)
      vs. reinforcement learning post-training, with unclear boundaries on which contributes
      most to final performance.'
    - 'Interaction mode: single-pass generation assumes a complete specification,
      while agentic clarification (ProCAD) argues that real-world prompts are ambiguous
      and require multi-turn dialogue; the overhead and user experience of clarification
      remain debated.'
    - 'Evaluation target: benchmarks like CADBench and UniCAD emphasize geometric
      and program metrics, while MUSE pushes for functional, manufacturability, and
      assemblability criteria, reflecting a tension between geometric accuracy and
      engineering utility.'
    open_questions:
    - How do representation choices (command sequences, CadQuery, B-Rep primitives)
      affect generalization to unseen part categories and complex assemblies?
    - What is the minimum set of evaluation metrics that correlates with practical
      CAD engineer satisfaction, and can VLM judges reliably approximate human expert
      assessment?
    - Can hybrid optimization methods be scaled to handle the full diversity of CAD
      operations (e.g., fillets, chamfers, patterns) without sacrificing reconstruction
      speed?
    - To what extent does the performance of agentic frameworks depend on the underlying
      LLM's coding ability, and how can light-weight clarifying agents be trained
      without large-scale human preference data?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 从多模态输入生成参数化CAD程序
      解决的问题: 将文本、图像、点云或网格输入转化为可编辑的参数化CAD程序（命令序列、CadQuery脚本、B-Rep操作），通过自回归模型、LLM或混合优化实现。
      尚未覆盖: 所选的程序表示和训练目标是否能在数据集家族之外泛化；对模态转换和几何复杂度升级的鲁棒性；在几何相似性之外系统集成工程约束。
    - 路线: 基于逐步或优化的网格到CAD逆向工程
      解决的问题: 通过迭代拟合操作并与中间或最终几何进行验证，从3D网格恢复参数化CAD构建序列，常使用IoU驱动优化或逐步特征添加。
      尚未覆盖: 重建精度有多少来自优化后处理而非学习到的先验；复杂拓扑及非标准操作（如倒角/圆角）的失败模式；需要更丰富的操作集和基准。
    - 路线: 多模态多任务统一框架与CAD基准
      解决的问题: 提供单一模型或评估套件，处理跨模态的异构CAD任务（重建、生成、问答），并标准化可执行性、几何保真度和设计意图等指标。
      尚未覆盖: 统一模型是否在所有维度上真正优于任务专用模型；基于VLM的评判器对工程标准的可靠性；基准对真实制造约束和装配场景的覆盖。
    - 路线: 交互式与主动澄清用于鲁棒文本到CAD生成
      解决的问题: 通过引入主动澄清智能体，在生成CAD代码前审核提示并提问，提高对模糊提示的鲁棒性，减少无效输出和几何误差。
      尚未覆盖: 智能体框架对复杂多部件装配的可扩展性；需要多少轮澄清而不增加用户负担；澄清智能体能否在没有大规模人工标注的情况下训练。
    共识:
    - CAD生成最好被视为结构化程序合成问题，输出为可执行CAD程序而非原始网格或点云。
    - 多模态条件（文本、图像、网格、点云）对于实际CAD创建流程必不可少，当前最优方法至少融合两种模态。
    - 评估必须超越几何相似性（Chamfer距离、IoU），纳入可执行性、结构有效性和设计意图对齐，常采用多指标和分阶段协议。
    - 大语言模型和视觉语言模型正成为核心组件，或在CAD代码上微调作为生成器，或在基准中作为评估器/评判器。
    分歧:
    - 表示格式：有的使用自回归草绘-拉伸命令序列，有的生成CadQuery或Python脚本，有的直接预测B-Rep基元操作，导致可编辑性和精度上的不同权衡。
    - 监督与优化：在策划数据集上进行监督微调（如FutureCAD、HierCAD）vs. 结合几何反馈的混合优化（如CADFit）vs. 强化学习后训练，三者对最终性能的贡献边界尚不明确。
    - 交互模式：单次生成假设输入规格完整，而主动澄清（ProCAD）认为真实提示存在歧义并需要多轮对话；澄清的开销和用户体验仍存争议。
    - 评价目标：CADBench和UniCAD等基准强调几何和程序指标，而MUSE推动功能性、可制造性和可装配性标准，反映出几何精度与工程效用之间的张力。
    开放问题:
    - 表示选择（命令序列、CadQuery、B-Rep基元）如何影响对未见零件类别和复杂装配的泛化？
    - 与CAD工程师实际满意度相关的最小评估指标集是什么？VLM评判器能否可靠近似人类专家评估？
    - 混合优化方法能否扩展以处理全部CAD操作（如倒角、圆角、阵列），同时不牺牲重建速度？
    - 智能体框架的性能在多大程度上依赖底层LLM的编码能力？如何在没有大规模人类偏好数据的情况下训练轻量级澄清智能体？
