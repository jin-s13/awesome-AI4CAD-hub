  related_work_outline:
  - 'Mainstream direction: unified multimodal CAD benchmarks for program generation
    and reverse engineering, covering text, image, sketch, point cloud, and mesh inputs
    into parametric CAD representations.'
  - 'Shared research pattern: evaluation is moving from single geometry scores to
    staged protocols that check executable program validity, geometric fidelity, and
    design-intent or engineering suitability.'
  - 'Key differences: works differ in input modality scope, output representation
    such as CadQuery scripts or construction sequences, evaluation target such as
    manufacturing readiness versus reconstruction fidelity, and interaction mode from
    one-shot to proactive clarification.'
  - 'Trend evolution: top evidence clusters in 2026; the visible shift is toward larger
    stratified samples, VLM-assisted judges, and multi-criteria benchmarks like CADBench,
    MUSE, and UniCAD, though older-year trends are not strongly represented in top-ranked
    papers.'
  - 'Open questions: whether benchmark criteria align with downstream engineering
    utility, whether conclusions remain stable across implementations and judge prompts,
    and whether dataset stratification covers real design ambiguity and long-tail
    CAD complexity.'
  related_work_outline_zh:
  - 主流方向：面向CAD程序生成与逆向工程的统一多模态基准，覆盖文本、图像、草图、点云和网格输入到参数化CAD表示。
  - 研究共性：评估从单一几何分数转向分阶段协议，同时检查程序可执行性、几何保真度以及设计意图或工程适配性。
  - 关键差异：在输入模态范围、输出表示如CadQuery脚本或构建序列、评估目标如制造就绪度与重建保真度，以及一次性生成到主动澄清等交互模式上存在分歧。
  - 趋势演进：高排名证据集中在2026年；可见变化是更大规模分层样本、VLM辅助评分器和多准则基准如CADBench、MUSE、UniCAD的出现，较早年份趋势未在高排名论文中充分反映。
  - 开放问题：基准标准是否与实际下游工程效用一致，结论在不同实现和评判提示下是否稳定，以及数据集分层是否覆盖真实设计歧义和长尾CAD复杂度。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared multimodal CAD tasks and datasets that make text-to-CAD,
        image-to-CAD, and reverse engineering claims comparable across models and
        input modalities.
      what_remains_open: Whether sample stratification and modality coverage represent
        real CAD workflows, manufacturing constraints, and long-tail geometry beyond
        curated datasets.
    - line: Metric and stress-test design
      what_it_solves: Probes CAD outputs beyond aggregate scores through program validity
        checks, geometric fidelity measures, and design-intent or manufacturability
        rubrics.
      what_remains_open: Alignment between proxy metrics such as IoU, Chamfer distance,
        or VLM judge scores and downstream decisions engineers actually care about.
    - line: Comparable baselines and reporting
      what_it_solves: Uses unified benchmark suites and common baselines to make CAD
        generation and reconstruction results more auditable and comparable.
      what_remains_open: Whether benchmark conclusions remain stable across independent
        implementations, LLM judge prompts, rubrics, and compute budgets.
    consensus:
    - 'CAD evaluation should combine multiple signals: executable program validity,
      geometric fidelity, and design-intent or engineering suitability.'
    - Multimodal inputs and parametric CAD program outputs are becoming the common
      evaluation abstraction for CAD generation and reverse engineering.
    - Staged evaluation protocols, moving from code checks to geometry checks to intent
      checks, are more informative than a single aggregate score.
    disagreements:
    - Some evaluations prioritize geometric reconstruction metrics such as IoU and
      Chamfer distance, while others emphasize manufacturability, functionality, and
      assemblability rubrics.
    - 'Interaction mode differs: one-shot generation is common, but reverse engineering
      can be stepwise, and text-to-CAD can include proactive clarification.'
    - Output representations and modality scopes vary across CAD construction sequences,
      CadQuery scripts, and B-Rep assemblies; input scopes range from single modalities
      to unified multi-modal settings.
    open_questions:
    - How well do current geometric and executability metrics predict downstream engineering
      utility such as editability, manufacturability, and assembly readiness?
    - Are benchmark rankings stable across different LLM judge configurations, rubrics,
      implementations, and compute budgets, given missing artifact details in some
      evidence?
    - Does stratification by geometric complexity and diversity sampling cover ambiguous
      real-world specifications and long-tail CAD model families?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享多模态CAD任务和数据集，使文本到CAD、图像到CAD及逆向工程的主张跨模型和输入模态可比较。
      尚未覆盖: 样本分层和模态覆盖是否代表真实CAD工作流、制造约束及长尾几何仍不明确。
    - 路线: 指标与压力测试设计
      解决的问题: 通过程序有效性检查、几何保真度指标和设计意图或可制造性评分标准，在总分之外检验CAD输出。
      尚未覆盖: IoU、Chamfer距离或VLM评分等代理指标与工程师实际关心的下游决策之间是否一致。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基准套件和公共基线，使CAD生成与重建结果更可审计、可比较。
      尚未覆盖: 基准结论在不同实现、LLM评判提示、评分标准和算力预算下是否稳定仍缺少证据。
    共识:
    - CAD评估应结合多重信号：程序可执行有效性、几何保真度以及设计意图或工程适配性。
    - 多模态输入和参数化CAD程序输出正成为CAD生成与逆向工程的常见评估抽象。
    - 从代码检查到几何检查再到意图检查的分阶段评估协议比单一总分更具信息量。
    分歧:
    - 一些评估侧重IoU和Chamfer距离等几何重建指标，另一些强调可制造性、功能性和可装配性评分标准。
    - 交互模式存在差异：一次性生成常见，但逆向工程可为逐步式，文本到CAD也可包含主动澄清。
    - 输出表示和模态范围在CAD构建序列、CadQuery脚本与B-Rep装配体之间不同；输入范围从单模态到统一多模态设置不等。
    开放问题:
    - 当前几何和可执行性指标在多大程度上能预测可编辑性、可制造性和装配就绪度等下游工程效用？
    - 在部分证据缺少工件细节的情况下，基准排名是否对不同LLM评判配置、评分标准、实现和算力预算稳定？
    - 基于几何复杂度和多样性采样的分层是否覆盖真实世界中的模糊规格和长尾CAD模型族？
