    evaluates executability, geometric fidelity, and design intent.'
  - 'Key differences: Inputs range from text prompts to images, meshes, and point
    clouds; interaction ranges from direct generation to proactive clarification;
    methods range from stepwise or optimization-based fitting to LLM program synthesis
    and unified multimodal models.'
  - 'Trend evolution: The selected evidence is concentrated in 2026, so trend inference
