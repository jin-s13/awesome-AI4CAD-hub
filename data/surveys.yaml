  related_work_outline:
  - 'Mainstream direction: Learning to reconstruct or generate editable parametric
    CAD programs and executable code from images, meshes, point clouds, or design
    intents; visible top evidence centers on mechanical CAD program generation rather
    than architecture, CAE, CAM, or 3D printing workflows.'
  - 'Shared research pattern: Iterative or geometry-aware generation, synthetic or
    augmented image-code-geometry datasets, and evaluation by both syntax validity
    and geometric or volumetric similarity.'
  - 'Key differences: Supervision ranges from direct geometric optimization, supervised
    decoding, offline RL, and VLM fine-tuning to evolutionary program search; inputs
    vary among mesh, point cloud, orthographic views, images, and text headers.'
  - 'Trend evolution: Within the current 2025–2026 frontier, work is moving from single-task
    mesh-to-CAD reconstruction toward unified multimodal multi-task CAD models, longer
    parametric sequence generation, and diagnostic studies of design-intent conditioning.'
  - 'Open questions: Real-world generalization beyond benchmarks, preservation of
    editability and design intent, reliability of unified models across tasks, independent
    evaluation without metric circularity, and verification of missing artifacts or
    limitations.'
  related_work_outline_zh:
  - 主流方向：从图像、网格、点云或设计意图中学习重建或生成可编辑参数化CAD程序和可执行代码；当前可见证据集中于机械CAD程序生成，而不是建筑、CAE、CAM或3D打印工作流。
  - 研究共性：采用迭代或几何感知生成、合成或增强的图像-代码-几何数据集，并以语法有效性与几何或体积相似度共同评价。
  - 关键差异：监督方式涵盖直接几何优化、监督解码、离线强化学习、视觉语言模型微调和程序演化搜索；输入模态包括网格、点云、正交视图、图像和文本头。
  - 趋势演进：在2025–2026年当前前沿内，正在从单任务网格到CAD重建走向统一多模态多任务CAD模型、更长参数序列生成以及设计意图条件化的诊断分析。
  - 开放问题：超越基准的真实泛化、可编辑性与设计意图的保持、统一模型在多任务上的可靠性、避免指标循环的独立评估，以及缺失工件或局限性的验证。
  literature_review:
    line_of_work_matrix:
    - line: Parametric CAD reverse engineering from visual or geometric input
      what_it_solves: Converting mesh, point cloud, orthographic, or image observations
        into editable parametric CAD programs or executable code.
      what_remains_open: Evidence on real-world images and unseen operations is limited;
        several limitation fields are missing, and transfer across complex part categories
        remains unresolved.
    - line: Unified multimodal and multitask CAD modeling
      what_it_solves: Handling heterogeneous CAD tasks such as reconstruction, generation,
        and question answering through one model over text, image, sketch, and point
        cloud inputs.
      what_remains_open: Whether a single model preserves task-specific reliability
        and editability in deployed CAD workflows is not yet shown; reproducibility
        signals are uneven.
    - line: Long-sequence and realistic CAD program generation
      what_it_solves: Generating longer, more complex parametric CAD sequences and
        executable programs with improved validity and shape similarity.
      what_remains_open: Design-intent control and semantic correctness beyond geometric
        metrics are underevidenced; dependence on synthetic evolution or augmentation
        is not fully bounded.
    - line: Design-intent conditioning and independent evaluation
      what_it_solves: Testing whether models use high-level design intent headers
        and whether evaluation metrics avoid circularity with generated program structure.
      what_remains_open: Findings are limited to a small model and single CAD program
        domain; floor effects in some intents and broader model class transfer remain
        open.
    consensus:
    - Parametric CAD programs and executable CAD code are the shared representation
      target because they preserve editability better than raw meshes.
    - Geometric and volumetric validity metrics are treated as necessary complements
      to syntax validity when evaluating CAD generation.
    - Iterative, stepwise, or feedback-driven refinement is a common mechanism for
      improving CAD reconstruction and generation quality.
    - Synthetic, augmented, or evolution-generated image-code-geometry datasets are
      used to address limited training data for complex CAD.
    - The visible evidence cluster belongs to the 2025–2026 current frontier, so conclusions
      mostly describe recent applied CAD research.
    disagreements:
    - 'Supervision approach differs: direct geometry-driven optimization, supervised
      sequence decoding, offline RL, VLM fine-tuning, and evolutionary program search
      coexist.'
    - Input modality differs across mesh, point cloud, orthographic views, natural
      images, and textual design-intent headers, leading to different generalization
      demands.
    - Output representation differs between structured parametric operation sequences
      and executable CadQuery code, with varying emphasis on editability and downstream
      use.
    - 'Evaluation target differs: reconstruction accuracy, generation validity, unified
      multi-task scores, or conditioning adherence are optimized separately.'
    - Artifact and reproducibility signals vary, and some papers report only partial
      generalization while others leave limitations and release statuses unspecified.
    open_questions:
    - Do strong benchmark reconstruction and generation results transfer to complex
      real CAD parts, unseen operations, and real-world image conditions?
    - Which representation and supervision best preserve design intent, editability,
      and downstream manufacturability in applied CAD workflows?
    - Can unified multimodal multi-task models remain reliable across reconstruction,
      generation, and CAD QA without task-specific silent failures?
    - How should design-intent conditioning be measured independently so results do
      not rely on the same program structure that the metric extracts?
    - Topic description includes architecture, CAE, CAM, and 3D printing, but visible
      top evidence centers on mechanical CAD program generation; transfer to those
      applied workflows remains an open verification gap.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 从视觉或几何输入进行参数化CAD逆向工程
      解决的问题: 将网格、点云、正交视图或图像观测转换为可编辑参数化CAD程序或可执行代码。
      尚未覆盖: 真实图像和未见过操作上的证据有限；多个论文缺少局限性说明，复杂零件类别间的迁移仍未解决。
    - 路线: 统一多模态多任务CAD建模
      解决的问题: 通过一个模型处理文本、图像、草图和点云输入，完成CAD重建、生成和问答等异构任务。
      尚未覆盖: 单一模型在真实CAD工作流中能否保持各任务可靠性与可编辑性尚未证明；可复现信号强弱不一。
    - 路线: 长序列与真实感CAD程序生成
      解决的问题: 生成更长、更复杂的参数化CAD序列和可执行程序，并提高有效性与形状相似度。
      尚未覆盖: 几何指标之外的设计意图控制和语义正确性证据不足；对合成演化或数据增强的依赖边界不清晰。
    - 路线: 设计意图条件化与独立评测
      解决的问题: 检验模型是否真正使用高层设计意图头，以及评测指标是否避免与生成程序结构形成循环。
      尚未覆盖: 发现限于小模型和单一CAD程序领域；部分意图存在性能下限效应，向更大模型类别的迁移仍未覆盖。
    共识:
    - 参数化CAD程序和可执行CAD代码是共同表示目标，因为它们比原始网格更利于保持可编辑性。
    - 几何与体积有效性指标被视为补充语法有效性的必要评测维度。
    - 迭代、逐步或反馈驱动的细化是提升CAD重建与生成质量的常见机制。
    - 合成、增强或演化生成的图像-代码-几何数据集被用于缓解复杂CAD训练数据不足。
    - 可见证据集中在2025–2026年的当前前沿，结论主要刻画近年应用CAD研究。
    分歧:
    - 监督方式不同：直接几何驱动优化、监督序列解码、离线强化学习、视觉语言模型微调和程序演化搜索并存。
    - 输入模态不同：网格、点云、正交视图、自然图像和文本设计意图头带来不同的泛化要求。
    - 输出表示不同：结构化参数化操作序列与可执行CadQuery代码并存，侧重点在可编辑性和下游用途上存在差异。
    - 评测目标不同：重建准确率、生成有效性、统一多任务分数和条件化一致性被分别优化。
    - 工件与可复现信号不一；一些论文仅报告部分泛化，另一些则未说明局限性和发布状态。
    开放问题:
