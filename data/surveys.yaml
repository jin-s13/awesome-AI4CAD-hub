  related_work_outline:
  - 'Mainstream direction: Recent work centers on reconstructing or generating editable
    parametric CAD programs from visual or geometric inputs, with representative examples
    such as CADFit, UniCAD, CAD-Coder, and CADEvolve.'
  - 'Shared research pattern: Methods commonly treat CAD as structured operation sequences
    or executable code, then validate outputs through geometric feedback, reconstruction
    metrics, or executable checks.'
  - 'Key differences: They differ in input modality, target representation, training
    strategy, and evaluation emphasis, including mesh/point/image/text inputs and
    construction-sequence versus CadQuery-code outputs.'
  - 'Trend evolution: Available top evidence is concentrated in 2025-2026, so the
    visible trend is within the current frontier: moving from task-specific reconstruction
    toward unified multimodal CAD models and VLM-guided data generation.'
  - 'Open questions: Real-world generalization, industrial-grade complex parts, design-intent
    control, metric independence, and cross-benchmark reproducibility remain unresolved.'
  related_work_outline_zh:
  - 主流方向：近期研究集中在从视觉或几何输入重建或生成可编辑参数化CAD程序，代表作如CADFit、UniCAD、CAD-Coder和CADEvolve。
  - 研究共性：多类方法将CAD视为结构化操作序列或可执行代码，并通过几何反馈、重建指标或可执行检查来验证输出。
  - 关键差异：输入模态、目标表示、训练策略和评测重点不同，包括网格/点云/图像/文本输入，以及构建序列与CadQuery代码输出。
  - 趋势演进：现有高相关证据集中在2025–2026年，可见趋势属于当前前沿：从任务特定重建走向统一多模态CAD模型和VLM引导的数据生成。
  - 开放问题：真实世界泛化、工业级复杂零件、设计意图控制、指标独立性以及跨基准可复现性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Geometry-to-parametric-CAD reconstruction
      what_it_solves: Recovers editable CAD construction sequences from mesh, point
        cloud, or image observations using iterative operation fitting and geometric
        comparison.
      what_remains_open: Whether validity and accuracy persist on industrial-scale
        complex parts, unseen operations, and broader benchmarks; many limitations
        are not documented.
    - line: Unified multimodal multi-task CAD modeling
      what_it_solves: Supports heterogeneous CAD tasks such as reconstruction, generation,
        and question answering inside one framework and benchmark.
      what_remains_open: Whether gains transfer across tasks and input modalities
        beyond the reported benchmark suite; reproducer evidence remains partial.
    - line: Long-sequence parametric CAD generative modeling
      what_it_solves: Models longer parametric CAD operation sequences through structured
        latent representations and generative decoding.
      what_remains_open: Evidence on dataset diversity, long-sequence evaluation beyond
        selected metrics, and generalization to unseen operation distributions is
        still thin.
    - line: Editable CAD code generation via vision-language models
      what_it_solves: Generates executable high-level CAD code, such as CadQuery Python,
        directly from visual inputs.
      what_remains_open: Real-world image and unseen-operation generalization is only
        partially demonstrated, and dataset or pipeline reproducibility varies across
        papers.
    - line: Design-intent conditioning and program-completion diagnostics
      what_it_solves: Tests whether design-intent headers improve CAD program completion
        while avoiding circular evaluation with independent geometric assertions.
      what_remains_open: Evidence is limited to a single model and code domain, and
        some shape intents sit at a generation floor, making the effect regime-specific.
    consensus:
    - CAD is increasingly represented as structured, editable programs or operation
      sequences rather than only as raw geometry.
    - Geometric validity and editability are central evaluation goals, with metrics
      such as IoU, Chamfer Distance, valid syntax rate, and B-rep assertions appearing
      across work.
    - Learned models and geometry feedback are replacing or augmenting purely rule-based
      extraction for CAD reconstruction and generation.
    - Benchmarks and datasets are treated as necessary for comparison, though evaluation
      settings remain fragmented.
    disagreements:
    - 'Input modality varies substantially: some methods reconstruct from mesh or
      point cloud, while others operate on images, sketches, or text.'
    - Target output differs between parametric construction sequences with operations
      and editable high-level code, affecting downstream usability.
    - 'Supervision and optimization differ: hybrid geometric optimization, offline
      reinforcement learning, end-to-end multimodal model training, and VLM-guided
      program evolution are all used.'
    - 'Evaluation emphasis differs: some work prioritizes geometric reconstruction
      accuracy, others executable code validity, real-image generalization, or design-intent
      adherence.'
    open_questions:
    - Can current mesh/image-to-CAD methods remain valid and editable on complex real-world
      or industrial parts beyond benchmark distributions?
    - Do reported improvements transfer across datasets, institutions, unseen operations,
      and physical or operational deployment conditions?
    - Are existing metrics independent enough to avoid inflated gains from parametric
      extractors, syntax checking, or benchmark-specific outputs?
    - What reproducibility and evaluation standards would enable reliable comparison
      between unified and task-specific CAD models?
    - How can design intent be injected into conditional generation without harming
      low-prefix or difficult shape regimes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何到参数化CAD重建
      解决的问题: 从网格、点云或图像观测中恢复可编辑CAD构建序列，使用迭代操作拟合和几何比较。
      尚未覆盖: 工业规模复杂零件、未见过操作及更广泛基准上的有效性和精度是否保持；许多局限未被记录。
    - 路线: 统一多模态多任务CAD建模
      解决的问题: 在单一框架和基准中支持重建、生成、问答等异构CAD任务。
      尚未覆盖: 跨任务和跨输入模态的收益是否能迁移到已报告基准之外；复现证据仍不完整。
    - 路线: 长序列参数化CAD生成建模
      解决的问题: 通过结构化潜在表示和生成解码，建模更长的参数化CAD操作序列。
      尚未覆盖: 关于数据集多样性、选定指标之外的长序列评估，以及未见过操作分布泛化的证据仍然薄弱。
    - 路线: 基于视觉语言模型的可编辑CAD代码生成
      解决的问题: 直接从视觉输入生成可执行的高层CAD代码，如CadQuery Python。
      尚未覆盖: 真实世界图像和未见过操作的泛化仅有部分展示，数据集或流水线可复现性在论文间不一致。
    - 路线: 设计意图条件化与程序补全诊断
      解决的问题: 用独立几何断言测试设计意图头是否改善CAD程序补全，并避免循环评估。
      尚未覆盖: 证据限于单一模型和代码域，部分形状意图处于生成下限，效应具有条件特异性。
    共识:
    - CAD越来越多地被表示为结构化、可编辑的程序或操作序列，而不仅仅是原始几何。
    - 几何有效性和可编辑性是核心评估目标，IoU、Chamfer Distance、有效语法率和B-rep断言等指标在不同工作中出现。
    - 学习模型和几何反馈正在取代或补充纯规则提取，用于CAD重建和生成。
    - 基准和数据集被视为比较的必要条件，但评估设置仍然碎片化。
    分歧:
    - 输入模态差异显著：一些方法从网格或点云重建，另一些则基于图像、草图或文本。
    - 目标输出在参数化构建序列与可编辑高层代码之间存在差异，影响下游可用性。
    - 监督与优化方式不同：混合几何优化、离线强化学习、端到端多模态模型训练和VLM引导的程序演化均被采用。
    - 评估重点不同：部分工作强调几何重建精度，另一些强调可执行代码有效性、真实图像泛化或设计意图依从性。
    开放问题:
    - 当前的网格/图像到CAD方法能否在复杂真实世界或工业零件上保持有效且可编辑？
    - 已有改进能否跨数据集、机构、未见过操作以及实际部署条件迁移？
    - 现有指标是否足够独立，以避免参数提取器、语法检查或基准特定输出造成虚高收益？
    - 需要怎样的可复现性和评估标准，才能在统一模型与任务特定CAD模型之间进行可靠比较？
    - 如何在不损害低前缀或困难形状生成能力的情况下注入设计意图？
