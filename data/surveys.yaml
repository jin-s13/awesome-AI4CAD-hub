    - Evaluation is moving beyond geometric distance toward code executability, geometric
      validity, and engineering design intent.
    - Language, image, sketch, point-cloud, and mesh pathways are being fused into
      unified or LLM-driven pipelines, with structure alignment and parameter grounding
      as recurring mechanisms.
    - Most evidence relies on curated datasets or benchmarks and uses supervised fine-tuning,
      reinforcement learning, or structured optimization to improve generation quality.
    disagreements:
    - 'Input scope differs: some systems handle text prompts only, while others reconstruct
      from meshes, images, sketches, or point clouds.'
    - 'Generation mechanism differs: LLM code synthesis, transformer-based primitive
      grounding, IoU-driven hybrid optimization, and stepwise feature construction
      coexist.'
    - 'Evaluation target differs: geometric fidelity and program validity are central
      in some work, while downstream manufacturability, functionality, and assemblability
      are central in others.'
    - 'Interaction mode differs: one-shot generation contrasts with proactive clarification
      that requests missing specifications before synthesis.'
    - 'Deployment setting differs: benchmark-suite evaluation dominates, with limited
      evidence for external CAD-kernel deployment or real-time serving.'
    open_questions:
    - How well do these systems transfer from curated benchmarks to real user prompts,
      external CAD kernels, and changing deployment infrastructure?
    - How should model choices be made when rankings change across geometric fidelity,
      executability, and program compactness?
    - What interaction budget and latency are acceptable for proactive clarification
      in closed-loop CAD workflows?
    - Can engineering-oriented rubrics and VLM judges be independently reproduced
      across teams, datasets, and evaluation pipelines?
    - How can complex B-Rep assemblies be handled beyond the observed failure cascade
      from executable code to valid geometry to design-intent alignment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可执行文本到参数化CAD生成
      解决的问题: 把自然语言设计规范转换为可编辑的CAD构建序列或脚本，并提升结构一致性与参数准确性。
      尚未覆盖: 模糊提示下的鲁棒性、对B-Rep基元的精确接地，以及跨用户场景和真实CAD数据集的泛化。
    - 路线: 几何到参数化CAD逆向重建
      解决的问题: 从网格、图像、草图或点云恢复可编辑的参数化CAD操作序列，并改善几何保真度和程序有效性。
      尚未覆盖: 模态偏移和几何复杂度上升时的性能退化，以及图像到CAD与网格到CAD工作流的稳定统一。
    - 路线: 统一多模态CAD基准与评测系统
      解决的问题: 跨CAD任务和输入模态提供标准化评测，并纳入代码可执行性、几何有效性、可制造性、功能性与可装配性检查。
      尚未覆盖: 指标间排名不一致、从可执行代码到工程就绪设计的失败级联，以及基于规则或VLM评判器的独立验证。
    - 路线: 交互式与智能体CAD系统
      解决的问题: 在程序合成前澄清不明确规格，以降低无效输出和几何误差，同时控制交互开销。
      尚未覆盖: 闭环服务延迟、保真度-可控性-复杂度权衡、与真实CAD内核的集成，以及向复杂装配体扩展。
    共识:
    - 当前工作将可执行CAD程序或构建序列视为主要输出，以保留可编辑性和可控性。
    - 评测正从几何距离扩展到代码可执行性、几何有效性和工程设计意图。
    - 语言、图像、草图、点云和网格等通路正被融合到统一模型或LLM驱动管线中，结构对齐和参数接地是常见机制。
    - 多数证据依赖策划数据集或基准，并通过监督微调、强化学习或结构化优化提升生成质量。
    分歧:
    - 输入范围差异：部分方法只处理文本提示，部分方法从网格、图像、草图或点云重建。
    - 生成机制差异：LLM代码合成、基于Transformer的基元接地、IoU驱动混合优化和逐步特征构造并存。
    - 评测目标差异：部分工作侧重几何保真和程序有效性，部分工作侧重可制造性、功能性和可装配性。
    - 交互模式差异：一次性生成与生成前主动澄清的智能体模式并存。
    - 部署场景差异：主要停留在基准评测，对外部CAD内核部署或实时服务的证据有限。
    开放问题:
    - 这些系统能否从策划基准迁移到真实用户提示、外部CAD内核和变化的部署基础设施？
    - 当几何保真度、可执行性和程序紧凑性导致模型排名变化时，应如何选择模型？
    - 在闭环CAD工作流中，主动澄清的交互预算和延迟应如何设定？
    - 面向工程意图的评分标准和VLM评判器能否跨团队、数据集和评测管线独立复现？
    - 如何突破从可执行代码到有效几何再到设计意图对齐的失败级联，处理复杂B-Rep装配体？
