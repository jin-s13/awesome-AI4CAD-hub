  related_work_outline:
  - 'Mainstream direction: Recent work centers on reconstructing or generating editable
    parametric CAD programs from meshes, images, sketches, and point clouds, with
    strong emphasis on geometric validity and structured operations.'
  - 'Shared research pattern: Models combine geometric feedback, stepwise construction,
    or executable code generation, and are evaluated on validity plus geometric similarity
    metrics.'
  - 'Key differences: Input modalities and representations differ; supervision ranges
    from IoU optimization, visual projections, and sequence RL to program evolution;
    evaluation targets include code syntax, B-rep assertions, and cross-benchmark
    accuracy.'
  - 'Trend evolution: Available top evidence is concentrated in 2025-2026, showing
    a frontier shift toward unified multimodal CAD models, generative sequence models,
    and synthetic program-evolution datasets.'
  - 'Open questions: Real-world generalization, semantic design-intent preservation,
    benchmark metric circularity, long-sequence scalability, and reproducibility remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：近期工作集中于从网格、图像、草图和点云重建或生成可编辑参数化CAD程序，强调几何有效性与结构化操作。
  - 研究共性：模型结合几何反馈、逐步构建或可执行代码生成，并以有效性和几何相似性指标评测。
  - 关键差异：输入模态与表示不同；监督信号从IoU优化、视觉投影、序列强化学习到程序演化；评测目标包括语法、B-rep断言和跨基准精度。
  - 趋势演进：可用高排序证据集中在2025-2026年，前沿转向统一多模态CAD模型、生成式序列模型和合成程序演化数据集。
  - 开放问题：真实世界泛化、设计意图保留、评测指标循环、长序列可扩展性与可复现性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Mesh-to-parametric CAD reconstruction
      what_it_solves: Recovering editable parametric CAD operations from mesh geometry
        using optimization or stepwise fitting, improving volumetric overlap and reducing
        invalid programs.
      what_remains_open: Cross-dataset and complex feature transfer, shape semantic
        editability, and computational scalability remain under-evidenced.
    - line: Unified multimodal CAD modeling and benchmarking
      what_it_solves: Processing text, images, sketches, and point clouds within one
        model for reconstruction, generation, and CAD question answering.
      what_remains_open: Unclear whether unified evaluation aligns with real CAD workflows
        or supports long-tail operations and out-of-distribution inputs.
    - line: Vision-language CAD code generation
      what_it_solves: Generating executable, editable CAD code directly from visual
        inputs, with high syntax validity and 3D similarity.
      what_remains_open: Robustness beyond training distribution is only partially
        shown; real-world images and unseen operations lack full evidence.
    - line: Stepwise visual and geometric feedback for CAD reconstruction
      what_it_solves: Turning CAD reconstruction into sequential decisions informed
        by intermediate orthographic projections and alignment rewards.
      what_remains_open: Data-efficiency and transfer across input noise, datasets,
        and actual design workflows remain open.
    - line: Generative modeling of long parametric CAD sequences
      what_it_solves: Learning latent representations and generating longer parametric
        CAD sequences via state-space models and GAN decoding.
      what_remains_open: Hierarchical, constrained validity for industrial-scale models
        and very long sequences is not established.
    - line: Program-evolution data generation
      what_it_solves: Creating complex executable CAD program datasets by evolving
        primitives through VLM-guided edits and validation.
      what_remains_open: Diversity, novelty, and bias of evolved programs, plus downstream
        generalization, are not fully measured.
    - line: Diagnostic evaluation of design-intent conditioning
      what_it_solves: Testing whether models utilize design-intent headers or spurious
        correlations using derangement control and geometric assertions.
      what_remains_open: Evidence is limited to a single model and CAD program domain
        with some intents at a generation floor, so generality is unproven.
    consensus:
    - Parametric CAD programs are preferred over mesh-only outputs because they preserve
      editability and structured operations.
    - Geometric feedback and stepwise construction are common mechanisms for improving
      reconstruction quality and validity.
    - Evaluation combines syntactic or executable validity with geometric similarity
      metrics such as IoU, Chamfer Distance, or B-rep assertions.
    - Recent methods increasingly use multimodal models or large-language/vision-language
      models for heterogeneous CAD tasks.
    - Synthetic or augmented program-geometry datasets are used to address training
      data constraints.
    disagreements:
    - Input representation varies across mesh, point cloud, image, sketch, and orthographic
      projections.
    - 'Supervision signal differs: direct geometric optimization, stepwise view rewards,
      RL-based sequence decisions, program evolution, or design-intent headers.'
    - Model choices differ from optimization over structured programs, state-space
      plus GAN generation, and offline Decision Transformer to VLM fine-tuning.
    - 'Evaluation targets differ: validity ratio and geometric distance, 100% syntax
      validity, cross-benchmark state-of-the-art, B-rep geometric assertions, or data
      efficiency.'
    - Scope ranges from single-task mesh/image-to-CAD reconstruction to unified multi-task
      systems and diagnostic causal tests of model behavior.
    open_questions:
    - Do mesh/image-to-CAD gains transfer across DeepCAD, Fusion 360, MCB, CADENA-Bench,
      and real-world industrial parts?
    - Can unified or VLM-based CAD models preserve semantic design intent and editability
      rather than only geometric similarity?
    - How can benchmarks avoid circularity between header extraction, program validity,
      and geometric evaluation?
    - How do state-space, VLM, and program-evolution methods scale to longer sequences,
      complex operations, and constrained industrial design?
    - Missing code, datasets, limitations, and citation edges leave reproducibility
      and comparative impact as verification gaps.
