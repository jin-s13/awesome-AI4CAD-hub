  related_work_outline_zh:
  - 主流方向：构建端到端系统，利用大语言模型或神经表示从多模态输入（文本、图像、点云）生成可执行的CAD程序。
  - 研究共性：都将CAD生成视为程序合成任务，用几何和可执行性指标评估，并揭示从代码到有效几何再到工程就绪设计的失败级联。
  - 关键差异：系统在监督粒度（CAD专用标注 vs. 点级监督）、内部表示（B-rep基元、构建序列或参数化面片）以及评估范围（仅几何保真度 vs. 可制造性与设计意图）上存在差异。
  - 趋势演进：在2026年前沿内，领域正从单模态网格到CAD向统一多模态模型转变，从静态生成向交互式、基于智能体的澄清循环转变。
  - 开放问题：如何弥合有效几何到工程就绪输出之间的鸿沟；如何使模型对模糊提示和模态转换具有鲁棒性；以及哪些评估协议能捕捉真实世界的可用性。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end multi-modal CAD generation systems
      what_it_solves: Producing editable CAD programs or B-reps directly from text,
        images, sketches, or point clouds in a single framework, removing the need
        for separate per-modality toolchains.
      what_remains_open: Generalization across input modalities and geometric complexity
        is brittle; most systems still rely on CAD-specific annotations, and the gap
        between generating valid geometry and meeting precise engineering constraints
        remains unaddressed.
    - line: Benchmark-driven evaluation of CAD program generation
      what_it_solves: Providing unified, multi-metric testbeds that expose failure
        modes (invalid code, geometry degradation, design intent mismatch) and enable
        controlled comparisons across models and input types.
      what_remains_open: Current benchmarks either focus on geometric fidelity or
        on design intent, but lack a single protocol that covers both; the reliance
        on VLM-based judges for manufacturability introduces unverified subjectivity,
        and none of the benchmarks include long-term deployment or downstream engineering
        tasks.
    - line: Interactive and agent-based CAD generation
      what_it_solves: Improving robustness to ambiguous specifications by inserting
        a clarification step before code synthesis, reducing invalid outputs and user
        effort.
      what_remains_open: The interaction cost and the capability to handle multi-turn
        design iteration are not fully characterized; the approach has only been demonstrated
        in a single text-to-CAD setting and not with multi-modal or multi-step design
        workflows.
    - line: Optimization-based CAD program recovery from raw geometry
      what_it_solves: Recovering editable parametric construction sequences from meshes
        or point clouds without requiring CAD-specific training data, using geometric
        feedback to fit operations incrementally.
      what_remains_open: The approach is limited to the operations supported by the
        optimizer; it does not learn from design intent or semantics, and its performance
        on very complex, multi-component assemblies is not yet established.
    consensus:
    - Executable CAD code generation is the shared target, with a common pipeline
      of input encoding, program synthesis, and evaluation through geometric and executability
      metrics.
    - 'All systems observe a failure cascade: executable code may not produce valid
      geometry, and valid geometry often fails to meet engineering or design intent,
      especially for complex shapes.'
    - Multi-modal inputs (text, image, mesh, point cloud) are converging as a standard
      capability, and the field is coalescing around benchmarks that compare across
      these modalities.
    - There is an emerging recognition that pure geometric fidelity is insufficient;
      evaluations must move toward functional, manufacturable, and assemblable criteria.
    disagreements:
    - 'Supervision: Some systems require CAD-specific annotations (construction sequences,
      B-rep primitives) while others, like DreamCAD, train with only point-level supervision,
      leading to a trade-off between data efficiency and parametric editability.'
    - 'Representation: one group uses B-rep primitives and parametric patches (DreamCAD,
      FutureCAD), another uses explicit construction sequences (CADFit, HierCAD),
      and a third generates code strings (CadQuery scripts in ProCAD), which affects
      the editability and the range of geometric operations supportable.'
    - 'Evaluation scope: CADBench and MUSE differ fundamentally in what they measure—geometric
      fidelity and executability versus manufacturability and design intent—and this
      split reveals a lack of consensus on what constitutes a successful CAD generation
      system.'
    - 'Interaction mode: ProCAD introduces an agentic clarification loop, while most
      other systems assume a single-shot generation, highlighting a divide on whether
      robustness should be achieved through better models or through interactive refinement.'
    open_questions:
    - How can we design a single evaluation protocol that reliably assesses both geometric
      accuracy and real-world engineering criteria without relying on unvalidated
      VLM judges?
    - What causes the sharp performance drop of CAD-specialized models under modality
      shift, and can a unified multi-modal training strategy mitigate this brittleness?
    - Can the gap between an executable CAD program and a truly manufacturable design
      be closed by incorporating physical constraints and assembly context into the
      generation objective?
    - How far can agent-based clarification scale to multi-step design sessions and
      to multi-modal inputs beyond short text prompts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端多模态CAD生成系统
      解决的问题: 从文本、图像、草图或点云直接生成可编辑的CAD程序或B-rep，避免为每种模态构建单独的工具链。
      尚未覆盖: 跨输入模态和几何复杂度的泛化仍脆弱；多数系统依赖CAD专用标注，而从生成有效几何到满足精确工程约束之间的鸿沟尚未解决。
    - 路线: 面向CAD程序生成的基准驱动评估
      解决的问题: 提供统一的、多指标测试平台，揭示失败模式（无效代码、几何退化、设计意图错位），并支持跨模型和输入类型的受控比较。
      尚未覆盖: 当前基准或关注几何保真度，或关注设计意图，缺乏覆盖两者的单一协议；依赖VLM评判器评估可制造性引入了未验证的主观性，且所有基准均未包含长期部署或下游工程任务。
    - 路线: 交互式与基于智能体的CAD生成
      解决的问题: 在代码合成前插入澄清步骤，提升对模糊规格的鲁棒性，减少无效输出和用户负担。
      尚未覆盖: 交互开销和处理多轮设计迭代的能力尚未完全表征；该方法仅在单一文本到CAD场景下验证，未扩展到多模态或多步设计工作流。
    - 路线: 基于优化的原始几何恢复CAD程序
      解决的问题: 从网格或点云中恢复可编辑的参数化构建序列，无需CAD专用训练数据，利用几何反馈逐步拟合操作。
      尚未覆盖: 受限于优化器支持的操作集；未能学习设计意图或语义，且对复杂多组件装配件的性能尚不明确。
    共识:
    - 可执行CAD代码生成是共同目标，普遍采用输入编码、程序合成、几何与可执行性指标评估的流水线。
    - 所有系统都观察到失败级联：可执行代码可能不产生有效几何，有效几何常常无法满足工程或设计意图，尤其对复杂形状。
    - 多模态输入（文本、图像、网格、点云）正成为标准能力，领域正围绕跨模态比较的基准聚合。
    - 逐渐认识到单纯的几何保真度不足，评估必须迈向功能性、可制造性和可装配性标准。
    分歧:
    - 监督信号：一些系统需要CAD专用标注（构建序列、B-rep基元），而DreamCAD等仅用点级监督，导致数据效率与参数化可编辑性之间的权衡。
    - 表示方式：一组使用B-rep基元和参数化面片（DreamCAD、FutureCAD），另一组使用显式构建序列（CADFit、HierCAD），第三组生成代码字符串（ProCAD的CadQuery脚本），这影响了可编辑性和可支持的几何操作范围。
    - 评估范围：CADBench和MUSE在测量目标上根本不同——几何保真度与可执行性 vs. 可制造性与设计意图——这一分歧揭示了关于什么是成功的CAD生成系统缺乏共识。
    - 交互模式：ProCAD引入了基于智能体的澄清循环，而多数其他系统假设单次生成，这突显了应通过更好模型还是通过交互式精炼来获得鲁棒性的分歧。
    开放问题:
    - 如何设计既能可靠评估几何精度又能评估真实工程标准、且不依赖未经验证的VLM评判器的单一评估协议？
    - CAD专用模型在模态转换下性能急剧下降的原因是什么，统一的跨模态训练策略能否缓解这种脆弱性？
    - 能否通过将物理约束和装配上下文纳入生成目标，来弥合可执行CAD程序与真正可制造设计之间的鸿沟？
    - 基于智能体的澄清在多大程度上可以扩展到多步设计会话和超出短文本提示的多模态输入？
