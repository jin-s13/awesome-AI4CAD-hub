  literature_review:
    line_of_work_matrix:
    - line: Runnable multimodal CAD benchmarks and evaluation stacks
      what_it_solves: Unify diverse CAD datasets, input modalities, and metrics to
        expose failure modes such as geometric complexity, modality shift, and ranking
        instability.
      what_remains_open: How these evaluation stacks transfer to external deployment
        settings, real engineering constraints, and cross-team reproduction.
    - line: LLM-driven parametric CAD program generation
      what_it_solves: Generate executable CAD scripts from text prompts and ground
        language references to geometric primitives, improving fidelity and editability.
      what_remains_open: Robustness to ambiguous prompts and coverage beyond script-level
        validity to real design constraints.
    - line: Hierarchical and grounded text-to-CAD reasoning
      what_it_solves: Decompose CAD construction trees into object-level and part-level
        reasoning to improve structural consistency and parameter accuracy.
      what_remains_open: Evidence for generalization beyond benchmark datasets and
        for interaction-level specification resolution.
    - line: Mesh, image, and point-cloud to CAD reverse engineering
      what_it_solves: Recover editable parametric operations from geometric inputs
        through incremental fitting, optimization, or stepwise geometry comparison.
      what_remains_open: Scalability to complex mechanical parts and robustness across
        clean, noisy, or photorealistic input modalities.
    - line: Agentic clarification and interactive CAD specification
      what_it_solves: Resolve ambiguous user prompts before program generation and
        reduce invalid outputs with low interaction overhead.
      what_remains_open: When clarification is necessary without excessive user burden,
        especially for assemblies and multi-turn workflows.
    - line: Unified multi-modal multi-task CAD models
      what_it_solves: Process text, images, sketches, and point clouds in a single
        framework for reconstruction, generation, and CAD question answering.
      what_remains_open: Whether strong supervised benchmark results transfer to real-world
        CAD workflows and heterogeneous deployment infrastructure.
