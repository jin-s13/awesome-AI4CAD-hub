  related_work_outline_zh:
  - 主流方向：参数化CAD重建与生成正在转向可编辑程序或代码，2025-2026年工作集中于序列模型、视觉语言模型和统一多任务框架。
  - 研究共性：将CAD视为结构化参数操作；从几何、图像或网格中学习或优化；评估几何保真度与可执行有效性。
  - 关键差异：输入模态、输出表示、监督信号和评估指标在各研究中差异明显。
  - 趋势演进：在2025-2026当前前沿内，研究从任务特定网格到CAD重建，转向多模态大模型、程序级数据生成和设计意图的因果评估。
  - 开放问题：真实世界与未见操作泛化、指标循环、长复杂零件有效性，以及缺失工件或局限性说明的可复现验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Mesh-to-parametric-CAD reconstruction
      what_it_solves: Reverse engineering 3D meshes or point clouds into editable
        parametric CAD operation sequences, improving geometric fidelity and validity.
      what_remains_open: Whether accuracy and validity transfer to complex industrial
        parts and real-world scans beyond curated mechanical benchmarks remains under-supported.
    - line: Unified multimodal CAD modeling and benchmarks
      what_it_solves: Combines point, image, sketch, and text inputs to handle reconstruction,
        generation, and CAD question answering in one model and one evaluation suite.
      what_remains_open: Evidence is limited for deployment on applied CAD workflows,
        design constraints, and tasks outside the unified benchmark tasks.
    - line: Efficient generative sequence and state-space models for long CAD
      what_it_solves: Models long parametric CAD sequences with state-space architectures,
        self-supervised pretraining, and adversarial generation.
      what_remains_open: Long-sequence validity improvements need more evidence for
        engineering-grade complexity, editability, and dataset bias.
    - line: Vision-language models for executable CAD code generation
      what_it_solves: Generates editable CAD source code and complex program datasets
        from images via fine-tuned vision-language models and program evolution.
      what_remains_open: Generalization to real-world images, unseen CAD operations,
        and industrial complexity is only partially demonstrated or lacks robust evidence.
    - line: Sequential decision-making and reward-driven CAD reconstruction
      what_it_solves: Treats CAD reconstruction as stepwise decisions with orthographic
        visual feedback and offline reinforcement learning rewards.
      what_remains_open: Transfer to broader CAD tasks, alternative reward signals,
        and sensitivity to visual supervision remain unresolved.
    - line: Design intent conditioning and evaluation validity in CAD program completion
      what_it_solves: Diagnoses whether language models use design-intent headers
        and whether metrics create circular evaluation artifacts.
      what_remains_open: Findings are restricted to one model and checkpoint and certain
        design intents; other models, longer prefixes, and broader CAD program domains
        need verification.
    consensus:
    - Parametric CAD is represented as structured, editable construction programs
      or executable code rather than only static geometry.
    - Studies evaluate generated or reconstructed CAD by both geometric similarity
      and program validity or executability.
    - Recent methods rely on paired CAD geometry and program or code data, often using
      large datasets and task-specific benchmarks.
    - Editable parametric output is treated as a key goal for downstream design and
      manufacturing workflows.
    disagreements:
    - 'Supervision signals differ: hybrid geometric optimization, offline reinforcement
      learning rewards, supervised vision-language fine-tuning, and self-supervised
      or adversarial pretraining.'
    - Output representations differ between parametric operation sequences and general-purpose
      CAD code such as CadQuery Python.
    - Input modalities differ across mesh, point cloud, image, sketch, text, orthographic
      views, and design-intent headers.
    - 'Evaluation targets differ: volumetric IoU, Chamfer distance, invalid ratio,
      valid syntax rate, 3D solid similarity, and executable geometric assertions
      are not directly interchangeable.'
    - 'Deployment style differs: some propose unified multimodal models or open-source
      code generators, while others optimize task-specific reconstruction pipelines
      or evaluation protocols.'
    open_questions:
    - How well do current CAD generation models generalize to real-world manufacturing,
      architecture, CAE, or CAM inputs when only partial real-world image generalization
      evidence exists?
    - Can reductions in invalid ratio and gains in geometric similarity be causally
      separated from metric circularity and data-specific header conditioning?
    - Do unified multimodal CAD models preserve editability, geometric validity, and
      design constraints across industrial tasks beyond curated benchmarks?
    - How do long-sequence gains from state-space, code-generation, and program-evolution
      methods transfer to complex engineering parts with unseen operations?
    - Missing code, datasets, metrics, baselines, or limitation details in several
      top papers are reproducibility verification gaps rather than confirmed absences.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 网格到参数化CAD重建
      解决的问题: 将三维网格或点云逆向工程为可编辑的参数化CAD操作序列，提升几何保真度与有效性。
      尚未覆盖: 在复杂工业零件和真实扫描上能否保持精度与有效性，仍缺乏充分证据。
    - 路线: 统一多模态CAD建模与基准
      解决的问题: 将点云、图像、草图和文本输入整合到单一模型与评测套件中，同时处理重建、生成和CAD问答。
      尚未覆盖: 在应用CAD工作流、设计约束和统一基准之外任务上的部署证据仍然有限。
    - 路线: 面向长CAD序列的高效序列与状态空间生成模型
      解决的问题: 通过状态空间结构、自监督预训练和对抗生成来建模较长参数化CAD序列。
      尚未覆盖: 长序列有效性提升是否适用于工程级复杂度、可编辑性和数据集偏差，仍需更多验证。
    - 路线: 面向可执行CAD代码生成的视觉语言模型
      解决的问题: 通过微调视觉语言模型和程序演化，从图像生成可编辑CAD源代码与复杂程序数据集。
      尚未覆盖: 对真实图像、未见CAD操作和工业复杂度的泛化仅有部分展示或缺乏稳健证据。
    - 路线: 基于序列决策与奖励的CAD重建
      解决的问题: 将CAD重建视为逐步决策，结合正交视觉反馈与离线强化学习奖励。
      尚未覆盖: 向更广泛CAD任务、不同奖励信号和视觉监督敏感性的迁移尚未解决。
    - 路线: CAD程序补全中的设计意图条件化与评估有效性
      解决的问题: 诊断语言模型是否利用设计意图头信息，以及指标是否产生循环评估伪影。
      尚未覆盖: 结果限于单一模型和检查点及部分设计意图；其他模型、更长前缀和更广CAD程序域仍需验证。
    共识:
    - 参数化CAD被表示为结构化、可编辑的构建程序或可执行代码，而不仅是静态几何。
    - 研究同时通过几何相似性和程序有效性或可执行性来评估生成或重建的CAD。
    - 近期方法依赖成对的CAD几何与程序或代码数据，常使用大规模数据集和任务特定基准。
    - 可编辑参数化输出被视为下游设计和制造工作流的关键目标。
    分歧:
    - 监督信号不同：混合几何优化、离线强化学习奖励、视觉语言监督微调以及自监督或对抗预训练并存。
    - 输出表示不同：参数化操作序列与CadQuery Python等通用CAD代码不直接一致。
    - 输入模态不同：网格、点云、图像、草图、文本、正交视图和设计意图头信息。
    - 评测目标不同：体积交并比、倒角距离、无效率、语法正确率、三维实体相似度和可执行几何断言不可直接互换。
    - 部署方式不同：有的提出统一多模态模型或开源代码生成器，有的优化任务特定重建流程或评估协议。
    开放问题:
    - 当前CAD生成模型在真实制造、建筑、CAE或CAM输入上的泛化能力如何？目前仅有部分真实图像泛化证据。
    - 几何一致性提升能否与指标循环和特定数据头部条件化因果分离？
    - 统一多模态CAD模型能否在工业任务中保持可编辑性、几何有效性和设计约束？
    - 状态空间、代码生成和程序演化带来的长序列收益能否迁移到含未见操作的复杂工程零件？
    - 若干论文缺失代码、数据集、指标、基线或局限性说明，应作为可复现性验证缺口而非已证实的缺失。
