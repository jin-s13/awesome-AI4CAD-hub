  related_work_outline_zh:
  - 主流方向：证据集中在工程CAD程序生成和基准评测，形式化几何建模理论主要体现为任务形式化和评测设计。
  - 研究共性：工作将文本/图像/网格/点到CAD生成形式化为产出可执行或可编辑CAD输出，并通过接地、对齐或澄清减少结构与参数错误。
  - 关键差异：表示在CadQuery脚本、直接BRep参数曲面和潜在CAD序列之间不同；监督在文本-CAD对、点级数据和自监督重建之间不同。
  - 趋势演进：证据高度集中在2026年，趋势属于当前前沿，从单零件几何走向多模态输入、工业零件族、装配体和工程意图评测。
  - 开放问题：尚不清楚哪种表示或监督假设能支持未见零件族；部分报告缺少局限或可复现细节，难以验证最先进主张。
  literature_review:
    line_of_work_matrix:
    - line: Multimodal CAD program generation benchmarks
      what_it_solves: Establish controlled datasets and metrics for comparing text,
        image, mesh, and point-to-CAD models on executability and geometric fidelity.
      what_remains_open: They diagnose but do not close the gap between coarse geometry
        recovery and faithful parametric CAD programs; unseen part-family generalization
        remains limited.
    - line: LLM-driven parametric CAD program synthesis with grounding
      what_it_solves: Generate executable parametric CAD scripts and align language
        prompts with topological structure, parameters, or B-Rep primitives.
      what_remains_open: Complex operations and ambiguous specifications still rely
        on curated data, interaction, or ranking-based supervision; formal constraints
        are not directly verified.
    - line: Direct BRep or parametric surface generation from weak supervision
      what_it_solves: Produce editable CAD models from point-level, self-supervised,
        or multimodal signals without requiring CAD-specific annotations.
      what_remains_open: Evidence on long-sequence robustness and benchmark transfer
        is thin; assumptions behind point-level supervision are not connected to formal
        design guarantees.
    - line: Assembly-level design-intent evaluation
      what_it_solves: Assess manufacturability, functionality, and assemblability
        of generated B-Rep assemblies through staged code, geometry, and rubric-based
        evaluation.
      what_remains_open: VLM-judge reliability and alignment with real engineering
        acceptance remain validation gaps; the cascade from executable code to engineering-ready
        design is only partially measured.
    consensus:
    - Across the evidence, research treats executable or editable CAD outputs as the
      primary target and uses geometric fidelity plus validity as shared evaluation
      concerns.
    - Multiple papers observe a failure cascade from syntactically plausible code
      to valid geometry and then to engineering intent, suggesting code execution
      alone is insufficient.
    - Grounding, alignment, and decomposition recur as mechanisms for reducing structural
      and parameter errors in parametric CAD generation.
    disagreements:
    - 'Representation differs: CadQuery script synthesis versus direct BRep parametric
      patches versus learned latent CAD sequences.'
    - 'Supervision differs: curated text-CAD pairs with fine-tuning or reinforcement
      learning versus point-level weak supervision versus self-supervised reconstruction.'
    - 'Evaluation target differs: single-part geometric fidelity and compactness versus
      industrial part-family program correctness versus assembly-level manufacturability,
      functionality, and assemblability.'
    - 'Interaction mode differs: one-shot generation versus proactive clarification
      before program synthesis.'
    open_questions:
    - Which representation and grounding assumptions best prevent subtle parameter
      and topology errors on unseen industrial part families?
    - How well do current benchmark metrics and VLM judges align with downstream manufacturing
      and design-intent outcomes?
    - What formal constraints or guarantees should generated parametric CAD programs
      satisfy under modality shift?
    - Where are the missing limitation and reproducibility details needed to verify
      the reported state-of-the-art results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态CAD程序生成基准
      解决的问题: 建立受控数据集与指标，比较文本、图像、网格和点到CAD模型的可执行性与几何保真度。
      尚未覆盖: 能诊断但未弥合粗略几何恢复与忠实参数化CAD程序之间的差距；未见零件族的泛化仍受限。
    - 路线: 基于LLM的参数化CAD程序合成与接地
      解决的问题: 生成可执行参数化CAD脚本，并将语言提示与拓扑结构、参数或B-Rep基元对齐。
      尚未覆盖: 复杂操作和模糊规格仍需策划数据、交互或排序监督；形式化约束尚未直接验证。
    - 路线: 从弱监督直接生成BRep或参数曲面
      解决的问题: 从点级、自监督或多模态信号生成可编辑CAD模型，无需CAD特定标注。
      尚未覆盖: 长序列鲁棒性和基准迁移证据薄弱；点级监督假设未与形式设计保证连接。
    - 路线: 装配级设计意图评测
      解决的问题: 通过分阶段代码、几何和评分标准评估生成BRep装配体的可制造性、功能性和可装配性。
      尚未覆盖: VLM评判器可靠性及与真实工程验收的一致性仍属验证缺口；从可执行代码到工程就绪设计的级联仅被部分测量。
    共识:
    - 证据中，研究将可执行或可编辑CAD输出作为主要目标，并把几何保真度和有效性作为共同评测关注点。
    - 多篇论文观察到从语法可行代码到有效几何再到工程意图的失败级联，表明仅代码执行不足以评估成功。
    - 接地、对齐和分解反复出现，是减少参数化CAD生成中结构与参数错误的机制。
    分歧:
    - 表示不同：CadQuery脚本合成、直接BRep参数曲面和潜在CAD序列表示并存。
    - 监督不同：策划文本-CAD对配合微调或强化学习、点级弱监督和自监督重建并存。
    - 评测目标不同：单零件几何保真度与紧凑性、工业零件族程序正确性、装配级可制造性/功能性/可装配性并存。
    - 交互模式不同：一次性生成与生成前主动澄清并存。
    开放问题:
    - 哪种表示和接地假设最能防止未见工业零件族中的微妙参数与拓扑错误？
    - 当前基准指标和VLM评判器与下游制造和设计意图结果的对齐程度如何？
    - 生成的参数化CAD程序在模态偏移下应满足哪些形式约束或保证？
    - 验证所报告的最先进结果所需的局限性和可复现细节在哪些地方缺失？
