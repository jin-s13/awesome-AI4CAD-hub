  related_work_outline:
  - 'Mainstream direction: The current frontier centers on unified multimodal, multi-task
    CAD benchmarks and paired generation/reconstruction models that target executable
    parametric CAD programs, especially B-Rep/CadQuery outputs, with engineering-oriented
    evaluation.'
  - 'Shared research pattern: Papers combine dataset design, staged evaluation protocols,
    and geometric/validity metrics to expose a failure cascade from plausible code
    to valid geometry to engineering-ready design.'
  - 'Key differences: They differ in evaluation target, supervision/optimization strategy,
    input and interaction assumptions, and benchmark scope.'
  - 'Trend evolution: Visible evidence is concentrated in 2026, so the trend appears
    within the current frontier: from single-task reconstruction/generation benchmarks
    toward multimodal, multi-task, design-intent-aware, and agentic/hybrid evaluation.'
  - 'Open questions: Coverage of real assemblies and engineering constraints, metric-to-decision
    alignment, ranking stability across modalities and metrics, and scalable evaluation
    of ambiguous-specification handling remain unresolved.'
  related_work_outline_zh:
  - 主流方向：当前前沿集中在统一的多模态、多任务CAD基准，并配套面向可执行参数化程序（尤其B-Rep/CadQuery）的生成与重建模型，强调工程化评估。
  - 研究共性：普遍将可执行参数化程序、几何有效性和设计意图纳入评估，并揭示从可执行代码到有效几何再到工程可用设计的失败级联。
  - 关键差异：差异体现在评估目标（几何精度、可制造性/可装配性/功能性、任务覆盖）、监督与优化策略、输入与交互假设，以及基准范围。
  - 趋势演进：可见证据集中在2026年，趋势属于当前前沿内部：从单任务重建/生成基准走向多模态、多任务、设计意图感知和智能体/混合优化评估。
  - 开放问题：真实装配与工程约束覆盖、指标与下游决策对齐、跨模态跨指标排名稳定性，以及模糊需求的可扩展评估仍是缺口。
  literature_review:
    line_of_work_matrix:
    - line: Multimodal benchmark and dataset design for CAD program generation/reconstruction
      what_it_solves: Creates shared evaluation suites spanning mesh, image, point-cloud,
        sketch, and text inputs, with stratified sampling by geometric complexity
        and multiple CAD dataset families.
      what_remains_open: Coverage of real engineering distributions, multi-part assemblies,
        manufacturability constraints, and full artifact availability remain incomplete;
        missing artifacts are verification gaps.
    - line: Metric and evaluation protocol design for geometric validity, design intent,
        and engineering readiness
      what_it_solves: Probes executability, geometric fidelity, invalid-ratio, functionality,
        manufacturability, and assemblability through staged code/geometry/design-intent
        checks and learned judges.
      what_remains_open: Whether proxy metrics align with downstream engineering decisions
        and whether VLM judges are stable and reliable across design-specific rubrics
        is not established.
    - line: Reverse engineering and stepwise parametric CAD reconstruction benchmarking
      what_it_solves: Defines mesh-to-CAD reconstruction tasks that recover editable
        parametric operation sequences and compare intermediate geometry during feature-by-feature
        construction.
      what_remains_open: Complex parts requiring rich operations such as fillets and
        chamfers, and robustness across mechanical part categories, are only partially
        evidenced.
    - line: Structure/parameter grounding and hybrid optimization for CAD generation
      what_it_solves: Improves structural consistency, parameter accuracy, editability,
        and geometric fidelity by grounding B-Rep primitives or construction trajectories
        and optimizing against geometry feedback.
      what_remains_open: Rankings vary across metrics and modalities; evidence on
        generalization to complex assemblies and real-world CAD codebases is still
        limited.
    - line: Agentic clarification and specification grounding for text-to-CAD
      what_it_solves: Reduces invalid or infeasible CAD programs by auditing ambiguous
        prompts, asking targeted clarification questions, and linking natural language
        to CAD primitives before code synthesis.
      what_remains_open: Interaction overhead, generalizability beyond CadQuery-style
        scripts, and evaluation of real ambiguous engineering prompts remain open.
    consensus:
    - Parametric CAD programs, B-Rep representations, and executable scripts are the
      dominant evaluation object because they support code checks, editability, and
      geometric validity checks.
    - Evaluation is moving from aggregate generation scores toward multi-metric, staged
      protocols that separately test executable code, geometric validity, and design-intent
      or engineering-readiness.
    - 'A recurring failure cascade appears: models may generate executable code yet
      produce invalid geometry, and may produce plausible geometry yet fail manufacturing
      or assemblability criteria.'
    - Grounding structure and parameters or comparing intermediate geometry generally
      improves structural consistency, parameter accuracy, and validity relative to
      direct end-to-end generation.
    disagreements:
    - 'Evaluation target differs: some work prioritizes geometric reconstruction metrics
      like volumetric IoU and Chamfer distance, while others focus on manufacturability,
      functionality, assemblability, or broad tasks such as CAD question answering.'
    - 'Supervision and optimization differ: supervised fine-tuning plus reinforcement
      learning, hierarchical structure alignment with ranking, hybrid optimization
      with geometric feedback, stepwise intermediate geometry comparison, and proactive
      clarification before code synthesis.'
    - 'Input and interaction assumptions differ: idealized clean inputs versus noisy,
      photorealistic, or multi-view inputs; single-shot generation versus an interactive
      clarifying loop before program generation.'
    - 'Benchmark scope differs: multimodal generation suites, multi-task unified CAD
      evaluation, mechanical part reverse engineering, and engineering assembly specifications
      with design rubrics each sample different task distributions.'
    open_questions:
    - How well do current benchmark distributions cover real CAD design settings,
      especially multi-part assemblies, engineering constraints, and production-like
      noisy inputs?
    - Are geometric fidelity and executability proxy metrics aligned with downstream
      usability, editability, manufacturability, and engineering refinement decisions?
    - How stable are model rankings across input modalities, geometric complexity
      strata, metrics, and implementation or compute budgets?
    - What evaluation protocol can measure design-intent alignment without overfitting
      to VLM/judge preferences or rubrics?
    - How much proactive clarification or interaction is needed to resolve ambiguous
      design specifications while keeping benchmarks scalable and comparable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向CAD程序生成/重建的多模态基准与数据集设计
      解决的问题: 构建跨网格、图像、点云、草图和文本的共享评估套件，并按几何复杂度分层采样多个CAD数据集。
      尚未覆盖: 真实工程分布、多零件装配、可制造约束及完整工件可用性仍不充分；缺失工件属于验证缺口。
    - 路线: 面向几何有效性、设计意图与工程就绪度的指标与评测协议设计
      解决的问题: 通过分阶段的代码检查、几何检查和设计意图对齐，评估可执行性、几何保真度、无效比、功能性、可制造性和可装配性。
      尚未覆盖: 代理指标是否对齐下游工程决策，以及VLM评委在设计特定评分标准下的稳定性和可靠性尚未确定。
    - 路线: 逆向工程与逐步参数化CAD重建基准
      解决的问题: 定义网格到CAD重建任务，恢复可编辑参数化操作序列，并在逐特征构建中比较中间几何。
      尚未覆盖: 包含倒圆角、倒角等丰富操作的复杂零件，以及跨机械零件类别的鲁棒性证据仍有限。
    - 路线: 结构/参数接地与混合优化的CAD生成
      解决的问题: 通过B-Rep基元或构建树轨迹接地，并基于几何反馈优化，以提升结构一致性、参数准确性、可编辑性和几何保真度。
      尚未覆盖: 模型排名随指标和模态变化；在复杂装配和真实CAD代码库上的泛化证据有限。
    - 路线: 面向文本到CAD的智能体澄清与规格接地
      解决的问题: 在代码合成前识别模糊提示并提出针对性澄清问题，将自然语言与CAD基元关联，减少无效或不可行程序。
      尚未覆盖: 交互开销、对CadQuery之外脚本范式的泛化，以及真实模糊工程提示的评测仍不足。
    共识:
    - 参数化CAD程序、B-Rep表示和可执行脚本是主要评估对象，因为其支持代码检查、可编辑性和几何有效性检查。
    - 评估正在从单一生成得分走向多指标、分阶段协议，分别检验可执行代码、几何有效性和设计意图或工程就绪度。
    - 证据反复显示失败级联：模型可能生成可执行代码却产生无效几何，或生成合理几何却不满足制造或装配标准。
    - 结构接地、参数接地或中间几何比较通常比直接端到端生成更能改善结构一致性、参数准确性和有效性。
    分歧:
    - 评估目标不同：有的侧重体素IoU、Chamfer距离等几何重建指标，有的侧重可制造性、功能性、可装配性，或CAD问答等多任务覆盖。
    - 监督与优化策略不同：监督微调加强化学习、层级结构对齐加排序、基于几何反馈的混合优化、逐步中间几何比较，以及代码合成前主动澄清。
    - 输入与交互假设不同：理想化输入与噪声、真实渲染或多视图输入不同；单轮生成与程序生成前的交互式澄清不同。
