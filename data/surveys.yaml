  related_work_outline:
  - 'Mainstream direction: The dominant work treats CAD as program synthesis: reconstructing
    or generating editable parametric CAD construction sequences from meshes, images,
    point clouds, sketches, or orthographic views, with recent emphasis on multimodal
    large models and executable code.'
  - 'Shared research pattern: Most works learn to map visual or geometric conditioning
    to sequences of parametric operations, then evaluate validity and geometric similarity
    on synthetic or benchmark datasets; several introduce datasets or benchmarks and
    report state-of-the-art gains.'
  - 'Key differences: Representations and input modalities vary, generation paradigms
    span optimization, offline reinforcement learning, state-space GANs, VLM fine-tuning,
    and program evolution; supervision and evaluation targets also differ, from IoU/Chamfer
    and valid syntax to executable geometric assertions.'
  - 'Trend evolution: The top-paper evidence is concentrated in 2025-2026, suggesting
    a current-frontier shift toward multimodal models, large-scale code data, sequence
    generation, and more diagnostic evaluation; older years appear in the topic span
    but are not represented among the visible top papers, so long-run evolution remains
    a verification gap.'
  - 'Open questions: Generalization to real images and unseen CAD operations, robust
    non-circular evaluation, scalable generation of long and complex valid programs,
    reproducible artifacts, and cross-task unified modeling remain unresolved.'
  related_work_outline_zh:
  - 主流方向：当前工作将CAD视为程序合成问题，从网格、图像、点云、草图或正交视图重建或生成可编辑的参数化CAD构建序列，近期偏向多模态大模型和可执行代码生成。
  - 研究共性：大多数方法学习将视觉或几何条件映射到参数化操作序列，并在合成或基准数据上评估有效性和几何相似性；多个工作提出数据集/基准并报告最先进结果。
  - 关键差异：输入表示和模态不同，生成范式涵盖混合优化、离线强化学习、状态空间GAN、VLM微调和程序演化；监督信号和评测目标也不同，从IoU/Chamfer和语法有效到可执行几何断言。
  - 趋势演进：可见的顶部论文集中在2025-2026年，显示当前前沿向多模态模型、大规模代码数据、序列生成和诊断式评测转变；主题时间跨度虽包含更早年份，但顶部证据未覆盖，长期演进仍属验证缺口。
  - 开放问题：真实图像和未见CAD操作的泛化、非循环鲁棒评测、长且复杂有效程序的可扩展生成、可复现工件，以及跨任务统一建模仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Geometry-to-parametric-CAD reconstruction
      what_it_solves: Recovers editable parametric CAD construction sequences from
        meshes, images, or stepwise orthographic views instead of only producing static
        geometry.
      what_remains_open: Generalization to real-world mechanical parts and unseen
        feature combinations is not established; several entries lack visible code
        or limitation evidence, so reproducibility is a verification gap.
    - line: Multimodal multi-task CAD modeling and unified benchmarks
      what_it_solves: Handles heterogeneous CAD tasks such as point/text/sketch/image-to-CAD
        and CAD question answering in a single framework with a unified evaluation
        suite.
      what_remains_open: Whether unified-task performance transfers outside the constructed
        benchmarks and what task-specific capability is lost remain open; available
        artifact signals are limited.
    - line: Long-sequence parametric CAD generation
      what_it_solves: Generates longer, valid parametric CAD sequences by using state-space
        or latent generative modeling rather than short-sequence autoregressive decoding.
      what_remains_open: Complexity and validity boundaries beyond the reported dataset
        distribution are not resolved, and limitation evidence is missing from the
        visible analysis.
    - line: VLM-based CAD code generation and program evolution
      what_it_solves: Produces editable CadQuery or Python code from images and scales
        complex training data through iterative program evolution with validation.
      what_remains_open: Real-world image robustness and unseen CAD operations are
        only partially shown; full operation coverage and open artifact availability
        remain verification gaps.
    - line: Design-intent conditioning and evaluation diagnosis
      what_it_solves: Tests whether a CAD program model actually uses design-intent
        headers and separates learned mapping from marginal distribution effects via
        derangement control and executable geometric assertions.
      what_remains_open: Evidence is limited to a single model and CAD program domain,
        with some design intents at a generation floor and findings restricted to
        certain prefix regimes.
    consensus:
    - Parametric CAD programs are preferred over raw geometry because they provide
      editable, structured construction sequences.
    - Most systems formulate CAD output as a sequence or program of operations and
      evaluate generated solids through validity and geometric similarity.
    - Multiple works introduce or use datasets/benchmarks with paired geometry and
      CAD code or construction sequences to train and compare models.
    - Visual and geometric conditioning is central, but the target is executable or
      structured CAD rather than rendered pixels alone.
    - Evaluation tends to combine program validity with geometric metrics such as
      IoU, Chamfer distance, solid similarity, or executable B-rep assertions.
    disagreements:
    - 'Input representation differs: some methods consume meshes or point clouds,
      others consume images, sketches, text, or stepwise orthographic views.'
    - 'Generation paradigm differs: hybrid optimization, offline reinforcement learning
      with geometric rewards, state-space latent GAN, VLM fine-tuning, and VLM-guided
      program evolution are used.'
    - 'Supervision signal differs: geometric feedback and IoU rewards, paired image-code
      supervision, self-supervised reconstruction, and executable assertion scoring
      reflect different training objectives.'
    - 'Evaluation target differs: some compare benchmark-specific reconstruction accuracy,
      others measure valid syntax and 3D similarity, while diagnostic work uses causal
      controls and independent geometric assertions.'
    - 'Interaction mode differs: end-to-end generation in one model, stepwise feature-by-feature
      construction, and iterative program evolution with validation imply different
      CAD workflow assumptions.'
    open_questions:
    - Can reconstruction and generation models maintain validity and geometric accuracy
      on real-world industrial parts and unseen CAD operations beyond curated benchmarks?
    - How can the field avoid circular evaluation where extracted headers or geometric
      reprojections share dependencies with the model's training objective?
    - Which supervision or generation paradigm scales best to long sequences, complex
      features such as fillets and chamfers, and low invalid-program rates?
    - Do unified multimodal multi-task CAD models sacrifice task-specific performance
      or fail on out-of-benchmark applied CAD workflow steps?
    - Given missing code, dataset, and limitation details for several top papers,
      can reported state-of-the-art results be independently reproduced and audited?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 几何到参数化CAD重建
      解决的问题: 从网格、图像或逐步正交视图恢复可编辑的参数化CAD构建序列，而不是只输出静态几何。
      尚未覆盖: 真实机械零件和未见特征组合上的泛化尚未建立；若干条目缺少可见代码或局限性证据，因此可复现性仍是验证缺口。
    - 路线: 多模态多任务CAD建模与统一基准
      解决的问题: 在单一框架中处理点云、文本、草图、图像到CAD以及CAD问答等异构任务，并提供统一评测。
      尚未覆盖: 统一任务性能能否迁移到构造基准之外，以及是否会损失任务特定能力仍不明确；可用工件信号有限。
    - 路线: 长序列参数化CAD生成
      解决的问题: 利用状态空间或潜在生成建模生成更长、有效的参数化CAD序列，而不是短序列自回归解码。
      尚未覆盖: 超出所报告数据集分布的复杂度和有效性边界尚未解决；可见分析中缺少局限性证据。
    - 路线: 基于视觉语言模型的CAD代码生成与程序演化
      解决的问题: 从图像生成可编辑的CadQuery或Python代码，并通过迭代程序演化和验证扩展复杂训练数据。
      尚未覆盖: 真实图像鲁棒性和未见CAD操作仅得到部分展示；完整操作覆盖与开放工件可用性仍是验证缺口。
    - 路线: 设计意图条件化与评测诊断
      解决的问题: 检验CAD程序模型是否真正利用设计意图头，并通过错乱控制和可执行几何断言分离学习映射与边际分布效应。
      尚未覆盖: 证据限于单一模型和CAD程序领域，部分设计意图处于生成下限，结论仅适用于特定前缀长度条件。
    共识:
    - 参数化CAD程序优于原始几何，因为它提供可编辑、结构化的构建序列。
    - 大多数系统将CAD输出形式化为操作序列或程序，并通过有效性和几何相似性评估生成实体。
    - 多个工作引入或使用包含几何与CAD代码/构建序列配对的数据集/基准进行训练和比较。
