    - 参数化CAD程序，特别是基于B-Rep的CadQuery脚本，是AI辅助设计的首选输出表示。
    - 评估必须超越几何相似性，包括可执行性、结构有效性和对设计规范的遵循。
    - 现有模型展现出失败级联：即使代码语法正确，生成的几何体往往无法满足工程意图，尤其是对于复杂零件。
    - 在理想化输入条件下，专用CAD模型优于通用视觉语言模型，但在模态转换下表现脆弱。
    分歧:
    - 评估目标不同：部分基准强调几何保真度和紧凑性，而另一些则引入了可制造性和可装配性等下游标准。
    - 监督策略各异：DreamCAD等模型在无标注数据上使用点级监督，而基于LLM的方法依赖精心整理的文本-代码对进行监督微调或强化学习。
    - 交互模式：ProCAD引入主动澄清以解决模糊性，而其他方法假设从完整提示进行单轮生成。
    - 表示方法：HierCAD采用构建树的层次化分解，DreamCAD使用连续参数化面片，Mamba-CAD探索了基于状态空间模型的潜在空间GAN。
    开放问题:
    - 如何验证基准指标与实际CAD工程成功之间的相关性，特别是对于细粒度设计意图？
    - 实现可靠泛化到未见零件族所需的最小额外监督或交互是什么？
    - 基于VLM的自动裁判能否可靠地评估可制造性和功能约束，还是始终需要人工评估？
