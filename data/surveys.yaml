  related_work_outline:
  - 'Mainstream direction: End-to-end generation of editable parametric CAD programs
    from multimodal inputs (text, images, meshes) using large language models, state-space
    models, or hybrid optimization, with a strong emphasis on executability and geometric
    fidelity.'
  - 'Shared research pattern: All approaches frame CAD generation as a sequence or
    program synthesis problem, leverage large-scale pretrained or custom generative
    models, and evaluate primarily on geometric metrics (IoU, Chamfer distance) and
    execution validity.'
  - 'Key differences: Representations differ (executable CadQuery scripts vs. construction
    trees vs. latent codes), interaction modes range from single-pass generation to
    multi-turn clarification, and evaluation depth varies from geometry-only to engineering
    attributes (manufacturability, assemblability).'
  - 'Trend evolution: The frontier (visible years 2026) moves from pure geometry reconstruction
    toward engineering-aware generation, from single-modality to multi-modal benchmarks,
    and from one-shot generation to interactive, agent-driven clarification pipelines.'
  - 'Open questions: How to reliably auto-evaluate manufacturability and functionality
    without ground-truth engineering feedback; why models degrade under modality shift;
    and how to suppress error accumulation in long parametric CAD sequences.'
  related_work_outline_zh:
  - 主流方向：利用大语言模型、状态空间模型或混合优化，从多模态输入（文本、图像、网格）端到端生成可编辑的参数化CAD程序，并高度关注可执行性与几何保真度。
  - 研究共性：所有工作均将CAD生成建模为序列或程序合成问题，依赖大规模预训练或自定义生成模型，主要使用几何指标（IoU、Chamfer距离）和可执行性进行评估。
  - 关键差异：表示方式不同（可执行CadQuery脚本、构建树、或隐式编码），交互模式从单次生成到多轮澄清，评估深度从仅几何指标扩展到工程属性（可制造性、可装配性）。
  - 趋势演进：当前前沿（可见年份2026）从纯几何重建向工程感知生成演进，从单模态向多模态基准发展，从一次性生成向交互式、智能体驱动的澄清流水线演进。
  - 开放问题：如何在缺乏真实工程反馈的情况下可靠地自动评估可制造性与功能性；模型在模态迁移下性能退化的原因；以及如何抑制长序列参数化CAD生成中的错误累积。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turning multimodal inputs (text, images, meshes) into editable
        CAD program representations such as CadQuery scripts, construction trees,
        or latent codes, with corresponding generative losses and training recipes.
      what_remains_open: Whether these representations and objectives generalize beyond
        simple parts to complex assemblies with multi-step engineering constraints,
        and whether the gains are due to the representation or the scale of the model.
    - line: Planning and action-interface methods
      what_it_solves: Resolving specification ambiguity during generation through
        proactive clarification or interactive planning, thereby improving robustness
        of text-to-CAD generation.
      what_remains_open: Trade-off between interaction cost and engineering efficiency;
        transferability of clarification strategies to other CAD tasks (editing, reasoning);
        error accumulation across multiple rounds.
    - line: Method evidence and ablation protocol
      what_it_solves: Separating method contribution from dataset, baseline, and metric
        effects by introducing multi-dimensional benchmarks (e.g., CADBench, MUSE)
        that assess geometric fidelity, executability, manufacturability, and assemblability.
      what_remains_open: Consistency between different evaluation metrics, reliability
        of automated judges (e.g., VLM-as-judge), and how well such benchmarks align
        with real-world engineering workflows without dataset nor judge bias.
    consensus:
    - CAD generation is predominantly modeled as a sequence or program synthesis task,
      and large language models or specialized generative models are the backbone.
    - Executability and geometric similarity are the minimum required evaluation dimensions,
      but all recent works acknowledge that geometry alone is insufficient.
    - There is a shared drive toward more comprehensive, engineering-relevant evaluation
      beyond pure shape metrics.
    - Multimodal conditioning (text, image, mesh, point cloud) is increasingly adopted,
      and unified frameworks that handle multiple tasks are emerging.
    disagreements:
    - 'Representation choice: some generate executable code (CadQuery, Python), others
      predict construction trees, and some use latent codes decoded into sequences.'
    - 'Interaction mode: single-pass end-to-end generation versus multi-turn, agent-driven
      clarification that probes the user before synthesis.'
    - 'Evaluation target: method papers focus on geometric accuracy and invalid program
      ratio, while benchmark papers emphasize downstream engineering attributes such
      as manufacturability, functionality, and assemblability.'
    - 'Supervision signal: methods vary from supervised fine-tuning and reinforcement
      learning to self-supervised pretraining and optimization-based fitting, each
      with different data requirements and failure modes.'
    open_questions:
    - How can functional and manufacturability properties be reliably auto-evaluated
      without ground-truth engineering simulations or expert annotations?
    - What causes the observed brittleness of CAD-specialized models under modality
      shift (e.g., clean mesh to noisy image), and is it a representation gap or a
      benchmark design issue?
    - How can error accumulation in long parametric CAD sequences be mitigated without
      sacrificing editability?
    - Do the gains from interactive clarification come from the agent's strategy or
      simply from the added information, and how well does this transfer to production
      CAD workflows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将多模态输入（文本、图像、网格）转化为可编辑的CAD程序表示（如CadQuery脚本、构建树或隐式编码），并设计相应的生成损失与训练配方。
      尚未覆盖: 这些表示与目标能否从简单零件泛化到具有多步骤工程约束的复杂装配体，以及方法增益究竟来自表示设计还是模型规模。
    - 路线: 规划与动作接口方法
      解决的问题: 在生成过程中通过主动澄清或交互式规划解决规范模糊性，从而提升文本到CAD生成的鲁棒性。
      尚未覆盖: 交互成本与工程效率之间的权衡；澄清策略在编辑、推理等其他CAD任务中的可迁移性；多轮交互中的错误累积问题。
    - 路线: 方法证据与消融协议
      解决的问题: 通过引入多维基准（如CADBench、MUSE）来分离方法贡献与数据集、基线、指标影响，评估几何保真度、可执行性、可制造性和可装配性。
      尚未覆盖: 不同评估指标之间的一致性，自动评判器（如VLM评判）的可靠性，以及这类基准在多大程度上反映真实工程需求而不引入数据集或评判偏差。
    共识:
    - CAD生成普遍被建模为序列或程序合成任务，大语言模型或专用生成模型是核心架构。
    - 可执行性和几何相似性是最低评估维度，但所有近期工作均认识到仅靠几何指标不足。
    - 推动更全面、与工程相关的评估已成共识，需要超越纯形状度量。
    - 多模态条件输入（文本、图像、网格、点云）被越来越多采用，统一处理多种任务的框架开始出现。
    分歧:
    - 表示选择：部分生成可执行代码（CadQuery、Python），部分预测构建树，部分使用隐式编码解码为序列。
    - 交互模式：单次端到端生成 vs. 多轮智能体驱动的主动澄清，在合成前向用户提问。
    - 评估目标：方法论文关注几何精度和无效程序比例，基准论文强调可制造性、功能性、可装配性等下游工程属性。
    - 监督信号：方法涵盖监督微调、强化学习、自监督预训练和基于优化的拟合，数据需求与失效模式各不相同。
    开放问题:
    - 在没有真实工程仿真或专家标注的情况下，如何可靠地自动评估功能性和可制造性？
    - CAD专用模型在模态迁移（如干净网格到噪声图像）下表现脆弱的根源是什么，是表示缺陷还是基准设计问题？
    - 如何在保持可编辑性的前提下，减轻长序列参数化CAD生成中的错误累积？
    - 交互式澄清的增益究竟来自智能体策略还是额外信息本身，以及该策略在工业生产CAD流程中的可迁移性如何？
