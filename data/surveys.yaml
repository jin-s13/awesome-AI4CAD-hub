  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal benchmarks and evaluation protocols for CAD program
        generation
      what_it_solves: Creates multimodal, stratified evaluation samples and metrics
        for text, image, point-cloud, and mesh-to-CAD generation, including executability
        and design-intent checks.
      what_remains_open: Whether rankings transfer beyond the reported 2026 samples
        is unproven; metric disagreement and limited real-world manufacturing or assembly
        ground truth remain.
    - line: LLM-based parametric CAD program synthesis from natural language and structured
        specifications
      what_it_solves: Converts text or clarified prompts into executable parametric
        scripts by grounding structure and parameters in CAD spans or B-Rep primitives.
      what_remains_open: Evidence is limited to reported datasets and curated interaction;
        geometric grounding quality and robustness to ambiguous, multi-constraint
        specifications are not fully established.
    - line: Geometry-to-CAD reverse engineering and parametric reconstruction
      what_it_solves: Recovers editable CAD construction sequences from meshes or
        images using incremental, stepwise, or optimization-based fitting with geometric
        feedback.
      what_remains_open: Operation coverage and complex geometry remain constrained;
        invalid-ratio improvements and robustness under noise or modality shift are
        not yet demonstrated across broad settings.
    - line: Unified multimodal multi-task models for heterogeneous CAD tasks
      what_it_solves: Processes multiple input modalities and performs reconstruction,
        generation, and question answering within a single framework.
      what_remains_open: It is unclear whether single-model gains persist across heterogeneous
        CAD tasks without task-specific scaffolding or benchmark-specific tuning.
    consensus:
    - Recent work treats parametric CAD programs rather than raw geometry as the target
      representation because they are editable and executable.
    - Evaluation increasingly combines geometric fidelity, executability, and structured
      design checks; geometric similarity alone is insufficient.
    - CAD-aware structure alignment, parameter grounding, or geometric feedback is
      used to improve validity over generic language or image generation.
    - A repeated observation is a failure cascade from executable code to valid geometry
      to engineering-ready or design-intent-compliant output.
    disagreements:
    - 'Interaction mode differs: some systems generate directly from text, while others
      introduce proactive clarification or bypass language by reverse engineering
      from geometry.'
    - 'Training and supervision strategy differs: supervised fine-tuning, reinforcement
      optimization, ranking-based grounding, hybrid optimization, and stepwise geometric
      comparison imply different sources of supervision.'
    - 'Evaluation emphasis differs: some benchmarks prioritize geometric and executability
      metrics, while others score manufacturability, functionality, and assemblability;
      model rankings change across metrics.'
    - 'Generic multimodal models versus CAD-specialized models show context-dependent
      advantage: specialized models can win under idealized geometry but degrade under
      modality shift.'
    open_questions:
    - Which design choices contribute most to generating valid, editable CAD programs
      after controlling for dataset, metric, and system-level scaffolding?
    - How do current geometric, code, and VLM-judge evaluations correspond to real
      downstream manufacturability, functionality, and engineering usability?
    - Do models generalize beyond the operation types, geometric complexity strata,
      and input modalities represented in currently reported benchmarks?
    - What interaction and feedback mechanisms best resolve ambiguous design specifications
      without excessive user overhead or specification overfitting?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD程序生成基准与评估协议
      解决的问题: 建立跨文本、图像、点云和网格的CAD生成评估样本、分层复杂度与可执行性或设计意图检查。
      尚未覆盖: 排行榜是否能迁移到2026年样本之外尚不明确；指标间存在分歧，真实制造与装配验证仍有限。
    - 路线: 基于大语言模型的文本到参数化CAD程序合成
      解决的问题: 将自然语言或澄清后的规格转换为可执行参数化脚本，并通过对齐结构、参数和B-Rep基元来提高有效性。
      尚未覆盖: 证据局限于报告数据集和人工交互设置；几何接地质量及对多约束模糊规格的鲁棒性尚未完全验证。
    - 路线: 从几何到CAD的逆向工程与参数化重建
      解决的问题: 通过增量、逐步或基于优化的拟合，从网格或图像恢复可编辑的参数化构建序列。
      尚未覆盖: 操作覆盖和复杂几何仍受限；噪声、模态偏移及更广设置下的无效程序与泛化证据不足。
    - 路线: 多模态多任务统一模型与评估套件
      解决的问题: 在单一框架内处理多种输入模态并完成重建、生成和问答等多个CAD任务。
      尚未覆盖: 尚不清楚统一模型在异构任务上的收益是否依赖任务特定脚手架或基准特定调优。
    共识:
    - 近期工作倾向于把可编辑、可执行的参数化CAD程序，而非原始网格或点云，作为目标表示。
    - 评估越来越多地同时考虑几何保真度、可执行性和结构化设计检查，仅看表面相似性不够。
    - 通过结构对齐、参数接地或几何反馈来降低无效输出，是多项工作的共同做法。
    - 多个研究反复观察到从可执行代码到有效几何再到工程就绪设计的失败级联。
    分歧:
    - 交互模式不同：有的直接从文本生成，有的在生成前主动澄清，有的从几何输入进行逆向重建。
    - 训练与监督策略不同：监督微调、强化优化、排序接地、混合优化和逐步几何比较意味着不同的监督来源。
    - 评估重点不同：部分基准强调几何与可执行性，另一些强调可制造性、功能性和可装配性；模型排名随指标而变化。
    - 通用多模态模型与CAD专用模型的优势依赖条件：专用模型在理想几何下较强，但在模态偏移下更脆弱。
    开放问题:
    - 在控制数据集、指标和系统脚手架后，哪些设计选择对生成有效且可编辑的CAD程序贡献最大？
    - 当前几何、代码和VLM评判器的评估在多大程度上对应真实可制造性、功能性和工程可用性？
    - 模型能否泛化到当前基准未充分覆盖的操作类型、几何复杂度和输入模态？
    - 怎样的交互和反馈机制能最好地消解模糊设计规格，同时避免用户负担过重和规格过拟合？
