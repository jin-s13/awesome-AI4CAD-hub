  related_work_outline:
  - 'Mainstream direction: Parametric CAD reconstruction and generation from geometry
    or visual inputs, with editable script or program output dominating recent work.'
  - 'Shared research pattern: Most approaches treat CAD as sequences or programs and
    use geometric validity/similarity feedback, with DeepCAD, Fusion 360, MCB, and
    newer benchmark datasets as evaluation anchors.'
  - 'Key differences: Input modalities and model families vary from mesh/point-cloud/orthographic
    inputs to image/text, and from optimization, state-space, RL, VLM, LLM to evolutionary
    data-generation pipelines; supervision and evaluation targets also differ.'
  - 'Trend evolution: The visible top evidence clusters in 2025-2026 and moves from
    task-specific mesh-to-CAD and sequence reconstruction toward unified multimodal
    multi-task CAD models and diagnostic evaluation of design-intent conditioning.'
  - 'Open questions: Cross-dataset and real-world generalization, metric circularity,
    missing reproducibility/limitation evidence, and downstream validation for manufacturing
    or CAE/CAM remain unresolved.'
  related_work_outline_zh:
  - 主流方向：从几何或视觉输入重建和生成参数化CAD，可编辑脚本或程序输出成为近期主流。
  - 研究共性：多数方法把CAD建模视为序列或程序生成，并以几何有效性/相似性反馈为主，常用DeepCAD、Fusion 360、MCB及新基准作为评测锚点。
  - 关键差异：输入模态与模型族不同，包括网格/点云/正交视图/图像/文本，以及优化、状态空间、强化学习、VLM、LLM和程序演化等路线；监督信号和评测目标也存在明显差异。
  - 趋势演进：证据集中在2025-2026年前沿，趋势从面向特定任务的网格到CAD和序列重建，走向统一多模态多任务CAD模型，并开始诊断设计意图条件化与评测有效性。
  - 开放问题：跨数据集和真实场景泛化、评测指标循环性、可复现与局限性证据缺失，以及面向制造或CAE/CAM的下游验证仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Parametric mesh and point-cloud reverse engineering
      what_it_solves: Recovering editable parametric CAD construction sequences from
        mesh or point geometry while improving geometric accuracy and program validity.
      what_remains_open: Transfer across heterogeneous complex industrial geometry
        is not fully evidenced; several top results lack detailed limitation statements
        and broader cross-dataset validation.
    - line: Unified multimodal multi-task CAD generation
      what_it_solves: Handling point-to-CAD reconstruction, text/image-to-CAD generation,
        and CAD question answering within a single framework.
      what_remains_open: Evidence is limited on generalization outside the reported
        benchmark suite; artifact and code availability signals are weak for the unified
        model.
    - line: Direct image-to-code generation with vision-language models
      what_it_solves: Producing editable CAD code directly from visual input by fine-tuning
        open-source VLMs on image-code pairs.
      what_remains_open: Initial generalization to real-world images and unseen CAD
        operations is only partial, leaving distribution-shift robustness unresolved.
    - line: Evolutionary program and dataset generation
      what_it_solves: Growing complex parametric CAD programs from simple primitives
        to create large script-geometry datasets for downstream image-to-CAD training.
      what_remains_open: Whether generated data improves downstream design validity
        beyond benchmark metrics or transfers to fabrication/simulation workflows
        is not established.
    - line: Conditioning and evaluation diagnostics for CAD program completion
      what_it_solves: Testing whether learned design-intent headers control CAD generation
        and reducing circularity in header-adherence metrics via executable geometric
        assertions.
      what_remains_open: Findings are restricted to a single model and CAD program
        domain; floor effects for some design intents limit the contrast, and generalization
        across prefix regimes remains open.
    consensus:
    - Recent work converges on parametric CAD programs or scripts as the preferred
      output because they preserve editability and enable executable or geometric
      validation.
    - Geometric similarity and validity metrics, such as volumetric IoU, Chamfer distance,
      invalid ratio, syntax validity, and B-rep assertions, are used across the evidence
      as core evaluation signals.
    - Benchmarks and datasets such as DeepCAD, Fusion 360, MCB, and newly proposed
      datasets anchor evaluation, but no single consistent evaluation protocol spans
      all approaches.
    - The visible top evidence is shifting toward multi-modal inputs and generative
      modeling rather than purely geometry-driven reverse engineering.
    disagreements:
    - 'Formulation differs: some approaches solve CAD recovery via optimization over
      parametric programs, others via stepwise feature construction, latent generative
      modeling, offline reinforcement learning, direct vision-language code generation,
      or evolutionary data generation.'
    - 'Supervision and training signals differ: geometric alignment rewards, self-supervised
      reconstruction, image-code supervised fine-tuning, GAN-based latent generation,
      and causal diagnostic controls imply different assumptions about what drives
      valid CAD output.'
    - Evaluation targets differ across reconstruction accuracy, multi-task benchmark
      breadth, valid code syntax, sequence reconstruction, and conditional design-intent
      adherence, making direct comparison difficult.
    - 'The role of design-intent conditioning is contested: one diagnostic study shows
      wrong headers can harm adherence and apparent correct-header benefits shrink
      under an independent metric, challenging simpler benchmark conclusions.'
    open_questions:
    - Do reported SOTA improvements on DeepCAD, Fusion 360, MCB, and new CAD benchmarks
      transfer to real manufacturing parts, CAE/CAM pipelines, or 3D printing constraints?
    - How robust are current geometric and validity metrics given the evidence that
      a header-adherence metric can be circular and overstate conditioning benefits?
    - Several top methods have missing limitation statements or weak code/dataset
      artifact signals; what verification gaps remain before these results can be
      independently reproduced?
    - Can unified multimodal models and generated synthetic datasets handle unseen
      CAD operations, real-world image noise, and longer parametric sequences beyond
      the tested distributions?
    - Does better CAD sequence reconstruction or code generation produce materially
      better editable designs, manufacturability, or simulation readiness?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 参数化网格与点云逆向工程
      解决的问题: 从网格或点几何中恢复可编辑的参数化CAD构建序列，同时提高几何精度和程序有效性。
      尚未覆盖: 跨异构复杂工业几何的迁移证据不足；若干顶部结果缺少详细局限性说明和更广泛的跨数据集验证。
    - 路线: 统一多模态多任务CAD生成
      解决的问题: 在单一框架内处理点云到CAD重建、文本/图像到CAD生成和CAD问答。
      尚未覆盖: 在报告基准套件之外的泛化证据有限；统一模型对应的代码和工件可得性信号较弱。
    - 路线: 基于视觉语言模型的图像到代码生成
      解决的问题: 通过微调开源VLM，在图像-代码对上直接从视觉输入生成可编辑CAD代码。
      尚未覆盖: 对真实图像和未见CAD操作的泛化仅是初步的，分布偏移下的鲁棒性仍未解决。
    - 路线: 程序演化与数据集生成
      解决的问题: 从简单基元逐步增长复杂参数化CAD程序，为下游图像到CAD训练创建大规模脚本-几何数据集。
      尚未覆盖: 生成数据是否在基准指标之外改善下游设计有效性，或能迁移到制造/仿真工作流，尚未建立证据。
    - 路线: CAD程序补全的条件化与评测诊断
      解决的问题: 检验学习到的设计意图头是否真正控制CAD生成，并通过可执行几何断言降低头依从性评测的循环性。
      尚未覆盖: 发现局限于单一模型和单一CAD程序领域；部分设计意图的生成地板效应限制了对比，跨前缀条件的泛化仍开放。
    共识:
    - 近期工作汇聚到以参数化CAD程序或脚本为优先输出，因为其保留可编辑性并支持可执行或几何验证。
    - 体素IoU、倒角距离、无效比例、语法有效性和B-rep断言等几何相似性与有效性指标被普遍用作核心评测信号。
    - DeepCAD、Fusion 360、MCB及新提出的数据集锚定了评测，但尚不存在横跨所有方法的统一评测协议。
    - 可见的顶部证据正从单纯几何驱动的逆向工程，转向多模态输入与生成式建模。
    分歧:
    - 问题形式不同：部分方法通过参数化程序上的优化恢复CAD，其他方法采用逐步特征构建、潜在生成建模、离线强化学习、直接视觉语言代码生成或演化式数据生成。
