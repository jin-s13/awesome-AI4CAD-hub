  related_work_outline:
  - 'Mainstream direction: runnable CAD systems are coalescing around end-to-end generation
    and evaluation of editable parametric CAD programs from text, images, meshes,
    sketches, and point clouds, with agentic interaction emerging.'
  - 'Shared research pattern: decompose CAD construction into executable programs
    or construction sequences, then supervise or optimize with geometric fidelity,
    executability, validity, and increasingly engineering intent signals.'
  - 'Key differences: input/output scope spans text-to-CAD, geometry-to-CAD, multimodal
    multi-task, and interactive clarification; supervision varies from supervised
    fine-tuning to RL, ranking-based grounding, and hybrid optimization; evaluation
    targets range from geometry-only metrics to manufacturability and assemblability.'
  - 'Trend evolution: top-paper evidence is concentrated in 2026, so the visible trend
    is within the current frontier: from isolated reconstruction toward unified multimodal
    and agent-centric systems, and from geometric validity toward engineering readiness.'
  - 'Open questions: robustness under geometric complexity and modality shift, the
    gap from executable code to engineering-ready design, reliability of learned judges,
    and independent reproduction across deployment environments remain verification
    gaps.'
  related_work_outline_zh:
  - 主流方向：可运行CAD系统正围绕可编辑参数化CAD程序的端到端生成与评测汇聚，输入包括文本、图像、网格、草图和点云，并开始引入智能体交互。
  - 研究共性：将CAD构造分解为可执行程序或构建序列，并通过几何保真度、可执行性、有效性以及工程意图信号进行监督或优化。
  - 关键差异：任务范围包括文本到CAD、几何到CAD、多模态多任务与交互式澄清；监督方式包括SFT、RL、排序接地和混合优化；评测目标从几何指标延伸到可制造性、可装配性。
  - 趋势演进：高相关论文集中在2026年，所见趋势属于当前前沿窗口：从单一重建走向统一多模态与智能体系统，从几何有效性走向工程就绪度。
  - 开放问题：复杂几何与模态转换下的鲁棒性、从可执行代码到工程可用设计的缺口、评测器可靠性，以及跨团队独立复现与部署仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal CAD benchmarks and evaluation protocols
      what_it_solves: Provides standardized evaluation across text, image, mesh, sketch,
        and point cloud inputs; tracks executability, geometric fidelity, program
        compactness, and design intent.
      what_remains_open: Metric ranking stability, robustness under modality shift,
        learned judge reliability, and transfer from benchmark settings to deployment
        remain unproven.
    - line: Text-to-CAD program generation
      what_it_solves: Converts natural language specifications into executable parametric
        CAD scripts while aligning object-level structure and part-level parameters.
      what_remains_open: Structural consistency and parameter accuracy under complex
        or ambiguous specifications remain open, as does fine-grained engineering
        readiness.
    - line: Geometry-to-CAD reverse engineering
      what_it_solves: Recovers editable parametric CAD construction sequences from
        meshes, images, or point clouds using stepwise fitting or hybrid optimization.
      what_remains_open: Scaling to high geometric complexity, covering richer operation
        sets, and avoiding invalid programs for complex designs remain unresolved.
    - line: Unified multi-task multimodal CAD modeling
      what_it_solves: Handles heterogeneous CAD tasks such as reconstruction, generation,
        and question answering in a single end-to-end multimodal framework.
      what_remains_open: Cross-task and cross-modality generalization beyond the training
        benchmarks is not yet independently established.
    - line: Agentic and interactive CAD generation
      what_it_solves: Audits ambiguous user prompts and asks targeted clarification
        questions before CAD code synthesis to improve generation robustness.
      what_remains_open: Interaction overhead, system complexity, and robustness of
        the clarifying agent in user-specific deployment settings are still open.
    consensus:
    - Executable parametric CAD programs are a common intermediate representation
      because they preserve editability.
    - Executability, validity, and geometric fidelity are shared evaluation signals
      across generation and reconstruction systems.
    - Recent systems expose a cascading failure pattern from executable code to valid
      geometry to engineering-ready design.
    - Beyond supervised fine-tuning, systems increasingly use reinforcement learning,
      ranking-based supervision, or geometry-driven optimization to align programs
      with structure and geometry.
    - Benchmark evidence distinguishes specialized CAD models from general vision-language
      models under idealized inputs.
    disagreements:
    - 'Task scope differs: some systems focus on text-to-CAD, others on mesh/image/point-to-CAD
      reconstruction, and others pursue unified multimodal multi-task handling.'
    - 'Representation choices differ: construction-tree sequences, direct B-Rep primitive
      grounding, and CadQuery script generation are used across systems.'
    - 'Supervision and optimization differ: supervised fine-tuning, reinforcement
      learning, perturbed parameter ranking, and IoU-driven hybrid optimization are
      distinct strategies.'
    - 'Evaluation targets differ: some work emphasizes geometric fidelity and validity,
      while others add manufacturability, functionality, and assemblability.'
    - 'Interaction mode differs: one-shot generation is common, but agentic work argues
      for proactive clarification before code synthesis.'
    open_questions:
    - How robust are current systems under geometric complexity and distribution shift?
      Evidence from CADBench shows degradation with complexity and brittleness under
      modality shift.
    - How can text-to-CAD systems move from executable code to engineering-ready output?
      MUSE evidence shows limited success on fine-grained engineering criteria.
    - How reliable are learned evaluation judges and metric rankings for design intent,
      manufacturability, and assemblability?
    - What are the independent reproduction and deployment gaps given missing code,
      dataset, metric, baseline, and limitation details in the packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD基准与评测协议
      解决的问题: 跨文本、图像、网格、草图和点云输入提供标准化评测，覆盖可执行性、几何保真度、程序紧凑性与设计意图。
      尚未覆盖: 指标排名稳定性、模态转换鲁棒性、评测器可靠性，以及从基准迁移到实际部署的有效性尚未证实。
    - 路线: 文本到CAD程序生成
      解决的问题: 将自然语言规格转换为可执行参数化CAD脚本，并对齐对象级结构和部件级参数。
      尚未覆盖: 复杂或模糊规格下的结构一致性和参数准确性仍有缺口，细粒度工程就绪度也未解决。
    - 路线: 几何到CAD逆向重建
      解决的问题: 从网格、图像或点云中通过逐步拟合或混合优化恢复可编辑的参数化CAD构建序列。
      尚未覆盖: 高几何复杂度、更丰富的操作集覆盖，以及复杂设计中避免无效程序仍然开放。
    - 路线: 统一多模态多任务CAD建模
      解决的问题: 在单一端到端多模态框架中处理重建、生成和问答等异构CAD任务。
      尚未覆盖: 训练基准之外的跨任务、跨模态泛化尚未被独立验证。
    - 路线: 智能体与交互式CAD生成
      解决的问题: 在CAD代码合成前审核模糊用户提示并提出有针对性的澄清问题，以提升生成鲁棒性。
      尚未覆盖: 交互开销、系统复杂度，以及澄清智能体在用户特定部署场景中的鲁棒性仍不清楚。
    共识:
    - 可执行参数化CAD程序是多条路线共同采用的中间表示，因为它保留可编辑性。
    - 可执行性、有效性和几何保真度是生成与重建系统共享的评测信号。
    - 近期系统暴露出从可执行代码到有效几何再到工程就绪设计的级联失败模式。
    - 除监督微调外，越来越多系统使用强化学习、排序监督或几何驱动优化来对齐程序、结构和几何。
    - 基准证据区分了专用CAD模型与通用视觉语言模型在理想化输入下的表现。
    分歧:
    - 任务范围不同：有的专注文本到CAD，有的专注网格/图像/点云到CAD重建，还有的追求统一多模态多任务处理。
    - 表示选择不同：构建树序列、直接B-Rep基元接地和CadQuery脚本生成在不同系统中分别使用。
    - 监督与优化不同：监督微调、强化学习、扰动参数排序和IoU驱动混合优化是不同策略。
    - 评测目标不同：有的强调几何保真度和有效性，有的加入可制造性、功能性和可装配性。
    - 交互模式不同：一次性生成常见，但智能体路线主张在代码合成前主动澄清。
    开放问题:
    - 当前系统在几何复杂度和分布偏移下有多鲁棒？CADBench证据显示重建质量随复杂度下降，CAD专用模型在模态转换下脆弱。
    - 文本到CAD系统如何从可执行代码跨越到工程就绪设计？MUSE证据显示在细粒度工程准则上仍很有限。
    - 学习型评测器和指标排名对设计意图、可制造性和可装配性的可靠性如何？
    - 鉴于包内存在代码、数据集、指标、基线和限制说明缺失，独立复现与跨团队部署的验证缺口是什么？
