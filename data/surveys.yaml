  related_work_outline:
  - 'Mainstream direction: The evidence is dominated by 2026 programmatic/text-to-CAD
    generation and benchmark construction, not by formal geometric theory alone.'
  - 'Shared research pattern: Systems map text, images, meshes, or point clouds to
    executable CAD programs or editable B-Reps and evaluate via geometric fidelity,
