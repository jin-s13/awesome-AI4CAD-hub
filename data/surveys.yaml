      尚未覆盖: 复杂设计仍出现无效程序比例，多数证据未说明限制；真实扫描或工业网格迁移未验证。
    - 路线: 统一多模态多任务CAD建模
      解决的问题: 在单一框架中处理点云到CAD重建、文本/图像到CAD生成和CAD问答等异构任务。
      尚未覆盖: 跨基准覆盖与可复现工件有限；多模态任务相互干扰的显式限制证据不足。
    - 路线: 视觉语言CAD代码生成
      解决的问题: 利用视觉语言模型从图像生成可编辑CAD代码，并用大规模图像-代码对训练。
