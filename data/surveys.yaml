  - 'Mainstream direction: The current frontier focuses on unifying programmatic CAD
    generation with multimodal inputs (text, image, point cloud) within benchmark-driven
    evaluations, emphasizing geometric fidelity, parametric editability, and engineering
    feasibility.'
  - 'Shared research pattern: Most works decompose the problem into representation
    choice (B-Rep, parametric patches, CadQuery scripts), generation architecture
    (LLM, state space model, GAN), and evaluation protocol (executability, geometric
    similarity, manufacturability).'
  - 'Key differences: Works diverge on whether to prioritize pure geometric reconstruction,
    engineering constraints (MUSE vs. CADBench), or interaction robustness (ProCAD);
    they also differ in how they handle ambiguous inputs, with some using proactive
    clarification and others assuming a clean specification.'
  - 'Trend evolution: Within the 2026 evidence, the trend is shifting from mesh-to-CAD
    reconstruction toward text-to-CAD and multi-modal CAD, with a growing emphasis
    on industrial part families, scalable benchmarks, and bridging the gap between
    coarse geometry and precise parametric programs.'
  - 'Open questions: How to formalize the relationship between geometric complexity
    and model failure modes; whether benchmarks can capture design intent beyond surface
    metrics; and how to achieve generalization to unseen part families while maintaining
    engineering constraints.'
  related_work_outline_zh:
  - 主流方向：当前前沿聚焦于在基准驱动的评估中，将程序化CAD生成与多模态输入（文本、图像、点云）统一起来，强调几何保真度、参数化可编辑性和工程可行性。
  - 研究共性：多数工作将问题分解为表示选择（B-Rep、参数化面片、CadQuery脚本）、生成架构（LLM、状态空间模型、GAN）和评估协议（可执行性、几何相似度、可制造性）。
  - 关键差异：工作在上侧重于几何重建还是工程约束上存在分歧（如MUSE与CADBench），在交互方式上，有的引入主动澄清，有的假设输入清晰；表示层面对CadQuery脚本与参数化曲面也有不同选择。
  - 趋势演进：在2026年证据中，趋势正从网格到CAD重建转向文本到CAD和多模态CAD，越来越强调工业零件族、可扩展基准，以及弥合粗糙几何与精确参数化程序之间的鸿沟。
  - 开放问题：如何形式化几何复杂性与模型失败模式之间的关系；基准能否捕捉表面度量之外的设计意图；如何在保持工程约束的同时实现对未见零件族的泛化。
  literature_review:
    line_of_work_matrix:
    - line: Benchmarking and evaluation frameworks
      what_it_solves: Provides standardized tasks, metrics, and controlled analysis
        to surface failure modes of CAD generation models under varying geometric
        complexity and modality shifts.
      what_remains_open: Unclear whether current benchmarks drive models toward engineering-valid
        designs or merely optimize for surface metrics; limited generalization to
        unseen part families even after fine-tuning.
    - line: Representation-driven generative modeling
      what_it_solves: Explores alternative CAD representations (B-Rep primitives,
        parametric Bézier patches, state space models) to handle longer sequences,
        editability, and training from unannotated 3D data.
      what_remains_open: Formal guarantees that the representation preserves topological
        consistency and captures complex operations (sweeps, lofts) remain absent;
        scalability to highly complex assemblies is untested.
    - line: Interactive and structured reasoning
      what_it_solves: Introduces hierarchical decomposition, structure alignment,
        and proactive clarification to improve structural consistency and parameter
        accuracy in text-to-CAD generation.
      what_remains_open: The interaction overhead, optimal question strategy, and
        whether alignment training truly prevents shortcut learning are not formally
        analyzed; impact on designer workflow is unexplored.
    consensus:
    - Parametric CAD (B-Rep and programmatic scripts) is the preferred representation
      for industrial-grade editable models.
    - Language models and multi-modal encoders can generate coarse CAD geometry but
      consistently fail to capture fine-grained parameters and complex operations,
      resorting to simplified sketch-and-extrude patterns.
    - Evaluation must go beyond executability and Chamfer distance to include engineering-aware
      criteria such as manufacturability, assemblability, and functional intent.
    - Modality shift and geometric complexity induce a degradation in reconstruction
      quality, with model rankings changing across different metrics.
    disagreements:
    - Some works treat the input as a clean, unambiguous specification (idealized
      images or structured text), while others explicitly model and resolve ambiguity
      through clarification loops.
    - 'Evaluation design varies: one line emphasizes diagnostic failure mode analysis
      across geometric strata (CADBench), another adds design-specific rubrics and
      VLM judges for engineering intent (MUSE), and a third focuses on industrial
      part family coverage and code editing (BenchCAD).'
    - Generative approaches split between direct script generation (LLM fine-tuned
      on CadQuery), latent space generation with GAN decoding, and differentiable
      surface fitting from point clouds, each with different assumptions about annotation
      requirements and editability.
    open_questions:
    - Can a unified theoretical framework reconcile geometric fidelity metrics with
      engineering feasibility scores, given that model rankings change across these
      axes?
    - What formal properties of CAD representations allow models to generalize to
      unseen part families, and how should benchmarks measure this generalization
      beyond hold-out sets?
    - How can the trade-off between interaction cost and robustness in proactive clarification
      be formalized, and what constitutes an optimal set of clarification questions?
    - Under what conditions do models substitute complex design operations with simpler
      ones, and can this be predicted from geometric complexity or training data distribution?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准测试与评估框架
      解决的问题: 提供标准化任务、指标和可控分析，揭示CAD生成模型在不同几何复杂度和模态转换下的失败模式。
      尚未覆盖: 当前基准是否能推动模型生成工程上有效的设计，还是仅优化表面度量，尚不明确；即使微调后，对未见零件族的泛化仍然有限。
    - 路线: 表示驱动的生成建模
      解决的问题: 探索替代CAD表示（B-Rep基元、参数化贝塞尔面片、状态空间模型），以处理更长序列、可编辑性以及从无标注3D数据训练。
      尚未覆盖: 缺乏形式化保证，证明表示能够保持拓扑一致性并捕获复杂操作（扫掠、放样）；对高度复杂装配的可扩展性未经测试。
    - 路线: 交互式与结构化推理
      解决的问题: 引入层次分解、结构对齐和主动澄清，以提高文本到CAD生成中的结构一致性和参数准确性。
      尚未覆盖: 交互开销、最佳提问策略以及对齐训练是否真正防止捷径学习，尚未形式化分析；对设计者工作流的影响尚未探索。
    共识:
    - 参数化CAD（B-Rep和程序化脚本）是工业级可编辑模型的首选表示。
    - 语言模型和多模态编码器可以生成粗糙的CAD几何体，但一直无法捕获精细参数和复杂操作，倾向于使用简化的草图-拉伸模式。
    - 评估必须超越可执行性和Chamfer距离，纳入工程感知标准，如可制造性、可装配性和功能意图。
    - 模态转换和几何复杂度会导致重建质量下降，且模型排名在不同指标间变化。
    分歧:
    - 一些工作将输入视为干净、无歧义的规范（理想化图像或结构化文本），而另一些则通过澄清循环显式建模并解决歧义。
    - 评估设计存在差异：一条路线强调跨几何分层的诊断性失败模式分析（CADBench），另一条添加设计专用评分标准和VLM评判器以评估工程意图（MUSE），还有一条侧重于工业零件族覆盖率和代码编辑（BenchCAD）。
    - 生成方法在直接脚本生成（基于CadQuery的LLM微调）、潜在空间生成与GAN解码、以及从点云进行可微曲面拟合之间分化，各有不同的标注需求和可编辑性假设。
    开放问题:
    - 鉴于模型排名在不同度量轴上变化，能否建立一个统一的理论框架来调和几何保真度度量与工程可行性评分？
    - CAD表示的哪些形式属性使得模型能够泛化到未见零件族，以及基准测试应如何衡量这种超越保留集的泛化？
    - 如何形式化主动澄清中交互成本与鲁棒性之间的权衡，什么构成一组最优的澄清问题？
    - 在什么条件下模型会用更简单的操作替代复杂设计操作，这能否从几何复杂度或训练数据分布中预测？
