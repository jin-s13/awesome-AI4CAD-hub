    - 'Interaction mode: proactive clarification before code synthesis contrasts with
      direct end-to-end generation without user interaction.'
    open_questions:
    - How well do CAD systems maintain geometric fidelity and engineering manufacturability
      under ambiguous real-world prompts and input modality changes?
    - Are VLM judges and rubrics reliable enough to replace or augment human engineering
      evaluation for manufacturable CAD?
    - Can LLM-generated parametric programs generalize to complex B-Rep assemblies
      beyond the six benchmark families shown in the evidence?
    - What proactive clarification budget balances robustness gains against interaction
