  related_work_outline:
  - 'Mainstream direction: Building multimodal, engineering-intent-aware benchmarks
    that unify evaluation of CAD program generation from text, images, and 3D data,
    shifting from geometry-only metrics to functional and manufacturability assessment.'
  - 'Shared research pattern: All new benchmarks adopt a pipeline of CAD program synthesis
    (e.g., CadQuery) and employ multi-stage evaluation protocols (code check, geometric
    check, design-intent alignment) to isolate failure modes.'
  - 'Key differences: Benchmarks differ in their evaluation focus: CADBench emphasizes
    multimodal geometric fidelity; MUSE targets manufacturability, functionality,
    and assemblability; UniCAD unifies multiple tasks; generation methods vary in
    architecture and interaction design.'
  - 'Trend evolution: From early single-modal, geometry-only benchmarks (DeepCAD,
    Fusion 360) to unified multimodal benchmarks with design-intent metrics; 2026
    sees a surge of VLM-based judges and proactive clarification frameworks.'
  - 'Open questions: Can benchmarks cover interactive iterative design and user clarification?
    How reliable are VLM judges for engineering constraints? Why do model rankings
    flip across metrics and benchmarks?'
  related_work_outline_zh:
  - 主流方向：构建多模态且感知工程意图的基准，统一评估从文本、图像、点云生成可编辑CAD程序的能力，从纯几何指标转向功能性与可制造性评估。
  - 研究共性：所有新基准均采用CAD程序合成管道（如CadQuery），并通过多阶段评估协议（代码检查、几何检查、设计意图对齐）分离失败模式。
  - 关键差异：基准在评估重点上不同：CADBench侧重多模态几何保真度，MUSE侧重可制造性/功能性/可装配性，UniCAD统一多任务，生成方法则在架构和交互设计上各异。
  - 趋势演进：从早期单模态、仅几何指标的基准（DeepCAD、Fusion 360）演进到统一多模态、具有设计意图指标的基准；2026年涌现出基于VLM的评判器和主动澄清框架。
  - 开放问题：基准能否覆盖交互式迭代设计与用户澄清？VLM评判器对工程约束的可靠性如何？模型排名在不同指标和基准间为何翻转？
  literature_review:
    line_of_work_matrix:
    - line: Multimodal CAD program generation benchmarks (e.g., CADBench, UniCAD)
      what_it_solves: Provides unified tasks and datasets that compare CAD generation
        across diverse input modalities (images, point clouds, text) and output representations,
        enabling consistent model ranking.
      what_remains_open: Do not model interactive clarification or iterative design
        common in real CAD workflows; model rankings can flip across metrics, and
        benchmark coverage of long, complex parametric sequences remains limited.
    - line: Engineering-intent evaluation benchmarks (e.g., MUSE)
      what_it_solves: Extends evaluation beyond geometric fidelity to manufacturability,
        functionality, and assemblability by using design specifications and VLM-based
        judges, bringing assessment closer to real-world engineering requirements.
      what_remains_open: VLM judge reliability is validated only on limited domains;
        coverage of all manufacturing constraints is incomplete, and human agreement
        with VLM scores may degrade for out-of-distribution designs.
    - line: Generation methods with their own evaluation practices (e.g., FutureCAD,
        ProCAD, CADFit, Mamba-CAD)
      what_it_solves: Introduces new datasets and metrics (Chamfer distance, invalidity
        ratio, clarification robustness) that probe specific aspects like long-sequence
        modeling, interactive ambiguity resolution, and hybrid optimization accuracy.
      what_remains_open: Lack of a shared benchmark makes cross-method comparison
        difficult; results often depend on implementation details and compute budgets
        that are not standardized.
    consensus:
    - All works agree that evaluation must move beyond geometric similarity to capture
      engineering usability, such as program executability and design-intent compliance.
    - CAD program synthesis (e.g., CadQuery scripts) is the dominant output representation,
      as it enables editability and integration with parametric CAD tools.
    - Multi-stage evaluation protocols (code check, geometry check, intent alignment)
      are necessary to isolate failures at different stages of the generation pipeline.
    disagreements:
    - Some benchmarks prioritize geometric fidelity metrics (Chamfer, IoU) while others
      argue that functional and manufacturability criteria are more important for
      real-world deployment.
    - 'Input modality coverage varies: CADBench and UniCAD support multimodal inputs,
      while MUSE and ProCAD focus on text-to-CAD, leading to different trade-offs
      between generality and depth.'
    - The use of VLM-based judges for design intent is contested; some works rely
      on deterministic geometric metrics, while MUSE advocates for VLM judges, but
      their engineering reliability remains unproven outside benchmark datasets.
    - 'Interaction mode differs: ProCAD introduces proactive clarification, whereas
      most benchmarks assume a single-shot generation without user feedback loops.'
    open_questions:
    - How can benchmarks incorporate interactive clarification and iterative refinement
      without incurring prohibitive human evaluation costs?
    - Are VLM-based engineering judges robust across diverse design domains and manufacturing
      standards, or do they overfit to the rubrics used in their training?
    - What causes model rankings to change across different geometric metrics and
      benchmarks, and how should practitioners choose a metric for a given downstream
      task?
    - Do the current datasets and benchmarks adequately represent the long-tail complexity
      of real-world CAD models, especially those with hundreds of parametric features?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态CAD程序生成基准（如CADBench、UniCAD）
      解决的问题: 提供统一任务与数据集，比较不同输入模态（图像、点云、文本）和输出表示下的CAD生成能力，实现一致的模型排名。
      尚未覆盖: 未建模真实CAD工作流中的交互式澄清或迭代设计；模型排名在不同指标间可能翻转，且对长复杂参数化序列的覆盖有限。
    - 路线: 工程意图评估基准（如MUSE）
      解决的问题: 将评估从几何保真度扩展到可制造性、功能性和可装配性，通过设计规范和基于VLM的评判器，使评估更贴近实际工程需求。
      尚未覆盖: VLM评判器的可靠性仅在有限领域验证；制造约束覆盖不完整，人类评分与VLM评分在分布外设计上的一致性可能下降。
    - 路线: 附带自身评估实践的生成方法（如FutureCAD、ProCAD、CADFit、Mamba-CAD）
      解决的问题: 引入新数据集和指标（Chamfer距离、无效比率、澄清鲁棒性），探测长序列建模、交互式歧义消解和混合优化精度等特定方面。
      尚未覆盖: 缺乏共享基准导致跨方法比较困难；结果往往依赖于未标准化的实现细节和算力预算。
    共识:
    - 所有工作都认同评估需超越几何相似性，捕捉工程可用性，如程序可执行性和设计意图符合度。
    - CAD程序合成（如CadQuery脚本）是主流输出表示，因其可编辑且能与参数化CAD工具集成。
    - 多阶段评估协议（代码检查、几何检查、意图对齐）对于分离生成管道不同阶段的失败是必要的。
    分歧:
    - 一些基准优先考虑几何保真度指标（Chamfer、IoU），而另一些认为功能性和可制造性标准对实际部署更重要。
    - 输入模态覆盖范围不同：CADBench和UniCAD支持多模态输入，MUSE和ProCAD专注于文本到CAD，导致通用性与深度之间的不同权衡。
    - 使用VLM评判器评估设计意图存在争议；部分工作依赖确定性几何指标，而MUSE主张VLM评判器，但其在基准数据集之外的工程可靠性尚未证实。
    - 交互模式不同：ProCAD引入主动澄清，而大多数基准假设单次生成，无用户反馈循环。
    开放问题:
    - 基准如何在不产生过高人工评估成本的情况下纳入交互式澄清和迭代改进？
    - 基于VLM的工程评判器在不同设计领域和制造标准下是否鲁棒，还是会过拟合到其训练所用的评分标准？
    - 什么原因导致模型排名在不同几何指标和基准间变化，实践者应如何为给定下游任务选择指标？
    - 当前数据集和基准是否充分代表了真实世界CAD模型的长尾复杂性，尤其是那些具有数百个参数化特征的模型？
