  literature_review:
    line_of_work_matrix:
    - line: End-to-end multimodal CAD program generation
      what_it_solves: Converts text, image, sketch, and point-cloud inputs into executable
        parametric CAD programs using large multimodal models or code-generating pipelines.
      what_remains_open: Robustness under input modality shift and geometric complexity,
        and engineering validity beyond program executability remain unproven.
    - line: Parametric mesh or point-to-CAD reverse engineering
      what_it_solves: Recovers editable CAD construction sequences from observed geometry
        through incremental operation fitting and geometric feedback.
      what_remains_open: Invalid program ratios and coverage for complex designs,
        operation sets, and dataset or kernel transfer are not fully resolved.
    - line: Unified CAD benchmarks and evaluation protocols
      what_it_solves: Provides standardized evaluation across datasets, input modalities,
        geometric metrics, code executability, and engineering design-intent rubrics.
      what_remains_open: Code and dataset artifact availability plus independent reproduction
        are verification gaps; judge reliability and metric sensitivity need further
        evidence.
    - line: Agentic grounding and proactive clarification
      what_it_solves: Aligns natural language specifications to geometric entities
        or parameters and asks targeted clarification questions before code synthesis
        to reduce ambiguity.
      what_remains_open: Interaction overhead, kernel generalization, and performance
        outside curated text-to-CadQuery or grounding datasets are unclear.
    consensus:
    - CAD generation is increasingly treated as executable program synthesis over
      procedural or hierarchical construction sequences.
    - Evaluation requires complementary signals spanning geometric fidelity, executability
      or validity, and engineering design intent such as manufacturability or assemblability.
    - Structure/parameter grounding or stepwise feedback improves consistency and
      reduces invalid outputs relative to direct sequence prediction.
    - 'Failures cascade across stages: executable code may still yield invalid geometry
      or fail engineering requirements.'
    disagreements:
    - Representation and task scope vary from specialized single-modality CAD generation
      to unified multimodal multi-task CAD systems.
    - 'Optimization differs: hybrid geometric feedback/IoU-driven reconstruction versus
      supervised fine-tuning with reinforcement learning versus proactive agentic
      clarification.'
    - 'Grounding mechanism differs: hierarchical structure alignment and parameter
      perturbation, text-based B-Rep primitive grounding, or stepwise intermediate
      geometry comparison.'
    - 'Evaluation target differs: geometric fidelity and program validity versus manufacturability,
      functionality, and assemblability judged by a VLM.'
    - 'Interaction mode differs: proactive clarification before generation versus
      end-to-end automatic synthesis without disambiguation.'
    open_questions:
    - Can current systems transfer across CAD kernels, datasets, and infrastructure
      environments? Supplied evidence lacks independent reproduction artifacts and
      deployment details.
    - How stable are model rankings under metric choice, input modality shift, and
      B-rep face-count complexity? Evidence shows rankings change across metrics and
      specialized models are brittle under modality shift.
    - Can VLM-based design-intent judges reliably substitute for or complement human
      engineering review? Human validation is mentioned but not fully demonstrated.
    - What is the acceptable trade-off between proactive clarification and automation
      across real workflows? Evidence shows low interaction overhead in one curated
      setting, but generalization is unknown.
    - 'Where exactly do failure cascades begin for complex assemblies: code generation,
      geometry validity, or design-intent alignment? Current metrics capture stages
      separately but root causes remain open.'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端多模态CAD程序生成
      解决的问题: 利用大型多模态模型或代码生成流水线，将文本、图像、草图、点云输入转换为可执行参数化CAD程序。
      尚未覆盖: 输入模态偏移和几何复杂度下的鲁棒性尚未证明，超出程序可执行性的工程有效性也未保证。
    - 路线: 参数化网格或点云到CAD逆向工程
      解决的问题: 通过增量操作拟合和几何反馈，从观测几何中恢复可编辑CAD构建序列。
      尚未覆盖: 复杂设计、操作集覆盖、跨数据集与内核迁移下的无效程序比例仍未完全解决。
    - 路线: 统一CAD基准与评测协议
      解决的问题: 在数据集、输入模态、几何指标、代码可执行性和工程设计意图评分标准之间提供标准化评测。
      尚未覆盖: 代码/数据集工件可用性与独立复现仍是验证缺口；评判器可靠性和指标敏感性需要更多证据。
    - 路线: 智能体式接地与主动澄清
      解决的问题: 将自然语言规格对齐到几何实体或参数，并在代码合成前提出针对性澄清问题以减少歧义。
      尚未覆盖: 交互开销、内核泛化，以及在精选的文本到CadQuery或接地数据集之外的性能尚不明确。
    共识:
    - CAD生成越来越被视为对程序化或层次化构建序列的可执行程序合成。
    - 评测需要互补信号，覆盖几何保真度、可执行性/有效性，以及可制造性或可装配性等工程设计意图。
    - 结构/参数接地或逐步反馈相比直接序列预测能提升一致性并减少无效输出。
    - 失败会跨阶段级联：可执行代码仍可能产生无效几何或无法满足工程需求。
    分歧:
    - 表示与任务范围不同：从专用单模态CAD生成到统一多模态多任务CAD系统。
    - 优化方式不同：混合几何反馈/IoU驱动重建、监督微调加强化学习，或主动智能体澄清。
    - 接地机制不同：层次结构对齐和参数扰动、基于文本的B-Rep基元接地，或逐步中间几何比较。
    - 评测目标不同：几何保真度和程序有效性，或由VLM评判的可制造性、功能性、可装配性。
    - 交互模式不同：生成前主动澄清，或端到端自动合成且无须消歧。
    开放问题:
    - 当前系统能否跨CAD内核、数据集和基础设施环境迁移？证据中缺少独立复现工件和部署细节。
    - 在指标选择、输入模态偏移与B-rep面数复杂度下，模型排名有多稳定？证据显示排名随指标变化，专用模型在模态偏移下脆弱。
    - 基于VLM的设计意图评判器能否替代或补充人工工程审查？有人工验证但没有完全展示。
    - 真实工作流中主动澄清与自动化之间的可接受权衡是什么？证据在一个精选设置中交互开销低，但泛化未知。
    - 复杂装配体的失败级联从何处开始：代码生成、几何有效性还是设计意图对齐？当前指标分阶段捕捉，但根因仍开放。
