  related_work_outline:
  - 'Mainstream direction: Multi-modal large language models and hybrid optimization
    pipelines are the dominant paradigm for generating parametric CAD programs from
    text, images, and 3D data.'
  - 'Shared research pattern: Most works adopt a two-stage pipeline—first reasoning
    about the construction sequence or specification, then generating or fitting executable
    CAD code with iterative refinement.'
  - 'Key differences: Methods diverge on interaction mode (one-shot generation vs.
    proactive clarification), optimization strategy (end-to-end learning vs. stepwise
    geometric fitting), and evaluation criteria (geometric fidelity vs. engineering
    manufacturability).'
  - 'Trend evolution: Recent work (2026) shifts from singular task benchmarks toward
    unified multi-modal, multi-task benchmarks and from purely geometric metrics toward
    engineering-aware evaluation of functionality and assemblability.'
  - 'Open questions: How to close the gap between idealized input modalities and real-world,
    noisy engineering data; whether current metrics truly capture design intent; and
    how to achieve robust generalization across geometric complexity and modality
    shifts.'
  related_work_outline_zh:
  - 主流方向：多模态大语言模型与混合优化流水线是从文本、图像和三维数据生成参数化CAD程序的主导范式。
  - 研究共性：多数工作采用两阶段流水线——先推理构建序列或规格说明，再生成或拟合可执行CAD代码并迭代优化。
  - 关键差异：方法在交互模式（一次性生成 vs. 主动澄清）、优化策略（端到端学习 vs. 逐步几何拟合）和评估标准（几何保真度 vs. 工程可制造性）上存在分歧。
  - 趋势演进：近期（2026年）工作从单一任务基准转向统一多模态多任务基准，从纯几何度量转向面向功能性和可装配性的工程感知评估。
  - 开放问题：如何弥合理想化输入模态与真实世界噪声工程数据之间的差距；当前度量标准是否真正捕捉了设计意图；以及如何在几何复杂度和模态迁移下实现鲁棒泛化。
  literature_review:
    line_of_work_matrix:
    - line: Text-to-CAD program generation via LLM
      what_it_solves: Translating natural language descriptions into parametric CAD
        scripts (e.g., CadQuery) by leveraging pre-trained language models, often
        with hierarchical reasoning or clarification sub-modules to improve structural
        consistency and parameter accuracy.
      what_remains_open: Reliance on curated text–CAD pairs; limited generalization
        to ambiguous or underspecified industrial prompts; failure cascade from executable
        code to valid geometry to engineering-ready design.
    - line: Mesh/Image-to-CAD reverse engineering
      what_it_solves: Reconstructing editable parametric CAD construction sequences
        from unstructured 3D data (meshes, point clouds, images) through iterative
        operation fitting and geometric validation, enabling downstream editing and
        manufacturing.
      what_remains_open: Brittleness under modality shift (e.g., real-world scans
        vs. synthetic renderings); degradation with increasing geometric complexity;
        assumption of a closed set of primitive operations.
    - line: Unified multi-modal multi-task CAD models
      what_it_solves: A single end-to-end model that ingests text, images, sketches,
        and point clouds to perform multiple CAD tasks (reconstruction, generation,
        question answering) under a unified architecture and benchmark.
      what_remains_open: Whether a unified model can match the fidelity of task-specific
        specialists; the difficulty of scaling training data across heterogeneous
        modalities; evaluation coverage of real-world engineering constraints.
    - line: Benchmarking and evaluation protocols for CAD generation
      what_it_solves: Providing standardized multi-modal datasets, stratified sampling
        by geometric complexity, and multi-faceted metrics (geometric fidelity, executability,
        manufacturability, assemblability) to reveal failure modes and enable fair
        comparison.
      what_remains_open: Metrics do not yet align well with iterative design intent
        and human engineering judgment; many benchmarks still rely on synthetic or
        simplified inputs, and inter-metric ranking inconsistency complicates model
        selection.
    consensus:
    - Parametric CAD programs (B-Rep sequences or script-based representations) are
      the preferred output format because they preserve editability and manufacturing
      intent.
    - Multi-modal input support (text, image, mesh, point cloud) is essential for
      practical CAD assistants, and no single modality dominates all use cases.
    - Existing models, whether specialized or unified, exhibit a cascade of failures
      from code validity to geometric accuracy to engineering-soundness, especially
      under complex or shifted inputs.
    - Carefully designed benchmarks with stratified difficulty and diverse metrics
      are critical for diagnosing model weaknesses beyond aggregate scores.
    disagreements:
    - 'Representation granularity: some methods generate full CAD programs in one
      shot, while others decompose the process into hierarchical or stepwise reasoning
      with intermediate geometric feedback.'
    - 'Supervision and optimization: approaches range from pure supervised fine-tuning
      on static datasets to reinforcement learning with execution feedback, and from
      end-to-end neural generation to hybrid optimization that fits parametric operations
      iteratively.'
    - 'Evaluation target: one group prioritizes geometric fidelity (IoU, Chamfer distance),
      while another emphasizes engineering validity such as executability, manufacturability,
      and assemblability, leading to different model rankings.'
    - 'Interaction mode: most systems assume a single-turn generation pipeline, whereas
      a proactive clarification agent introduces a multi-turn, human-in-the-loop paradigm
      to resolve ambiguous specifications before code synthesis.'
    open_questions:
    - How can text-to-CAD models be made robust to the ambiguity and underspecification
      typical of real-world engineering prompts without excessive human intervention?
    - What is the minimal set of primitive operations and geometric constraints needed
      to reverse-engineer an arbitrary mechanical part from a noisy scan, and how
      does that set affect generalization?
    - Can a unified multi-modal model achieve the same level of geometric detail and
      structural validity as task-specific specialists, and under what training data
      budget?
    - How should evaluation metrics be designed to correlate with downstream tasks
      such as simulation, manufacturing, and design iteration, and how can they be
      scaled without expensive human annotation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于LLM的文本到CAD程序生成
      解决的问题: 利用预训练语言模型将自然语言描述转化为参数化CAD脚本（如CadQuery），常结合层次化推理或澄清子模块以提高结构一致性和参数准确性。
      尚未覆盖: 依赖精心整理的文本-CAD对；对模糊或欠规范的工业提示泛化能力有限；从可执行代码到有效几何再到工程就绪设计存在失败级联。
    - 路线: 网格/图像到CAD的逆向工程
      解决的问题: 通过逐步操作拟合和几何验证，从非结构化三维数据（网格、点云、图像）重建可编辑的参数化CAD构建序列，支持下游编辑与制造。
      尚未覆盖: 在模态迁移（如真实扫描 vs. 合成渲染）下脆弱；随几何复杂度增加性能下降；假设操作基元集是封闭的。
    - 路线: 统一多模态多任务CAD模型
      解决的问题: 单一端到端模型接收文本、图像、草图和点云，在统一架构和基准下执行多种CAD任务（重建、生成、问答）。
      尚未覆盖: 统一模型能否达到任务专用模型的精度尚不明确；跨异构模态的训练数据扩展困难；对真实工程约束的覆盖有限。
    - 路线: CAD生成基准与评估协议
      解决的问题: 提供标准化多模态数据集、按几何复杂度分层采样以及多维度指标（几何保真度、可执行性、可制造性、可装配性），揭示失败模式以实现公平比较。
      尚未覆盖: 指标尚未与迭代设计意图和人类工程判断对齐；许多基准仍依赖合成或简化输入；不同指标间的排名不一致使模型选择复杂化。
    共识:
    - 参数化CAD程序（B-Rep序列或脚本表示）是首选输出格式，因为它保留了可编辑性和制造意图。
    - 多模态输入支持（文本、图像、网格、点云）对实际CAD助手至关重要，没有单一模态能主导所有用例。
    - 现有模型，无论专用还是统一，都表现出从代码有效性到几何精度再到工程完备性的失败级联，尤其在复杂或迁移输入下。
    - 精心设计、带有难度分层和多样化指标的基准对于诊断模型弱点至关重要，不能仅依赖总体分数。
    分歧:
    - 表示粒度：部分方法一次性生成完整CAD程序，而其他方法将过程分解为层次化或逐步推理，并利用中间几何反馈。
    - 监督与优化：路径包括在静态数据集上的纯监督微调、带执行反馈的强化学习，以及从端到端神经生成到迭代拟合参数化操作的混合优化。
    - 评估目标：一派优先考虑几何保真度（IoU、Chamfer距离），另一派强调工程有效性（可执行性、可制造性、可装配性），导致不同的模型排名。
    - 交互模式：多数系统假设单轮生成流水线，而主动澄清智能体引入多轮人机交互范式，在代码合成前解决模糊规格。
    开放问题:
    - 如何使文本到CAD模型对真实工程提示中常见的模糊性和欠规范具有鲁棒性，同时避免过度的人为干预？
    - 从噪声扫描中对任意机械零件进行逆向工程所需的最小操作基元集和几何约束集是什么？该集合如何影响泛化？
    - 统一多模态模型能否在何种训练数据预算下达到与任务专用模型相同的几何细节和结构有效性？
    - 如何设计评估指标，使其与下游任务（如仿真、制造和设计迭代）相关，并在不过度依赖昂贵人工标注的情况下扩展？
