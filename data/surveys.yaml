  related_work_outline_zh:
  - 主流方向：证据集中在基于LLM或智能体的可执行程序化CAD生成，以及面向文本/图像/3D到CAD的统一多模态基准；形式理论仅通过设计规范、参数接地和可制造性评测部分出现。
  - 研究共性：多数工作将CAD输出视为可执行程序或可编辑B-Rep，并按代码有效性、几何保真度、设计意图或可制造性对齐进行分层评测。
  - 关键差异：方法主要在表示方式如参数脚本、B-Rep面片或隐序列，监督来源如文本、图像、点级或澄清交互，以及评测目标如几何、执行、可制造性或交互成本上形成差异。
  - 趋势演进：在2026年密集的前沿证据中，研究正从纯几何生成转向工业级多模态基准和智能体式规格澄清；早期年份在证据包中表现较弱，趋势更接近当前边界内的细化演进。
  - 开放问题：参数接地与B-Rep约束缺乏形式化验证，未见零件族的泛化边界不清，VLM设计意图评判器可靠性不足，代码、数据集和复现工件仍有证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Multimodal and industrial benchmark construction for programmatic CAD
      what_it_solves: Provides controlled comparison across datasets, input modalities,
        metrics, and industrial part families for executable CAD generation.
      what_remains_open: Generalization to unseen part families, VLM-judge reliability,
        artifact availability, and alignment between benchmark metrics and engineering
        use remain unresolved.
    - line: LLM-driven parametric CAD program synthesis and B-Rep grounding
      what_it_solves: Translates text prompts into executable CAD scripts and maps
        natural language to B-Rep primitives or parameters for editable outputs.
      what_remains_open: Fine topology and complex operations such as sweeps or lofts
        are often mistranslated; formal parameter-constraint analysis and broader
        generalization are still missing.
    - line: Representation-centric generative models for CAD sequences or editable
        B-Reps
      what_it_solves: Uses latent sequence models or differentiable parametric patches
        to generate longer CAD sequences and editable solids from weak or unannotated
        supervision.
      what_remains_open: Fair comparison under the same benchmarks and validation
        against manufacturability or engineering constraints are not yet established.
    - line: Design-intent, manufacturability, and assemblability evaluation
      what_it_solves: Adds structured design specifications and engineering rubrics
        beyond geometric similarity to measure functional and assemblable readiness.
      what_remains_open: Rubric coverage, VLM-judge reliability, human verification,
        and dataset diversity are only partially evidenced in the bounded packet.
    - line: Agentic clarification before CAD program synthesis
      what_it_solves: Detects ambiguous prompts and asks targeted clarification questions
        to create more self-consistent specifications before code generation.
      what_remains_open: Interaction overhead, scalability to industrial part families,
        and transfer across CAD languages or input modalities are not yet demonstrated.
    consensus:
    - 'Executability and editability are shared evaluation anchors: generated CAD
      output must be more than an image or mesh.'
    - Current models often recover coarse outer geometry but struggle with fine topology,
      parameter fidelity, and complex operations like sweeps or lofts.
    - Evaluation is moving beyond geometric similarity toward manufacturability, functionality,
      and assemblability.
    - B-Rep or parametric structures and natural-language or visual specifications
      are treated as complementary and require explicit grounding.
    disagreements:
    - 'Representation choice differs: parametric scripts versus direct B-Rep patches
      versus latent sequence representations.'
    - 'Supervision source differs: curated text-to-CAD pairs, multimodal image or
      3D inputs, unannotated point-level data, or agentic clarification traces.'
    - 'Evaluation target differs: geometric fidelity, execution validity, design-intent
      alignment, or interaction efficiency is prioritized differently.'
    - 'Interaction mode differs: one-shot generation is contrasted with proactive
      clarification before generation, shifting where the main failure occurs.'
    open_questions:
    - Which formal assumptions are necessary for text-to-B-Rep grounding and parameter
      constraints to preserve design intent under ambiguity?
    - Do lower Chamfer distance or invalidity-ratio improvements predict engineering-ready
      CAD on unseen industrial part families?
    - How reliable are VLM-based design-intent judges for manufacturability and assemblability,
      and what human validation should support them?
    - What is the generalization boundary after fine-tuning and reinforcement learning
      when testing leaves the benchmark part-family distribution?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向程序化CAD的多模态与工业基准构建
      解决的问题: 在数据集、输入模态、指标和工业零件族之间提供可执行CAD生成的受控比较。
      尚未覆盖: 未见零件族的泛化、VLM评判器可靠性、工件可得性，以及基准指标与工程应用的一致性仍未解决。
    - 路线: LLM驱动的参数化CAD程序合成与B-Rep接地
      解决的问题: 将文本提示转换为可执行CAD脚本，并将自然语言映射到B-Rep基元或参数以生成可编辑输出。
      尚未覆盖: 扫掠、放样等复杂拓扑操作常被错误翻译；参数约束的形式化分析以及超出精选数据集的泛化仍缺失。
    - 路线: 面向CAD序列或可编辑B-Rep的表示中心生成模型
      解决的问题: 利用潜在序列模型或可微分参数面片，从弱监督或无标注监督生成长CAD序列和可编辑实体。
      尚未覆盖: 在相同基准下的公平比较，以及对可制造性或工程约束的验证尚未建立。
    - 路线: 设计意图、可制造性与可装配性评测
      解决的问题: 在几何相似度之外加入结构化设计规范和工程评分标准，衡量功能与可装配就绪程度。
      尚未覆盖: 评分标准覆盖范围、VLM评判器可靠性、人工验证和数据集多样性在证据包中仅有部分支撑。
    - 路线: CAD程序合成前的智能体式澄清
      解决的问题: 识别模糊提示并提出有针对性的澄清问题，在代码生成前形成更自洽的规格。
      尚未覆盖: 交互开销、工业零件族可扩展性，以及跨CAD语言或输入模态的迁移尚未验证。
    共识:
    - 可执行性和可编辑性是共享的评测锚点：生成的CAD输出必须不只是图像或网格。
    - 当前模型通常能恢复粗略外形，但在细部拓扑、参数保真度以及扫掠、放样等复杂操作上仍然吃力。
    - 评测正从纯几何相似度转向可制造性、功能性和可装配性。
    - B-Rep或参数结构与自然语言或视觉规格被视为互补表示，需要显式接地。
    分歧:
    - 表示选择不同：参数脚本、直接B-Rep面片或潜在序列表示之间存在差异。
    - 监督来源不同：精筛文本到CAD对、多模态图像或3D输入、无标注点级数据或智能体澄清轨迹各有侧重。
    - 评测目标不同：几何保真度、执行有效性、设计意图对齐或交互效率的优先级不同。
    - 交互模式不同：一次性生成与主动澄清生成形成对比，二者将主要失败点分别放在代码合成与提示规格阶段。
    开放问题:
    - 在模糊输入下，文本到B-Rep接地和参数约束需要哪些形式假设才能保持设计意图？
    - 更低的Chamfer距离或更低无效率是否能在未见工业零件族上预测工程就绪的CAD？
    - 用于可制造性与可装配性的VLM设计意图评判器有多可靠，应搭配何种人工验证？
    - 当测试超出基准零件族分布时，经过微调和强化学习后的泛化边界在哪里？
