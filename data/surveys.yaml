  literature_review:
    line_of_work_matrix:
    - line: Unified CAD benchmarking and evaluation protocols
      what_it_solves: Provides controlled comparisons across input modalities, geometric
        complexity, and metrics; exposes failure cascades from executable code to
        valid geometry and engineering-ready design.
      what_remains_open: Whether rankings transfer to unseen part families and real
        manufacturing validation; judge and rubric reliability requires independent
        confirmation.
    - line: Programmatic CAD generation with LLM/VLM reasoning
      what_it_solves: Converts text, image, or point inputs into editable parametric
        scripts or B-Rep structures; structural alignment, parameter perturbation,
        and RL improve consistency and fidelity.
      what_remains_open: Complex operations are often replaced by simpler sketch-and-extrude
        features; high-fidelity parameter recovery remains brittle under modality
        shift and geometric complexity.
    - line: Generative sequence modeling for long parametric CAD
      what_it_solves: Learns long CAD sequence generation through reconstruction,
        latent generation, and adversarial objectives rather than only next-token
        program synthesis.
      what_remains_open: Multimodal controllability, interactive editing, and industrial
        task transfer lack direct evidence in the available detail.
    - line: Agent-based specification repair
      what_it_solves: Reduces prompt ambiguity by asking targeted clarification questions
        before code synthesis, improving robustness while keeping interaction overhead
        low.
      what_remains_open: Whether clarification covers deep engineering constraints
        and scales beyond curated text-to-CadQuery settings remains unclear.
    - line: Engineering-intent and manufacturability assessment
      what_it_solves: Extends evaluation beyond geometry to functionality, manufacturability,
        and assemblability using structured design specifications and design-specific
        rubrics.
      what_remains_open: The gap between rubric-based VLM judgment and physical manufacturing
        or assembly validation remains unresolved.
    consensus:
    - Editable B-Rep or parametric CAD representations are treated as the preferred
      output, not meshes alone.
    - General-purpose LLMs/VLMs can recover plausible coarse geometry but often fail
      on fine-grained parameters, complex operations, and unseen part families.
    - Evaluation increasingly uses multi-stage protocols that separate code executability,
      geometric validity, and design-intent or engineering constraints.
    - Controlled dataset diversity and stratification are necessary because model
      rankings and robustness change with modality and geometric complexity.
    disagreements:
    - 'Supervision differs: point-level signals without CAD annotations, curated text-CAD
      pairs, or execution-verified industrial programs.'
    - 'Representation choices differ: parametric surface patches with differentiable
      tessellation, executable program sequences, or latent sequence encodings.'
    - Interaction mode differs between direct one-shot synthesis and agent-mediated
      clarification before generation.
    - Evaluation targets differ across geometric fidelity, program correctness, and
      manufacturable design intent.
    - Model strategy differs between specialized CAD models trained on narrower distributions
      and frontier multimodal LLMs with fine-tuning or RL.
    open_questions:
    - Can models preserve complex operations such as sweeps and lofts instead of simplifying
      them to sketch-and-extrude patterns?
    - Do benchmark rankings and fine-tuned models transfer to unseen part families
      and physical manufacturing validation?
    - How reliable are VLM judges and design-specific rubrics for measuring functionality,
      manufacturability, and assemblability?
    - Does proactive clarification transfer from curated text-to-CadQuery ambiguity
      to broader CAD constraints and interactive workflows?
    - The topic description calls for formal design reasoning and guarantees, but
      the bounded top papers focus on empirical CAD benchmarks; formal conditions
      connecting assumptions to model behavior remain a verification gap.
    - Reproducibility is only partially verifiable because several papers lack visible
      code, dataset, artifact, or limitation details in the provided evidence.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一CAD基准与评测协议
      解决的问题: 在输入模态、几何复杂度和指标上提供受控比较，揭示从代码可执行到有效几何再到工程就绪的失败级联。
      尚未覆盖: 排名能否迁移到未见零件族和真实制造验证；评委与评分标准的可靠性仍需独立确认。
    - 路线: 基于LLM/VLM的程序化CAD生成
      解决的问题: 将文本、图像或点输入转换为可编辑参数脚本或B-Rep结构，通过结构对齐、参数扰动和强化学习提升一致性与保真度。
      尚未覆盖: 复杂操作常被替换为简单的草图-拉伸特征；高保真参数恢复在模态转移和几何复杂度下仍然脆弱。
    - 路线: 长参数化CAD序列的生成建模
      解决的问题: 通过重建、潜在生成和对抗目标学习长CAD序列，不局限于逐步令牌程序合成。
      尚未覆盖: 多模态可控性、交互编辑和工业任务迁移在现有细节中缺少直接证据。
    - 路线: 基于智能体的规格修复
      解决的问题: 在代码合成前提出有针对性的澄清问题，降低提示歧义并提升鲁棒性，同时保持较低交互开销。
      尚未覆盖: 澄清能否覆盖深层工程约束并扩展到精选文本到CadQuery设置之外仍不明确。
    - 路线: 工程意图与可制造性评估
      解决的问题: 通过结构化设计规范和设计特定评分标准，将评测从几何扩展到功能性、可制造性和可装配性。
      尚未覆盖: 基于评分标准的VLM判断与物理制造或装配验证之间的差距仍未解决。
    共识:
    - 可编辑B-Rep或参数化CAD表示被视为优先输出，而不只是网格。
    - 通用LLM/VLM能恢复粗略外形，却在细粒度参数、复杂操作和未见零件族上失败。
    - 评测越来越多采用多阶段协议，区分代码可执行性、几何有效性和设计意图或工程约束。
    - 受控的数据集多样性和分层是必要的，因为模型排名和鲁棒性会随模态与几何复杂度变化。
    分歧:
    - 监督信号不同：点级无CAD标注、精选文本-CAD对或执行验证的工业程序。
    - 表示方式不同：带可微分曲面细分的参数曲面面片、可执行程序序列或潜在序列编码。
    - 交互模式不同：直接一次生成与生成前由智能体澄清。
    - 评测目标不同：几何保真、程序正确性或可制造设计意图。
    - 模型策略不同：面向较窄分布的专用CAD模型与带微调或强化学习的前沿多模态LLM。
    开放问题:
    - 模型能否保留扫掠、放样等复杂操作，而不是将其简化为草图-拉伸模式？
    - 基准排名和微调模型能否迁移到未见零件族及物理制造验证？
    - VLM评审和设计特定评分标准对功能性、可制造性和可装配性的测量可靠性如何？
    - 主动澄清能否从精选文本到CadQuery的歧义场景扩展到更广泛的CAD约束和交互工作流？
