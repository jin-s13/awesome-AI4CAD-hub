  literature_review:
    line_of_work_matrix:
    - line: Formal problem definition and representation
      what_it_solves: Defines CAD generation as a mapping from text, image, or 3D
        data to executable parametric programs or boundary representations, establishing
        foundational assumptions about geometric composition, editability, and the
        role of hierarchical structure and parameter grounding.
      what_remains_open: Whether these formalizations capture the full range of industrial
        design constraints, and how to verify that the defined representations align
        with downstream manufacturing requirements such as functionality and assemblability.
    - line: Benchmarking and evaluation taxonomy
      what_it_solves: Organizes evaluation into hierarchical stages (code correctness,
        geometric fidelity, design-intent alignment) and introduces metrics for manufacturability,
        functionality, and assemblability, revealing failure cascades and model brittleness
        under modality shift and geometric complexity.
      what_remains_open: Generalization to unseen part families remains limited; no
        consensus on unified metrics that balance geometric accuracy, parametric parsimony,
        and engineering feasibility; evaluation still relies on proxy judges rather
        than real-world manufacturing validation.
    - line: Generative model design and scaling
      what_it_solves: Develops architectures (LLMs, state space models, differentiable
        parametric surfaces) and training strategies (supervised fine-tuning, reinforcement
        learning from execution feedback, self-supervised pre-training) to improve
        sequence generation, multi-modal conditioning, and editability.
      what_remains_open: Scaling laws are not empirically mapped; models exhibit brittleness
        under modality shift and geometric complexity; integration of explicit manufacturing
        constraints into generative objectives is missing; generalization to novel
        industrial part families remains poor.
    consensus:
    - Programmatic CAD generation, especially via B-Rep or scripts, is the dominant
      paradigm for achieving editable and precise models.
    - Multi-modal conditioning (text, image, point cloud) is essential for practical
      CAD tools, but the mapping from these modalities to parametric CAD is error-prone
      and often loses fine geometric detail.
    - Current models frequently fail to preserve design intent and underperform when
      evaluated on engineering criteria beyond geometric similarity, exhibiting a
      cascade from executable code to valid geometry to engineering-ready design.
    - Comprehensive benchmarks that expose failure modes (executability, geometric
      fidelity, design alignment) are critical for driving progress, as they reveal
      systematic weaknesses and guide model improvement.
    disagreements:
    - 'Output representation: some works target CadQuery scripts, others B-Rep primitives,
      and others parametric Bézier surfaces, leading to different trade-offs in editability,
      precision, and trainability.'
    - 'Evaluation focus: benchmarks differ in whether they prioritize geometric fidelity,
      compactness, executability, or downstream manufacturability and design intent,
      causing model rankings to change across metrics.'
    - 'Training paradigm: methods split between supervised fine-tuning on curated
      datasets, reinforcement learning from execution feedback, and self-supervised
      pre-training on large unannotated 3D data, with no consensus on which yields
      the best generalization.'
    - 'Interaction model: one line of work assumes unambiguous input and purely generative
      behavior, while another advocates proactive clarification to resolve specification
      ambiguities before generation, trading off latency for robustness.'
    open_questions:
    - How can manufacturing constraints be directly embedded into CAD generation to
      guarantee functional, assemblable outputs beyond geometric validity?
    - What scaling laws govern the relationship between model size, data diversity,
      and generalization to unseen part families or industrial domains?
    - Can a unified evaluation framework be designed that jointly assesses parametric
      accuracy, geometric fidelity, and engineering feasibility without depending
      on brittle proxy metrics?
    - How should formal representations of design intent be operationalized so that
      generated models align with user specifications even when inputs are ambiguous?
