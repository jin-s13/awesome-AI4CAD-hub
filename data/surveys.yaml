  related_work_outline:
  - 'Mainstream direction: LLM-based and sequence-model methods for generating parametric
    CAD programs from text, images, or meshes, with a parallel focus on unified benchmarks
    for evaluating geometric fidelity, executability, and engineering constraints.'
  - 'Shared research pattern: Systems decompose CAD generation into discrete reasoning
    or fitting steps, then apply supervised training, RL, or optimization to align
    geometry with input specifications.'
  - 'Key differences: Methods differ in output representation (CadQuery scripts vs.
    construction sequences vs. B-rep primitives), interaction mode (single-pass vs.
    multi-turn clarification), and evaluation criteria (geometric accuracy vs. manufacturability).'
  - 'Trend evolution: All available evidence is from 2026, showing a concentrated
    frontier shift toward multimodal benchmarks, agent-based clarification, and assessment
    of downstream engineering properties beyond geometry.'
  - 'Open questions: How to achieve robustness under input modality shift, how to
    balance geometric accuracy with functional and assemblability constraints, and
    whether gains transfer from idealized benchmarks to real-world CAD workflows.'
  related_work_outline_zh:
  - 主流方向：基于LLM和序列模型的方法，从文本、图像或网格生成参数化CAD程序，同时并行发展统一基准，评估几何保真度、可执行性与工程约束。
  - 研究共性：系统将CAD生成分解为离散推理或拟合步骤，再通过监督训练、强化学习或优化使几何与输入规格对齐。
  - 关键差异：方法在输出表示（CadQuery脚本 vs 构建序列 vs B-rep基元）、交互模式（单轮 vs 多轮澄清）和评估标准（几何精度 vs 可制造性）上存在分歧。
  - 趋势演进：所有证据均来自2026年，表明前沿集中转向多模态基准、智能体式澄清以及对几何之外的下游工程属性的评估。
  - 开放问题：如何在输入模态转移下保持鲁棒性，如何平衡几何精度与功能性和可装配性约束，以及从理想化基准到真实CAD工作流的迁移能力。
  literature_review:
    line_of_work_matrix:
    - line: Parametric CAD program generation from multimodal inputs
      what_it_solves: Transforms text, images, or meshes into executable CAD scripts
        or construction sequences via LLMs, auto-regressive models, or hybrid optimization.
      what_remains_open: Robustness to ambiguous prompts and modality shift, and whether
        high geometric fidelity on standard benchmarks translates to engineering-ready
        designs.
    - line: Unified and multi-faceted benchmarking for CAD generation
      what_it_solves: Provides standard evaluation suites covering multiple input
        modalities, output metrics, and engineering criteria such as manufacturability
        and assemblability.
      what_remains_open: Whether metric choices and VLM-based judges fully capture
        real-world design intent, and how to prevent benchmark-to-benchmark ordering
        inconsistencies.
    - line: Agent-based and interactive CAD generation
      what_it_solves: Introduces proactive clarification or multi-step reasoning to
        resolve specification ambiguity before code synthesis, improving robustness
        and reducing invalid outputs.
      what_remains_open: How much human interaction is needed, and whether the clarifying
        agent can generalize to novel constraint types without task-specific fine-tuning.
    - line: Sequence modeling architectures for long parametric CAD
      what_it_solves: Applies state-space models or alternative encoders to handle
        long parametric CAD sequences for reconstruction and generation.
      what_remains_open: Evidence that the architecture alone improves downstream
        task performance, as opposed to dataset scale, and how it compares under real-world
        design complexity.
    consensus:
    - Generating parametric CAD programs from natural language or visual inputs is
      a central challenge, and current methods are evaluated primarily on geometric
      fidelity and program executability.
    - Specialized mesh-to-CAD models outperform general-purpose vision-language models
      under idealized input conditions, but their performance degrades under modality
      shift or increasing geometric complexity.
    - Benchmarks reveal a failure cascade from generating executable code to achieving
      valid geometry and finally satisfying fine-grained engineering constraints.
    - Multi-stage approaches—whether through hierarchical reasoning, progressive fitting,
      or agent-based clarification—improve output quality over single-pass generation.
    disagreements:
    - 'Output representation: some methods generate high-level CadQuery scripts, while
      others produce low-level construction sequences or B-rep primitives, leading
      to different editability and precision trade-offs.'
    - 'Evaluation targets: standard benchmarks emphasize volumetric IoU and Chamfer
      distance, whereas newer benchmarks introduce manufacturability, functionality,
      and assemblability rubrics, causing inconsistent model rankings.'
    - 'Interaction paradigm: most systems assume a single turn of input-to-output,
      but ProCAD demonstrates that multi-turn clarification can substantially reduce
      errors, raising the question of whether interactive evaluation should become
      standard.'
    - 'Training strategy: approaches range from supervised fine-tuning alone to reinforcement
      learning, hybrid optimization, and self-supervised pretraining with GANs, with
      no clear evidence on which combination best generalizes.'
    open_questions:
    - How well do models trained on ideal meshes or single-view renders transfer to
      noisy, real-world sensor data from CAD pipelines?
    - Can the gains from multi-turn clarification be achieved without additional human-in-the-loop
      cost, perhaps through automated specification checking?
    - What is the minimal set of metrics that reliably predicts downstream engineering
      success, given that geometric and functional metrics can yield contradictory
      rankings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多模态输入到参数化CAD程序生成
      解决的问题: 通过LLM、自回归模型或混合优化，将文本、图像或网格转换为可执行CAD脚本或构建序列。
      尚未覆盖: 对模糊提示和模态转移的鲁棒性，以及标准基准上的高几何保真度是否转化为工程就绪的设计。
    - 路线: 面向CAD生成的统一与多维度基准测试
      解决的问题: 提供涵盖多种输入模态、输出指标以及可制造性、可装配性等工程准则的标准评估套件。
      尚未覆盖: 指标选择和基于VLM的评判器是否能完全捕捉真实设计意图，以及如何避免跨基准排名不一致。
    - 路线: 基于智能体的交互式CAD生成
      解决的问题: 在代码合成前引入主动澄清或多步推理以解决规格歧义，提高鲁棒性并减少无效输出。
      尚未覆盖: 需要多少人工交互，以及澄清智能体能否在无需任务特定微调的情况下泛化到新的约束类型。
    - 路线: 长序列参数化CAD的序列建模架构
      解决的问题: 应用状态空间模型或替代编码器来处理长参数化CAD序列，用于重建和生成。
      尚未覆盖: 架构本身对下游任务性能的提升究竟有多少，相较于数据集规模，以及在实际设计复杂度下的对比证据。
    共识:
    - 从自然语言或视觉输入生成参数化CAD程序是核心挑战，当前方法主要基于几何保真度和程序可执行性进行评估。
    - 在理想化输入条件下，专用网格到CAD模型优于通用视觉语言模型，但其性能在模态转移或几何复杂度增加时下降。
    - 基准测试揭示了一个从生成可执行代码到获得有效几何，再到满足细粒度工程约束的失败级联。
    - 多阶段方法——无论是通过层次化推理、递进拟合还是基于智能体的澄清——均优于单轮生成。
    分歧:
    - 输出表示：一些方法生成高级CadQuery脚本，另一些则生成低级构建序列或B-rep基元，导致可编辑性和精度的不同权衡。
    - 评估目标：标准基准强调体积IoU和Chamfer距离，而较新的基准引入了可制造性、功能性和可装配性评分标准，导致模型排名不一致。
    - 交互范式：多数系统假设单轮输入到输出，但ProCAD表明多轮澄清可显著减少错误，引发交互式评估是否应成为标准的讨论。
    - 训练策略：从仅监督微调，到强化学习、混合优化和基于GAN的自监督预训练，尚无明确证据表明哪种组合泛化能力最佳。
    开放问题:
    - 在理想网格或单视图渲染上训练的模型，向真实世界含噪传感器数据的迁移能力如何？
    - 多轮澄清的收益能否通过自动化规格检查实现，而不增加额外的人工交互成本？
    - 鉴于几何和功能指标可能产生矛盾排名，能够可靠预测下游工程成功的最小指标集是什么？
