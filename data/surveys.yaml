  related_work_outline_zh:
  - 主流方向：从网格、图像、草图和点云等非CAD输入中恢复可编辑的参数化CAD程序。
  - 研究共性：将CAD作为结构化程序或构建序列建模，并以几何保真度与程序有效性作为核心评测。
  - 关键差异：输入模态、优化或监督策略、程序表示和评测指标是主要分歧维度。
  - 趋势演进：高排名证据集中在2025–2026年，从单任务重建走向统一多模态模型、VLM代码生成和可诊断评估。
  - 开放问题：真实场景泛化、复杂设计失败模式、可复现工件与设计意图鲁棒性仍缺乏系统证据。
  literature_review:
    line_of_work_matrix:
    - line: Mesh-to-parametric CAD reconstruction
      what_it_solves: Reverse engineers meshes into editable parametric CAD construction
        sequences, aiming for geometric fidelity and valid parametric operations.
      what_remains_open: Complex designs still show invalid program ratios, limitation
        details are often missing, and real scanned or industrial mesh generalization
        is unproven.
    - line: Unified multi-modal and multi-task CAD modeling
      what_it_solves: Handles heterogeneous CAD tasks such as point-to-CAD reconstruction,
        text/image-to-CAD generation, and CAD question answering in one framework.
      what_remains_open: Cross-benchmark coverage and reproducibility artifacts remain
        limited, with little explicit limitation evidence for multimodal task interference.
    - line: Visual-language CAD code generation
      what_it_solves: Generates editable CAD code directly from visual input using
        fine-tuned vision-language models and large image-code training sets.
      what_remains_open: Generalization to real-world images and unseen operations
        is only partially demonstrated, leaving out-of-distribution robustness uncertain.
    - line: Program evolution and synthetic CAD data generation
      what_it_solves: Creates complex realistic CAD programs through iterative VLM-guided
        edits and validation, then augments paired training data for image-to-CAD.
      what_remains_open: No limitation details are provided, and generated complexity
        may not cover manufacturing constraints, CAE/CAM readiness, or industrial
        workflows.
    - line: CAD sequence decision making and long-sequence generative modeling
      what_it_solves: Models CAD construction as sequential decisions or state-space
        generation to handle longer parametric sequences with geometric rewards or
        learned latent generation.
      what_remains_open: Evidence centers on benchmark validity and accuracy; cross-task
        transfer, data efficiency, and behavior under changed design constraints are
        not established.
    - line: Design-intent conditioning diagnosis
      what_it_solves: Tests whether header-based design intent is read during CAD
        program completion, using derangement controls and executable geometric assertions.
      what_remains_open: Evidence is limited to a single model checkpoint, some intent
        categories are uninformative, and findings apply mainly to conditional completion
        settings.
    consensus:
    - CAD is represented as parametric programs or construction sequences, with editable
      operations as the target rather than plain shape output.
    - Geometric consistency and program validity or syntax are shared evaluation concerns
      across recent methods.
    - Paired data between non-CAD inputs and programs or code is central to training
      recent models.
    - DeepCAD, Fusion 360, and MCB benchmarks recur as common evaluation settings.
    disagreements:
    - 'Input coverage differs: some methods reconstruct from meshes or point clouds,
      while others condition on images, sketches, or text.'
    - 'Optimization and supervision differ: hybrid geometric optimization, offline
      reinforcement learning, VLM fine-tuning, program evolution, and state-space
      or GAN-based generation are all present.'
    - Program representation differs between native parametric operation sequences
      and executable CadQuery Python code.
    - Evaluation differs between surface-similarity or validity metrics and executable
      geometric assertions used for diagnostic contrast.
    - 'Generalization claims differ: some works report state-of-the-art benchmark
      scores, while one evidence point shows only partial real-world and unseen-operation
      generalization.'
    open_questions:
    - Do reported mesh and image-to-CAD gains transfer to real-world scans, manufacturing
      constraints, CAE/CAM workflows, and unseen CAD operations?
    - What are the specific failure modes for complex or multi-feature parts when
      limitation fields are often missing in high-ranked evidence?
    - Can unified multi-modal CAD models retain task-specific accuracy and provide
      reproducible artifacts beyond reported benchmark wins?
    - Does design-intent conditioning remain harmful or beneficial across other models,
      longer prefixes, and diverse CAD domains?
    - Are current geometric-similarity metrics circular or biased toward surface appearance,
      and do executable assertions align with engineering validity?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 网格到参数化CAD重建
      解决的问题: 从网格反推可编辑参数化CAD构建序列，关注几何保真与有效参数操作。
      尚未覆盖: 复杂设计仍出现无效程序比例，多数证据未说明限制；真实扫描或工业网格迁移未验证。
    - 路线: 统一多模态多任务CAD建模
      解决的问题: 在单一框架中处理点云到CAD重建、文本/图像到CAD生成和CAD问答等异构任务。
      尚未覆盖: 跨基准覆盖与可复现工件有限；多模态任务相互干扰的显式限制证据不足。
    - 路线: 视觉语言CAD代码生成
      解决的问题: 利用视觉语言模型从图像生成可编辑CAD代码，并用大规模图像-代码对训练。
      尚未覆盖: 对真实世界图像和未知操作的泛化仅部分验证，分布外鲁棒性仍不确定。
    - 路线: 程序演化与合成CAD数据生成
      解决的问题: 通过VLM引导的迭代编辑与验证生成复杂真实CAD程序，并扩充图像到CAD的成对训练数据。
      尚未覆盖: 未提供限制说明；生成复杂度是否覆盖制造约束、CAE/CAM条件或工业流程未知。
    - 路线: CAD序列决策与长序列生成建模
      解决的问题: 将CAD构建视为顺序决策或状态空间生成，以处理较长参数化序列。
      尚未覆盖: 证据集中在基准有效性与精度；跨任务迁移、数据效率和设计约束变化下的表现未建立。
    - 路线: 设计意图条件化诊断
      解决的问题: 通过错乱控制和可执行几何断言检验头信息在CAD程序补全中是否被读取。
      尚未覆盖: 限于单一模型检查点；部分意图类别无信息量；结论主要适用于条件补全场景。
    共识:
    - CAD被表示为参数化程序或构建序列，建模目标是可编辑操作而非单纯形状输出。
    - 几何一致性与程序有效性或语法是近期方法的共同评测关注点。
    - 非CAD输入与程序或代码之间的成对数据是训练近期模型的核心资源。
    - DeepCAD、Fusion 360和MCB基准被反复用作评估设置。
    分歧:
    - 输入覆盖不同：部分方法从网格或点云重建，其他方法则依赖图像、草图或文本。
    - 优化与监督方式不同：混合几何优化、离线强化学习、VLM微调、程序演化和状态空间或GAN生成同时存在。
    - 程序表示不同：原生参数化操作序列与可执行CadQuery Python代码之间存在差异。
    - 评测方式不同：表面相似度或有效性指标与用于诊断对比的可执行几何断言不相同。
    - 泛化结论不同：一些证据报告标准基准上的最先进性能，另一证据仅显示真实世界和未知操作的有限泛化。
    开放问题:
    - 报告中的网格和图像到CAD收益能否迁移到真实扫描、制造约束、CAE/CAM流程和未知CAD操作？
    - 在高排名证据的限制字段经常缺失的情况下，复杂或多特征零件的具体失败模式是什么？
    - 统一多模态CAD模型能否在基准胜利之外保持任务级精度并提供可复现工件？
    - 设计意图条件化在其他模型、更长前缀和更广泛CAD领域下是否仍然有害或有益？
    - 当前几何相似度指标是否存在循环或偏向表面外观，可执行断言是否与工程有效性一致？
