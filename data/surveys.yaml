  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative and reverse-engineering
    pipelines that output parametric CAD programs or B-Rep construction sequences
    from text, images, meshes, sketches, or point clouds, with strong emphasis on
    benchmark-driven evaluation.'
  - 'Shared research pattern: Methods represent CAD as structured programs or construction
    sequences and use LLMs, multimodal models, transformers, or optimization to align
    geometry, topology, parameters, and natural-language specifications.'
  - 'Key differences: Some works reconstruct editable CAD from mesh/image input via
    stepwise or IoU-driven optimization, while others fine-tune LLM/VLM generators
    for text-to-CAD; evaluation emphasis differs among geometric fidelity, executability,
    engineering intent, and multi-task coverage.'
  - 'Trend evolution: The visible evidence is concentrated in 2026, so the observed
    trend is within the current frontier: from single-task CAD generation toward multimodal,
    multi-task, and design-intent-aware evaluation.'
  - 'Open questions: Transfer under modality shift and complex geometry remains uncertain;
    the contribution of model, grounding, agent, or benchmark design is not fully
    isolated; missing code, datasets, and limitations leave reproducibility as a verification
    gap.'
  related_work_outline_zh:
  - 主流方向：近期工作集中于生成与逆向重建管道，从文本、图像、网格、草图或点云输出可编辑参数化CAD程序或B-Rep构建序列，并强调基准评测。
  - 研究共性：将CAD表示为结构化程序或构建序列，利用大语言/多模态模型、变压器或优化对齐几何、拓扑、参数与自然语言规格。
  - 关键差异：网格/图像到CAD重建采用逐步构建或IoU驱动优化；文本到CAD多采用LLM微调、基元接地或主动澄清；评测目标在几何保真、可执行性、工程意图间不同。
  - 趋势演进：可见证据集中在2026年，趋势处于当前前沿：从单任务CAD生成走向多模态、多任务和设计意图感知评测。
  - 开放问题：模态偏移与复杂几何下迁移性未明；模型、数据、接地/澄清与评测协议各自贡献未隔离；缺失代码/数据集/限制说明使复现性存疑。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal CAD benchmarks and evaluation protocols (e.g., CADBench,
        MUSE, UniCAD)
      what_it_solves: Systematic comparison of CAD program generation and reconstruction
        across input modalities and metrics, including geometric fidelity, executability,
        and engineering intent.
      what_remains_open: Whether benchmark metrics and VLM judges represent real manufacturability
        and transfer beyond the selected dataset families; some works lack code or
        artifacts for verification.
    - line: LLM-driven text-to-CAD program generation with grounding and clarification
        (e.g., FutureCAD, HierCAD, ProCAD)
      what_it_solves: Translating natural language into executable parametric CAD
        scripts or B-Rep primitives through fine-tuning, structural alignment, parameter
        grounding, reinforcement learning, and proactive specification clarification.
      what_remains_open: Robustness to ambiguous specifications and unseen part complexity;
        how much gain comes from model capability, training data, grounding, or clarification
        is not fully isolated.
    - line: Mesh/image-to-CAD reconstruction and reverse engineering (e.g., CADFit,
        CADENA)
      what_it_solves: Recovering editable parametric CAD operation sequences from
        3D meshes or images using stepwise construction or hybrid optimization to
        improve geometric accuracy and program validity.
      what_remains_open: Reliability under high geometric complexity, diverse operation
        types, and non-ideal input modalities remains insufficiently evidenced.
    - line: Universal multimodal multi-task CAD models (e.g., UniCAD-MLLM)
      what_it_solves: Handling heterogeneous CAD tasks such as reconstruction, generation,
        and question answering in one model across text, images, sketches, and point
        clouds.
      what_remains_open: Per-task failure boundaries, cross-task interference, and
        whether unified models match specialized models under domain shift remain
        unclear.
    consensus:
    - CAD is generally treated as structured programs or construction sequences rather
      than unstructured geometry alone.
    - Most methods use parametric, B-Rep, or CadQuery-style representations and evaluate
      at least one validity or executability measure.
    - Strong geometric metrics do not guarantee engineering-ready CAD; a gap remains
      between executable code, valid geometry, and manufacturable design.
    - Specialized models can outperform general vision-language models under idealized
      geometric inputs, while generalization under shift is limited.
    disagreements:
    - 'Evaluation target differs: geometric reconstruction fidelity, program executability
      and validity, or manufacturability/functionality/assemblability; model rankings
      change across metrics.'
    - 'Input and supervision differ: text-only, image, mesh, sketch, point cloud,
      or multimodal; specialized mesh-to-CAD models differ from general LLM/VLM generators.'
    - 'Representation and generation mechanism differ: direct script generation, B-Rep
      primitive grounding, stepwise operation fitting, or optimization over structured
      programs.'
    - 'Interaction mode differs: single-shot generation versus proactive clarification
      before synthesis.'
    - 'System scope differs: unified multi-task models versus task-specific reconstruction
      or generation pipelines.'
    open_questions:
    - How do methods maintain robustness under modality shift and increasing B-Rep
      face count? Evidence from CADBench indicates specialized models are brittle
      under modality shift.
    - How much of reported performance gain comes from representation, training data,
      parameter grounding, proactive clarification, or evaluation protocol design?
    - Can VLM-judge-based design-intent metrics replace human engineering assessment
      for manufacturability, functionality, and assemblability at scale?
    - Several papers lack visible code, dataset, or limitation details, leaving reproducibility
      and failure boundaries as verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD基准与评测协议（如 CADBench、MUSE、UniCAD）
      解决的问题: 跨输入模态和指标系统比较CAD程序生成与重建，覆盖几何保真、可执行性与工程意图。
      尚未覆盖: 基准指标和VLM评判器能否代表真实可制造性，以及能否超出所选数据集族泛化；部分工作缺少代码或工件。
    - 路线: LLM驱动的文本到CAD程序生成与接地澄清（如 FutureCAD、HierCAD、ProCAD）
      解决的问题: 通过微调、结构对齐、参数接地、强化学习和主动澄清，将自然语言转为可执行CAD脚本或B-Rep基元。
      尚未覆盖: 模糊规格和未见部件复杂度下的鲁棒性；收益来自模型、训练数据、接地还是澄清机制尚未完全分离。
    - 路线: 网格/图像到CAD重建与逆向工程（如 CADFit、CADENA）
      解决的问题: 从3D网格或图像恢复可编辑参数化CAD操作序列，通过逐步构建或混合优化提升几何精度和程序有效性。
      尚未覆盖: 高几何复杂度、丰富操作类型和非理想输入模态下的可靠性仍缺少系统证据。
    - 路线: 统一多模态多任务CAD模型（如 UniCAD-MLLM）
      解决的问题: 在单一模型中同时处理重建、生成和问答，支持文本、图像、草图、点云输入。
      尚未覆盖: 各任务失败边界、跨任务干扰，以及统一模型在域偏移下能否匹配专用模型尚不明确。
    共识:
    - 工作普遍将CAD表示成结构化程序或构建序列，而非仅生成非结构化几何。
    - 多数方法采用参数化、B-Rep或CadQuery风格表示，并至少评估一种有效性或可执行性。
    - 即使几何指标较强，从可执行代码到工程可制造CAD仍存在明显差距。
    - 专用模型在理想化几何输入下可优于通用视觉语言模型，但泛化性受限。
    分歧:
    - 评测目标不同：几何重建精度、程序可执行性与有效几何、制造/功能/装配意图，不同指标会改变模型排名。
    - 输入与监督信号不同：文本、图像、网格、草图、点云或混合模态，以及专用与通用模型路线。
    - 表示与生成机制不同：直接生成脚本、B-Rep基元接地、逐步操作拟合或结构化程序优化。
    - 交互模式不同：单次生成与先澄清后生成的主动式交互。
    - 系统范围不同：统一多任务模型与面向单一任务的专用方法。
    开放问题:
    - 在模态偏移和B-Rep面数复杂度增加时，哪些方法能保持稳健？CADBench证据显示专用模型易受模态偏移影响。
    - 性能提升中有多少来自表示、训练数据、参数接地、主动澄清或评测协议，尚未充分隔离。
    - VLM评判器能否替代人类工程评审来评估可制造性、功能性和可装配性，仍需更大规模验证。
    - 若干论文缺少代码、数据集或限制说明，复现性与失败边界仍属验证缺口。
