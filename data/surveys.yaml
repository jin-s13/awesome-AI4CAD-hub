  related_work_outline:
  - 'Mainstream direction: The strongest current evidence centers on end-to-end CAD
    program generation and evaluation, especially text/image/mesh to editable parametric
    outputs. Representative examples include CADBench, FutureCAD, and UniCAD, with
    unified benchmarks and agentic or multimodal pipelines.'
  - 'Shared research pattern: Most works formalize CAD as executable structured programs
    or construction sequences. They pair generation with geometric validation, program
    validity checks, and multi-metric benchmarks rather than only predicting meshes.'
  - 'Key differences: They differ in input modality and supervision: LLM script generation,
    hierarchical reasoning, hybrid optimization, proactive clarification, or unified
    multimodal models. Evaluation targets range from surface fidelity to manufacturability,
    functionality, and assemblability.'
  - 'Trend evolution: The visible 2026 evidence indicates a shift from isolated geometry/program
    metrics toward system-level evaluation across modalities, design intent, and engineering
    readiness. Older years in the span are not represented in the top evidence, so
    the observed trend is current-frontier.'
  - 'Open questions: Generalization beyond curated benchmarks, deployment reliability,
    interaction/latency trade-offs, and independent reproduction remain unresolved.
    Missing limitation statements and uneven artifact evidence are verification gaps
    rather than proven weaknesses.'
  related_work_outline_zh:
  - 主流方向：当前最强证据集中在端到端CAD程序生成与评测，尤其是文本、图像、网格到可编辑参数化输出。代表性工作包括 CADBench、FutureCAD、UniCAD，采用统一基准和智能体或多模态流水线。
  - 研究共性：多数工作把CAD形式化为可执行结构化程序或构建序列，在生成后配以几何验证、程序有效性检查和多指标基准，而非只预测网格。
  - 关键差异：输入模态与监督信号不同，分别采用LLM脚本生成、层次化推理、混合优化、主动澄清或统一多模态模型；评测目标从表面保真度到可制造性、功能性、可装配性不等。
  - 趋势演进：可见的2026证据显示从孤立几何或程序指标转向跨模态、设计意图和工程就绪度的系统级评测；更早年份在主要证据中未展开，因此观察到的是当前前沿趋势。
  - 开放问题：超越策展基准的泛化能力、部署可靠性、交互/延迟权衡和独立复现仍不明确。缺失局限性说明和不均衡的工件证据是验证缺口，而非已证实弱点。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal CAD program generation and benchmarking
      what_it_solves: Standardizes evaluation of CAD program generation across image,
        mesh, point cloud, and text inputs; measures geometric fidelity, executability,
        compactness, and engineering design criteria.
      what_remains_open: Real-world design intent, manufacturing and assembly constraints,
        cross-dataset generalization, and judge or metric reliability are not yet
        established; many artifacts lack verified independent reproduction.
    - line: Agentic and LLM-driven text-to-CAD pipelines
      what_it_solves: Converts ambiguous natural language specifications into executable
        parametric CAD scripts, using clarification, structure alignment, primitive
        grounding, or instruction tuning to improve validity.
      what_remains_open: Interaction overhead, robustness to complex assemblies, and
        the boundary where clarification is sufficient remain unresolved; deployed
        reliability beyond curated prompts is a verification gap.
    - line: Geometry-to-CAD reverse engineering and reconstruction
      what_it_solves: Recovers editable parametric CAD construction sequences and
        operations from meshes, images, or point clouds using iterative fitting, optimization,
        or stepwise geometry comparison.
      what_remains_open: Trade-offs among speed, geometric fidelity, program validity,
        and complexity remain open; performance under noisy input, hardware variation,
        and external datasets is incompletely evidenced.
    - line: Reproducible CAD evaluation artifacts and engineering systems
      what_it_solves: Provides benchmarks, datasets, code-visible signals, and evaluation
        protocols so CAD systems can be inspected, compared, and potentially reused
        in downstream pipelines.
      what_remains_open: Independent reproduction across teams, infrastructure, and
        downstream engineering workflows is not shown consistently; missing limitation
        statements and artifact details leave verification gaps.
    consensus:
    - CAD generation is increasingly framed as producing executable structured programs
      or construction sequences rather than only surface meshes.
    - Evaluation is moving toward multi-metric benchmarks that combine geometric fidelity
      with program executability or validity, and sometimes design-intent criteria.
    - Many systems share grounding and validation mechanisms, using alignment, perturbation,
      optimization, or geometric feedback to improve parameter and topology consistency.
    - Current systems consistently reveal a gap between producing valid CAD code and
      satisfying fine-grained engineering, manufacturing, or assembly requirements.
    disagreements:
    - 'Input assumptions differ: some systems target clean mesh or image reconstruction,
      while others handle ambiguous text prompts or mixed multimodal inputs.'
    - 'Supervision and optimization strategies differ: supervised or reinforcement-tuned
      LLM code generation, hierarchical trajectory alignment, hybrid geometric optimization,
      and proactive clarification each have distinct trade-offs.'
    - Evaluation targets split between geometric or surface recovery, program validity
      and compactness, and design-level criteria such as manufacturability, functionality,
      and assemblability.
    - 'Interaction mode differs: one-pass generation coexists with agentic clarification-and-coding
      loops, implying different assumptions about human-in-the-loop effort.'
    open_questions:
    - Can CAD systems maintain validity and design intent under ambiguous user specifications
      and complex assemblies beyond curated benchmark conditions?
    - What practical latency, compute, and reliability trade-offs arise in interactive
      or deployed CAD pipelines?
    - How robust are current evaluation judges and curated benchmarks to independent
      reproduction and to real manufacturing and assembly constraints?
    - Which grounding or optimization strategy transfers across input modalities,
      datasets, and downstream CAD kernels without brittle parameter assumptions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态CAD程序生成与评测基准
      解决的问题: 在图像、网格、点云和文本输入下统一评估CAD程序生成，衡量几何保真度、可执行性、紧凑性和工程设计标准。
      尚未覆盖: 真实设计意图、制造与装配约束、跨数据集泛化、评判器可靠性仍不明确；许多工件缺少独立复现验证。
    - 路线: 基于智能体与LLM的文本到CAD流水线
      解决的问题: 将模糊自然语言规格转换为可执行参数化CAD脚本，通过澄清、结构对齐、基元接地或指令调优提高有效性。
      尚未覆盖: 交互开销、复杂装配下的鲁棒性，以及澄清在何种边界下足够仍未知；策展提示之外的部署可靠性存在证据缺口。
    - 路线: 几何到CAD逆向工程与重建
      解决的问题: 从网格、图像或点云恢复可编辑参数化CAD构建序列和操作，采用迭代拟合、优化或逐步几何比对。
      尚未覆盖: 速度、保真度、程序有效性与复杂度之间的权衡未解决；噪声输入、硬件差异和外部数据集下的表现不充分。
    - 路线: 可复现CAD评测工件与工程化系统
      解决的问题: 提供基准、数据集、代码可见信号和评测协议，使CAD系统可检查、可比较，并可能用于下游流水线。
      尚未覆盖: 跨团队、基础设施和下游工程流程的独立复现不一致；缺失局限性说明和工件细节形成验证缺口。
    共识:
    - CAD生成越来越多地被形式化为可执行结构化程序或构建序列，而不是只生成表面网格。
    - 评测正在转向多指标基准，同时关注几何保真与程序可执行性或有效性，部分开始纳入设计意图标准。
    - 许多系统共享接地和验证机制，通过对齐、扰动、优化或几何反馈提高参数与拓扑一致性。
    - 当前系统一致显示出从生成有效CAD代码到满足细粒度工程、制造或装配要求之间存在差距。
    分歧:
    - 输入假设不同：部分系统面向干净网格或图像重建，部分面向模糊文本提示或混合多模态输入。
    - 监督与优化策略不同：监督微调或强化学习的LLM代码生成、层次化轨迹对齐、混合几何优化和主动澄清各有不同权衡。
    - 评测目标分裂为几何或表面恢复、程序有效性与紧凑性，以及可制造性、功能性、可装配性等设计级标准。
    - 交互模式不同：单次生成与智能体澄清-编码循环并存，隐含着对人工参与程度的不同假设。
    开放问题:
    - CAD系统能否在模糊用户需求和复杂装配条件下，超越策展基准保持有效性和设计意图？
    - 交互式或部署化CAD流水线在延迟、计算和可靠性上的实际权衡是什么？
    - 当前评估评判器和策展基准在独立复现以及真实制造与装配约束下有多稳健？
    - 哪种接地或优化策略能跨输入模态、数据集和下游CAD内核稳定迁移，而不过度依赖脆弱的参数假设？
