  related_work_outline:
  - 'Mainstream direction: Learning to generate or reconstruct editable parametric
    CAD programs from non-parametric inputs such as meshes, images, point clouds,
    text, and code, increasingly via multimodal large models, state-space models,
    or sequential decision models.'
  - 'Shared research pattern: Works propose or reuse CAD benchmarks and datasets,
    evaluate with geometric or syntactic validity metrics, and commonly compare against
    DeepCAD, Fusion360, or MCB, though limitation and artifact reporting is inconsistent.'
  - 'Key differences: Approaches differ in output representation, input modality,
    supervision/interaction mode, and evaluation target; some produce construction
    sequences, some executable code, some latent generative representations, and some
    diagnose design-intent conditioning.'
  - 'Trend evolution: Available evidence clusters in 2025-2026, showing a current-frontier
    shift from single-task CAD reconstruction toward unified multimodal multi-task
    models, VLM-guided program synthesis, and long-sequence generative modeling.'
  - 'Open questions: Cross-domain transfer to real industrial workflows, robust metrics
    for design intent, long-sequence and complex-operation coverage, and verification
    of missing reproducibility artifacts remain open.'
  related_work_outline_zh:
  - 主流方向：以可编辑参数化CAD程序为核心输出，从网格、图像、点云、文本或代码等非参数输入进行重建或生成，并越来越多使用多模态大模型、状态空间模型或序列决策模型。
  - 研究共性：工作通常提出或复用CAD基准与数据集，使用几何或语法有效性指标评测，并常与DeepCAD、Fusion360、MCB对比；限制条件与可复现工件披露不一致。
  - 关键差异：输出表示、输入模态、监督/交互方式与评测目标不同；有的生成构造序列，有的生成可执行代码，有的关注潜在表示生成，有的诊断设计意图条件化。
  - 趋势演进：现有证据集中在2025-2026年，趋势是在当前前沿内从单一CAD重建走向统一多模态多任务、VLM引导的程序合成和长序列生成。
  - 开放问题：真实工业CAD/CAE/CAM流程中的跨域迁移、设计意图的稳健评测、长序列与复杂操作覆盖、以及可复现工件的验证缺口仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Parametric reverse engineering from non-parametric geometry, e.g., CADFit,
        CADENA, SOV-CAD
      what_it_solves: Recovers editable parametric CAD construction sequences from
        meshes, images, or orthographic projections.
      what_remains_open: Cross-category and real-world geometry generalization, robust
        handling of complex operations, and transparent limitation reporting remain
        under-evidenced.
    - line: Unified multimodal and CAD code generation models, e.g., UniCAD, CAD-Coder,
        CADEvolve
      what_it_solves: Covers multiple CAD tasks such as reconstruction, generation,
        and question answering, or translates visual inputs into executable CAD code
        within one model.
      what_remains_open: Out-of-distribution robustness, industrial-grade operation
        coverage, and reproducible data/model artifacts are still verification gaps.
    - line: Long-sequence generative modeling of parametric CAD, e.g., Mamba-CAD
      what_it_solves: Learns latent representations of long parametric CAD sequences
        and generates longer valid CAD models.
      what_remains_open: Validity metrics alone do not establish design-intent fidelity
        or downstream manufacturing utility; longer-sequence evidence is still limited.
    - line: Design-intent conditioning and evaluation diagnostics, e.g., Wrong Design
        Intent Is Worse Than None
      what_it_solves: Tests whether completion models truly use design-intent headers
        and provides independent geometric assertion metrics to avoid circular evaluation.
      what_remains_open: Current evidence is bounded to specific intents, one model
        checkpoint, and conditional completion regimes; broader causal evaluation
        is missing.
    consensus:
    - Recent work consistently treats editable parametric CAD programs, rather than
      static meshes or point clouds, as the core reconstruction or generation output.
    - Geometric or syntactic validity is a shared evaluation concern, with variants
      such as IoU, Chamfer Distance, invalid ratio, solid similarity, and executable
      assertions.
    - Multiple works reuse DeepCAD, Fusion 360, and MCB as common benchmarks for cross-method
      comparison.
    - There is a shift toward multimodal inputs and unified task models, particularly
      combining image, point cloud, text, sketch, and mesh inputs.
    disagreements:
    - 'Output representation differs: some methods emit structured parametric operation
      sequences, others emit executable CAD code, and others decode latent representations
      back to CAD.'
    - 'Training and interaction mode differs: supervised sequence fitting, offline
      reinforcement learning with stepwise views, VLM-guided program evolution, self-supervised
      reconstruction plus GAN generation, and LoRA fine-tuning with header conditioning.'
    - 'Evaluation emphasis differs: geometric similarity, syntax validity, invalid
      ratio, B-rep design-intent adherence, or data efficiency are prioritized differently.'
    - 'Input modality and task scope differ: mesh, image, orthographic views, point
      cloud, sketch, text, or a unified mixture; some focus on image-to-CAD, some
      on point-to-CAD, and some on multi-task CAD.'
    open_questions:
    - How well do reported improvements transfer to real-world CAD/CAE/CAM workflows,
      industrial parts, and unseen operations, given only partial generalization evidence?
    - Which evaluation metric best captures editable design intent without circularity,
      and how should validity be balanced with geometric similarity?
    - Can long-sequence and complex-operation CAD generation be improved without losing
      design-intent fidelity or reproducibility?
    - Do missing code, dataset, and limitation details in several works represent
      verification gaps rather than absence, and how should they be resolved?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 从非参数几何进行参数化逆向工程，例如 CADFit、CADENA、SOV-CAD
      解决的问题: 从网格、图像或正交投影中恢复可编辑的参数化CAD构建序列。
      尚未覆盖: 跨类别与真实几何泛化、复杂操作稳健性以及限制报告仍缺乏证据。
    - 路线: 统一多模态与CAD代码生成模型，例如 UniCAD、CAD-Coder、CADEvolve
      解决的问题: 在单一模型中覆盖点云/图像/文本到CAD、生成和问答，或从图像输出可执行 CadQuery 代码。
      尚未覆盖: 训练分布外真实图像与未见过操作的鲁棒性、工业级操作覆盖和可复现工件仍存在验证缺口。
    - 路线: 长序列参数化CAD生成建模，例如 Mamba-CAD
      解决的问题: 学习长参数化CAD序列的潜在表示并生成较长且有效的CAD模型。
      尚未覆盖: 有效性指标不足以证明设计意图保真或下游制造流程可用性。
    - 路线: 设计意图条件化与评测诊断，例如 Wrong Design Intent Is Worse Than None
      解决的问题: 检验补全模型是否真正使用设计意图头，并提供独立几何断言指标以避免循环评测。
      尚未覆盖: 当前证据限于特定意图、单一模型检查点和条件补全设定；更广泛因果评测缺失。
    共识:
    - 近期研究一致将可编辑参数化CAD程序，而非静态网格或点云，作为核心重建或生成输出。
    - 几何或语法有效性是共同评测关切，常见指标包括 IoU、Chamfer Distance、Invalid Ratio、实体相似度和可执行断言。
    - 多项工作复用 DeepCAD、Fusion360、MCB 作为跨方法比较基准。
    - 存在向多模态输入和统一任务模型演进的趋势，包括图像、点云、文本、草图和网格。
    分歧:
    - 输出表示不同：有的生成结构化参数化操作序列，有的生成可执行CAD代码，有的从潜在表示解码回CAD。
    - 训练与交互方式不同：监督式序列拟合、基于逐步视图的离线强化学习、VLM引导的程序演化、自监督重建加GAN生成、以及带设计意图头的LoRA微调。
    - 评测重点不同：几何相似度、语法有效性、无效比例、B-rep设计意图一致性或数据效率被不同工作优先。
    - 输入模态与任务范围不同：网格、图像、正交视图、点云、草图、文本或统一多模态混合物，且任务聚焦从图像到CAD、点云到CAD到多任务不等。
    开放问题:
    - 当前报告的改进在真实CAD/CAE/CAM工作流、工业零件和未见过操作上的迁移能力仍缺乏充分证据。
    - 哪种评测指标更能无循环地反映可编辑设计意图，且如何平衡有效性与几何相似度？
    - 在保持设计意图保真和可复现性的前提下，如何提升长序列和复杂操作CAD生成？
    - 多篇论文缺失代码、数据集或限制说明，这属于验证缺口而非不存在；应如何系统化和公开披露？
