  - 'Mainstream direction: Current evidence centers on parametric CAD program generation
    and reverse engineering from text, images, meshes, and point clouds, with frontier
    multimodal benchmark/model systems such as CADBench, UniCAD, and MUSE leading
    the 2026 evidence.'
  - 'Shared research pattern: Work decomposes CAD output into executable programs,
