  related_work_outline:
  - 'Mainstream direction: unified multimodal CAD evaluation dominates, with benchmark
    suites combining text, image, mesh, sketch, and point-cloud inputs for parametric/B-Rep
    generation, reverse engineering, and QA, while ranking specialized generators
    against LLM/VLM baselines.'
  - 'Shared research pattern: evaluation moves beyond code syntax to staged geometric
    and design-intent checks, using executability, geometric validity, IoU/Chamfer,
    invalid ratio, and rubric-based VLM judging for manufacturability, functionality,
    and assemblability.'
  - 'Key differences: works differ in evaluation target—idealized mesh reverse engineering,
    text-to-CAD design intent, or multi-task CAD QA—and in representation/supervision
    such as CadQuery scripts, construction trees, B-Rep primitives, stepwise fitting,
    or proactive clarification.'
  - 'Trend evolution: visible years span 2005–2026, but top evidence concentrates
    in 2026; the current frontier trend is toward unified, engineering-aware, multimodal
    CAD benchmarks rather than single-dataset geometric comparisons.'
  - 'Open questions: major gaps include downstream utility alignment of metrics, VLM-judge
    reliability, robustness across modality/implementation/compute shifts, coverage
    of real assemblies and ambiguous specifications, and missing code/dataset/limitation
    evidence for reproducibility.'
  related_work_outline_zh:
  - 主流方向：当前集中在多模态统一CAD评测，用CADBench、MUSE、UniCAD等基准覆盖文本、图像、网格、点云等输入到参数化/B-Rep生成、逆向重建与问答，并比较专用模型与LLM/VLM。
  - 研究共性：评测从代码可执行性扩展到分层几何与设计意图检查，常用可执行性、IoU/Chamfer、无效率以及Rubric式VLM评判可制造性、功能性与可装配性。
  - 关键差异：评测目标不同，包括理想化网格逆向重建、文本到CAD设计意图、多任务问答；表示与监督也不同，如CadQuery脚本、构建树、B-Rep基元、逐步拟合或主动澄清。
  - 趋势演进：证据年份跨度2005–2026，但主要证据集中在2026；当前前沿是从单一数据集几何比较转向统一、工程感知、多模态CAD基准。
  - 开放问题：指标与下游工程效用是否一致、VLM评委可靠性、模态/实现/算力迁移稳定性、真实装配与模糊需求覆盖，以及代码/数据集/局限性缺失带来的可复现缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Builds shared CAD evaluation suites spanning text, image, mesh,
        sketch, and point-cloud inputs for program generation, reverse engineering,
        and QA, so different model families can be compared under one protocol.
      what_remains_open: Visible evidence does not establish coverage of real assembly
        workflows, ambiguous designer intent, or noisy production inputs; several
        benchmarks lack visible code, dataset, licensing, and limitation details.
    - line: Metric and stress-test design
      what_it_solves: Probes geometric validity, executability, compactness, modality
        robustness, and engineering criteria such as manufacturability, functionality,
        and assemblability beyond aggregate generation success.
      what_remains_open: Proxy metrics have not been shown to align with downstream
        engineering or manufacturing decisions; rubric/VLM-judge reliability and cross-benchmark
        comparability remain limited.
    - line: Comparable baselines and reporting
      what_it_solves: Provides multi-model, multi-metric rankings and staged evaluation
        protocols that reveal failure cascades from code to geometry to design intent.
      what_remains_open: Rankings change across metrics and modality shifts; missing
        implementations, datasets, compute details, and limitation statements prevent
        verification of stability and reproducibility.
    consensus:
    - Shared CAD benchmarks are moving toward unified multimodal suites that compare
      specialized parametric/B-Rep models with LLM/VLM code-generation baselines.
    - Evaluation increasingly separates syntax-level success from geometric validity
      and design-intent quality, using staged checks, IoU/Chamfer, invalid ratio,
      and rubric-based judges.
    - 'No single metric is treated as sufficient: model rankings shift across modalities,
      geometric complexity, and metrics, so multi-dimensional reporting is necessary.'
    - Specialized CAD models remain strong under clean or idealized inputs, while
      LLM/VLM and agentic approaches are tested for robustness and engineering readiness.
    disagreements:
    - 'Evaluation targets differ: idealized mesh-to-CAD reverse engineering, text-to-CAD
      assembly generation, and multi-task CAD QA impose different validity criteria.'
    - 'Representation and supervision differ: parametric construction sequences, CadQuery
      scripts, B-Rep primitive grounding, stepwise feature fitting, and clarification
      trajectories are used as alternative abstractions.'
    - 'Metric emphasis differs: some works privilege geometric aggregate measures,
      while others foreground manufacturability/function/assemblability and code-to-geometry
      failure cascades.'
    - 'Interaction mode differs: zero-shot generation benchmarks versus proactive
      clarification before code synthesis imply different evaluation of user intent
      and interaction cost.'
    open_questions:
    - Do current geometric and rubric/VLM metrics align with CAD engineers' downstream
      decisions about editability, manufacturability, and assembly?
    - Are multi-metric rankings stable across implementations, compute budgets, data
      splits, and unseen modality shifts when artifacts are incomplete?
    - How should benchmarks measure ambiguous or under-specified text prompts without
      letting interaction overhead dominate?
    - What evaluation designs can cover noisy production meshes, complex assemblies,
      and real-world design specifications beyond curated academic splits?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建覆盖文本、图像、网格、点云等输入的统一CAD评测任务，使参数化/B-Rep生成、逆向重建和问答模型可比较。
      尚未覆盖: 可见证据未确认真实装配流程、模糊设计意图或噪声生产输入的覆盖；部分基准的代码、数据集、许可证和局限性信息缺失。
    - 路线: 指标与压力测试设计
      解决的问题: 在可执行性之外检验几何保真度、紧凑性、模态鲁棒性，以及可制造性、功能性、可装配性等工程属性。
      尚未覆盖: 代理指标与工程师实际决策或制造判断的对齐未证实；Rubric/VLM评委的可靠性和跨基准可比性仍有限。
    - 路线: 可比基线与报告规范
      解决的问题: 通过多模型、多指标排名和分层评测揭示从代码到几何再到设计意图的失败级联。
      尚未覆盖: 模型排名会随指标和模态变化；实现、算力、数据划分和工件缺失使结论稳定性和可复现性难以验证。
    共识:
    - 共享CAD基准正转向统一多模态评测，将专用参数化/B-Rep模型与LLM/VLM代码生成基线进行比较。
    - 评测从语法级成功转向几何有效性和设计意图质量，采用分阶段检查、IoU/Chamfer、无效率及Rubric式评判。
    - 普遍认为单一指标不够：排名会随模态、几何复杂度和指标变化，需要多维报告。
    - 专用CAD模型在干净或理想输入下仍强，LLM/VLM及智能体方法更多被用于鲁棒性和工程就绪度测试。
    分歧:
    - 评测目标不同：理想化网格到CAD逆向重建、文本到CAD装配生成、多任务CAD问答的有效性标准不同。
    - 表示与监督不同：参数化构建序列、CadQuery脚本、B-Rep基元接地、逐特征拟合和澄清轨迹被作为不同抽象。
    - 指标侧重不同：一些强调几何聚合指标，另一些强调可制造性/功能性/可装配性以及代码到几何的失败级联。
    - 交互模式不同：零样本生成与生成前主动澄清会改变用户意图和交互成本的评价方式。
    开放问题:
    - 当前几何指标与Rubric/VLM指标是否与CAD工程师对可编辑性、可制造性和装配性的下游判断一致？
    - 在工件缺失时，多指标排名在不同实现、算力预算、数据划分和模态迁移下是否稳定？
    - 如何评价模糊或不完整文本提示，而不过度增加交互成本？
    - 如何设计覆盖噪声网格、复杂装配和真实工程规范而不仅是学术切分的评测？
