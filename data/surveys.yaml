  related_work_outline:
  - 'Mainstream direction: Moving from task-specific CAD reconstruction toward unified
    multi-modal large models that generate editable parametric programs (often CadQuery)
    from meshes, images, point clouds, or text, with a strong emphasis on end-to-end
    code generation and multi-task benchmarks.'
  - 'Shared research pattern: All works treat CAD modeling as a sequence prediction
    or program synthesis problem, use parametric program representations for editability,
    rely on geometry-aligned supervision (IoU, Chamfer, geometric assertions), and
    validate against DeepCAD, Fusion360, or MCB datasets.'
  - 'Key differences: Methods split between stepwise reconstruction with intermediate
    feedback (CADFit, CADENA, SOV-CAD) and one-shot sequence generation (Mamba-CAD,
    CAD-Coder), and between reinforcement learning rewards, direct optimization, and
    VLM-guided evolution as supervision strategies.'
  - 'Trend evolution: The field is shifting from 2020–2024 standalone CAD reconstruction
    models to 2025–2026 frontier works that leverage vision-language models, program
    evolution, and causal diagnosis, aiming to move beyond geometry matching toward
    verifiable design intent capture.'
  - 'Open questions: Whether generated CAD programs honor real-world manufacturing
    constraints (e.g., fillets, drafts), how to decouple metric circularity from genuine
    design-intent understanding, and why generalization to casual photos or unseen
    operations remains fragile.'
  related_work_outline_zh:
  - 主流方向：从单一任务的CAD重建转向统一的多模态大模型，能够从网格、图像、点云或文本生成可编辑的参数化程序（如CadQuery），并强调端到端代码生成与多任务基准。
  - 研究共性：多数工作将CAD建模视为序列预测或程序合成问题，采用参数化程序表示以保证可编辑性，依赖几何对齐监督（IoU、倒角距离、几何断言），并通过DeepCAD、Fusion360、MCB等数据集验证。
  - 关键差异：方法分为逐步重建并接收中间反馈（CADFit、CADENA、SOV-CAD）与一次性序列生成（Mamba-CAD、CAD-Coder），监督策略则涵盖强化学习奖励、直接优化与VLM引导的演化，对误差累积和修正能力存在不同影响。
  - 趋势演进：从2020–2024年独立的CAD重建模型，演进到2025–2026年以视觉语言模型、程序演化和因果诊断为代表的前沿工作，趋势是从几何匹配转向可验证的设计意图捕获。
  - 开放问题：生成的CAD程序是否满足真实制造约束（如倒角、拔模），如何将指标循环性与真正的设计意图理解解耦，以及为何对随意照片和未见操作的泛化仍然脆弱。
  literature_review:
    line_of_work_matrix:
    - line: Multi-modal parametric CAD reverse engineering from 3D/2D data
      what_it_solves: Recovers editable, history-based CAD construction sequences
        from meshes, orthographic views, or point clouds, turning non-editable geometry
        into reusable parametric programs.
      what_remains_open: Robustness to real sensor noise, industrial-level complex
        topologies, and verification that the reconstructed sequences reflect the
        original designer's intent rather than just geometric fit; evaluation still
        relies heavily on geometry-only metrics.
    - line: Unified multi-task and VLM-driven CAD code generation
      what_it_solves: Uses fine-tuned vision-language models or multi-modal large
        models to directly generate editable CAD code (e.g., CadQuery Python) from
        images, text, or sketches, and consolidates heterogeneous tasks into a single
        framework.
      what_remains_open: Out-of-distribution generalization to real-world photos and
        novel operations is only partial; the generated code's integration into professional
        design workflows and manufacturing feasibility checks are not yet addressed;
        evaluation gaps exist between syntax validity and functional design soundness.
    - line: Generative modeling and intent-conditioned completion for CAD sequences
      what_it_solves: Models long parametric CAD sequences via state-space models
        or autoregressive LLMs, and diagnoses whether models truly leverage design-intent
        headers during completion instead of exploiting metric artifacts.
      what_remains_open: Physical validity and topological consistency of long generated
        sequences; transferability of design-intent conditioning across different
        model scales and CAD domains; the fundamental circularity between header extraction
        and adherence metrics remains unresolved.
    consensus:
    - Parametric CAD programs, particularly CadQuery, are emerging as a common representation
      to enable editability and downstream reuse.
    - End-to-end reconstruction from multi-modal inputs (mesh, image, point cloud)
      to a construction sequence is the core problem formulation.
    - Evaluation is shifting from pure geometric similarity toward editability, validity
      ratios, and executable geometric assertions.
    - Existing benchmarks (DeepCAD, Fusion360, MCB) serve as standardized comparison
      grounds, though their limitations are increasingly noted.
    disagreements:
    - 'Generation mode: stepwise, feature-by-feature reconstruction with intermediate
      geometry checks versus one-shot full sequence generation, leading to different
      error accumulation and correction behaviors.'
    - 'Supervision signal: reinforcement learning with geometric alignment rewards
      versus direct IoU-driven optimization versus VLM-guided program evolution, each
      with distinct assumptions about what constitutes a good program.'
    - 'Design intent modeling: explicit diagnosis of intent headers via causal derangement
