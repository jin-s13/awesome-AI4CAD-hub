  literature_review:
    line_of_work_matrix:
    - line: Evaluation-driven formalization of CAD success criteria
      what_it_solves: Defines measurable checks for program executability, geometric
        validity, and engineering intent such as manufacturability, functionality,
        and assemblability.
      what_remains_open: Whether changing metrics and rubric-based VLM judgments capture
        engineering readiness across unseen part families and complex design specifications.
    - line: LLM-based program synthesis for CAD
      what_it_solves: Translates natural-language or multimodal prompts into executable
        parametric CAD programs such as CadQuery scripts.
      what_remains_open: Faithful recovery of fine 3D structure and complex operations
        such as sweeps or lofts, and generalization beyond in-distribution industrial
        part families.
    - line: Hierarchical structure and parameter grounding
      what_it_solves: Aligns language structure with CAD construction trees and grounds
        parameters to reduce topology and parameter errors in text-to-CAD generation.
      what_remains_open: Whether perturbation-based and ranking-based supervision
        avoids shortcut learning beyond evaluated CAD sequence generation and reconstructed
        model benchmarks.
    - line: Differentiable and self-supervised CAD representation learning
      what_it_solves: Generates long parametric CAD sequences or editable B-Reps from
        point-level or reconstruction supervision without requiring CAD-specific annotations.
      what_remains_open: Robustness under geometric complexity and modality shift
        is only partially tested; validity and engineering usability of generated
        programs remain verification gaps.
    - line: Proactive specification clarification for CAD agents
      what_it_solves: Resolves ambiguous or under-specified user prompts before CAD
        code synthesis, improving robustness and reducing invalid outputs.
      what_remains_open: Limited evidence on interaction overhead, complex assembly
        understanding, and generalization beyond curated text-to-CadQuery or agent-training
        data.
    consensus:
    - All high-rank evidence treats CAD as structured, editable output such as parametric
      command sequences or B-Rep/parametric surfaces rather than only unstructured
      meshes.
    - 'Work converges on layered evaluation: code validity, geometric fit, and engineering
      or design-intent feasibility, with failures increasing across these stages.'
    - Across methods, performance degrades under geometric complexity, modality shift,
      and ambiguous or under-specified user intent.
    - Program executability and geometric fidelity are repeatedly treated as necessary
      but not sufficient conditions for manufacturable or functional CAD.
    disagreements:
    - 'Representation differs: executable CadQuery scripts, hierarchical construction-tree
      sequences, B-Rep parametric patches, and latent state-space representations
      make different structural assumptions.'
    - 'Supervision differs: text prompts, point-level supervision, CAD reconstruction,
      and curated text-to-program datasets impose different learning signals and data
      requirements.'
    - 'Evaluation targets differ: some work emphasizes geometric distance and program
      executability, while others targets manufacturability, functionality, assemblability,
      or program compactness.'
    - 'Interaction mode differs: direct one-shot generation versus proactive clarification
      before CAD code synthesis.'
    - 'Architecture differs: LLM/transformer, Mamba state-space with GAN decoding,
      and differentiable parametric-surface frameworks make different assumptions
      about sequences and geometry.'
    open_questions:
    - How well do current CAD metrics and rubric-based judges align with fine-grained
      design intent and engineering readiness?
    - Can models generalize to unseen industrial part families and complex operations
      after fine-tuning or reinforcement learning?
    - Which representation or supervision choice improves robustness to geometric
      complexity and modality shift?
    - Are reproducibility and limitation evidence sufficient to verify cross-benchmark
      claims, given uneven visibility into code and artifacts?
    - What formal assumptions about CAD programs or B-Rep structure are necessary
      for controllable, valid generation beyond the reported benchmarks?
